<script>
const screens=[['home','⌂','Обзор'],['routes','↗','Мой маршрут'],['map','⌘','Карта знаний'],['lesson','▤','Урок'],['arrival','🏅','Завершение урока'],['practice','◉','Практика'],['review','↻','Повторение'],['mission','✳','Миссии'],['missionRun','💬','Диалог-миссия'],['library','▧','Библиотека'],['story','Aa','Читаем'],['dictionary','⌕','Словарь'],['vocabulary','▣','Мои слова'],['progress','▥','Прогресс'],['profile','☺','Профиль'],['onboarding','✦','Первый запуск'],['diagnostic','◉','Оценка уровня'],['settings','⚙','Настройки'],['reminders','◷','Напоминания'],['exercises','▦','Все упражнения']];
const icons=Object.fromEntries(screens.map(s=>[s[0],s[1]]));let current='home',exercise='single_choice',selected=new Set(),wordSentence=[],storyOpen=false,vocabRevealed=false,mobile=false,modalOn=false;
function navHtml(){return screens.map(s=>`<button data-screen="${s[0]}" class="${current===s[0]?'active':''}"><span class="ico">${s[1]}</span>${s[2]}</button>`).join('')}

document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-screen]');if(b)setScreen(b.dataset.screen)});
document.getElementById('phoneTabs').innerHTML=[['home','⌂','Домой'],['map','⌘','Карта'],['practice','◉','Практика'],['library','▧','Книги'],['profile','☺','Я']].map(s=>`<button data-screen="${s[0]}" class="${current===s[0]?'active':''}"><span>${s[1]}</span>${s[2]}</button>`).join('');
document.getElementById('phoneTabs').addEventListener('click',e=>{const b=e.target.closest('[data-screen]');if(b)setScreen(b.dataset.screen)});
document.getElementById('desk').onclick=()=>setDevice(false);document.getElementById('phone').onclick=()=>setDevice(true);function setDevice(x){mobile=x;document.getElementById('frame').classList.toggle('phone',x);document.getElementById('phone').classList.toggle('selected',x);document.getElementById('desk').classList.toggle('selected',!x)}

const exerciseTypes=[['single_choice','Один вариант','Выбор'],['multi_choice','Несколько вариантов','Выбор'],['true_false','Верно или неверно','Понимание'],['match_pairs','Соедини пары','Связи'],['reply_choice','Ответь в диалоге','Ситуация'],['word_order','Собери предложение','Порядок'],['cloze','Заполни пропуски','Контекст'],['transform','Преобразуй фразу','Грамматика'],['article_input','Введи артикль','Ввод'],['form_input','Форма слова','Ввод'],['gap_fill_input','Вставь слово','Ввод'],['spelling_input','Напиши слово','Ввод'],['number_input','Введи число','Ввод'],['time_input','Напиши время','Ввод'],['listening','Аудирование','На очереди'],['dictation','Диктант','На очереди'],['categorize','Распредели слова','На очереди'],['error_correction','Найди ошибку','На очереди'],['guided_writing','Короткое письмо','На очереди'],['speaking','Скажи вслух','На очереди'],['minimal_pairs','Похожие звуки','На очереди']];
function exUi(type){let title=(exerciseTypes.find(t=>t[0]===type)||[])[1];let base=`<p class="eyebrow">ТРЕНИРУЕМ · A1</p><h2 style="font:800 20px Manrope;margin:0 0 8px">${title}</h2>`;switch(type){case'single_choice':return base+`<p>Какой артикль у слова <b class="de-text">Tisch</b>?</p>${opts(['der','die','das'],true)}`;case'multi_choice':return base+`<p>Выбери все правильные формы множественного числа <i>die</i></p>${opts(['die Tische','die Frau','die Bücher','der Hund'],true)}`;case'true_false':return base+`<p>Верно ли утверждение?</p><div class="card tint"><p class="de-text">„Guten Morgen“ sagt man am Nachmittag.</p></div>${opts(['Верно','Неверно'],false)}`;case'match_pairs':return base+`<p>Соедини немецкое слово со значением</p><div class="grid two">${[['der Bahnhof','вокзал'],['die Rechnung','счёт'],['das Fenster','окно']].map(x=>`<div class="card tint row"><b class="de-text" style="font-size:15px">${x[0]}</b><button class="control" data-match="${x[0]}">Соединить ↔ ${x[1]}</button></div>`).join('')}</div>`;case'reply_choice':return base+`<div class="card tint"><span class="pill">БАРИСТА ГОВОРИТ</span><p class="de-text">Was möchten Sie trinken?</p></div><p>Выбери уместный ответ</p>${opts(['Einen Kaffee, bitte.','Ich heiße Anna.','Ja, ich wohne hier.'],true)}`;case'word_order':return base+`<p>Собери: «Сегодня я еду домой»</p><div class="dropzone" id="dropzone">${wordSentence.map(x=>`<button class="token" data-remove="${x}">${x}</button>`).join('')}</div><div class="token-row">${['fahre','heute','ich','nach Hause'].map(x=>`<button class="token" data-token="${x}" class="${wordSentence.includes(x)?'used':''}">${x}</button>`).join('')}</div>`;case'cloze':return base+`<p class="de-text">Heute <input class="answer" style="width:130px" placeholder="глагол"> ich nach Hause.</p><span class="pill">Подсказка: глагол на второй позиции</span>`;case'transform':return base+`<div class="card tint"><span class="pill">НАЧНИ С HEUTE</span><p class="de-text">Ich fahre nach Hause.</p></div><p>Перестрой предложение с указанным началом.</p><input class="answer" placeholder="Составь новое предложение…">`;case'article_input':return base+`<p>Впиши артикль</p><p class="de-text">___ Bahnhof ist groß.</p><input class="answer" placeholder="der / die / das">`;case'form_input':return base+`<p>Поставь глагол в нужную форму</p><p class="de-text">Anna ___ in Berlin. <span class="muted">(wohnen)</span></p><input class="answer" placeholder="Введи форму глагола">`;case'gap_fill_input':return base+`<p>Заполни пропуск по смыслу</p><p class="de-text">Ich fahre ___ Berlin.</p><input class="answer" placeholder="Введи предлог">`;case'spelling_input':return base+`<p>Напиши слово, которое услышал</p><div class="card tint">🔊 <button class="btn soft">▶ Прослушать</button> <span class="muted small">повтор 1 из 2</span></div><input class="answer" placeholder="Немецкое слово">`;case'number_input':return base+`<p>Напиши число словами</p><div class="card tint"><span class="de-text">47</span> <span class="muted small">→ по-немецки</span></div><input class="answer" placeholder="Число словами">`;case'time_input':return base+`<p>Напиши время по-немецки</p><div class="card tint" style="font:800 32px Manrope">14:30</div><input class="answer" placeholder="Например: halb drei">`;case'listening':return base+`<p>Послушай и выбери, куда едет Анна</p><div class="card tint" style="text-align:center;padding:26px"><button class="btn" style="font-size:16px">▶</button><p class="muted small">Можно слушать повторно · скорость 1×</p></div>${opts(['Zum Bahnhof','Zur Arbeit','Nach Hause'],true)}`;case'dictation':return base+`<p>Запиши услышанную фразу</p><div class="card tint" style="text-align:center;padding:20px"><button class="btn">▶ Воспроизвести</button><div class="toolbar" style="justify-content:center;margin-top:12px"><button class="control">0.8×</button><button class="control active">1×</button></div></div><input class="answer" placeholder="Напечатай немецкую фразу">`;case'categorize':return base+`<p>Перетащи слова в подходящую группу</p><div class="grid two"><div class="card tint"><b>der</b><div class="token-row"><button class="token">Tisch</button><button class="token">Bahnhof</button></div></div><div class="card tint"><b>die</b><div class="token-row"><button class="token">Straße</button><button class="token">Stadt</button></div></div></div>`;case'error_correction':return base+`<p>Найди и исправь одну ошибку</p><div class="card tint de-text">Heute ich gehe ins Kino.</div><input class="answer" placeholder="Напиши исправленное предложение">`;case'guided_writing':return base+`<p>Напиши короткое сообщение соседу (2–3 предложения)</p><div class="callout">Поздоровайся, представься и спроси, где остановка. Вежливый тон.</div><textarea class="answer" style="height:110px;resize:vertical" placeholder="Hallo! Ich heiße …"></textarea><div class="row"><span class="muted small">Оцениваются цель, вежливость и ключевые фразы</span><span class="pill orange">Черновик</span></div>`;case'speaking':return base+`<p>Представься новому соседу</p><div class="card tint" style="text-align:center;padding:27px"><button class="btn">🎙 Начать запись</button><p class="muted small">Запись пока демонстрационная, оценка произношения не заявляется.</p></div><div class="callout">Цель: уверенно назвать имя и спросить, как зовут соседа.</div>`;case'minimal_pairs':return base+`<p>Слушай и выбирай услышанный звук</p><div class="grid two"><button class="card" style="border:1px solid var(--line)"><span class="pill">ВАРИАНТ A</span><div class="de-text" style="font-size:28px;margin-top:13px">schon</div><span class="muted small">🔊 слушать</span></button><button class="card" style="border:1px solid var(--line)"><span class="pill">ВАРИАНТ B</span><div class="de-text" style="font-size:28px;margin-top:13px">schön</div><span class="muted small">🔊 слушать</span></button></div>`}return base}

function arrival(){return `<div style="max-width:780px;margin:24px auto;text-align:center">${hdr('СТАНЦИЯ ПРОЙДЕНА','Отличная работа! 🎉','Ты разобрался, как представиться и задать первый вопрос.')}<div class="card"><div class="done-badge">✓</div><p class="eyebrow" style="margin-top:20px">ИТОГ УРОКА</p><div class="grid three" style="margin:18px 0 23px"><div class="card tint"><div class="stat">+35</div><div class="stat-label">XP заработано</div></div><div class="card tint"><div class="stat">8 / 9</div><div class="stat-label">верно с первого раза</div></div><div class="card tint"><div class="stat">6 мин</div><div class="stat-label">время занятия</div></div></div><span class="pill orange">🔥 Серия: 7 дней подряд</span><div class="divider"></div><div class="row" style="justify-content:center;flex-wrap:wrap">${btn('Следующий урок →','lesson','btn')}${btn('На мою линию','home','btn secondary')}${btn('Повторить тему','review','btn ghost')}</div></div><p class="muted small">Ответы обновили прогресс. Следующий совет объяснит, почему выбран именно он.</p></div>`}
function missionRun(){return `${hdr('МИССИЯ · КАФЕ В БЕРЛИНЕ','Закажи кофе','4 реплики · цель — вежливо сделать заказ и уточнить цену.')}<div class="lesson-wrap"><div class="card tint"><div class="row"><span class="pill orange">БАРИСТА · БЕРЛИН</span><span class="muted small">Реплика 2 из 4</span></div><p class="de-text" style="font-size:22px;margin:18px 0 4px">Was möchten Sie trinken?</p><p class="muted small">Что будете пить?</p></div><div class="card" style="margin-top:13px"><p class="eyebrow">ТВОЙ ОТВЕТ</p>${opts(['Einen Kaffee, bitte.','Ich trinke gern Wasser.','Die Rechnung ist gut.'],true)}<div class="feedback ${window.checked?'show':''}">✓ Отлично: форму <i>einen Kaffee</i> используют, когда заказывают один кофе.</div><div class="row" style="margin-top:18px"><span class="muted small">Разбор ответа связан с темой урока</span>${btn(window.checked?'Следующая реплика →':'Ответить','check','btn')}</div></div></div>`}
function dictionary(){return `${hdr('СПРАВОЧНИК','Словарь немецкого','Значения, род, формы и примеры. Ищи слово или переходи сюда из текста.')}<div class="grid two"><div><input class="search" placeholder="⌕   Например: fahren, freundlich, Bahnhof"><div class="card" style="margin-top:13px"><span class="pill blue">ГЛАГОЛ · A1</span><h2 class="de-text" style="margin:11px 0">fahren</h2><p class="muted small">ехать; ездить</p>${btn('☆ Сохранить','save-word','btn soft')}<div class="divider"></div><h3>Формы</h3><p class="de-text" style="font-size:15px">ich fahre · du fährst · er/sie fährt</p><p class="de-text" style="font-size:15px">fuhr · ist gefahren</p><div class="divider"></div><h3>Управление и сочетания</h3><p><span class="de-text" style="font-size:15px">nach Berlin fahren</span> <span class="muted small">ехать в Берлин</span></p><div class="divider"></div><h3>Пример</h3><p class="de-text" style="font-size:16px">Wir fahren morgen nach Wien.</p><p class="muted small">Мы завтра едем в Вену.</p></div></div><div class="grid"><div class="card tint"><h3>Связанные уроки</h3><p class="muted small">Слова связываются с грамматикой и примерами из курса.</p>${btn('Глаголы движения →','map','btn soft')}</div><div class="card"><h3>Недавно смотрели</h3>${['der Bahnhof · вокзал','die Haltestelle · остановка','freundlich · дружелюбный'].map(x=>`<div class="list-row"><span class="feature-icon">Aa</span><span class="de-text" style="font-size:14px">${x}</span></div>`).join('')}</div></div></div>`}
function reminders(){return `${hdr('НАПОМИНАНИЯ','Подходящее время для повтора','Уведомления включаются отдельно для слов и учебных тем.')}<div class="grid two"><div class="card"><div class="row"><div><h3>Ежедневный учебный ритм</h3><p class="muted small">Пн–Пт · 19:00</p></div><input type="checkbox" checked></div><div class="divider"></div><label class="checkrow"><input type="checkbox" checked> Напоминать о словах к повторению</label><label class="checkrow" style="margin-top:8px"><input type="checkbox" checked> Напоминать продолжить маршрут</label><div class="divider"></div><div class="row"><span>Время</span><input type="time" value="19:00" class="control"></div><div class="row" style="margin-top:14px"><span>Дни недели</span><div class="toolbar">${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map((x,i)=>`<button class="control ${i<5?'active':''}">${x}</button>`).join('')}</div></div></div><div class="card tint"><h3>Спокойный ритм</h3><p class="muted small" style="line-height:1.6">Напоминание помогает вернуться, не обнуляет серию и отключается в любой момент.</p>${btn('Разрешить уведомления','reminder-permission','btn soft')}</div></div>`}
function render(){document.getElementById('nav').innerHTML=navHtml();document.getElementById('phoneTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.screen===current));let s={home,routes,map,lesson,arrival,practice,review,mission,missionRun,library,story,dictionary,vocabulary,progress,profile,onboarding,diagnostic,settings,reminders,exercises}[current]||home;document.getElementById('screen').innerHTML=s();document.getElementById('crumb').textContent='Прототип · '+(screens.find(x=>x[0]===current)?.[2]||'Экран');bind();}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{routeSelected=b.dataset.route;render()});document.querySelectorAll('[data-option],[data-ex-option]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.option??b.dataset.exOption);selected.has(i)?selected.delete(i):selected.add(i);render()});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{exercise=b.dataset.type;window.exchecked=false;render()});document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{if(!wordSentence.includes(b.dataset.token)){wordSentence.push(b.dataset.token);render()}});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{wordSentence=wordSentence.filter(x=>x!==b.dataset.remove);render()});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,j=b.dataset.move==='up'?i-1:i+1;[routeState[i],routeState[j]]=[routeState[j],routeState[i]];render()});document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{let i=+b.dataset.skip;skipped.has(i)?skipped.delete(i):skipped.add(i);render()});document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{storyOpen=b.dataset.word;render()});}
function action(a){if(['home','routes','map','lesson','arrival','practice','review','mission','missionRun','library','story','dictionary','vocabulary','progress','profile','settings','onboarding','diagnostic','reminders','exercises'].includes(a)){setScreen(a);return}if(a==='check'){window.checked=true;render();return}if(a==='check-ex'){window.exchecked=true;render();return}if(a==='reset-route'){routeState.splice(0,routeState.length,...['Алфавит и произношение','Числа и время','Знакомство и приветствия','Глагол в настоящем времени','Заказ в кафе','Покупки на рынке']);skipped.clear();render();return}if(a==='reveal'){vocabRevealed=true;render();return}if(a==='remember'||a==='again'){vocabRevealed=false;render();return}if(a==='save-word'){alert('Слово добавлено в твой словарь вместе с контекстом.');return}if(a==='story-next'){alert('Следующий абзац истории откроется здесь.');return}if(a==='mission-run'){setScreen('missionRun');return}if(a==='signin'){modal('Войти в DeutschGo','Выбери способ входа. В макете подключение аккаунта демонстрационное.','<button class="option">Продолжить с Google</button><button class="option">Продолжить с Apple</button><input class="answer" placeholder="Электронная почта">');return}if(a==='export'){alert('Выгрузка прогресса появится в подключённой версии.');return}if(a==='reminder-permission'){alert('Настройки системных уведомлений появятся после подключения устройства.');return}if(a==='confirm-clear'){modal('Удалить данные DeutschGo с этого устройства?','Действие нельзя отменить. Данные аккаунта останутся.','<div class="checks"><label class="checkrow"><input type="checkbox" checked> Прогресс уроков на устройстве</label><label class="checkrow"><input type="checkbox" checked> Мой маршрут и порядок тем</label><label class="checkrow"><input type="checkbox" checked> Слова и ответы</label></div><div class="modal-actions"><button class="btn secondary" data-close>Отмена</button><button class="btn" data-clear>Удалить всё</button></div>');document.querySelector('[data-clear]').onclick=()=>{closeModal();alert('Локальные данные удалены (демонстрация).')}}}
function modal(title,text,body){document.getElementById('modalbox').innerHTML=`<p class="eyebrow">DEUTSCHGO · ДАННЫЕ</p><h2 style="font:800 21px Manrope;margin:0 0 8px">${title}</h2><p class="muted small">${text}</p>${body}<div class="modal-actions" style="margin-top:15px"><button class="btn secondary" data-close>Закрыть</button></div>`;document.getElementById('modal').classList.add('open');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){document.getElementById('modal').classList.remove('open')}
render();
</script>
</body></html>
