<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">DeutschGo route studio mockup</title>
  <desc id="desc">A route customization screen with a selected learning line, route choices and a reorderable topic list.</desc>
  <rect width="1440" height="1000" fill="#eef2f7"/><rect width="248" height="1000" fill="#fff" stroke="#dbe3ee"/>
  <circle cx="47" cy="47" r="18" fill="#1b4fa0"/><path d="m43 37 10 10-10 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="54" font-family="Arial" font-size="24" font-weight="700" fill="#0f1f33">DeutschGo</text>
  <g font-family="Arial" font-size="18" fill="#4a5b72"><text x="40" y="140">⌂　Home</text><text x="40" y="198">◉　Practice</text><text x="40" y="256">⌘　Knowledge map</text><text x="40" y="314">▣　Library</text><text x="40" y="372">☺　You</text></g>
