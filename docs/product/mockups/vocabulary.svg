<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">DeutschGo vocabulary board mockup</title>
  <desc id="desc">A spaced vocabulary flashcard and a list of saved words with contexts and review dates.</desc>
  <rect width="1280" height="900" fill="#eef2f7"/><rect width="230" height="900" fill="#fff" stroke="#dbe3ee"/>
  <circle cx="46" cy="45" r="17" fill="#1b4fa0"/><path d="m42 36 9 9-9 9" fill="none" stroke="#fff" stroke-width="4"/><text x="74" y="52" font-family="Arial" font-size="22" font-weight="700" fill="#0f1f33">DeutschGo</text>
  <g font-family="Arial" font-size="17" fill="#4a5b72"><text x="35" y="130">⌂　Home</text><text x="35" y="185">◉　Practice</text><text x="35" y="240">⌘　Knowledge map</text><rect x="20" y="262" width="190" height="48" rx="12" fill="#e3ecfa"/><text x="35" y="293" font-weight="700" fill="#1b4fa0">▣　Library</text><text x="35" y="350">☺　You</text></g>
  <text x="275" y="68" font-family="Arial" font-size="14" font-weight="700" letter-spacing="2" fill="#1b4fa0">READ IN GERMAN</text><text x="275" y="115" font-family="Arial" font-size="38" font-weight="700" fill="#0f1f33">My vocabulary</text><text x="275" y="150" font-family="Arial" font-size="18" fill="#4a5b72">Recall a word, reveal it, then choose how well you remembered.</text>
  <g font-family="Arial">
    <rect x="275" y="185" width="280" height="82" rx="14" fill="#fff" stroke="#dbe3ee"/><text x="300" y="225" font-size="28" font-weight="700" fill="#0f1f33">8</text><text x="300" y="248" font-size="13" fill="#4a5b72">Saved words</text>
    <rect x="570" y="185" width="280" height="82" rx="14" fill="#fff" stroke="#dbe3ee"/><text x="595" y="225" font-size="28" font-weight="700" fill="#0f1f33">3</text><text x="595" y="248" font-size="13" fill="#4a5b72">Ready to review</text>
    <rect x="865" y="185" width="280" height="82" rx="14" fill="#fff" stroke="#dbe3ee"/><text x="890" y="225" font-size="28" font-weight="700" fill="#0f1f33">5</text><text x="890" y="248" font-size="13" fill="#4a5b72">Scheduled</text>
    <text x="710" y="307" font-size="14" fill="#4a5b72">Card 1 of 3</text>
    <rect x="415" y="330" width="590" height="300" rx="22" fill="#fff" stroke="#dbe3ee"/>
    <text x="710" y="375" font-size="14" font-weight="700" letter-spacing="1" fill="#1b4fa0">DER MITARBEITER</text><text x="710" y="438" font-family="Georgia" font-size="44" fill="#0f1f33">Mitarbeiter</text>
    <text x="710" y="490" font-size="16" fill="#4a5b72">Try to remember the meaning before you turn the card.</text>
    <rect x="605" y="540" width="210" height="4" rx="2" fill="#123a78"/><rect x="605" y="536" width="210" height="4" rx="2" fill="#1b4fa0"/><text x="667" y="566" font-size="15" font-weight="700" fill="#fff">Show meaning</text>
    <text x="310" y="695" font-size="22" font-weight="700" fill="#0f1f33">All saved words</text>
    <rect x="275" y="715" width="870" height="55" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="300" y="750" font-family="Georgia" font-size="19" fill="#0f1f33">Bahnhof</text><text x="475" y="750" font-size="14" fill="#4a5b72">train station · A morning at the station</text><text x="970" y="750" font-size="13" fill="#1b4fa0">Due now</text><text x="1075" y="750" font-size="13" fill="#1b4fa0">Remove</text>
    <rect x="275" y="780" width="870" height="55" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="300" y="815" font-family="Georgia" font-size="19" fill="#0f1f33">kommen</text><text x="475" y="815" font-size="14" fill="#4a5b72">to come · A morning at the station</text><text x="970" y="815" font-size="13" fill="#4a5b72">25 Oct</text><text x="1075" y="815" font-size="13" fill="#1b4fa0">Remove</text>
  </g>
</svg>
