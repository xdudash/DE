<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">DeutschGo review room mockup</title>
  <desc id="desc">Due topic board with a selectable daily review size, an overdue list, an estimated duration, and a review session action.</desc>
  <rect width="1280" height="800" fill="#eef2f7"/>
  <rect x="32" y="28" width="180" height="744" rx="22" fill="#fff" stroke="#dbe3ee"/>
  <circle cx="70" cy="70" r="18" fill="#1b4fa0"/><path d="M66 60l10 10-10 10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="77" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="#0f1f33">DeutschGo</text>
  <text x="68" y="208" font-family="Arial,sans-serif" font-size="17" fill="#4a5b72">Home</text><rect x="52" y="232" width="140" height="48" rx="12" fill="#eaf0fb"/><text x="78" y="263" font-family="Arial,sans-serif" font-size="17" fill="#123a78">↻  Practice</text><text x="68" y="323" font-family="Arial,sans-serif" font-size="17" fill="#4a5b72">Knowledge map</text><text x="68" y="373" font-family="Arial,sans-serif" font-size="17" fill="#4a5b72">You</text>
  <text x="256" y="72" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#4a5b72">TODAY'S SESSION</text><text x="256" y="112" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f1f33">Review room</text><text x="256" y="143" font-family="Arial,sans-serif" font-size="17" fill="#4a5b72">Bring back the ideas you learned, while they are still worth revisiting.</text><text x="1100" y="88" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1b4fa0">Back to practice</text>
  <rect x="256" y="174" width="308" height="92" rx="16" fill="#fff" stroke="#dbe3ee"/><text x="280" y="207" font-family="Arial,sans-serif" font-size="14" fill="#4a5b72">DUE NOW</text><text x="280" y="244" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f1f33">8 topics</text>
  <rect x="578" y="174" width="308" height="92" rx="16" fill="#fff" stroke="#dbe3ee"/><text x="602" y="207" font-family="Arial,sans-serif" font-size="14" fill="#4a5b72">SESSION SIZE</text><text x="602" y="244" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f1f33">5 topics</text>
  <rect x="900" y="174" width="338" height="92" rx="16" fill="#fff" stroke="#dbe3ee"/><text x="924" y="207" font-family="Arial,sans-serif" font-size="14" fill="#4a5b72">ESTIMATED TIME</text><text x="924" y="244" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f1f33">~10 min</text>
  <rect x="256" y="288" width="650" height="470" rx="20" fill="#fff" stroke="#dbe3ee"/><text x="284" y="329" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f1f33">Due topics</text><text x="284" y="355" font-family="Arial,sans-serif" font-size="14" fill="#4a5b72">8 due topics, oldest first</text>
  <rect x="742" y="307" width="132" height="46" rx="12" fill="#f4f7fb" stroke="#dbe3ee"/><rect x="748" y="313" width="42" height="34" rx="9" fill="#fff" stroke="#dbe3ee"/><text x="763" y="336" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1b4fa0">3</text><text x="812" y="336" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4a5b72">5</text><text x="851" y="336" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4a5b72">10</text>
  <g font-family="Arial,sans-serif">
    <path d="M284 382h594M284 458h594M284 534h594M284 610h594M284 686h594" stroke="#dbe3ee"/>
    <rect x="287" y="397" width="18" height="18" rx="4" fill="#1b4fa0"/><path d="M291 406l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="322" y="407" font-size="17" font-weight="700" fill="#0f1f33">Numbers from 1 to 20</text><text x="322" y="432" font-size="14" fill="#4a5b72">Due 24 Oct · 6 answers</text><text x="851" y="419" font-size="19" fill="#4a5b72">→</text>
    <rect x="287" y="473" width="18" height="18" rx="4" fill="#1b4fa0"/><path d="M291 482l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="322" y="483" font-size="17" font-weight="700" fill="#0f1f33">German greetings</text><text x="322" y="508" font-size="14" fill="#4a5b72">Due 24 Oct · 4 answers</text><text x="851" y="495" font-size="19" fill="#4a5b72">→</text>
    <rect x="287" y="549" width="18" height="18" rx="4" fill="#1b4fa0"/><path d="M291 558l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="322" y="559" font-size="17" font-weight="700" fill="#0f1f33">Verb in position two</text><text x="322" y="584" font-size="14" fill="#4a5b72">Due 25 Oct · 9 answers</text><text x="851" y="571" font-size="19" fill="#4a5b72">→</text>
    <rect x="287" y="625" width="18" height="18" rx="4" fill="#fff" stroke="#b9c6d8" stroke-width="2"/><text x="322" y="635" font-size="17" font-weight="700" fill="#0f1f33">Formal introductions</text><text x="322" y="660" font-size="14" fill="#4a5b72">Due 25 Oct · 3 answers</text><text x="851" y="647" font-size="19" fill="#4a5b72">→</text>
  </g>
  <rect x="928" y="288" width="310" height="236" rx="20" fill="#fff" stroke="#dbe3ee"/><text x="956" y="327" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#4a5b72">TODAY</text><text x="956" y="365" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f1f33">5 topics selected</text><text x="956" y="398" font-family="Arial,sans-serif" font-size="15" fill="#4a5b72">One question per topic. Answers</text><text x="956" y="421" font-family="Arial,sans-serif" font-size="15" fill="#4a5b72">update your shared learning history.</text><rect x="956" y="447" width="254" height="50" rx="12" fill="#1b4fa0"/><text x="1020" y="478" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Start review</text>
  <rect x="928" y="542" width="310" height="146" rx="20" fill="#f4f7fb" stroke="#dbe3ee"/><circle cx="970" cy="584" r="18" fill="#e3ecfa"/><text x="960" y="592" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1b4fa0">↻</text><text x="1000" y="582" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f1f33">How review works</text><text x="956" y="620" font-family="Arial,sans-serif" font-size="14" fill="#4a5b72">Correct answers extend the interval.</text><text x="956" y="643" font-family="Arial,sans-serif" font-size="14" fill="#4a5b72">Wrong answers restart it. A quick repeat</text><text x="956" y="666" font-family="Arial,sans-serif" font-size="14" fill="#4a5b72">does not count as delayed recall.</text>
  <text x="928" y="724" font-family="Arial,sans-serif" font-size="14" fill="#4a5b72">Progress is stored on this device.</text>
</svg>
