name: CI

on:
  push:
    branches: [main, "chore/**", "docs/**", "feat/**", "fix/**", "content/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Repository foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate foundation files and relative links
        run: python scripts/check_foundation.py

  app:
    name: Content contract, tests, and web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      # TODO(DG-011): switch to `npm ci` once package-lock.json is committed.
      - name: Install dependencies
        id: install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund 2>&1 | tee -a ci.log
            echo "lock_generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Content validation (schema, references, graph, exercises, localization coverage)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run content:validate 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Unit and integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Build web app (static pages for every language × unit)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
        shell: bash
      # Raw job logs live in blob storage; surfacing the tail as an annotation makes
      # failures readable through the GitHub API (used by Claude Code sessions).
      - name: Publish log tail as annotation on failure
        if: failure()
        shell: bash
        run: |
          tail -n 150 ci.log | python3 -c "import sys; d=sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print('::error title=CI log tail::'+d)"
      - name: Upload lockfile produced by this run (for DG-011)
        if: always() && steps.install.outputs.lock_generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore

  e2e:
    name: End-to-end journeys and accessibility (Playwright, axe)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        id: install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Install Chromium with system dependencies
        run: npm exec --workspace=@deutschgo/web -- playwright install --with-deps chromium
      - name: Build the production web app
        run: npm run build -w @deutschgo/web 2>&1 | tee -a e2e.log; exit ${PIPESTATUS[0]}
        shell: bash
      # Journeys run against `next start` of that build. The E2E specs assert the honest
      # "progress is not saved" state, so no database is needed here.
      - name: Run journeys (desktop) and accessibility checks
        env:
          CI: "true"
        run: npm run e2e -w @deutschgo/web 2>&1 | tee -a e2e.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Publish log tail as annotation on failure
        if: failure()
        shell: bash
        run: |
          # First every failing test with its first error lines, then the tail: the log itself is
          # not readable from every place the result is reviewed, annotations are.
          grep -E "^\s+[0-9]+\) \[|Error:|Expected|Received|waiting for|^\s+>\s+[0-9]+ \|" e2e.log | grep -v "Retry #" | head -120 | python3 -c "import sys; d=sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print('::error title=E2E failures::'+d)"
          tail -n 150 e2e.log | python3 -c "import sys; d=sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print('::error title=E2E log tail::'+d)"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  database:
    name: Learner-data migrations, RLS and attempt recording
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Apply migrations and run database tests
        run: ./scripts/db_test.sh
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      # The attempt pipeline against the real schema: server re-evaluation, append-only
      # events, idempotent retries and RLS isolation. Skips itself without DG_DB_URL.
      - name: Prepare a migrated database for the integration test
        run: ./scripts/db_prepare.sh deutschgo_integration
      - name: Attempt recording integration test
        timeout-minutes: 5
        env:
          # 127.0.0.1, not localhost: Node resolves localhost to ::1 first, where the
          # service container does not listen, and the driver would wait for it.
          DG_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/deutschgo_integration
          DATABASE_SSL: disable
          # `server-only` throws unless resolved under the react-server condition. Without
          # this, the DB suites that import server modules were silently skipped.
          NODE_OPTIONS: --conditions=react-server
        run: npm test -w @deutschgo/web 2>&1 | tee -a db.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Publish log tail as annotation on failure
        if: failure()
        shell: bash
        run: |
          # Failing test names first: the tail alone often starts after the failure.
          { grep -E "not ok|failureType|error:|AssertionError|expected:|actual:" db.log | head -40; echo "--- tail ---"; tail -n 120 db.log; } | python3 -c "import sys; d=sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print('::error title=Database job log tail::'+d)"
