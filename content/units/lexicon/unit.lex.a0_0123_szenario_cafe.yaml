schema: deutschgo.unit/1
id: unit.lex.a0_0123_szenario_cafe
version: 1.1.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
prerequisites: []
goals: [general, everyday]
estimated_minutes: 9
objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "Was möchten Sie?", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "Ein Tee, bitte.", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "Zwei Kaffee, bitte.", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "Drei Wasser, bitte.", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "Das macht sechs Euro.", gloss: "@ex.5", highlight: [] }
      - { id: ex_6, de: "Hier, bitte!", gloss: "@ex.6", highlight: [] }

  - { type: explanation, id: b_tip, body: "@tip" }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x1.prompt"
        line_de: "Guten Tag! Was möchten Sie?"
        options:
          - { id: a, de: "Zwei Kaffee, bitte.", correct: true }
          - { id: b, de: "Gute Nacht!", correct: false, feedback: "@x1.o2.fb" }
          - { id: c, de: "Das macht zwei Euro.", correct: false, feedback: "@x1.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: number_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x2.prompt"
        stem_de: "Das macht neun Euro."
        accept: ["9"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x2.expl"

      - id: x3
        type: match_pairs
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x3.prompt"
        pairs:
          - { id: a, left_de: "Ein Tee, bitte.", right_de: "1" }
          - { id: b, left_de: "Zwei Kaffee, bitte.", right_de: "2" }
          - { id: c, left_de: "Drei Wasser, bitte.", right_de: "3" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x3.expl"

      - id: x4
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x4.prompt"
        statement_de: "„Das macht fünf Euro“ ist der Preis."
        correct: true
        wrong_feedback: "@x4.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x5.prompt"
        stem_de: "Zwei Kaffee, ___!"
        accept: ["bitte"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["danke"], feedback: "@x5.r1" }
          - { match: ["bite"], feedback: "@x5.r2" }
        explanation: "@x5.expl"

      - id: x6
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x6.prompt"
        options:
          - { id: a, de: "Hier, bitte!", correct: true }
          - { id: b, de: "Was möchten Sie?", correct: false, feedback: "@x6.o2.fb" }
          - { id: c, de: "Zwei Kaffee!", correct: false, feedback: "@x6.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x6.expl"

      - id: x7
        type: word_order
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x7.prompt"
        tokens: ["bitte", "Kaffee,", "Zwei"]
        final_punctuation: "."
        accept: ["Zwei Kaffee, bitte."]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

      - id: x8
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x8.prompt"
        options:
          - { id: a, de: "Ein Tee, bitte.", correct: true }
          - { id: b, de: "Drei Wasser, bitte.", correct: true }
          - { id: c, de: "Tee!", correct: false, feedback: "@x8.o3.fb" }
          - { id: d, de: "Das macht drei Euro.", correct: false, feedback: "@x8.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x9
        type: cloze
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x9.prompt"
        text_de: "Was möchten Sie? – Zwei Kaffee, {{0}}. – Das {{1}} vier Euro."
        gaps:
          - { accept: ["bitte"] }
          - { accept: ["macht"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x9.expl"

      - id: x10
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x10.prompt"
        line_de: "Danke schön!"
        options:
          - { id: a, de: "Bitte schön!", correct: true }
          - { id: b, de: "Zwei Kaffee, bitte.", correct: false, feedback: "@x10.o2.fb" }
          - { id: c, de: "Was möchten Sie?", correct: false, feedback: "@x10.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x10.expl"

      - id: x11
        type: spelling_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x11.prompt"
        accept: ["acht"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["ach"], feedback: "@x11.r1" }
          - { match: ["aht"], feedback: "@x11.r2" }
        explanation: "@x11.expl"

      - id: x12
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x12.prompt"
        statement_de: "Man sagt: „Das macht sechs Euros.“"
        correct: false
        wrong_feedback: "@x12.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x12.expl"

      - id: x13
        type: word_order
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x13.prompt"
        tokens: ["Sie", "möchten", "Was"]
        final_punctuation: "?"
        accept: ["Was möchten Sie?"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x13.expl"

      - id: x14
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x14.prompt"
        options:
          - { id: a, de: "Ein Tee, bitte.", correct: true }
          - { id: b, de: "Eins Tee, bitte.", correct: false, feedback: "@x14.o2.fb" }
          - { id: c, de: "Elf Tee, bitte.", correct: false, feedback: "@x14.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x14.expl"

      - id: x15
        type: number_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal, concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x15.prompt"
        stem_de: "Drei Kaffee, bitte."
        accept: ["3"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x15.expl"

review:
