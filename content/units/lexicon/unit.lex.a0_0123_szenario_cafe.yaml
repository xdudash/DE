  pedagogical: { status: pending, notes: "Was möchten Sie?, Das macht … Euro, Hier, bitte! and Bitte schön are chunks. 'Ein Tee' introduces ein vs eins without the article system; reviewer to confirm that 'zwei Kaffee' (order form) is acceptable at A0." }
