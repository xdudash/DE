# A0 lesson, authored for DeutschGo with scripts/lesson_builder.py. Status needs_review: not reviewed by a human yet (DG-007, ADR-0021).
schema: deutschgo.unit/1
id: unit.lex.a0_0115_tschuess_auf_wiedersehen
version: 1.1.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.prag.goodbyes]
prerequisites: [concept.prag.greetings_dach]
goals: [general, everyday]
estimated_minutes: 9
objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "Tschüss, Anna!", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "Auf Wiedersehen, Herr Klein!", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "Bis bald!", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "Bis morgen, Frau Weber!", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "Tschüss und bis bald!", gloss: "@ex.5", highlight: [] }

  - { type: explanation, id: b_tip, body: "@tip" }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: match_pairs
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x1.prompt"
        pairs:
          - { id: a, left_de: "Auf", right_de: "Wiedersehen" }
          - { id: b, left_de: "Bis", right_de: "bald" }
          - { id: c, left_de: "Gute", right_de: "Nacht" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: single_choice
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x2.prompt"
        options:
          - { id: a, de: "Tschüss!", correct: true }
          - { id: b, de: "Guten Tag!", correct: false, feedback: "@x2.o2.fb" }
          - { id: c, de: "Hallo!", correct: false, feedback: "@x2.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x2.expl"

      - id: x3
        type: true_false
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x3.prompt"
        statement_de: "„Bis bald!“ = „Guten Tag!“"
        correct: false
        wrong_feedback: "@x3.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x3.expl"

      - id: x4
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x4.prompt"
        stem_de: "Bis ___!"
        accept: ["morgen", "Bis morgen"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["bald"], feedback: "@x4.r1" }
          - { match: ["Bis bald"], feedback: "@x4.r2" }
        explanation: "@x4.expl"

      - id: x5
        type: multi_choice
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x5.prompt"
        options:
          - { id: a, de: "Tschüss", correct: true }
          - { id: b, de: "Auf Wiedersehen", correct: true }
          - { id: c, de: "Bis bald", correct: true }
          - { id: d, de: "Guten Morgen", correct: false, feedback: "@x5.o4.fb" }
          - { id: e, de: "Hallo", correct: false, feedback: "@x5.o5.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x5.expl"

      - id: x6
        type: word_order
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x6.prompt"
        tokens: ["Anna", "bald,", "Bis"]
        final_punctuation: "!"
        accept: ["Bis bald, Anna!"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x6.expl"

      - id: x7
        type: reply_choice
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x7.prompt"
        line_de: "Auf Wiedersehen, Herr Klein!"
        options:
          - { id: a, de: "Auf Wiedersehen, Frau Weber!", correct: true }
          - { id: b, de: "Hallo, Frau Weber!", correct: false, feedback: "@x7.o2.fb" }
          - { id: c, de: "Guten Morgen, Frau Weber!", correct: false, feedback: "@x7.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

      - id: x8
        type: true_false
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x8.prompt"
        statement_de: "„Bis morgen!“ = „Bis bald!“"
        correct: false
        wrong_feedback: "@x8.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x9
        type: cloze
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x9.prompt"
        text_de: "Tschüss, Lisa! Bis {{0}}! – {{1}}, Tom!"
        gaps:
          - { accept: ["morgen", "bald"] }
          - { accept: ["Tschüss", "Tschüs", "Tschuess", "Tschues"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x9.expl"

      - id: x10
        type: single_choice
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x10.prompt"
        options:
          - { id: a, de: "Auf Wiedersehen!", correct: true }
          - { id: b, de: "Tschüss!", correct: false, feedback: "@x10.o2.fb" }
          - { id: c, de: "Bis bald!", correct: false, feedback: "@x10.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x10.expl"

      - id: x11
        type: transform
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x11.prompt"
        source_de: "Tschüss, Frau Weber!"
        accept: ["Auf Wiedersehen, Frau Weber!", "Auf Wiedersehen Frau Weber!"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x11.expl"

      - id: x12
        type: reply_choice
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x12.prompt"
        line_de: "Tschüss!"
        options:
          - { id: a, de: "Tschüss, bis morgen!", correct: true }
          - { id: b, de: "Guten Tag!", correct: false, feedback: "@x12.o2.fb" }
          - { id: c, de: "Auf Wiedersehen, Herr Klein!", correct: false, feedback: "@x12.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x12.expl"

      - id: x13
        type: spelling_input
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x13.prompt"
        accept: ["Auf Wiedersehen"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["Auf Widersehen"], feedback: "@x13.r1" }
          - { match: ["Auf wiedersehen"], feedback: "@x13.r2" }
          - { match: ["Auf Wiedersehn"], feedback: "@x13.r3" }
        explanation: "@x13.expl"

      - id: x14
        type: single_choice
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x14.prompt"
        options:
          - { id: a, de: "bald", correct: true }
          - { id: b, de: "morgen", correct: false, feedback: "@x14.o2.fb" }
          - { id: c, de: "bis", correct: false, feedback: "@x14.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x14.expl"

      - id: x15
        type: true_false
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x15.prompt"
        statement_de: "„Wiedersehen“ = „wieder“ + „sehen“"
        correct: true
        wrong_feedback: "@x15.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x15.expl"

      - id: x16
        type: spelling_input
        objective: obj_main
        concepts: [concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x16.prompt"
        accept: ["Bis morgen"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["Bis Morgen"], feedback: "@x16.r1" }
          - { match: ["Bis bald"], feedback: "@x16.r2" }
        explanation: "@x16.expl"

review:
  linguistic: { status: pending, notes: "Batch draft (ADR-0021). Needs a qualified German teacher or native speaker (DG-007)." }
  pedagogical: { status: pending, notes: "Auf Wiederhören (the phone goodbye) is not taught yet; exercises avoid phone situations. Tschuess/Tschues are accepted in the cloze as the ae/oe/ue spelling taught in 0103." }
  rights: { status: pending, notes: "Authored for DeutschGo; owner confirmation pending." }
