    items:
      - id: x1
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x1.prompt"
        options:
          - { id: a, de: "null", correct: true }
          - { id: b, de: "eins", correct: false, feedback: "@x1.o2.fb" }
          - { id: c, de: "zwei", correct: false, feedback: "@x1.o3.fb" }
