schema: deutschgo.unit/1
id: unit.lex.a0_0119_zahlen_0_5
version: 1.1.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.lex.numbers_cardinal]
prerequisites: []
goals: [general, everyday]
estimated_minutes: 9
objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "null, eins, zwei", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "Zimmer drei", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "Bus Nummer vier", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "fünf Euro", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "null – eins – fünf – zwei", gloss: "@ex.5", highlight: [] }

  - { type: explanation, id: b_tip, body: "@tip" }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: match_pairs
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x1.prompt"
        pairs:
          - { id: a, left_de: "null", right_de: "0" }
          - { id: b, left_de: "eins", right_de: "1" }
          - { id: c, left_de: "zwei", right_de: "2" }
          - { id: d, left_de: "drei", right_de: "3" }
          - { id: e, left_de: "vier", right_de: "4" }
          - { id: f, left_de: "fünf", right_de: "5" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x2.prompt"
        options:
          - { id: a, de: "Bus Nummer vier", correct: true }
          - { id: b, de: "Bus Nummer fünf", correct: false, feedback: "@x2.o2.fb" }
          - { id: c, de: "Bus Nummer drei", correct: false, feedback: "@x2.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x2.expl"

      - id: x3
        type: spelling_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x3.prompt"
        accept: ["vier"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["fier"], feedback: "@x3.r1" }
          - { match: ["vir", "veir"], feedback: "@x3.r2" }
        explanation: "@x3.expl"

      - id: x4
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x4.prompt"
        statement_de: "„Vier“ klingt am Anfang wie f."
        correct: true
        wrong_feedback: "@x4.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: cloze
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x5.prompt"
        text_de: "null, eins, {{0}}, drei, {{1}}, fünf"
        gaps:
          - { accept: ["zwei", "Zwei"] }
          - { accept: ["vier", "Vier"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x5.expl"

      - id: x6
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x6.prompt"
        options:
          - { id: a, de: "null", correct: true }
          - { id: b, de: "eins", correct: true }
          - { id: c, de: "zwei", correct: true }
          - { id: d, de: "vier", correct: false, feedback: "@x6.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x6.expl"

      - id: x7
        type: word_order
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x7.prompt"
        tokens: ["vier", "Nummer", "Zimmer"]
        final_punctuation: "."
        accept: ["Zimmer Nummer vier."]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

      - id: x8
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x8.prompt"
        options:
          - { id: a, de: "drei Euro", correct: true }
          - { id: b, de: "drei Euros", correct: false, feedback: "@x8.o2.fb" }
          - { id: c, de: "zwei Euro", correct: false, feedback: "@x8.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x9
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x9.prompt"
        stem_de: "Bus Nummer ___ (2)"
        accept: ["zwei"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["zwai"], feedback: "@x9.r1" }
          - { match: ["zwo"], feedback: "@x9.r2" }
        explanation: "@x9.expl"

      - id: x10
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x10.prompt"
        options:
          - { id: a, de: "eins", correct: true }
          - { id: b, de: "zwei", correct: true }
          - { id: c, de: "drei", correct: true }
          - { id: d, de: "vier", correct: false, feedback: "@x10.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x10.expl"

      - id: x11
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x11.prompt"
        statement_de: "vier + eins = fünf"
        correct: true
        wrong_feedback: "@x11.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x11.expl"

      - id: x12
        type: number_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x12.prompt"
        stem_de: "null – eins – fünf – zwei"
        accept: ["0152", "0 1 5 2", "01 52"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x12.expl"

      - id: x13
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x13.prompt"
        line_de: "Ihre Nummer, bitte?"
        options:
          - { id: a, de: "Null – eins – fünf – zwei.", correct: true }
          - { id: b, de: "Null – eins – vier – zwei.", correct: false, feedback: "@x13.o2.fb" }
          - { id: c, de: "Eins – null – fünf – zwei.", correct: false, feedback: "@x13.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x13.expl"

      - id: x14
        type: transform
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x14.prompt"
        source_de: "0 3 4"
        accept: ["null drei vier", "null, drei, vier", "null – drei – vier", "null-drei-vier"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x14.expl"

      - id: x15
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x15.prompt"
        line_de: "Welches Zimmer?"
        options:
          - { id: a, de: "Zimmer fünf.", correct: true }
          - { id: b, de: "Zimmer vier.", correct: false, feedback: "@x15.o2.fb" }
          - { id: c, de: "Zimmer eins.", correct: false, feedback: "@x15.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x15.expl"

