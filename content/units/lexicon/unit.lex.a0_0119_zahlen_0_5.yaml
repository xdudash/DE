        explanation: "@x1.expl"

      - id: x2
        type: number_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x2.prompt"
        stem_de: "drei"
        accept: ["3"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x2.expl"

      - id: x3
        type: match_pairs
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x3.prompt"
        pairs:
          - { id: a, left_de: "null", right_de: "0" }
          - { id: b, left_de: "eins", right_de: "1" }
          - { id: c, left_de: "zwei", right_de: "2" }
          - { id: d, left_de: "drei", right_de: "3" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x3.expl"

      - id: x4
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x4.prompt"
        statement_de: "„Fünf“ ist die Zahl 5."
        correct: true
        wrong_feedback: "@x4.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: spelling_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x5.prompt"
        accept: ["vier"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["fier"], feedback: "@x5.r1" }
          - { match: ["vir"], feedback: "@x5.r2" }
        explanation: "@x5.expl"

      - id: x6
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x6.prompt"
        options:
          - { id: a, de: "eins", correct: true }
          - { id: b, de: "fünf", correct: true }
