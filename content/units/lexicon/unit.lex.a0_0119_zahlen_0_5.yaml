        type: word_order
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x7.prompt"
        tokens: ["zwei", "Bus", "Nummer"]
        final_punctuation: "."
        accept: ["Bus Nummer zwei."]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

