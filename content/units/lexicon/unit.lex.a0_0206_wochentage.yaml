version: 1.0.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.lex.weekdays]
prerequisites: []
goals: [general, everyday]
estimated_minutes: 9
objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "Heute ist Montag.", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "am Dienstag", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "Am Mittwoch ist Kurs.", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "Bis Freitag!", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "Samstag und Sonntag sind Wochenende.", gloss: "@ex.5", highlight: [] }
      - { id: ex_6, de: "Mo.–Fr. 9–18 Uhr", gloss: "@ex.6", highlight: [] }

  - { type: explanation, id: b_tip, body: "@tip" }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x4
        type: match_pairs
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x4.prompt"
        pairs:
          - { id: a, left_de: "Montag", right_de: "Mo." }
          - { id: b, left_de: "Dienstag", right_de: "Di." }
          - { id: c, left_de: "Donnerstag", right_de: "Do." }
          - { id: d, left_de: "Samstag", right_de: "Sa." }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x5.prompt"
        options:
          - { id: a, de: "Montag", correct: true }
          - { id: b, de: "Mittwoch", correct: true }
          - { id: c, de: "Freitag", correct: true }
          - { id: d, de: "Sonntag", correct: false, feedback: "@x5.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x5.expl"

      - id: x1
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x1.prompt"
        options:
          - { id: a, de: "Dienstag", correct: true }
          - { id: b, de: "Mittwoch", correct: false, feedback: "@x1.o2.fb" }
          - { id: c, de: "Sonntag", correct: false, feedback: "@x1.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: spelling_input
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x2.prompt"
        accept: ["Donnerstag"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["Donerstag"], feedback: "@x2.r1" }
          - { match: ["Dienstag"], feedback: "@x2.r2" }
        explanation: "@x2.expl"

      - id: x3
        type: true_false
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x3.prompt"
        statement_de: "Samstag und Sonntag sind das Wochenende."
        correct: true
        wrong_feedback: "@x3.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x3.expl"

      - id: x6
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x6.prompt"
        stem_de: "___ Freitag"
        accept: ["am"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["an"], feedback: "@x6.r1" }
          - { match: ["im"], feedback: "@x6.r2" }
        explanation: "@x6.expl"

      - id: x7
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x7.prompt"
        line_de: "Welcher Tag ist heute?"
        options:
          - { id: a, de: "Heute ist Dienstag.", correct: true }
          - { id: b, de: "Heute ist Januar.", correct: false, feedback: "@x7.o2.fb" }
          - { id: c, de: "Heute ist zehn Uhr.", correct: false, feedback: "@x7.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

      - id: x10
        type: number_input
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x10.prompt"
        accept: ["5"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["6"], feedback: "@x10.r1" }
        explanation: "@x10.expl"

      - id: x9
        type: true_false
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x9.prompt"
        statement_de: "Donnerstag kommt vor Mittwoch."
        correct: false
        wrong_feedback: "@x9.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x9.expl"

      - id: x8
        type: word_order
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x8.prompt"
        tokens: ["Montag", "ist", "Heute"]
        final_punctuation: "."
        accept: ["Heute ist Montag."]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x11
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x11.prompt"
        options:
          - { id: a, de: "Mittwoch", correct: true }
          - { id: b, de: "Montag", correct: false, feedback: "@x11.o2.fb" }
          - { id: c, de: "Donnerstag", correct: false, feedback: "@x11.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x11.expl"

      - id: x14
        type: cloze
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x14.prompt"
        text_de: "Montag, Dienstag, {{0}}, Donnerstag, {{1}}, Samstag, Sonntag."
        gaps:
          - { accept: ["Mittwoch"] }
          - { accept: ["Freitag"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x14.expl"

      - id: x12
        type: transform
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x12.prompt"
        source_de: "Samstag"
        accept: ["am Samstag"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x12.expl"

      - id: x15
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x15.prompt"
        line_de: "Tschüss! Bis Freitag!"
        options:
          - { id: a, de: "Bis Freitag!", correct: true }
          - { id: b, de: "Guten Tag, Freitag!", correct: false, feedback: "@x15.o2.fb" }
          - { id: c, de: "Bis Januar!", correct: false, feedback: "@x15.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x15.expl"

      - id: x13
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x13.prompt"
        options:
          - { id: a, de: "Sonntag", correct: true }
          - { id: b, de: "Dienstag", correct: true }
          - { id: c, de: "Januar", correct: false, feedback: "@x13.o3.fb" }
          - { id: d, de: "Morgen", correct: false, feedback: "@x13.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x13.expl"

