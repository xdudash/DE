  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x1.prompt"
        line_de: "Tschüss! Bis Freitag!"
        options:
          - { id: a, de: "Bis Freitag!", correct: true }
          - { id: b, de: "Guten Tag!", correct: false, feedback: "@x1.o2.fb" }
          - { id: c, de: "Am Januar!", correct: false, feedback: "@x1.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x2.prompt"
        stem_de: "Heute ist ___."
        accept: ["Samstag", "Sonnabend"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["samstag"], feedback: "@x2.r1" }
          - { match: ["Sonntag"], feedback: "@x2.r2" }
        explanation: "@x2.expl"

      - id: x3
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x3.prompt"
        options:
          - { id: a, de: "Montag", correct: true }
          - { id: b, de: "Mittwoch", correct: true }
          - { id: c, de: "Freitag", correct: true }
          - { id: d, de: "Sonntag", correct: false, feedback: "@x3.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x3.expl"

      - id: x4
        type: true_false
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x4.prompt"
        statement_de: "Sonnabend ist ein anderes Wort für Samstag."
        correct: true
        wrong_feedback: "@x4.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: transform
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x5.prompt"
        source_de: "Sa."
        accept: ["Samstag", "Sonnabend"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["Sonntag"], feedback: "@x5.r1" }
        explanation: "@x5.expl"

      - id: x6
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x6.prompt"
        line_de: "Welcher Tag ist heute?"
        options:
          - { id: a, de: "Heute ist Dienstag.", correct: true }
          - { id: b, de: "Heute ist Januar.", correct: false, feedback: "@x6.o2.fb" }
          - { id: c, de: "Heute ist zehn Uhr.", correct: false, feedback: "@x6.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x6.expl"

      - id: x7
        type: word_order
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x7.prompt"
        tokens: ["Montag", "ist", "Heute"]
        final_punctuation: "."
        accept: ["Heute ist Montag."]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

      - id: x8
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x8.prompt"
        options:
          - { id: a, de: "Sonntag", correct: true }
          - { id: b, de: "Dienstag", correct: true }
          - { id: c, de: "Januar", correct: false, feedback: "@x8.o3.fb" }
          - { id: d, de: "Morgen", correct: false, feedback: "@x8.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x9
        type: cloze
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x9.prompt"
        text_de: "Montag, Dienstag, {{0}}, Donnerstag, {{1}}, Samstag, Sonntag."
        gaps:
          - { accept: ["Mittwoch"] }
          - { accept: ["Freitag"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x9.expl"

      - id: x10
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x10.prompt"
        stem_de: "Mo.–Fr. 9–18 Uhr"
        options:
          - { id: a, text: "@x10.o1", correct: true }
          - { id: b, text: "@x10.o2", correct: false, feedback: "@x10.o2.fb" }
          - { id: c, text: "@x10.o3", correct: false, feedback: "@x10.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x10.expl"

      - id: x11
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x11.prompt"
        stem_de: "___ Freitag"
        accept: ["am"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["an"], feedback: "@x11.r1" }
          - { match: ["im"], feedback: "@x11.r2" }
          - { match: ["in"], feedback: "@x11.r3" }
        explanation: "@x11.expl"

      - id: x12
        type: true_false
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x12.prompt"
        statement_de: "Samstag und Sonntag sind Wochenende."
        correct: true
        wrong_feedback: "@x12.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x12.expl"

      - id: x13
        type: spelling_input
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x13.prompt"
        stem_de: "? ← Samstag"
        accept: ["Freitag"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["Sonntag"], feedback: "@x13.r1" }
          - { match: ["Freitak"], feedback: "@x13.r2" }
        explanation: "@x13.expl"

      - id: x14
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x14.prompt"
        stem_de: "Montag → ?"
        options:
          - { id: a, de: "Dienstag", correct: true }
          - { id: b, de: "Mittwoch", correct: false, feedback: "@x14.o2.fb" }
          - { id: c, de: "Sonntag", correct: false, feedback: "@x14.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x14.expl"

      - id: x15
        type: match_pairs
        objective: obj_main
        concepts: [concept.lex.weekdays]
        difficulty: 1
        prompt: "@x15.prompt"
        pairs:
          - { id: a, left_de: "Montag", right_de: "1" }
          - { id: b, left_de: "Mittwoch", right_de: "3" }
          - { id: c, left_de: "Freitag", right_de: "5" }
          - { id: d, left_de: "Sonntag", right_de: "7" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x15.expl"

