schema: deutschgo.unit/1
id: unit.lex.a0_0122_szenario_kurs
version: 1.1.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
prerequisites: []
goals: [general, everyday]
estimated_minutes: 9
objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "Guten Morgen zusammen!", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "Hallo, ich heiße Anna.", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "Wie heißt du?", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "Wie heißen Sie?", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "Freut mich!", gloss: "@ex.5", highlight: [] }
      - { id: ex_6, de: "Tschüss, bis morgen!", gloss: "@ex.6", highlight: [] }

  - { type: explanation, id: b_tip, body: "@tip" }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: single_choice
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x1.prompt"
        options:
          - { id: a, de: "Ich heiße Anna.", correct: true }
          - { id: b, de: "Wie heißt du?", correct: false, feedback: "@x1.o2.fb" }
          - { id: c, de: "Freut mich.", correct: false, feedback: "@x1.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x2.prompt"
        stem_de: "Ich ___ Tom."
        accept: ["heiße", "heisse"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["heise"], feedback: "@x2.r1" }
          - { match: ["heißt", "heisst"], feedback: "@x2.r2" }
        explanation: "@x2.expl"

      - id: x3
        type: match_pairs
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x3.prompt"
        pairs:
          - { id: a, left_de: "Wie heißt du?", right_de: "Ich heiße Lena." }
          - { id: b, left_de: "Freut mich!", right_de: "Freut mich auch!" }
          - { id: c, left_de: "Tschüss!", right_de: "Tschüss, bis morgen!" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x3.expl"

      - id: x4
        type: true_false
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x4.prompt"
        statement_de: "„Wie heißt du?“ fragt nach dem Namen."
        correct: true
        wrong_feedback: "@x4.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: spelling_input
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x5.prompt"
        accept: ["Freut mich"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["Froit mich"], feedback: "@x5.r1" }
          - { match: ["Freut mir"], feedback: "@x5.r2" }
        explanation: "@x5.expl"

      - id: x6
        type: reply_choice
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x6.prompt"
        line_de: "Hallo, ich heiße Lena. Und du?"
        options:
          - { id: a, de: "Ich heiße Max.", correct: true }
          - { id: b, de: "Ich heiße Lena.", correct: false, feedback: "@x6.o2.fb" }
          - { id: c, de: "Auf Wiedersehen!", correct: false, feedback: "@x6.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x6.expl"

      - id: x7
        type: word_order
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x7.prompt"
        tokens: ["heißt", "du", "Wie"]
        final_punctuation: "?"
        accept: ["Wie heißt du?"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

      - id: x8
        type: multi_choice
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x8.prompt"
        options:
          - { id: a, de: "Hallo zusammen!", correct: true }
          - { id: b, de: "Guten Morgen!", correct: true }
          - { id: c, de: "Tschüss, bis morgen!", correct: false, feedback: "@x8.o3.fb" }
          - { id: d, de: "Gute Nacht!", correct: false, feedback: "@x8.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x9
        type: cloze
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x9.prompt"
        text_de: "Wie {{0}} du? – Ich {{1}} Anna."
        gaps:
          - { accept: ["heißt", "heisst"] }
          - { accept: ["heiße", "heisse"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x9.expl"

      - id: x10
        type: reply_choice
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x10.prompt"
        line_de: "Freut mich!"
        options:
          - { id: a, de: "Freut mich auch!", correct: true }
          - { id: b, de: "Gute Nacht!", correct: false, feedback: "@x10.o2.fb" }
          - { id: c, de: "Danke, tschüss!", correct: false, feedback: "@x10.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x10.expl"

      - id: x11
        type: transform
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x11.prompt"
        source_de: "Wie heißt du?"
        accept: ["Wie heißen Sie?", "Wie heissen Sie?"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x11.expl"

      - id: x12
        type: true_false
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x12.prompt"
        statement_de: "„Ich heiße Anna“ bedeutet: Mein Name ist Anna."
        correct: true
        wrong_feedback: "@x12.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x12.expl"

      - id: x13
        type: word_order
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x13.prompt"
        tokens: ["zusammen", "Morgen", "Guten"]
        final_punctuation: "!"
        accept: ["Guten Morgen zusammen!"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x13.expl"

      - id: x14
        type: single_choice
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x14.prompt"
        options:
          - { id: a, de: "Tschüss, bis morgen!", correct: true }
          - { id: b, de: "Hallo zusammen!", correct: false, feedback: "@x14.o2.fb" }
          - { id: c, de: "Freut mich!", correct: false, feedback: "@x14.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x14.expl"

      - id: x15
        type: cloze
        objective: obj_main
        concepts: [concept.prag.greetings_dach, concept.prag.goodbyes]
        difficulty: 1
        prompt: "@x15.prompt"
        text_de: "Tschüss, {{0}} morgen!"
        gaps:
          - { accept: ["bis"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x15.expl"

