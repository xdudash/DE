schema: deutschgo.unit/1
id: unit.lex.a0_0201_zahlen_20_50
version: 1.0.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.lex.numbers_tens]
prerequisites: [concept.lex.numbers_cardinal]
goals: [general, everyday]
estimated_minutes: 9
objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "zwanzig Euro", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "Bus Nummer dreißig", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "vierzig Minuten", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "fünfzig Cent", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "einundzwanzig", gloss: "@ex.5", highlight: [] }
      - { id: ex_6, de: "Wie alt bist du? – Ich bin dreiunddreißig.", gloss: "@ex.6", highlight: [] }
      - { id: ex_7, de: "Vierzig ist mehr als dreißig.", gloss: "@ex.7", highlight: [] }

  - { type: explanation, id: b_tip, body: "@tip" }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: match_pairs
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x1.prompt"
        pairs:
          - { id: a, left_de: "zwanzig", right_de: "20" }
          - { id: b, left_de: "dreißig", right_de: "30" }
          - { id: c, left_de: "vierzig", right_de: "40" }
          - { id: d, left_de: "fünfzig", right_de: "50" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x2.prompt"
        options:
          - { id: a, de: "dreißig", correct: true }
          - { id: b, de: "dreizehn", correct: false, feedback: "@x2.o2.fb" }
          - { id: c, de: "drei", correct: false, feedback: "@x2.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x2.expl"

      - id: x3
        type: spelling_input
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x3.prompt"
        stem_de: "50"
        accept: ["fünfzig", "fuenfzig"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["fünfzehn"], feedback: "@x3.r1" }
          - { match: ["funfzig"], feedback: "@x3.r2" }
        explanation: "@x3.expl"

      - id: x4
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x4.prompt"
        options:
          - { id: a, de: "zwanzig", correct: true }
          - { id: b, de: "vierzig", correct: true }
          - { id: c, de: "fünfzig", correct: true }
          - { id: d, de: "dreißig", correct: false, feedback: "@x4.o4.fb" }
          - { id: e, de: "vierzehn", correct: false, feedback: "@x4.o5.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x5.prompt"
        stem_de: "___undzwanzig (21)"
        accept: ["ein"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["eins"], feedback: "@x5.r1" }
          - { match: ["zwei"], feedback: "@x5.r2" }
        explanation: "@x5.expl"

      - id: x6
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x6.prompt"
        statement_de: "Zwanzig plus zehn ist dreißig."
        correct: true
        wrong_feedback: "@x6.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x6.expl"

      - id: x7
        type: word_order
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x7.prompt"
        tokens: ["dreißig", "Bus", "Nummer"]
        final_punctuation: "."
        accept: ["Bus Nummer dreißig."]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

      - id: x8
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x8.prompt"
        options:
          - { id: a, text: "@x8.o1", correct: true }
          - { id: b, text: "@x8.o2", correct: false, feedback: "@x8.o2.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x9
        type: number_input
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x9.prompt"
        stem_de: "siebenundvierzig"
        accept: ["47"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["74"], feedback: "@x9.r1" }
        explanation: "@x9.expl"

      - id: x10
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x10.prompt"
        line_de: "Wie alt bist du?"
        options:
          - { id: a, de: "Ich bin dreiunddreißig.", correct: true }
          - { id: b, de: "Ich bin dreißig drei.", correct: false, feedback: "@x10.o2.fb" }
          - { id: c, de: "Dreiunddreißig Euro.", correct: false, feedback: "@x10.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x10.expl"

      - id: x11
        type: transform
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x11.prompt"
        source_de: "33"
        accept: ["dreiunddreißig", "dreiunddreissig"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["dreißigdrei"], feedback: "@x11.r1" }
          - { match: ["drei und dreißig"], feedback: "@x11.r2" }
        explanation: "@x11.expl"

      - id: x12
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x12.prompt"
        options:
          - { id: a, de: "fünfunddreißig", correct: true }
          - { id: b, de: "dreiundfünfzig", correct: false, feedback: "@x12.o2.fb" }
          - { id: c, de: "dreißigfünf", correct: false, feedback: "@x12.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x12.expl"

      - id: x13
        type: cloze
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x13.prompt"
        text_de: "Das kostet {{0}} (40) Euro und {{1}} (20) Cent."
        gaps:
          - { accept: ["vierzig"] }
          - { accept: ["zwanzig"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x13.expl"

      - id: x14
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x14.prompt"
        statement_de: "Vierzig ist mehr als fünfzig."
        correct: false
        wrong_feedback: "@x14.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x14.expl"

      - id: x15
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x15.prompt"
        options:
          - { id: a, de: "einunddreißig", correct: true }
          - { id: b, de: "vierzig", correct: true }
          - { id: c, de: "neunundzwanzig", correct: false, feedback: "@x15.o3.fb" }
          - { id: d, de: "dreizehn", correct: false, feedback: "@x15.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x15.expl"

