schema: deutschgo.unit/1
id: unit.lex.a0_0201_zahlen_20_50
version: 1.0.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.lex.numbers_tens]
prerequisites: [concept.lex.numbers_cardinal]
goals: [general, everyday]
estimated_minutes: 8
objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "zwanzig Euro", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "Bus Nummer dreißig", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "vierzig Minuten", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "fünfzig Cent", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "einundzwanzig", gloss: "@ex.5", highlight: [] }
      - { id: ex_6, de: "Wie alt bist du? – Ich bin dreiunddreißig.", gloss: "@ex.6", highlight: [] }

  - { type: explanation, id: b_tip, body: "@tip" }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x1.prompt"
        options:
          - { id: a, de: "dreißig", correct: true }
          - { id: b, de: "dreizehn", correct: false, feedback: "@x1.o2.fb" }
          - { id: c, de: "dreizig", correct: false, feedback: "@x1.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: number_input
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x2.prompt"
        accept: ["40"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["14"], feedback: "@x2.r1" }
        explanation: "@x2.expl"

      - id: x3
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x3.prompt"
        statement_de: "Einundzwanzig ist die Zahl 21."
        correct: true
        wrong_feedback: "@x3.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x3.expl"

      - id: x4
        type: match_pairs
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x4.prompt"
        pairs:
          - { id: a, left_de: "zwanzig", right_de: "20" }
          - { id: b, left_de: "dreißig", right_de: "30" }
          - { id: c, left_de: "vierzig", right_de: "40" }
          - { id: d, left_de: "fünfzig", right_de: "50" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x5.prompt"
        options:
          - { id: a, de: "vierzig", correct: true }
          - { id: b, de: "fünfzig", correct: true }
          - { id: c, de: "einunddreißig", correct: true }
          - { id: d, de: "zwanzig", correct: false, feedback: "@x5.o4.fb" }
          - { id: e, de: "dreizehn", correct: false, feedback: "@x5.o5.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x5.expl"

      - id: x6
        type: spelling_input
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x6.prompt"
        accept: ["fünfzig"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["fünfzehn"], feedback: "@x6.r1" }
          - { match: ["funfzig"], feedback: "@x6.r2" }
        explanation: "@x6.expl"

      - id: x7
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x7.prompt"
        line_de: "Was kostet das?"
        options:
          - { id: a, de: "Vierzig Euro.", correct: true }
          - { id: b, de: "Vierzehn Uhr.", correct: false, feedback: "@x7.o2.fb" }
          - { id: c, de: "Guten Tag.", correct: false, feedback: "@x7.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

      - id: x8
        type: word_order
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x8.prompt"
        tokens: ["Euro", "kostet", "Das", "dreißig"]
        final_punctuation: "."
        accept: ["Das kostet dreißig Euro."]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x9
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x9.prompt"
        statement_de: "Vierundzwanzig ist 42."
        correct: false
        wrong_feedback: "@x9.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x9.expl"

      - id: x10
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x10.prompt"
        stem_de: "___undzwanzig (21)"
        accept: ["ein"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["eins"], feedback: "@x10.r1" }
          - { match: ["zwei"], feedback: "@x10.r2" }
        explanation: "@x10.expl"

      - id: x11
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x11.prompt"
        options:
          - { id: a, de: "fünfunddreißig", correct: true }
          - { id: b, de: "dreiundfünfzig", correct: false, feedback: "@x11.o2.fb" }
          - { id: c, de: "fünfzehn", correct: false, feedback: "@x11.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x11.expl"

      - id: x12
        type: number_input
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x12.prompt"
        accept: ["47"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["74"], feedback: "@x12.r1" }
        explanation: "@x12.expl"

      - id: x13
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x13.prompt"
        options:
          - { id: a, de: "einundzwanzig", correct: true }
          - { id: b, de: "achtundzwanzig", correct: true }
          - { id: c, de: "zweiunddreißig", correct: false, feedback: "@x13.o3.fb" }
          - { id: d, de: "zwölf", correct: false, feedback: "@x13.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x13.expl"

      - id: x14
        type: cloze
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x14.prompt"
        text_de: "Zehn plus {{0}} ist dreißig. Zwanzig plus zwanzig ist {{1}}."
        gaps:
          - { accept: ["zwanzig"] }
          - { accept: ["vierzig"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x14.expl"

      - id: x15
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x15.prompt"
        line_de: "Wie alt bist du?"
        options:
          - { id: a, de: "Ich bin dreiunddreißig.", correct: true }
          - { id: b, de: "Ich bin dreiunddreißig Euro.", correct: false, feedback: "@x15.o2.fb" }
          - { id: c, de: "Dreiunddreißig Uhr.", correct: false, feedback: "@x15.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x15.expl"

