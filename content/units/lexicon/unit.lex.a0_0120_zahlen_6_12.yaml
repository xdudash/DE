          - { id: d, left_de: "neun", right_de: "9" }
          - { id: e, left_de: "elf", right_de: "11" }
          - { id: f, left_de: "zwölf", right_de: "12" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x6.expl"

