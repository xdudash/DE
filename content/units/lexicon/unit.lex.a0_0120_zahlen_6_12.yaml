          - { id: d, de: "sieben", correct: false, feedback: "@x11.o4.fb" }
          - { id: e, de: "elf", correct: false, feedback: "@x11.o5.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x11.expl"

