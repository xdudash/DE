          incorrect: "@fb.incorrect"
          rules:
          - { match: ["zwelf"], feedback: "@x8.r1" }
          - { match: ["zwölv"], feedback: "@x8.r2" }
          - { match: ["zwoelf"], feedback: "@x8.r3" }
