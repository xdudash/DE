        type: match_pairs
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x6.prompt"
        pairs:
          - { id: a, left_de: "sechs", right_de: "6" }
          - { id: b, left_de: "sieben", right_de: "7" }
