id: unit.lex.a0_0202_zahlen_60_100
version: 1.0.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.lex.numbers_tens]
prerequisites: [concept.lex.numbers_cardinal]
goals: [general, everyday]
estimated_minutes: 9
objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "sechzig Minuten", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "siebzig Euro", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "Oma Erna ist achtzig.", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "neunzig Cent", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "Das kostet hundert Euro.", gloss: "@ex.5", highlight: [] }
      - { id: ex_6, de: "fünfundsiebzig", gloss: "@ex.6", highlight: [] }

  - { type: explanation, id: b_tip, body: "@tip" }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: match_pairs
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x1.prompt"
        pairs:
          - { id: a, left_de: "sechzig", right_de: "60" }
          - { id: b, left_de: "siebzig", right_de: "70" }
          - { id: c, left_de: "achtzig", right_de: "80" }
          - { id: d, left_de: "neunzig", right_de: "90" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x2.prompt"
        options:
          - { id: a, de: "sechzig", correct: true }
          - { id: b, de: "sechzehn", correct: false, feedback: "@x2.o2.fb" }
          - { id: c, de: "sechs", correct: false, feedback: "@x2.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x2.expl"

      - id: x3
        type: spelling_input
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x3.prompt"
        stem_de: "60"
        accept: ["sechzig"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["sechszig"], feedback: "@x3.r1" }
          - { match: ["sechzehn"], feedback: "@x3.r2" }
        explanation: "@x3.expl"

      - id: x4
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x4.prompt"
        statement_de: "Einhundert ist 100."
        correct: true
        wrong_feedback: "@x4.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x5.prompt"
        stem_de: "sieb___ (70)"
        accept: ["zig"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["enzig"], feedback: "@x5.r1" }
          - { match: ["zehn"], feedback: "@x5.r2" }
        explanation: "@x5.expl"

      - id: x6
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x6.prompt"
        options:
          - { id: a, text: "@x6.o1", correct: true }
          - { id: b, text: "@x6.o2", correct: false, feedback: "@x6.o2.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x6.expl"

      - id: x7
        type: number_input
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x7.prompt"
        stem_de: "dreiundsechzig"
        accept: ["63"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["36"], feedback: "@x7.r1" }
        explanation: "@x7.expl"

      - id: x8
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x8.prompt"
        options:
          - { id: a, de: "achtundneunzig", correct: true }
          - { id: b, de: "fünfundsiebzig", correct: true }
          - { id: c, de: "neunzigacht", correct: false, feedback: "@x8.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x9
        type: word_order
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x9.prompt"
        tokens: ["siebzig", "Nummer", "Bus"]
        final_punctuation: "."
        accept: ["Bus Nummer siebzig."]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x9.expl"

      - id: x10
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x10.prompt"
        stem_de: "Oma Erna: 90"
        options:
          - { id: a, de: "Sie ist neunzig.", correct: true }
          - { id: b, de: "Sie ist neunzehn.", correct: false, feedback: "@x10.o2.fb" }
          - { id: c, de: "Sie ist neunzig Euro.", correct: false, feedback: "@x10.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x10.expl"

      - id: x11
        type: transform
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x11.prompt"
        source_de: "75"
        accept: ["fünfundsiebzig", "fuenfundsiebzig"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["siebzigfünf"], feedback: "@x11.r1" }
          - { match: ["fünfundsiebenzig"], feedback: "@x11.r2" }
        explanation: "@x11.expl"

      - id: x12
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x12.prompt"
        statement_de: "Fünfzig plus fünfzig ist hundert."
        correct: true
        wrong_feedback: "@x12.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x12.expl"

      - id: x13
        type: cloze
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x13.prompt"
        text_de: "Das kostet {{0}} (80) Euro und {{1}} (90) Cent."
        gaps:
          - { accept: ["achtzig"] }
          - { accept: ["neunzig"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x13.expl"

      - id: x14
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x14.prompt"
        options:
          - { id: a, de: "neunzig", correct: true }
          - { id: b, de: "einundachtzig", correct: true }
          - { id: c, de: "achtzehn", correct: false, feedback: "@x14.o3.fb" }
          - { id: d, de: "neunundsiebzig", correct: false, feedback: "@x14.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x14.expl"

      - id: x15
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.numbers_tens]
        difficulty: 1
        prompt: "@x15.prompt"
        line_de: "Danke! Das macht siebzig Euro."
        options:
          - { id: a, de: "Hier, bitte.", correct: true }
          - { id: b, de: "Siebzehn Euro?", correct: false, feedback: "@x15.o2.fb" }
          - { id: c, de: "Guten Morgen!", correct: false, feedback: "@x15.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x15.expl"

