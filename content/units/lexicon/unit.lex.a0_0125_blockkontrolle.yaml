          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["ei"], feedback: "@x8.r1" }
          - { match: ["i"], feedback: "@x8.r2" }
        explanation: "@x8.expl"

      - id: x9
        type: true_false
        objective: obj_main
        concepts: [concept.pron.ch_sounds]
