        objective: obj_main
        concepts: [concept.prag.greetings_dach]
        difficulty: 1
        prompt: "@x11.prompt"
        source_de: "Hallo, Herr Klein!"
        accept: ["Guten Tag, Herr Klein!", "Guten Tag Herr Klein!"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x11.expl"

      - id: x12
        type: multi_choice
        objective: obj_main
        concepts: [concept.pron.r_and_final_er]
        difficulty: 1
        prompt: "@x12.prompt"
        options:
