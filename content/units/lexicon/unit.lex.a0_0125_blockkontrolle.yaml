objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "A, B, C … Ä, Ö, Ü, ß", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "Tag – Mann · Boot – Sonne", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "ich · acht · Schule · Straße · Sport", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "Guten Morgen! Danke! – Bitte! Tschüss!", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "null, eins, zwei … zwanzig", gloss: "@ex.5", highlight: [] }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: single_choice
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x1.prompt"
        options:
          - { id: a, de: "W", correct: true }
          - { id: b, de: "V", correct: false, feedback: "@x1.o2.fb" }
          - { id: c, de: "B", correct: false, feedback: "@x1.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x2.prompt"
        stem_de: "lena ät gmx ___ de"
        accept: ["Punkt"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["ät"], feedback: "@x2.r1" }
          - { match: ["Bindestrich"], feedback: "@x2.r2" }
        explanation: "@x2.expl"

      - id: x3
        type: true_false
        objective: obj_main
        concepts: [concept.pron.umlauts]
        difficulty: 1
        prompt: "@x3.prompt"
        statement_de: "Ö und O sind derselbe Buchstabe."
        correct: false
        wrong_feedback: "@x3.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x3.expl"

      - id: x4
        type: match_pairs
        objective: obj_main
        concepts: [concept.pron.umlauts]
        difficulty: 1
        prompt: "@x4.prompt"
        pairs:
          - { id: a, left_de: "München", right_de: "ü" }
          - { id: b, left_de: "Köln", right_de: "ö" }
          - { id: c, left_de: "Mädchen", right_de: "ä" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: single_choice
        objective: obj_main
        concepts: [concept.ortho.eszett_and_ss]
        difficulty: 1
        prompt: "@x5.prompt"
        options:
          - { id: a, de: "Straße", correct: true }
          - { id: b, de: "Strase", correct: false, feedback: "@x5.o2.fb" }
          - { id: c, de: "Straze", correct: false, feedback: "@x5.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x5.expl"

