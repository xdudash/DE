        type: multi_choice
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x7.prompt"
        options:
          - { id: a, de: "Boot", correct: true }
          - { id: b, de: "rot", correct: true }
          - { id: c, de: "gut", correct: true }
          - { id: d, de: "Sonne", correct: false, feedback: "@x7.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

