        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x23.prompt"
        text_de: "Was {{0}} das? – Das kostet drei Euro."
        gaps:
          - { accept: ["kostet"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x23.expl"

      - id: x24
        type: match_pairs
        objective: obj_main
