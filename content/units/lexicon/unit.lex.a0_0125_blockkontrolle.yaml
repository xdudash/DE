schema: deutschgo.unit/1
id: unit.lex.a0_0125_blockkontrolle
version: 1.0.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.pron.alphabet, concept.pron.umlauts, concept.ortho.eszett_and_ss, concept.pron.long_short_vowels, concept.pron.ch_sounds, concept.pron.sch_st_sp, concept.pron.r_and_final_er, concept.prag.greetings_dach, concept.prag.goodbyes, concept.prag.courtesy_phrases, concept.lex.numbers_cardinal]
