# A0 lesson, authored for DeutschGo with scripts/lesson_builder.py. Status needs_review: not reviewed by a human yet (DG-007, ADR-0021).
schema: deutschgo.unit/1
id: unit.lex.a0_0121_zahlen_13_20
version: 1.1.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.lex.numbers_cardinal]
prerequisites: []
goals: [general, everyday]
estimated_minutes: 9
objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "Bus Nummer dreizehn", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "vierzehn Euro", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "sechzehn Uhr", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "Ich bin achtzehn.", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "Zimmer neunzehn", gloss: "@ex.5", highlight: [] }
      - { id: ex_6, de: "Der Bus kommt in zwanzig Minuten.", gloss: "@ex.6", highlight: [] }

  - { type: explanation, id: b_tip, body: "@tip" }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: match_pairs
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x1.prompt"
        pairs:
          - { id: a, left_de: "dreizehn", right_de: "13" }
          - { id: b, left_de: "fünfzehn", right_de: "15" }
          - { id: c, left_de: "siebzehn", right_de: "17" }
          - { id: d, left_de: "neunzehn", right_de: "19" }
          - { id: e, left_de: "zwanzig", right_de: "20" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x2.prompt"
        options:
          - { id: a, de: "14", correct: true }
          - { id: b, de: "40", correct: false, feedback: "@x2.o2.fb" }
          - { id: c, de: "4", correct: false, feedback: "@x2.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x2.expl"

      - id: x3
        type: spelling_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x3.prompt"
        accept: ["sechzehn"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["sechszehn"], feedback: "@x3.r1" }
          - { match: ["sechzen"], feedback: "@x3.r2" }
        explanation: "@x3.expl"

      - id: x4
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x4.prompt"
        statement_de: "vierzehn + eins = fünfzehn"
        correct: true
        wrong_feedback: "@x4.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: multi_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x5.prompt"
        options:
          - { id: a, de: "siebzehn", correct: true }
          - { id: b, de: "achtzehn", correct: true }
          - { id: c, de: "zwanzig", correct: true }
          - { id: d, de: "vierzehn", correct: false, feedback: "@x5.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x5.expl"

      - id: x6
        type: cloze
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x6.prompt"
        text_de: "dreizehn, {{0}}, fünfzehn … achtzehn, {{1}}, zwanzig"
        gaps:
          - { accept: ["vierzehn", "Vierzehn"] }
          - { accept: ["neunzehn", "Neunzehn"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x6.expl"

      - id: x7
        type: true_false
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x7.prompt"
        statement_de: "In „sechzehn“ hört man ch wie in „ich“."
        correct: true
        wrong_feedback: "@x7.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

      - id: x8
        type: word_order
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x8.prompt"
        tokens: ["in zwanzig Minuten", "kommt", "Der Bus"]
        final_punctuation: "."
        accept: ["Der Bus kommt in zwanzig Minuten."]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x9
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x9.prompt"
        stem_de: "Bus Nummer ___"
        accept: ["dreizehn"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["dreizen"], feedback: "@x9.r1" }
          - { match: ["dreißig"], feedback: "@x9.r2" }
        explanation: "@x9.expl"

      - id: x10
        type: single_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x10.prompt"
        options:
          - { id: a, de: "um siebzehn Uhr", correct: true }
          - { id: b, de: "um sieben Uhr", correct: false, feedback: "@x10.o2.fb" }
          - { id: c, de: "um siebzig Uhr", correct: false, feedback: "@x10.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x10.expl"

      - id: x11
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x11.prompt"
        stem_de: "vier___"
        accept: ["zehn"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["zig"], feedback: "@x11.r1" }
          - { match: ["zen"], feedback: "@x11.r2" }
        explanation: "@x11.expl"

      - id: x12
        type: reply_choice
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x12.prompt"
        line_de: "Wie alt bist du?"
        options:
          - { id: a, de: "Ich bin achtzehn.", correct: true }
          - { id: b, de: "Ich bin achtzig.", correct: false, feedback: "@x12.o2.fb" }
          - { id: c, de: "Ich bin acht.", correct: false, feedback: "@x12.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x12.expl"

      - id: x13
        type: number_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x13.prompt"
        stem_de: "Zimmer neunzehn"
        accept: ["19"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x13.expl"

      - id: x14
        type: transform
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x14.prompt"
        source_de: "14 €"
        accept: ["vierzehn Euro"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["vierzig Euro"], feedback: "@x14.r1" }
          - { match: ["vierzehn Euros"], feedback: "@x14.r2" }
        explanation: "@x14.expl"

      - id: x15
        type: time_input
        objective: obj_main
        concepts: [concept.lex.numbers_cardinal]
        difficulty: 1
        prompt: "@x15.prompt"
        stem_de: "neunzehn Uhr"
        accept: ["19:00", "19.00"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["9:00", "09:00"], feedback: "@x15.r1" }
        explanation: "@x15.expl"

review:
  linguistic: { status: pending, notes: "Batch draft (ADR-0021). Needs a qualified German teacher or native speaker (DG-007)." }
  pedagogical: { status: pending, notes: "Chunks glossed in the examples: Bus Nummer, Zimmer, Uhr, um (at), Ich bin … / Wie alt bist du?, Der Bus kommt in … Minuten. Distractors use dreißig, vierzig, siebzig, achtzig (taught in 0201/0202) as the typical -zehn/-zig confusion; feedback names their values. The -ig pronunciation (-ich in Germany, -ik in the south, Austria, Switzerland) is in the tip and needs a native check." }
  rights: { status: pending, notes: "Authored for DeutschGo; owner confirmation pending." }
