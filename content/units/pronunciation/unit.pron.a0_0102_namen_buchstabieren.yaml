id: unit.pron.a0_0102_namen_buchstabieren
version: 1.0.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.pron.alphabet]
prerequisites: []
goals: [general, everyday]
estimated_minutes: 9
objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "Wie schreibt man das?", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "M – E – Y – E – R", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "M – Ü – Doppel-L – E – R", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "V – fau, W – we", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "J – jot, Y – ypsilon", gloss: "@ex.5", highlight: [] }
      - { id: ex_6, de: "W wie Wasser", gloss: "@ex.6", highlight: [] }

  - { type: explanation, id: b_tip, body: "@tip" }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: single_choice
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x1.prompt"
        options:
          - { id: a, de: "we", correct: true }
          - { id: b, de: "Doppel-U", correct: false, feedback: "@x1.o2.fb" }
          - { id: c, de: "fau", correct: false, feedback: "@x1.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: spelling_input
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x2.prompt"
        accept: ["Meyer"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["Meier"], feedback: "@x2.r1" }
          - { match: ["Mayer"], feedback: "@x2.r2" }
        explanation: "@x2.expl"

      - id: x3
        type: true_false
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x3.prompt"
        statement_de: "„Fau“ ist der Name von V."
        correct: true
        wrong_feedback: "@x3.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x3.expl"

      - id: x4
        type: match_pairs
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x4.prompt"
        pairs:
          - { id: a, left_de: "V", right_de: "fau" }
          - { id: b, left_de: "W", right_de: "we" }
          - { id: c, left_de: "J", right_de: "jot" }
          - { id: d, left_de: "Y", right_de: "ypsilon" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: multi_choice
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x5.prompt"
        options:
          - { id: a, de: "A", correct: true }
          - { id: b, de: "N", correct: true }
          - { id: c, de: "M", correct: false, feedback: "@x5.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x5.expl"

      - id: x6
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x6.prompt"
        stem_de: "M – Ü – L – L – E – ___"
        accept: ["R"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["A"], feedback: "@x6.r1" }
        explanation: "@x6.expl"

      - id: x7
        type: reply_choice
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x7.prompt"
        line_de: "Wie schreibt man das?"
        options:
          - { id: a, de: "M – E – Y – E – R.", correct: true }
          - { id: b, de: "Ich heiße Meyer.", correct: false, feedback: "@x7.o2.fb" }
          - { id: c, de: "Danke schön!", correct: false, feedback: "@x7.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

      - id: x8
        type: word_order
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x8.prompt"
        tokens: ["man", "das", "schreibt", "Wie"]
        final_punctuation: "?"
        accept: ["Wie schreibt man das?"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x9
        type: true_false
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x9.prompt"
        statement_de: "Für zwei gleiche Buchstaben sagt man oft „Doppel-“."
        correct: true
        wrong_feedback: "@x9.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x9.expl"

      - id: x10
        type: spelling_input
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x10.prompt"
        accept: ["J"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["Y"], feedback: "@x10.r1" }
          - { match: ["I"], feedback: "@x10.r2" }
        explanation: "@x10.expl"

      - id: x11
        type: single_choice
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x11.prompt"
        options:
          - { id: a, de: "Y", correct: true }
          - { id: b, de: "I", correct: false, feedback: "@x11.o2.fb" }
          - { id: c, de: "J", correct: false, feedback: "@x11.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x11.expl"

      - id: x12
        type: cloze
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x12.prompt"
        text_de: "Wie {{0}} man das? – B – E – C – K: {{1}}."
        gaps:
          - { accept: ["schreibt"] }
          - { accept: ["Beck"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x12.expl"

      - id: x13
        type: multi_choice
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x13.prompt"
        options:
          - { id: a, de: "be", correct: true }
          - { id: b, de: "ha", correct: true }
          - { id: c, de: "fau", correct: true }
          - { id: d, de: "double-u", correct: false, feedback: "@x13.o4.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x13.expl"

      - id: x14
        type: transform
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x14.prompt"
        source_de: "Klein"
        accept: ["K – L – E – I – N", "K-L-E-I-N", "K - L - E - I - N", "K L E I N"]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x14.expl"

      - id: x15
        type: reply_choice
        objective: obj_main
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x15.prompt"
        line_de: "Wie ist Ihr Name, bitte?"
        options:
          - { id: a, de: "Klein. K – L – E – I – N.", correct: true }
          - { id: b, de: "Guten Abend.", correct: false, feedback: "@x15.o2.fb" }
          - { id: c, de: "Tschüss.", correct: false, feedback: "@x15.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x15.expl"

