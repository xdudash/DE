  pedagogical: { status: pending, notes: "Chunks glossed in the examples or prompts, not taught as grammar yet: Die Uhr ist rot, Das Brot ist gut, Meine Mutter ist Lehrerin, Wie heißt das auf Deutsch?, ich glaube, Nein/Ja. Buch/Kuchen are named as exceptions." }
