schema: deutschgo.unit/1
id: unit.pron.a0_0108_vowels_ou
version: 1.1.0
status: needs_review
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.pron.long_short_vowels]
prerequisites: []
goals: [general, everyday]
estimated_minutes: 10
objectives:
  - { id: obj_main, text: "@obj", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@intro" }

  - type: examples
    id: b_examples
    title: "@examples"
    items:
      - { id: ex_1, de: "das Boot", gloss: "@ex.1", highlight: [] }
      - { id: ex_2, de: "die Sonne", gloss: "@ex.2", highlight: [] }
      - { id: ex_3, de: "der Sohn", gloss: "@ex.3", highlight: [] }
      - { id: ex_4, de: "rot", gloss: "@ex.4", highlight: [] }
      - { id: ex_5, de: "die Mutter", gloss: "@ex.5", highlight: [] }
      - { id: ex_6, de: "gut", gloss: "@ex.6", highlight: [] }
      - { id: ex_7, de: "die Uhr", gloss: "@ex.7", highlight: [] }
      - { id: ex_8, de: "der Hund", gloss: "@ex.8", highlight: [] }
      - { id: ex_9, de: "Die Uhr ist rot.", gloss: "@ex.9", highlight: [] }
      - { id: ex_10, de: "Das Brot ist gut.", gloss: "@ex.10", highlight: [] }

  - { type: explanation, id: b_tip, body: "@tip" }

  - { type: explanation, id: b_summary, body: "@summary_block" }

  - type: exercises
    id: b_practice
    title: "@practice"
    items:
      - id: x1
        type: multi_choice
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x1.prompt"
        options:
          - { id: a, de: "Boot", correct: true }
          - { id: b, de: "rot", correct: true }
          - { id: c, de: "Sohn", correct: true }
          - { id: d, de: "Sonne", correct: false, feedback: "@x1.o4.fb" }
          - { id: e, de: "Post", correct: false, feedback: "@x1.o5.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x1.expl"

      - id: x2
        type: match_pairs
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x2.prompt"
        pairs:
          - { id: a, left_de: "Sonne", right_de: "kurzes o" }
          - { id: b, left_de: "Brot", right_de: "langes o" }
          - { id: c, left_de: "Hund", right_de: "kurzes u" }
          - { id: d, left_de: "Hut", right_de: "langes u" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x2.expl"

      - id: x3
        type: true_false
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x3.prompt"
        statement_de: "In „Sohn“ ist das o lang."
        correct: true
        wrong_feedback: "@x3.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x3.expl"

      - id: x4
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x4.prompt"
        stem_de: "Meine Mu___er ist Lehrerin."
        accept: ["tt"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["t"], feedback: "@x4.r1" }
        explanation: "@x4.expl"

      - id: x5
        type: single_choice
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x5.prompt"
        options:
          - { id: a, de: "Hund", correct: true }
          - { id: b, de: "gut", correct: false, feedback: "@x5.o2.fb" }
          - { id: c, de: "Uhr", correct: false, feedback: "@x5.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x5.expl"

      - id: x6
        type: spelling_input
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x6.prompt"
        accept: ["Boot", "das Boot"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["Bot"], feedback: "@x6.r1" }
          - { match: ["Boat"], feedback: "@x6.r2" }
        explanation: "@x6.expl"

      - id: x7
        type: reply_choice
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x7.prompt"
        line_de: "Wie heißt das auf Deutsch: „sun“?"
        options:
          - { id: a, de: "Sonne.", correct: true }
          - { id: b, de: "Sone.", correct: false, feedback: "@x7.o2.fb" }
          - { id: c, de: "Sohn.", correct: false, feedback: "@x7.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

      - id: x8
        type: word_order
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x8.prompt"
        tokens: ["rot", "Die Uhr", "ist"]
        final_punctuation: "."
        accept: ["Die Uhr ist rot."]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x8.expl"

      - id: x9
        type: single_choice
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x9.prompt"
        stem_de: "Sohn · Sonne"
        options:
          - { id: a, de: "Sohn", correct: true }
          - { id: b, de: "Sonne", correct: false, feedback: "@x9.o2.fb" }
          - { id: c, text: "@x9.o3", correct: false, feedback: "@x9.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x9.expl"

      - id: x10
        type: transform
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x10.prompt"
        source_de: "Das Brot ist gutt."
        accept: ["Das Brot ist gut."]
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x10.expl"

      - id: x11
        type: true_false
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x11.prompt"
        statement_de: "In „Buch“ ist das u lang."
        correct: true
        wrong_feedback: "@x11.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x11.expl"

      - id: x12
        type: cloze
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x12.prompt"
        text_de: "So{{0}}e · ko{{1}}en · Ko{{2}}er"
        gaps:
          - { accept: ["nn"] }
          - { accept: ["mm"] }
          - { accept: ["ff"] }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x12.expl"

      - id: x13
        type: single_choice
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x13.prompt"
        options:
          - { id: a, de: "Hund", correct: true }
          - { id: b, de: "Hunt", correct: false, feedback: "@x13.o2.fb" }
          - { id: c, de: "Huhnd", correct: false, feedback: "@x13.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x13.expl"

      - id: x14
        type: reply_choice
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x14.prompt"
        line_de: "Ich glaube, in „Post“ ist das o lang."
        options:
          - { id: a, de: "Nein, das o ist kurz: st.", correct: true }
          - { id: b, de: "Ja, das o ist lang.", correct: false, feedback: "@x14.o2.fb" }
          - { id: c, de: "Ja, wie in „Boot“.", correct: false, feedback: "@x14.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x14.expl"

      - id: x15
        type: gap_fill_input
        objective: obj_main
        concepts: [concept.pron.long_short_vowels]
        difficulty: 1
        prompt: "@x15.prompt"
        stem_de: "die U___"
        accept: ["hr"]
        feedback:
          correct: "@fb.correct"
          incorrect: "@fb.incorrect"
          rules:
          - { match: ["r"], feedback: "@x15.r1" }
        explanation: "@x15.expl"

