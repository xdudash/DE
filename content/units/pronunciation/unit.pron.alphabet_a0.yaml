# A0 calibration unit: the alphabet and how to spell words aloud.
# Status approved: approved by the project owner on 2026-10-24. A native-speaker review is still advisable (DG-007).
schema: deutschgo.unit/1
id: unit.pron.alphabet_a0
version: 1.1.0
status: approved
title: "@title"
summary: "@summary"
cefr: A0
concepts: [concept.pron.alphabet]
prerequisites: []
goals: [general, everyday]
estimated_minutes: 12
objectives:
  - { id: obj_letters, text: "@obj.letters", skill: knowledge }
  - { id: obj_spell, text: "@obj.spell", skill: knowledge }
sources:
  - { source: src.deutschgo_original }

blocks:
  - { type: explanation, id: b_intro, body: "@b.intro" }

  - type: examples
    id: b_examples
    title: "@b.examples.title"
    items:
      - { id: ex_berlin, de: "B – E – R – L – I – N", gloss: "@ex.berlin", highlight: [] }
      - { id: ex_anna, de: "A – N – N – A", gloss: "@ex.anna", highlight: [] }
      - { id: ex_umlaut, de: "Ö wie in „schön“", gloss: "@ex.umlaut", highlight: [] }
      - { id: ex_uber, de: "Ü wie in „über“", gloss: "@ex.uber", highlight: [] }
      - { id: ex_eszett, de: "ß – scharfes S", gloss: "@ex.eszett", highlight: [] }

  - { type: explanation, id: b_tip, body: "@b.tip" }

  - { type: explanation, id: b_summary, body: "@b.summary" }

  - type: exercises
    id: b_practice
    title: "@b.practice.title"
    items:
      - id: x_spell_name
        type: single_choice
        objective: obj_spell
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x.spell_name.prompt"
        options:
          - { id: a, de: "Ö", correct: true }
          - { id: b, de: "O", correct: false, feedback: "@x.spell_name.b" }
          - { id: c, de: "Ä", correct: false, feedback: "@x.spell_name.c" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x.spell_name.explanation"

      - id: x_letter_names
        type: single_choice
        objective: obj_letters
        concepts: [concept.pron.alphabet]
        difficulty: 1
        prompt: "@x.letter_names.prompt"
        stem_de: "Wie buchstabiert man „Mai“?"
        options:
          - { id: a, de: "M – A – I", correct: true }
          - { id: b, de: "N – A – Y", correct: false, feedback: "@x.letter_names.b" }
          - { id: c, de: "M – E – I", correct: false, feedback: "@x.letter_names.c" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x.letter_names.explanation"

      - id: x_spell_tuer
        type: single_choice
        objective: obj_spell
        concepts: [concept.pron.alphabet]
        difficulty: 2
        prompt: "@x.tuer.prompt"
        stem_de: "Tür"
        options:
          - { id: a, de: "T – U – R", correct: false, feedback: "@x.tuer.b" }
          - { id: b, de: "T – Ü – R", correct: true }
          - { id: c, de: "T – U – E", correct: false, feedback: "@x.tuer.c" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x.tuer.explanation"

      - id: x_spell_haus
        type: single_choice
        objective: obj_spell
        concepts: [concept.pron.alphabet]
        difficulty: 2
        prompt: "@x.haus.prompt"
        stem_de: "Haus"
        options:
          - { id: a, de: "H – A – U – S", correct: true }
          - { id: b, de: "H – A – U – Z", correct: false, feedback: "@x.haus.b" }
          - { id: c, de: "H – O – U – S", correct: false, feedback: "@x.haus.c" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x.haus.explanation"

      - id: x_eszett_letter
        type: single_choice
        objective: obj_letters
        concepts: [concept.pron.alphabet]
        difficulty: 2
        prompt: "@x.eszett_letter.prompt"
        options:
          - { id: a, de: "ss", correct: false, feedback: "@x.eszett_letter.a" }
          - { id: b, de: "ß", correct: true }
          - { id: c, de: "sz", correct: false, feedback: "@x.eszett_letter.c" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x.eszett_letter.explanation"

review:
  linguistic: { status: passed, reviewer: "project owner", date: 2026-10-24, notes: "Approved by the project owner, 2026-10-24. Not a native-speaker review; a qualified check is still advisable (DG-007)." }
  pedagogical: { status: passed, reviewer: "project owner", date: 2026-10-24, notes: "Approved by the project owner, 2026-10-24, as the reference lesson for drafting. Check the 12-minute estimate in the first real lesson run." }
  rights: { status: passed, reviewer: "project owner", date: 2026-10-24, notes: "Authored for DeutschGo; approved by the project owner, 2026-10-24." }
