        objective: obj_main
        concepts: [concept.pron.umlauts]
        difficulty: 1
        prompt: "@x1.prompt"
        options:
          - { id: a, de: "München", correct: true }
          - { id: b, de: "Köln", correct: false, feedback: "@x1.o2.fb" }
