          - { id: b, de: "K – O – L – N.", correct: false, feedback: "@x7.o2.fb" }
          - { id: c, de: "K – Ü – L – N.", correct: false, feedback: "@x7.o3.fb" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x7.expl"

