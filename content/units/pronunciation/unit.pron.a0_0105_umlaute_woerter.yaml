        wrong_feedback: "@x3.wrong"
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x3.expl"

      - id: x4
        type: match_pairs
        objective: obj_main
        concepts: [concept.pron.umlauts]
        difficulty: 1
        prompt: "@x4.prompt"
        pairs:
          - { id: a, left_de: "Mädchen", right_de: "ä" }
          - { id: b, left_de: "Brötchen", right_de: "ö" }
          - { id: c, left_de: "Zürich", right_de: "ü" }
        feedback: { correct: "@fb.correct", incorrect: "@fb.incorrect" }
        explanation: "@x4.expl"

      - id: x5
        type: multi_choice
        objective: obj_main
        concepts: [concept.pron.umlauts]
        difficulty: 1
        prompt: "@x5.prompt"
