  pattern.limits: "На уровне A0 рассматриваем только три распространённых прощания; Ciao упомянуто только как неформальное."
  ex.tschuess: "Tschüss (пока): неформально, с друзьями и ровесниками."
  ex.auf_wiedersehen: "Auf Wiedersehen (до свидания): официально, с преподавателями, начальством и незнакомцами."
  ex.bis_bald: "Bis bald (до скорого): неформально, когда ожидаете скорую встречу."
