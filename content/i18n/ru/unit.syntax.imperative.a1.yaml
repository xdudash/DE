translator: Codex (AI draft, 2026-10-26)
strings:
  title: "Повелительное наклонение: простые инструкции"
  summary: "Используйте формы du, ihr и вежливое Sie для коротких инструкций и просьб."
  obj.recognize: "Распознавать приказ и определять, к кому он обращён: du, ihr или вежливое Sie."
  obj.form: "Составлять короткие инструкции для одного человека, группы и вежливого обращения."
  b.intro: "Повелительное наклонение используют для инструкций и просьб. У многих частых глаголов формы легко узнать: *mach!* для одного человека (*du*), *macht!* для нескольких (*ihr*) и *machen Sie!* при вежливом обращении.\n\nВ краткой форме для одного человека *du* опускают. В вежливой форме *Sie* стоит после глагола. Слово *bitte* делает просьбу вежливее."
  b.pattern.caption: "Три полезные формы"
  col.form: "Форма приказа"
  col.subject: "К кому обращаются"
  col.example: "Пример"
  b.examples.title: "Инструкции и просьбы"
  ex.du: "Открой окно, пожалуйста! (одному человеку, неформально)"
  ex.ihr: "Откройте книги, пожалуйста! (нескольким людям, неформально)"
  ex.sie: "Откройте дверь, пожалуйста! (вежливо)"
  ex.wait: "Пожалуйста, подождите здесь! (вежливо)"
  b.position: "У отделяемых глаголов приставка стоит в конце: *Mach das Fenster auf!* (Открой окно!). В вежливой инструкции глагол стоит первым, а за ним следует *Sie*: *Öffnen Sie bitte das Fenster!* Здесь изучаются частые схемы; некоторые глаголы имеют особые формы, которые разбираются отдельно."
  b.errors.title: "Следите за порядком слов"
  e.du_subject: "В неформальном обращении к одному человеку опустите *du*: *Mach das Fenster auf!*"
  e.sie_order: "В вежливом приказе сначала поставьте глагол, затем *Sie*: *Machen Sie die Tür auf!*"
  b.summary: "- Один человек, неформально: основа глагола, обычно без *du*: *Mach!*\n- Несколько человек, неформально: форма *ihr* без местоимения: *Macht!*\n- Вежливое обращение: сначала глагол, затем *Sie*: *Machen Sie!*\n- У отделяемого глагола приставка стоит в конце: *Mach die Tür auf!* Добавьте *bitte* для вежливой просьбы."
  b.practice.title: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Проверьте, к кому обращаются и где стоит глагол."
  x.choose_du.prompt: "Выберите приказ для одного человека, к которому обращаются на «ты»."
  x.choose_du.a: "Это утверждение с подлежащим *du*, а не обычная краткая форма приказа."
  x.choose_du.c: "*Macht* обращено к нескольким людям (*ihr*)."
  x.choose_du.explanation: "Для одного человека используйте *Mach!* и опустите *du*."
  x.match.prompt: "Соедините форму с теми, к кому обращаются."
  x.match.explanation: "Используйте *mach* с *du*, *macht* с *ihr* и *machen Sie* в вежливой просьбе."
  x.cloze.prompt: "Дополните вежливую просьбу глаголом *machen*."
  x.cloze.explanation: "В вежливом приказе поставьте *machen* первым, а затем *Sie*: *Machen Sie bitte ...!*"
  x.order.prompt: "Составьте просьбу: «Открой окно, пожалуйста!» (одному человеку, неформально)"
  x.order.explanation: "Начните с *Mach*, затем добавьте *bitte* и дополнение; отделяемая приставка *auf* стоит в конце."
  x.transform.prompt: "Преобразуйте утверждение в приказ для нескольких людей: Ihr macht bitte die Bücher auf."
  x.transform.explanation: "Используйте форму *ihr* — *macht*, но опустите местоимение *ihr*: *Macht bitte die Bücher auf!*"
  x.categorize.prompt: "Распределите инструкции по адресату."
  x.categorize.du: "Один человек (du)"
  x.categorize.ihr: "Несколько людей (ihr)"
  x.categorize.sie: "Вежливое обращение (Sie)"
  x.categorize.explanation: "*Mach* обращено к одному человеку, *macht* — к группе, *machen Sie* или *warten Sie* — вежливая форма."
  x.true_false.prompt: "Верно или неверно? В кратком неформальном приказе одному человеку обычно опускают *du*."
  x.true_false.wrong: "В краткой форме обычно говорят *Mach!* без *du*."
  x.true_false.explanation: "Форма глагола показывает адресата, поэтому *du* обычно опускают: *Mach!*"
  x.correct.prompt: "Исправьте порядок слов в этой вежливой просьбе."
  x.correct.explanation: "Поставьте глагол первым, затем вежливое *Sie*: *Öffnen Sie bitte das Fenster!*"
  x.situation.prompt: "Как вежливо попросить подождать здесь?"
  x.situation.b: "Это утверждение, а не инструкция."
  x.situation.c: "В вежливом приказе *Sie* следует за глаголом, а не стоит в конце."
  x.situation.explanation: "Вежливая инструкция начинается с глагола: *Warten Sie bitte hier!*"
