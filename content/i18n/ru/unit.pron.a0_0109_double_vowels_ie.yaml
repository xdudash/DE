strings:
  title: "Удвоенные гласные и ie"
  summary: "aa, ee, oo и ie всегда обозначают долгую гласную."
  obj: "Читать и писать слова с aa, ee, oo и ie."
  intro: "Некоторые долгие гласные пишутся дважды: aa как в Haar, ee как в See, oo как в Boot. Долгое i обычно пишется ie: Bier, vier, sieben. Удвоенных i и u в немецких словах нет. Удвоенная согласная (tt, nn) — противоположный сигнал: она показывает краткую гласную."
  examples: "Слова с удвоенными гласными и ie."
  summary_block: "**aa, ee, oo:** долгие a, e, o (Haar, See, Boot). **ie:** долгое i (Bier, vier). **tt, nn:** краткая гласная."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "волосы: долгое a, пишется aa"
  ex.2: "пара: долгое a, пишется aa"
  ex.3: "озеро: долгое e, пишется ee"
  ex.4: "море: долгое e, пишется ee"
  ex.5: "зоопарк: долгое o, пишется oo"
  ex.6: "пиво: долгое i, пишется ie"
  ex.7: "четыре: долгое i, пишется ie"
  ex.8: "семь: долгое i, пишется ie"
  x1.prompt: "В каком слове долгое i пишется ie?"
  x1.o2.fb: "В Mitte после i стоит tt, поэтому i краткое и пишется одной i."
  x1.o3.fb: "В Kind после i стоит nd, поэтому i краткое."
  x1.expl: "vier: ie — долгое i."
  x2.prompt: "Напишите слово «озеро»."
  x2.r1: "В See удвоенное e: ee — долгое e."
  x2.r2: "Sea — по-английски. По-немецки See."
  x2.expl: "der See: ee для долгого e."
  x3.prompt: "Соедините каждое слово с написанием его долгой гласной."
  x3.expl: "У каждой долгой гласной своё удвоенное написание; долгое i — ie."
  x4.prompt: "Правда или нет?"
  x4.wrong: "Это правда: ie читается как одно долгое i, как в Bier."
  x4.expl: "ie — один звук: долгое i."
  x5.prompt: "В каких словах удвоенная гласная?"
  x5.o4.fb: "В Sonne удвоенная согласная nn, а не гласная."
  x5.o5.fb: "В Bett удвоенная согласная tt, а не гласная."
  x5.expl: "Haar, Meer и Zoo удваивают гласную; Sonne и Bett — согласную."
  x6.prompt: "Дополните слово «четыре»."
  x6.r1: "vier — это v-i-e-r: сначала i, потом e. ei — звук как в drei."
  x6.r2: "Долгому i нужно ie: vier."
  x6.expl: "vier: ie для долгого i."
  x7.prompt: "Одногруппник спрашивает, как пишется слово. Какой ответ правильный?"
  x7.o2.fb: "Так получается Beir. Долгое i пишется: сначала i, потом e."
  x7.o3.fb: "Без e долгое i не обозначено. В Bier нужно ie."
  x7.expl: "Bier: B, i, e, r."
  x8.prompt: "Дополните долгие гласные: лодка, озеро, животное."
  x8.expl: "Boot, See, Tier: oo, ee и ie."
  x9.prompt: "В каком слове долгое a пишется aa?"
  x9.o2.fb: "В Mann после a стоит nn, поэтому a краткое."
  x9.o3.fb: "В Tag долгое a, но пишется одной a."
  x9.expl: "Paar: aa — долгое a."
  x10.prompt: "Напишите по буквам слово «пиво»."
  x10.r1: "В Bier нужно e: ie — долгое i."
  x10.r2: "Beer — по-английски. По-немецки долгое i пишется ie: Bier."
  x10.r3: "В Beir буквы переставлены. Сначала i, потом e: Bier."
  x10.expl: "Bier: B-i-e-r."
  x11.prompt: "Это правильно?"
  x11.wrong: "В Haar стоит aa. Удвоенная гласная всегда долгая."
  x11.expl: "aa, ee и oo показывают долгую гласную."
  x12.prompt: "Дополните слово «семь»."
  x12.r1: "В sieben долгое i, которое пишется ie."
  x12.r2: "seiben — такого слова нет. Долгое i — ie: sieben."
  x12.expl: "sieben: ie для долгого i."
  x13.prompt: "В каких словах долгое i?"
  x13.o4.fb: "В Kind после i стоит nd, поэтому i краткое."
  x13.o5.fb: "В bitte после i стоит tt, поэтому i краткое."
  x13.expl: "В sieben, Tier и wie есть ie."
  x14.prompt: "Наберите слово «зоопарк»."
  x14.r1: "В Zoo удвоенное o: долгое o пишется oo."
  x14.expl: "der Zoo: oo для долгого o."
  x15.prompt: "Какое написание показывает краткую гласную?"
  x15.o2.fb: "ie показывает долгое i."
  x15.o3.fb: "oo показывает долгое o."
  x15.expl: "Удвоенная согласная, как tt, показывает краткую гласную; удвоенная гласная — долгую."
  tip: "Не путайте ie и ei: ie — долгое i (vier), ei — другой звук (drei, ein)."
