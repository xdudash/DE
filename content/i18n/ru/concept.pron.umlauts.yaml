strings:
  title: "Умлауты: ä, ö, ü"
  summary: "Ä, Ö и Ü — гласные с двумя точками. У каждой свой звук, он не совпадает с простым a, o или u."
  pattern.scope: "Гласные с умлаутом пишутся с двумя точками; у каждой свой звук."
  pattern.limits: "Звуки показаны на примерах слов; фонетические знаки на A0 не используются."
  ex.kaese: "Käse (сыр): ä — как „е“ в „bed“, только длиннее."
  ex.schoen: "schön (красивый): е с округлёнными губами."
  ex.ueber: "über (над): и с округлёнными губами."
