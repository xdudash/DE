strings:
  title: Немецкий алфавит и названия букв
  summary: В немецком 26 букв, три умлаута и ß. Названия букв не совпадают со звуками, поэтому при диктовке слово произносят по правилам алфавита.
  rel.umlauts: Ä, Ö и Ü — отдельные буквы; их звуки объясняет следующая тема.
  rel.eszett: ß — отдельная буква, она стоит после долгих гласных и дифтонгов.
  pattern.scope: "У каждой буквы одно название; буквы с умляутом сохраняют точки в названии."
  pattern.limits: "Названия букв произносят отдельно; это не предложение."
  ex.letters: "Ö — буква с умлаутом; называйте её собственным названием."
  ex.names: "M – A – I — это «Mai» по буквам."
