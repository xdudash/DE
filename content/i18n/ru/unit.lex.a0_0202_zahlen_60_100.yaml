strings:
  title: "Числа от 60 до 100"
  summary: "Sechzig, siebzig, achtzig, neunzig и hundert и числа между ними."
  obj: "Читать и писать числа от 60 до 100."
  intro: "Десятки от 60: sechzig, siebzig, achtzig и neunzig. Два из них сокращены: sechzig теряет s от sechs, а siebzig — -en от sieben. 100 — hundert или einhundert. Числа между ними строятся так же: fünfundsiebzig — это 5 + 70."
  examples: "Числа в повседневной жизни."
  summary_block: "**sechzig 60 · siebzig 70 · achtzig 80 · neunzig 90 · hundert 100.** Между ними: единицы + **und** + десятки: **fünfundsiebzig 75**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "шестьдесят минут, один час"
  ex.2: "семьдесят евро"
  ex.3: "Ему восемьдесят (лет)."
  ex.4: "девяносто центов"
  ex.5: "Это стоит сто евро."
  ex.6: "семьдесят пять: fünf + und + siebzig"
  x1.prompt: "Как написать 60?"
  x1.o2.fb: "Sechs в sechzig теряет s: sech-zig."
  x1.o3.fb: "Sechzehn — это 16, а не 60."
  x1.expl: "60 — sechzig, без s от sechs."
  x2.prompt: "Запишите цифрами: siebzig."
  x2.r1: "17 — это siebzehn. Siebzig заканчивается на -zig: 70."
  x2.expl: "Siebzig — семь десятков: 70."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Это правильно: hundert или einhundert — это 100."
  x3.expl: "Hundert — это 100."
  x4.prompt: "Соедините слова с числами."
  x4.expl: "Четыре десятка от 60 до 90."
  x5.prompt: "Какие написания правильные?"
  x5.o3.fb: "Siebzig теряет -en от sieben: sieb-zig."
  x5.o4.fb: "Sechzig теряет s от sechs: sech-zig."
  x5.expl: "Sechzig и siebzig — два сокращённых десятка."
  x6.prompt: "Напишите 90 словом."
  x6.r1: "Neunzehn — это 19; 90 — neunzig."
  x6.r2: "Слово neun не сокращается: neun-zig."
  x6.expl: "Neun + -zig: neunzig."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Uhr — для времени суток, и 80 часов не бывает. Цена — в Euro."
  x7.o3.fb: "Это приветствие, а не цена."
  x7.expl: "Цена: число + Euro."
  x8.prompt: "Расставьте слова в правильном порядке."
  x8.expl: "Er ist achtzig: ему восемьдесят. Глагол ist на втором месте."
  x9.prompt: "Это правильно?"
  x9.wrong: "Нет: fünfundsiebzig — это 75, fünf (5) + siebzig (70). 57 — siebenundfünfzig."
  x9.expl: "В слове первыми единицы, в цифрах — десятки."
  x10.prompt: "Дополните длинную форму числа 100."
  x10.r1: "Перед hundert eins теряет s: einhundert."
  x10.r2: "Zehnhundert — это 1000. 100 — einhundert."
  x10.expl: "Einhundert и hundert означают 100."
  x11.prompt: "Какое слово означает 99?"
  x11.o2.fb: "По-немецки единицы первыми: neun + und + neunzig."
  x11.o3.fb: "Neunundachtzig — это 89: neun + achtzig."
  x11.expl: "99 = neun + und + neunzig."
  x12.prompt: "Какое это число? Запишите цифрами: dreiundsechzig."
  x12.r1: "В слове единицы первыми: drei (3) и sechzig (60) — это 63."
  x12.expl: "Drei + und + sechzig = 63."
  x13.prompt: "Какие числа больше 80?"
  x13.o4.fb: "Siebzig — это 70, меньше 80."
  x13.o5.fb: "Achtzehn — это 18, а не 80."
  x13.expl: "Neunzig 90, hundert 100 и einundachtzig 81 — все больше 80."
  x14.prompt: "Дополните примеры."
  x14.expl: "50 + 50 = 100 и 10 + 60 = 70."
  x15.prompt: "Как вы ответите?"
  x15.o2.fb: "Euro — для цен; о возрасте говорят только число."
  x15.o3.fb: "Слова achtzehnzig нет: 80 — achtzig, 18 — achtzehn."
  x15.expl: "Wie alt ist …? – Er ist + число."
  tip: "Обратите внимание на два написания: sechzig (не sechszig) и siebzig (не siebenzig). Hundert и einhundert означают 100."
