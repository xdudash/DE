strings:
  title: "Числа от 60 до 100"
  summary: "Sechzig, siebzig, achtzig, neunzig и hundert и числа между ними."
  obj: "Читать, произносить и писать числа от 60 до 100."
  intro: "Десятки от 60: sechzig, siebzig, achtzig и neunzig. Два из них сокращены: sechzig теряет s от sechs, а siebzig — -en от sieben. Ch в sechzig — мягкий звук как в ich, а не «кс», как в sechs. 100 — hundert или einhundert. Числа между десятками строятся по знакомой модели: fünfundsiebzig — это 5 + und + 70, а не «семьдесят пять»."
  examples: "Числа в повседневной жизни."
  summary_block: "**sechzig 60 · siebzig 70 · achtzig 80 · neunzig 90 · hundert 100.** Между ними: единицы + **und** + десятки: **fünfundsiebzig 75**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "шестьдесят минут, один час"
  ex.2: "семьдесят евро"
  ex.3: "Бабушке Эрне восемьдесят (лет). Oma = бабушка."
  ex.4: "девяносто центов"
  ex.5: "Это стоит сто евро."
  ex.6: "семьдесят пять: fünf + und + siebzig"
  x1.prompt: "Соедините слова с числами."
  x1.expl: "Четыре десятка от 60 до 90."
  x2.prompt: "16 или 60? Какое слово означает 60?"
  x2.o2.fb: "Sechzehn — это 16: -zehn — для 13–19. 60 — sechzig."
  x2.o3.fb: "Sechs — это 6."
  x2.expl: "Sechzig: sech- + -zig."
  x3.prompt: "Напишите это число словом."
  x3.r1: "Sechs в sechzig теряет s: sech-zig."
  x3.r2: "Sechzehn — это 16. 60 — sechzig."
  x3.expl: "60 — sechzig, без s от sechs."
  x4.prompt: "Правда или нет?"
  x4.wrong: "Это верно: einhundert и hundert означают 100."
  x4.expl: "Можно сказать hundert или einhundert."
  x5.prompt: "Дополните число 70."
  x5.r1: "Siebzig теряет -en от sieben: sieb-zig."
  x5.r2: "Siebzehn — это 17. 70 заканчивается на -zig."
  x5.expl: "70 = siebzig."
  x6.prompt: "Как произносят ch в слове „sechzig“?"
  x6.o1: "как ch в ich"
  x6.o2: "как «кс», как в sechs"
  x6.o2.fb: "В sechs chs звучит как «кс». В sechzig и sechzehn ch — мягкий звук как в ich."
  x6.expl: "В sechs — «кс»; в sechzig и sechzehn — звук как в ich."
  x7.prompt: "Запишите это число цифрами."
  x7.r1: "В слове единицы первыми: drei (3) и sechzig (60) — это 63."
  x7.expl: "Drei + und + sechzig = 63."
  x8.prompt: "Какие из этих чисел правильные по-немецки?"
  x8.o3.fb: "По-немецки единицы первыми: achtundneunzig (98)."
  x8.expl: "Единицы + und + десятки: achtundneunzig 98, fünfundsiebzig 75."
  x9.prompt: "Расставьте слова: номер автобуса."
  x9.expl: "Сначала Bus, потом Nummer, потом число."
  x10.prompt: "Как сказать её возраст?"
  x10.o2.fb: "Neunzehn — это 19; бабушке Эрне 90: neunzig."
  x10.o3.fb: "Euro — для цен; о возрасте говорят только число."
  x10.expl: "Sie ist neunzig: ей девяносто."
  x11.prompt: "Напишите число словами."
  x11.r1: "Единицы первыми: fünf + und + siebzig."
  x11.r2: "Siebzig теряет -en: fünfundsiebzig."
  x11.expl: "75 = fünf + und + siebzig, одним словом."
  x12.prompt: "Это правильно?"
  x12.wrong: "Это верно: 50 + 50 = 100."
  x12.expl: "Fünfzig 50, hundert 100."
  x13.prompt: "Напишите числа словами."
  x13.expl: "Achtzig Euro und neunzig Cent: 80 евро 90 центов."
  x14.prompt: "Какие числа больше 80?"
  x14.o3.fb: "Achtzehn — это 18, а не 80."
  x14.o4.fb: "Neunundsiebzig — это 79, чуть меньше 80."
  x14.expl: "Neunzig 90 и einundachtzig 81 — больше 80."
  x15.prompt: "Выберите правильный ответ."
  x15.o2.fb: "Продавец говорит siebzig, 70, а не siebzehn, 17."
  x15.o3.fb: "Это приветствие, а продавец просит заплатить."
  x15.expl: "Das macht … — это сумма; Hier, bitte говорят, когда платят."
  tip: "Две сокращённые формы: sechzig (от sechs) и siebzig (от sieben). Остальные десятки сохраняют всё число: achtzig, neunzig."
