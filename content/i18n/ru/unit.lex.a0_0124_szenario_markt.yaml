strings:
  title: "Сценарий: покупки на рынке"
  summary: "Поздоровайтесь с продавцом, спросите цену, закажите, расплатитесь и попрощайтесь."
  obj: "Купить несколько вещей на рынке и понять цену."
  intro: "На рынке вы здороваетесь с продавцом, спрашиваете «Was kostet das?» и говорите, сколько вам нужно. Продавец называет цену («Das kostet …») и спрашивает «Ist das alles?». Вы платите, благодарите и прощаетесь."
  examples: "Фразы на рынке."
  summary_block: "**Was kostet das?** — **Das kostet zwei Euro.** — **Drei Äpfel, bitte.** — **Ist das alles?** — **Ja, danke.**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Сколько это стоит?"
  ex.2: "Это стоит два евро."
  ex.3: "Три яблока, пожалуйста. Один Apfel, несколько Äpfel."
  ex.4: "Это всё? (продавец)"
  ex.5: "Да, спасибо."
  ex.6: "Большое спасибо! Пока!"
  x1.prompt: "Вы хотите узнать цену. Что вы спросите?"
  x1.o2.fb: "Это вопрос об имени, а не о цене."
  x1.o3.fb: "Это вопрос продавца: это всё?"
  x1.expl: "Kosten — «стоить»: Was kostet das?"
  x2.prompt: "Запишите цену цифрами."
  x2.expl: "Sieben Euro — это 7 евро."
  x3.prompt: "Соедините каждый вопрос с ответом."
  x3.expl: "На вопрос о цене — цена; на Ist das alles? — да или нет; на Was möchten Sie? — заказ."
  x4.prompt: "Правда или нет?"
  x4.wrong: "Это правда: kosten — «стоить», поэтому вопрос о цене."
  x4.expl: "Was kostet das? = сколько это стоит?"
  x5.prompt: "Продавец говорит 10 евро. Напишите число словом."
  x5.r1: "В zehn есть h: z-e-h-n."
  x5.r2: "Zehn начинается с z, которая звучит как «ц»."
  x5.expl: "Zehn Euro: десять евро."
  x6.prompt: "Выберите правильный ответ."
  x6.o2.fb: "Tschüss завершает разговор, а продавец только что спросил, что вы хотите."
  x6.o3.fb: "Продавец спрашивает, что вы хотите, а не ваше имя."
  x6.expl: "Отвечайте числом, названием товара и bitte."
  x7.prompt: "Расставьте слова в правильном порядке."
  x7.expl: "Сначала вопросительное слово, потом глагол: Was kostet das?"
  x8.prompt: "Какие реплики вежливы на рынке?"
  x8.o4.fb: "Без числа и bitte одно слово звучит грубо."
  x8.expl: "Приветствие, bitte и danke — это вежливо на любом рынке."
  x9.prompt: "Дополните диалог."
  x9.expl: "Was kostet das? … Hier, bitte!"
  x10.prompt: "Как вы ответите?"
  x10.o2.fb: "Вы уже поздоровались; теперь продавец спрашивает, нужно ли что-то ещё."
  x10.o3.fb: "Hallo zusammen приветствует группу, а продавец задаёт вопрос."
  x10.expl: "Ist das alles? — Ja, danke: да, это всё."
  x11.prompt: "Дополните заказ: три яблока, пожалуйста."
  x11.r1: "Один Apfel, два и больше — Äpfel: во множественном числе Ä."
  x11.r2: "Пишите Ä с двумя точками: Äpfel."
  x11.expl: "Drei Äpfel, bitte: три яблока, пожалуйста."
  x12.prompt: "Это правильно?"
  x12.wrong: "Нет: Danke schön — благодарность, а не вопрос."
  x12.expl: "Danke schön = большое спасибо."
  x13.prompt: "Соедините цену с цифрами."
  x13.expl: "Zwei 2, fünf 5, zwölf 12."
  x14.prompt: "Вы уходите от прилавка. Что вы скажете?"
  x14.o2.fb: "Это вопрос о цене, а вы уже уходите."
  x14.o3.fb: "Guten Morgen — приветствие, а вы уходите."
  x14.expl: "Поблагодарите продавца и попрощайтесь."
  x15.prompt: "Запишите количество яблок цифрами."
  x15.expl: "Vier Äpfel: четыре яблока."
  tip: "Покажите на фрукты и спросите «Was kostet das?»: das означает «это», поэтому название фрукта не нужно."
