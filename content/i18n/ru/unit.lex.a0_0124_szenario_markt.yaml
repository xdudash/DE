strings:
  title: "Сценарий: покупки на рынке"
  summary: "Поздоровайте продавца, спросите цену и расплатитесь."
  obj: "Купить несколько вещей на рынке и спросить цену."
  intro: "На рынке поздоровайте продавца, спросите «Was kostet das?», назовите количество и поблагодарите."
  examples: "Фразы для рынка."
  summary_block: "**Was kostet das?** — Сколько это стоит? **Drei Äpfel, bitte.** — Три яблока, пожалуйста. **Danke schön!** — Спасибо."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Посмотрите на ситуацию ещё раз."
  fb.not_this: "Не то. Прочитайте объяснение."
  ex.1: "Сколько это стоит?"
  ex.2: "Три яблока, пожалуйста."
  ex.3: "Большое спасибо."
  x1.prompt: "Какое приветствие подходит рыночному ряду в 9 утра?"
  x1.expl: "Guten Morgen — для утра."
  x2.prompt: "Выберите правильный ответ."
  x2.expl: "Назовите, что хотите и сколько."
  x3.prompt: "Какой вопрос спрашивает цену?"
  x3.expl: "Kostet — «стоит»."
  x4.prompt: "Соедините слово с цифрой."
  x4.expl: "Каждое слово соответствует одной цифре."
  x5.prompt: "Запишите цифрами: sieben."
  x5.expl: "sieben — это 7."
  x6.prompt: "Напишите словом число 2."
  x6.expl: "2 пишется zwei."
  x7.prompt: "Верно ли это утверждение?"
  x7.expl: "Was kostet das? спрашивает, сколько это стоит."
  x8.prompt: "Верно ли это утверждение?"
  x8.expl: "У вопроса есть вопросительный знак."
  x8.wrong: "Danke schön — благодарность, не вопрос."
  x9.prompt: "Какие слова можно сказать на рынке?"
  x9.expl: "Hallo и Danke — вежливо на рынке; Gute Nacht — для ночи."
  x10.prompt: "Продавец говорит «Das macht zwei Euro.» Что скажете, расплачиваясь?"
  x10.expl: "Hier, bitte — когда расплачиваетесь."
  x11.prompt: "Выберите правильный ответ."
  x11.expl: "Прощайтесь, уходя от прилавка."
  x12.prompt: "Напишите благодарность в конце покупки."
  x12.expl: "Danke schön — вежливая форма."
  x13.prompt: "Какое немецкое слово для 10?"
  x13.expl: "Zehn — это 10."
  x14.prompt: "Верно ли это утверждение?"
  x14.expl: "В 9 утра ещё утро."
  x15.prompt: "Какое предложение заказывает три яблока?"
  x15.expl: "Äpfel — множественное число от Apfel."
