strings:
  title: "W-вопросы: спрашиваем о нужном"
  summary: "Спрашиваем о человеке, предмете, месте, времени, причине или количестве: вопросительное слово стоит первым, спрягаемый глагол — вторым."
  obj.recognize: "Определять, какую информацию запрашивает W-вопрос, и находить место спрягаемого глагола."
  obj.ask: "Составлять простой W-вопрос со спрягаемым глаголом на втором месте."
  b.intro: |
    Задавайте W-вопрос, когда вам нужна какая-то конкретная информация. В начале стоит вопросительное слово, а сразу за ним — **спрягаемый глагол** на втором месте. Подлежащее обычно идёт после глагола: *Wo **wohnst** du?* (Где ты живёшь?)

    Вопросительное слово подсказывает собеседнику, какой ответ вам нужен: место, время, человек или что-то другое. Этот порядок связан с порядком слов в утверждении, который вы только что изучили.
  b.pattern.caption: "Вопросительное слово первым, спрягаемый глагол вторым"
  col.question: "Место 1: вопросительное слово"
  col.verb: "Место 2: спрягаемый глагол"
  col.subject: "Подлежащее"
  col.rest: "Другие сведения"
  b.examples.title: "Вопросы на каждый день"
  ex.when: "Когда отправляется автобус?"
  ex.where: "Где ты живёшь?"
  ex.who_subject: "Кто здесь живёт?"
  ex.where_from: "Откуда Вы? (вежливое обращение)"
  ex.price: "Сколько стоит билет?"
  b.word_meaning: |
    **Выбирайте вопросительное слово в зависимости от нужного ответа.** *Wo?* спрашивает о месте, *wohin?* — о направлении к цели, *woher?* — об исходной точке. *Wann?* спрашивает о времени, *warum?* — о причине, а *wie viel?* — о количестве или цене.

    Полезное исключение: в вопросе *Wer wohnt hier?* (Кто здесь живёт?) слово *wer* является подлежащим. После глагола отдельного подлежащего нет. В большинстве других примеров, например *Wo wohnst du?*, подлежащее следует за спрягаемым глаголом.
  b.errors.title: "Частая ошибка"
  e.verb_third: "Вопросительное слово уже занимает первое место. Сразу после него поставьте спрягаемый глагол, а затем подлежащее: *Wo wohnst du?*"
  e.indirect: "Это прямой вопрос, поэтому порядок такой: вопросительное слово + спрягаемый глагол + подлежащее: *Wann fährt der Bus?* В косвенном вопросе порядок другой: *Weißt du, wann der Bus fährt?*"
  b.summary: |
    - Поставьте вопросительное слово на первое место, а спрягаемый глагол — на второе: *Wann fährt der Bus?*
    - Подлежащее обычно идёт после глагола: *Wo wohnst du?*
    - Если *wer* — подлежащее, не добавляйте ещё одно: *Wer wohnt hier?*
    - Используйте *wo*, *wohin* и *woher* для места, направления и исходной точки соответственно.
  b.practice.title: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Подумайте, какой ответ запрашивает вопросительное слово, затем поставьте спрягаемый глагол на второе место."
  x.choose_order.prompt: "Какой прямой вопрос построен правильно?"
  x.choose_order.b: "В прямом вопросе спрягаемый глагол стоит сразу после вопросительного слова."
  x.choose_order.c: "Вопросительное слово занимает первое место, а спрягаемый глагол — второе."
  x.choose_order.explanation: "Прямой W-вопрос начинается с вопросительного слова. За ним на втором месте стоит спрягаемый глагол, затем подлежащее: *Wann beginnt der Deutschkurs?*"
  x.choose_word.prompt: "Выберите вопросительное слово, подходящее к ответу."
  x.choose_word.a: "*Wo?* спрашивает о месте, а не о времени."
  x.choose_word.c: "*Wer?* спрашивает о человеке. Здесь в ответе указано время."
  x.choose_word.explanation: "*Um acht Uhr* указывает на время, поэтому спросите *Wann fährt der Bus?*"
  x.match_words.prompt: "Соедините вопросительное слово с типом информации, которую оно запрашивает."
  x.match_words.explanation: "*Wo?* спрашивает о месте, *wann?* — о времени, *wohin?* — о цели направления, *woher?* — об исходной точке."
  x.cloze.prompt: "Дополните вопрос и ответ правильными формами глагола *heißen*."
  x.cloze.explanation: "Спросите *Wie heißt du?*, поставив глагол на второе место. В ответе с подлежащим *ich* используется форма *heiße*."
  x.order_where.prompt: "Составьте вопрос: «Где ты живёшь?»"
  x.order_where.explanation: "*Wo* стоит на первом месте, *wohnst* — спрягаемый глагол на втором, *du* — подлежащее."
  x.transform_time.prompt: "Преобразуйте утверждение в вопрос о времени: Der Bus fährt um acht Uhr."
  x.transform_time.explanation: "Замените указание времени на *wann* и поставьте его на первое место. Спрягаемый глагол *fährt* будет на втором, перед подлежащим *der Bus*."
  x.categorize.prompt: "Распределите вопросительные слова по типу запрашиваемой информации."
  x.categorize.time: "Время"
  x.categorize.place: "Место"
  x.categorize.person: "Человек"
  x.categorize.reason: "Причина"
  x.categorize.explanation: "*Wann* спрашивает о времени, *wo* — о месте, *wer* — о человеке, а *warum* — о причине."
  x.wer_subject.prompt: "Верно или неверно? В этом вопросе *wer* является подлежащим."
  x.wer_subject.wrong: "Здесь *wer* обозначает человека, который выполняет действие, поэтому это подлежащее."
  x.wer_subject.explanation: "В предложении *Wer wohnt hier?* слово *wer* является подлежащим. За ним идёт спрягаемый глагол *wohnt*, отдельное подлежащее не требуется."
  x.correct_order.prompt: "Исправьте порядок слов в прямом вопросе."
  x.correct_order.explanation: "Это прямой вопрос: *wo* стоит первым, спрягаемый глагол *findet* — вторым, за ним следует подлежащее *der Deutschkurs*."
