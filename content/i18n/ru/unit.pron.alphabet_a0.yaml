strings:
  title: "Алфавит: диктовка слов"
  summary: Продиктуйте немецкое слово буква за буквой, так же как называете свою фамилию по телефону.
  obj.letters: Назовите буквы немецкого алфавита, включая Ä, Ö, Ü и ß.
  obj.spell: Продиктуйте короткое слово, используя названия немецких букв.
  b.intro: |
    У каждой немецкой буквы есть своё название. Когда вы диктуете слово, вы называете **название** каждой буквы, а не тот звук, который она даёт в слове.

    Произносите буквы с короткой паузой между ними: **B – E – R – L – I – N**.
    Три буквы особые: **Ä**, **Ö** и **Ü** имеют умлаут, а **ß** — отдельная буква.
  b.examples.title: "Диктовка"
  ex.berlin: "Berlin, продиктованный буква за буквой."
  ex.umlaut: "Ö называют по названию буквы; в слове это звук умлаута."
  ex.eszett: "ß называют «эсцет» или «scharfes S»."
  b.summary: "**Диктовать — значит называть названия букв.** Называйте каждую букву по отдельности, с паузой. Ä, Ö, Ü и ß имеют свои названия."
  b.practice.title: "Практика"
  x.spell_name.prompt: "Какая буква обозначает звук «ö»?"
  x.spell_name.b: "O — другая буква. Буква с двумя точками называется Ö."
  x.spell_name.c: "Ä — другая буква. Ищите букву с двумя точками, которая звучит как «ö»."
  x.spell_name.explanation: "Ö — буква с двумя точками; её называют как «ö»."
  x.letter_names.prompt: "Как продиктовать «Mai»?"
  x.letter_names.b: "В этом слове нет N, A и Y. Диктуйте буквы по одной: M, A, I."
  x.letter_names.c: "Вторая буква — A, а не E. Её название — «а»."
  x.letter_names.explanation: "M – A – I: называйте название каждой буквы по очереди."
  x.eszett_letter.prompt: "Какая одна буква означает «scharfes S»?"
  x.eszett_letter.a: "ss — это две буквы. Одна буква — это ß."
  x.eszett_letter.c: "sz — не немецкая буква. Одна буква — это ß."
  x.eszett_letter.explanation: "ß пишется одной буквой, её название — «эсцет»."
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Называйте название каждой буквы по порядку."
