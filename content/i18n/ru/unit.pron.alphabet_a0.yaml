strings:
  title: "Алфавит: диктовка слов"
  summary: Продиктуйте немецкое слово буква за буквой, так же, как называете свою фамилию по телефону.
  obj.letters: Назовите буквы немецкого алфавита, включая Ä, Ö, Ü и ß.
  obj.spell: Продиктуйте короткое слово, используя немецкие названия букв.
  b.intro: |
    В немецком языке у каждой буквы есть название. Когда вы диктуете слово, вы называете **название** каждой буквы, а не звук, который она дает в слове.

    Называйте буквы с короткой паузой между ними: **B – E – R – L – I – N**.
    Три буквы особые: **Ä**, **Ö** и **Ü** с умлаутом, а **ß** — отдельная буква.
  b.examples.title: "Диктовка"
  ex.berlin: "Berlin, продиктовано буква за буквой."
  ex.anna: "Anna, продиктовано буква за буквой. Два N и два A."
  ex.umlaut: "Ö называется по названию буквы; в слове это звук с умлаутом."
  ex.uber: "Ü называется „ü“; в слове „über“ это тот же звук."
  ex.eszett: "ß называется „эсцет“ или „scharfes S“."
  b.tip: |
    Названия большинства букв — это гласный звук: **A** — „a“, **E** — „e“, **I** — „i“, **O** — „o“, **U** — „u“.
    **Ä**, **Ö** и **Ü** называются с умлаутом: „ä“, „ö“, „ü“. **ß** — это „эсцет“.
  b.summary: "**Диктовка — это называние букв.** Называйте каждую букву с паузой между ними. Ä, Ö, Ü и ß имеют собственные названия."
  b.practice.title: "Практика"
  x.spell_name.prompt: "Какая буква называется звуком „ö“?"
  x.spell_name.b: "O — другая буква. Название Ö — „ö“ с умлаутом."
  x.spell_name.c: "Ä — другая буква. Ищите букву с двумя точками, которая звучит как „ö“."
  x.spell_name.explanation: "Ö — это буква с двумя точками; называется „ö“."
  x.letter_names.prompt: "Как продиктовать „Mai“ по буквам?"
  x.letter_names.b: "N, A и Y в этом слове нет. Диктуйте буквы по одной: M, A, I."
  x.letter_names.c: "Вторая буква — A, а не E. Её название — „a“."
  x.letter_names.explanation: "M – A – I: назовите по очереди название каждой буквы."
  x.tuer.prompt: "Как продиктовать „Tür“ (дверь) по буквам?"
  x.tuer.b: "U — другая буква. В этом слове есть Ü, буква с двумя точками."
  x.tuer.c: "E здесь нет. Вторая буква — Ü с двумя точками."
  x.tuer.explanation: "T – Ü – R: назовите название каждой буквы по порядку. Ü — „ü“."
  x.haus.prompt: "Как продиктовать „Haus“ (дом) по буквам?"
  x.haus.b: "Z здесь нет. Последняя буква — S, её название „эс“."
  x.haus.c: "O здесь нет. Вторая буква — A."
  x.haus.explanation: "H – A – U – S: назовите название каждой буквы по порядку."
  x.eszett_letter.prompt: "Какая одна буква — это „scharfes S“?"
  x.eszett_letter.a: "ss — это две буквы. Одна буква — ß."
  x.eszett_letter.c: "sz — не немецкая буква. Одна буква — ß."
  x.eszett_letter.explanation: "ß пишется как одна буква, её название — „эсцет“."
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Назовите название каждой буквы по порядку."
