strings:
  title: "Приветствия: Hallo и Guten Tag"
  summary: "Hallo — для знакомых, Guten Tag — вежливо для всех днём."
  obj: "Выбирать приветствие, подходящее человеку и ситуации."
  intro: "Hallo — обычное приветствие для друзей, одноклассников и знакомых коллег. Guten Tag — вежливое приветствие днём: с незнакомцами, на ресепшене, в магазине или учреждении. Оба используют в Германии, Австрии и Швейцарии, а Guten Tag — надёжный выбор в официальной ситуации."
  examples: "Приветствия в коротких сценах."
  summary_block: "**Hallo** — со знакомыми. **Guten Tag** — вежливо с кем угодно днём, особенно с **Herr** или **Frau** и фамилией."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Привет, Анна! (подруге)"
  ex.2: "Добрый день, госпожа Вебер! (вежливо, с фамилией)"
  ex.3: "Добрый день, господин Кляйн!"
  ex.4: "Привет всем! (знакомой группе)"
  ex.5: "Привет, Том! (очень разговорно, из английского)"
  x1.prompt: "Вы встречаете друга на улице. Что вы скажете?"
  x1.o2.fb: "Auf Wiedersehen завершает разговор, а вы только встретились."
  x1.o3.fb: "Gute Nacht говорят поздно вечером, когда уходят."
  x1.expl: "Hallo — обычное приветствие для знакомых."
  x2.prompt: "Напишите вежливое приветствие для дня."
  x2.r1: "Guten заканчивается на -n: Guten Tag."
  x2.r2: "Tag — существительное, поэтому с заглавной T."
  x2.expl: "Guten Tag: два слова, оба с заглавной буквы в начале приветствия."
  x3.prompt: "Правда или нет? (Verabschiedung = прощание)"
  x3.wrong: "Guten Tag — приветствие, его говорят, когда приходят. Когда уходят — Auf Wiedersehen."
  x3.expl: "Verabschiedung — прощание. Guten Tag — приветствие."
  x4.prompt: "Соедините две части каждого приветствия."
  x4.expl: "Guten Tag, Hallo zusammen и Freut mich — устойчивые выражения."
  x5.prompt: "Что из этого — приветствия?"
  x5.o4.fb: "Tschüss — неформальное прощание."
  x5.expl: "Hallo, Guten Tag и Hi начинают разговор; Tschüss его завершает."
  x6.prompt: "Дополните вежливое приветствие."
  x6.r1: "Tag — существительное: пишите с заглавной T."
  x6.r2: "Tag заканчивается на g, хотя звучит как k."
  x6.expl: "Guten Tag, Frau Weber: вежливое приветствие с фамилией."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Gute Nacht — когда уходят ночью; Анна только что поздоровалась."
  x7.o3.fb: "Auf Wiedersehen завершило бы разговор, который Анна только начала."
  x7.expl: "Поздоровайтесь в ответ тем же словом и именем."
  x8.prompt: "Расставьте слова в правильном порядке."
  x8.expl: "Сначала приветствие, потом имя."
  x9.prompt: "Это правильно? (informell = неформальный)"
  x9.wrong: "Это верно: Hallo — обычное неформальное приветствие со знакомыми."
  x9.expl: "Hallo подходит для знакомых людей."
  x10.prompt: "Напишите приветствие для группы друзей (два слова)."
  x10.r1: "Zusammen пишется с двойным m."
  x10.expl: "Zusammen — вместе; Hallo zusammen приветствует всех сразу."
  x11.prompt: "Какое приветствие уместнее всего на ресепшене у врача?"
  x11.o2.fb: "Hi — слишком разговорно для ресепшена."
  x11.o3.fb: "Hallo zusammen приветствует группу друзей, а не одного администратора."
  x11.expl: "С незнакомыми Guten Tag — вежливый выбор."
  x12.prompt: "Дополните короткий диалог."
  x12.expl: "Оба используют вежливое приветствие с фамилией."
  x13.prompt: "Какие приветствия неформальные?"
  x13.o4.fb: "Guten Tag — вежливое; его можно использовать с кем угодно."
  x13.expl: "Hallo, Hi и Hallo zusammen — неформальные."
  x14.prompt: "Сделайте это приветствие вежливым."
  x14.expl: "С Frau и фамилией вежливо сказать Guten Tag."
  x15.prompt: "Как вы ответите?"
  x15.o2.fb: "Hi с одной фамилией звучит грубо по отношению к незнакомому человеку."
  x15.o3.fb: "Tschüss — прощание, а разговор только начался."
  x15.expl: "На вежливое приветствие отвечайте вежливо, с Frau и фамилией."
  tip: "С Herr или Frau и фамилией говорите Guten Tag. С именем обычно говорят Hallo."
