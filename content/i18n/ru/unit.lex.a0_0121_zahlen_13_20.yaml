strings:
  title: "Числа от 13 до 20"
  summary: "От тринадцати до двадцати: числа на -zehn и zwanzig."
  obj: "Называть, читать и писать числа от 13 до 20."
  intro: "От 13 до 19 число — это единица плюс -zehn: drei + zehn = dreizehn. Единица стоит первой. Две формы сокращены: sechzehn (без s от sechs) и siebzehn (без -en от sieben). Двадцать — новое слово: zwanzig."
  examples: "Числа в повседневных фразах."
  summary_block: "**dreizehn 13 · vierzehn 14 · fünfzehn 15 · sechzehn 16 · siebzehn 17 · achtzehn 18 · neunzehn 19 · zwanzig 20**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "автобус номер тринадцать"
  ex.2: "четырнадцать дней: две недели"
  ex.3: "шестнадцать евро: sech- без s"
  ex.4: "семнадцать часов (17:00): sieb- без -en"
  ex.5: "восемнадцать лет"
  ex.6: "двадцать минут"
  x1.prompt: "Какое число — vierzehn?"
  x1.o2.fb: "40 — это vierzig, с -zig; -zehn означает «плюс десять»."
  x1.o3.fb: "4 — это vier; -zehn прибавляет десять."
  x1.expl: "Vierzehn = vier + zehn = 14."
  x2.prompt: "Запишите число цифрами."
  x2.expl: "Achtzehn = acht + zehn = 18."
  x3.prompt: "Соедините каждое слово с цифрой."
  x3.expl: "Сначала единица, потом -zehn; zwanzig — это 20."
  x4.prompt: "Правда или нет?"
  x4.wrong: "Это правда: sechzehn — это 16, пишется без s от sechs."
  x4.expl: "Sechzehn — это 16."
  x5.prompt: "Напишите число 16 словом."
  x5.r1: "В 16 s от sechs выпадает: sechzehn."
  x5.r2: "В zehn есть h: sechzehn."
  x5.expl: "Sechzehn: sech + zehn."
  x6.prompt: "Какие слова заканчиваются на -zehn?"
  x6.o4.fb: "Zwanzig — это 20 и заканчивается на -zig."
  x6.expl: "От 13 до 19 — на -zehn; 20 — zwanzig."
  x7.prompt: "Составьте фразу «автобус номер пятнадцать»."
  x7.expl: "Bus Nummer fünfzehn: число стоит в конце."
  x8.prompt: "Что дальше?"
  x8.o2.fb: "Zehn — это 10; после 19 идёт 20."
  x8.o3.fb: "Neunzig — это 90; двадцать — zwanzig."
  x8.expl: "Achtzehn, neunzehn, zwanzig: 18, 19, 20."
  x9.prompt: "Впишите пропущенные числа."
  x9.expl: "Пропущенные числа: vierzehn (14) и sechzehn (16)."
  x10.prompt: "Фильм начинается в 17:00. Когда это?"
  x10.o2.fb: "Sieben Uhr — это 7:00."
  x10.o3.fb: "Siebzig — это 70; семидесяти часов не бывает."
  x10.expl: "17:00 — это siebzehn Uhr."
  x11.prompt: "Какая цифра соответствует этому слову?"
  x11.expl: "Dreizehn = drei + zehn = 13."
  x12.prompt: "Это правильно?"
  x12.wrong: "Нет: в 17 -en от sieben выпадает: siebzehn."
  x12.expl: "Правильно пишется siebzehn."
  x13.prompt: "Напишите пропущенное число словом."
  x13.r1: "Пишите -ig в конце; во многих регионах это звучит как -ich."
  x13.r2: "Двадцать — это zwanzig, а не число на -zehn."
  x13.expl: "Der Bus kommt in zwanzig Minuten: автобус придёт через двадцать минут."
  x14.prompt: "Соедините цену с числом."
  x14.expl: "Dreizehn 13, sechzehn 16, neunzehn 19."
  x15.prompt: "Напишите число 17 словом."
  x15.r1: "В 17 -en от sieben выпадает: siebzehn."
  x15.r2: "Siebzig — это 70; 17 заканчивается на -zehn."
  x15.expl: "Siebzehn: sieb + zehn."
  x16.prompt: "Какие из этих чисел между 13 и 16?"
  x16.o3.fb: "Zwölf — это 12, меньше 13."
  x16.o4.fb: "Achtzehn — это 18, больше 16."
  x16.expl: "Vierzehn (14) и fünfzehn (15) — между 13 и 16."
  tip: "Не путайте -zehn (13–19) с -zig (20, 30 …): vierzehn — это 14, vierzig — 40."
