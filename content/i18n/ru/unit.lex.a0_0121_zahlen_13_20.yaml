strings:
  title: "Числа от 13 до 20"
  summary: "От тринадцати до двадцати: числа на -zehn и zwanzig."
  obj: "Называть, читать и писать числа от 13 до 20 и использовать их для автобусов, комнат, возраста и времени."
  intro: "От 13 до 19 сначала говорят число от 3 до 9, а потом -zehn: drei + zehn = dreizehn — так же, как в «три-надцать». Две формы сокращены: sechzehn (без s от sechs) и siebzehn (без -en от sieben). Двадцать — новое слово: zwanzig. Обратите внимание на звуки: sechzehn произносят с ich-звуком (sech-), а не с «кс», как в sechs, а i в vierzehn краткое, хотя и пишется ie."
  examples: "Числа в повседневных фразах."
  summary_block: "**dreizehn 13 · vierzehn 14 · fünfzehn 15 · sechzehn 16 · siebzehn 17 · achtzehn 18 · neunzehn 19 · zwanzig 20**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "автобус номер тринадцать"
  ex.2: "четырнадцать евро: i краткое"
  ex.3: "шестнадцать часов (16:00): sech- с ich-звуком"
  ex.4: "Мне восемнадцать. Wie alt bist du? = сколько тебе лет?"
  ex.5: "комната девятнадцать"
  ex.6: "Автобус придёт через двадцать минут."
  x1.prompt: "Соедините каждое слово с цифрой."
  x1.expl: "Сначала маленькое число, потом -zehn; zwanzig — это 20."
  x2.prompt: "Какое число — vierzehn?"
  x2.o2.fb: "40 — это vierzig, с -zig; -zehn прибавляет десять."
  x2.o3.fb: "4 — это vier; -zehn прибавляет десять: 14."
  x2.expl: "Vierzehn = vier + zehn = 14."
  x3.prompt: "Напишите число 16 словом."
  x3.r1: "В 16 s от sechs выпадает: sechzehn."
  x3.r2: "В zehn есть h: sechzehn."
  x3.expl: "Sechzehn: sech + zehn, с ich-звуком."
  x4.prompt: "Правда или нет?"
  x4.wrong: "Это верно: 14 + 1 = 15."
  x4.expl: "Vierzehn (14) + eins (1) = fünfzehn (15)."
  x5.prompt: "Какие из этих чисел больше 15?"
  x5.o4.fb: "Vierzehn — это 14, меньше 15."
  x5.expl: "Siebzehn 17, achtzehn 18, zwanzig 20: все больше 15."
  x6.prompt: "Впишите пропущенные числа."
  x6.expl: "Счёт: dreizehn, vierzehn, fünfzehn … achtzehn, neunzehn, zwanzig."
  x7.prompt: "Правда или нет? (hört man = слышно, wie in = как в)"
  x7.wrong: "Это верно: sechzehn произносят с ich-звуком, sech-zehn, а не с «кс», как в sechs."
  x7.expl: "В sechs — «кс», а в sechzehn — ich-звук."
  x8.prompt: "Расставьте слова в правильном порядке."
  x8.expl: "Der Bus kommt in zwanzig Minuten: автобус придёт через двадцать минут."
  x9.prompt: "Ваш автобус — 13. Напишите его номер словом."
  x9.r1: "В zehn есть h: dreizehn."
  x9.r2: "Dreißig — это 30; 13 — dreizehn."
  x9.expl: "Bus Nummer dreizehn: автобус номер тринадцать."
  x10.prompt: "Фильм начинается в 17:00. Когда это?"
  x10.o2.fb: "Sieben Uhr — это 7:00."
  x10.o3.fb: "Siebzig — это 70; 17 заканчивается на -zehn: siebzehn."
  x10.expl: "17:00 = siebzehn Uhr; um = в."
  x11.prompt: "-zehn или -zig? Дополните число 14."
  x11.r1: "-zig образует десятки: vierzig — 40. Для 14 — -zehn: vierzehn."
  x11.r2: "В zehn есть h: vierzehn."
  x11.expl: "14 = vierzehn."
  x12.prompt: "Вам 18. Ответьте на вопрос."
  x12.o2.fb: "Achtzig — это 80; 18 — achtzehn."
  x12.o3.fb: "Acht — это 8; 18 — achtzehn."
  x12.expl: "Wie alt bist du? – Ich bin achtzehn."
  x13.prompt: "Администратор называет вашу комнату. Запишите номер цифрами."
  x13.expl: "Neunzehn — это 19."
  x14.prompt: "Напишите эту цену словами."
  x14.r1: "Vierzig — это 40; 14 — vierzehn."
  x14.r2: "Euro не меняется после числа: vierzehn Euro."
  x14.expl: "14 € = vierzehn Euro."
  x15.prompt: "Запишите время цифрами."
  x15.r1: "Neun Uhr — 9:00; neunzehn Uhr — 19:00."
  x15.expl: "Neunzehn Uhr — это 19:00."
  tip: "Не путайте -zehn (13–19) с -zig (20, 30 …): vierzehn — это 14, vierzig — 40. Окончание -ig в zwanzig в стандартном произношении Германии звучит как «-их», а на юге Германии, в Австрии и Швейцарии — как «-ик»."
