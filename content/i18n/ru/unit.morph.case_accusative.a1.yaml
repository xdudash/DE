strings:
  title: "Akkusativ: прямое дополнение"
  summary: "Akkusativ обозначает прямое дополнение. Артикли мужского рода меняются; женский, средний и множественный артикли в этой модели сохраняются."
  obj.role: "Находить прямое дополнение в простом предложении."
  obj.article: "Выбирать определённый или неопределённый артикль для прямого дополнения."
  b.intro: |
    **Akkusativ** часто обозначает человека или предмет, на который непосредственно направлено действие. В предложении *Ich sehe den Hund* (Я вижу собаку) *ich* — тот, кто действует, а *den Hund* — тот, кого я вижу.

    Сначала найдите подлежащее, затем задайте после глагола вопрос **кого?** или **что?** Ответ часто будет прямым дополнением в Akkusativ.
  b.pattern.caption: "В Akkusativ меняются только артикли мужского рода"
  col.nominative: "Форма подлежащего"
  col.accusative: "Форма дополнения"
  col.example: "Пример"
  b.examples.title: "Дополнения в повседневных предложениях"
  ex.book: "Я покупаю яблоко."
  ex.coffee: "Она заказывает кофе."
  ex.film: "Мы смотрим фильм."
  ex.fem: "Он навещает семью."
  ex.neut: "Я беру велосипед."
  b.rule: |
    С существительным **мужского рода** определённый артикль меняется с *der* на *den*, а неопределённый — с *ein* на *einen*. Так же меняются *kein → keinen* и притяжательные формы, например *mein → meinen*.

    Артикли женского рода *die*, среднего рода *das* и множественного числа *die* в этой базовой модели Akkusativ не меняются. Само существительное обычно остаётся прежним: *der Hund → den Hund*.
  b.summary: |
    - Подлежащее выполняет действие и обычно стоит в Nominativ.
    - Прямое дополнение отвечает на вопрос **кого?** или **что?** после глагола.
    - Мужской род: *der → den*, *ein → einen*, *kein → keinen*.
    - *Die* женского рода, *das* среднего рода и *die* множественного числа здесь не меняются.
  b.practice.title: "Практика: найди и оформи дополнение"
  fb.correct: "Верно."
  fb.incorrect: "Пока не совсем. Найдите дополнение и проверьте род существительного."
  x.article.prompt: "Выберите артикль для прямого дополнения."
  x.article.a: "*Der* — форма мужского рода для подлежащего. Здесь яблоко — дополнение."
  x.article.c: "*Dem* используется с некоторыми дополнениями в Dativ; здесь нужен Akkusativ."
  x.article.explanation: "*Apfel* — существительное мужского рода, а здесь это то, что покупают. Поэтому нужен Akkusativ *den*."
  x.cloze.prompt: "Дополните предложение артиклем в Akkusativ."
  x.cloze.explanation: "*Bahnhof* — мужского рода. Как дополнение после *suchen* он требует формы *einen*."
  x.match.prompt: "Сопоставьте форму подлежащего с формой дополнения в Akkusativ."
  x.match.explanation: "В этом наборе меняется только артикль мужского рода: *der → den*."
  x.order.prompt: "Составьте предложение «Я смотрю фильм»."
  x.order.explanation: "Сначала подлежащее, затем спрягаемый глагол и дополнение: *Ich sehe einen Film.*"
  x.transform.prompt: "Исправьте артикль: мужчина покупает яблоко."
  x.transform.explanation: "Яблоко — прямое дополнение. *Apfel* мужского рода, поэтому *der* меняется на *den*."
  x.correct.prompt: "Исправьте артикль в предложении."
  x.correct.rule: "Врач — дополнение после *besucht*. Используйте мужскую форму Akkusativ *den Arzt*."
  x.correct.explanation: "*Sie* — подлежащее. Человек, которого она навещает, — прямое дополнение: *den Arzt*."
  x.true_false.prompt: "Определите, верно ли утверждение."
  x.true_false.wrong: "Здесь *ich* — подлежащее, а *den Hund* — прямое дополнение."
  x.true_false.explanation: "После глагола *sehen* увиденный предмет является прямым дополнением; *den Hund* стоит в Akkusativ."
