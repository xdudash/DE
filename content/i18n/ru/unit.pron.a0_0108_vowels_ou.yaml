strings:
  title: "Долгие и краткие o и u"
  summary: "Читайте o и u долгими или краткими по соседним буквам; несколько слов — исключения."
  obj: "Различать долгие и краткие o и u по написанию слова."
  intro: "Правило из прошлого урока действует и для o и u. Удвоенная согласная (nn, tt, mm) или две согласные (st, nd) после гласной обычно делают её краткой: Sonne, Mutter, Post, Hund. Одна согласная, h или удвоенная гласная обычно делают её долгой: rot, gut, Sohn, Uhr, Boot. Долгота важна: Sohn (сын) и Sonne (солнце) различаются именно ею. Русские о и у по долготе не различаются, поэтому долгое немецкое о тяните заметно дольше."
  examples: "Долгие и краткие o и u в словах."
  summary_block: "**Обычно краткие o и u:** Sonne, Post, Mutter, Hund. **Обычно долгие o и u:** Boot, Sohn, rot, gut, Uhr. **Исключение:** Buch, Kuchen (долгое u перед ch)."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "лодка: долгое o, пишется oo"
  ex.2: "солнце: краткое o, удвоенное n"
  ex.3: "сын: долгое o, отмечено h"
  ex.4: "красный: долгое o, одно t"
  ex.5: "мать: краткое u, удвоенное t"
  ex.6: "хорошо: долгое u, одно t"
  ex.7: "часы: долгое u, отмечено h"
  ex.8: "собака: краткое u, две согласные nd (d в конце звучит как t)"
  ex.9: "Часы красные."
  ex.10: "Хлеб хороший."
  x1.prompt: "В каких словах долгое o?"
  x1.o4.fb: "В Sonne после o стоит nn, поэтому o краткое."
  x1.o5.fb: "В Post после o две согласные st, поэтому o краткое."
  x1.expl: "В Boot oo, в Sohn oh, а в rot одна согласная: все долгие."
  x2.prompt: "Соедините каждое слово с его гласной (kurz — краткая, lang — долгая)."
  x2.expl: "nn и nd — кратко. Одно t — долго (Brot, Hut)."
  x3.prompt: "Правда или нет? (lang — долгий)"
  x3.wrong: "Это верно: в Sohn после o стоит h, а oh — долгое o."
  x3.expl: "h после гласной обозначает, что она долгая."
  x4.prompt: "Дополните слово «мать». (Моя мама — учительница.)"
  x4.r1: "С одним t u было бы долгим. В Mutter краткое u, поэтому нужно tt."
  x4.expl: "Mutter: tt после краткого u."
  x5.prompt: "В каком слове краткое u?"
  x5.o2.fb: "В gut после u одно t, поэтому u долгое."
  x5.o3.fb: "В Uhr после u стоит h, поэтому u долгое."
  x5.expl: "В Hund после u стоит nd, поэтому u краткое."
  x6.prompt: "Напишите немецкое слово «лодка»."
  x6.r1: "В Boot удвоенное o для долгого o."
  x6.r2: "Boat — по-английски. По-немецки Boot."
  x6.expl: "das Boot: oo — долгое o."
  x7.prompt: "Одногруппник спрашивает (Wie heißt das auf Deutsch? — Как это по-немецки?). Что вы ответите?"
  x7.o2.fb: "С одной n o было бы долгим. Солнце — Sonne, с nn."
  x7.o3.fb: "Sohn — это сын, с долгим o. Солнце — Sonne, с кратким o."
  x7.expl: "die Sonne: краткое o перед nn."
  x8.prompt: "Составьте предложение «Часы красные»."
  x8.expl: "Die Uhr ist rot: долгое u в Uhr, долгое o в rot."
  x9.prompt: "Какое из двух слов имеет долгое o?"
  x9.o2.fb: "В Sonne nn, поэтому её o краткое."
  x9.o3: "оба"
  x9.o3.fb: "Только в Sohn долгое o (oh). В Sonne краткое o."
  x9.expl: "Sohn (сын) и Sonne (солнце) различаются долготой o."
  x10.prompt: "Исправьте ошибку в написании."
  x10.expl: "В gut одно t: u долгое."
  x11.prompt: "Это правильно? (lang — долгий)"
  x11.wrong: "Это верно: в Buch долгое u, хотя после него ch. Buch и Kuchen — исключения."
  x11.expl: "Правило говорит «обычно»: в Buch и Kuchen долгое u перед ch."
  x12.prompt: "Краткое o: дополните слова «солнце», «приходить» и «чемодан»."
  x12.expl: "Sonne, kommen и Koffer: удвоенная согласная показывает краткое o."
  x13.prompt: "Какое написание слова «собака» правильное?"
  x13.o2.fb: "В конце слышно t, но слово пишется с d: Hund."
  x13.o3.fb: "h обозначало бы долгое u. В Hund краткое u."
  x13.expl: "der Hund: краткое u перед nd; d звучит как t."
  x14.prompt: "Одногруппник говорит это (ich glaube — я думаю). Что вы ответите?"
  x14.o2.fb: "В Post после o две согласные st, поэтому o краткое."
  x14.o3.fb: "В Boot oo и долгое o; в Post st и краткое o."
  x14.expl: "Nein — нет: st после o делает её краткой."
  x15.prompt: "Дополните слово «часы»."
  x15.r1: "Ur — это не часы. Долгое u отмечено h: Uhr."
  x15.expl: "die Uhr: h после u обозначает долгое u."
  tip: "Исключение, которое встретится часто: в Buch (книга) и Kuchen (пирог) долгое u, хотя после него стоит ch."
