strings:
  title: "Долгие и краткие o и u"
  summary: "Читайте o и u долгими или краткими по соседним буквам."
  obj: "Различать долгие и краткие o и u по написанию слова."
  intro: "То же правило написания действует для o и u. Удвоенная согласная (nn, tt, mm) или две согласные (st, nd) после гласной обычно делают её краткой: Sonne, Mutter, Post, Hund. Одна согласная, h или удвоенная гласная обычно делают её долгой: rot, gut, Sohn, Uhr, Boot."
  examples: "Долгие и краткие o и u в словах."
  summary_block: "**Краткие o и u:** Sonne, Post, Mutter, Hund. **Долгие o и u:** Boot, Sohn, rot, gut, Uhr."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "лодка: долгое o, пишется oo"
  ex.2: "солнце: краткое o, удвоенное n"
  ex.3: "сын: долгое o, отмечено h"
  ex.4: "красный: долгое o, одно t"
  ex.5: "мать: краткое u, удвоенное t"
  ex.6: "хорошо: долгое u, одно t"
  ex.7: "часы: долгое u, отмечено h"
  ex.8: "собака: краткое u, две согласные nd"
  x1.prompt: "В каких словах долгое o?"
  x1.o4.fb: "В Sonne после o стоит nn, поэтому o краткое."
  x1.o5.fb: "В Post после o две согласные st, поэтому o краткое."
  x1.expl: "В Boot oo, в Sohn oh, а в rot одна согласная: все долгие."
  x2.prompt: "Дополните слово «мать»."
  x2.r1: "С одним t u было бы долгим. В Mutter краткое u, поэтому нужно tt."
  x2.expl: "Mutter: tt после краткого u."
  x3.prompt: "В каком слове краткое u?"
  x3.o2.fb: "В gut после u одно t, поэтому u долгое."
  x3.o3.fb: "В Uhr после u стоит h, поэтому u долгое."
  x3.expl: "В Hund после u стоит nd, поэтому u краткое."
  x4.prompt: "Соедините каждое слово с его гласной."
  x4.expl: "oo и одна согласная — долго. nn и tt — кратко."
  x5.prompt: "Правда или нет?"
  x5.wrong: "Это правда: в Sohn после o стоит h, а oh — долгое o."
  x5.expl: "h после гласной обозначает, что она долгая."
  x6.prompt: "Напишите слово «лодка»."
  x6.r1: "В Boot удвоенное o для долгого o."
  x6.r2: "Boat — по-английски. По-немецки Boot."
  x6.expl: "Boot: oo — долгое o."
  x7.prompt: "Одногруппник спрашивает вас. Что вы ответите?"
  x7.o2.fb: "В Butter после u стоит tt, поэтому u краткое."
  x7.o3.fb: "Butter пишется B-u-t-t-e-r: там есть u."
  x7.expl: "Kurz означает «краткий»: после u стоит tt."
  x8.prompt: "Краткое o: дополните каждое слово удвоенной согласной."
  x8.expl: "Sonne, kommen и Koffer: удвоенная согласная показывает краткое o."
  x9.prompt: "В каком слове долгое u отмечено h?"
  x9.o2.fb: "В Hund после u стоит nd, поэтому u краткое, и h нет."
  x9.o3.fb: "В Mutter после u стоит tt, поэтому u краткое."
  x9.expl: "Uhr: h после u обозначает, что она долгая."
  x10.prompt: "Напишите по буквам слово «хорошо» (долгое u)."
  x10.r1: "С tt u было бы кратким. В gut одно t."
  x10.r2: "В gut нет h: g-u-t. Одно t уже показывает долгое u."
  x10.expl: "gut: одно t после долгого u."
  x11.prompt: "Это правильно?"
  x11.wrong: "В Post после o две согласные st, поэтому o краткое."
  x11.expl: "Две согласные после гласной обычно делают её краткой."
  x12.prompt: "Дополните словом «солнце» (краткое o, nn)."
  x12.r1: "В Sonne нужно nn: o краткое."
  x12.expl: "Die Sonne ist warm означает «солнце тёплое»."
  x13.prompt: "В каких словах краткая гласная?"
  x13.o4.fb: "В Brot после o одно t, поэтому o долгое."
  x13.o5.fb: "В Schuh после u стоит h, поэтому u долгое."
  x13.expl: "В Hund nd, в kommen mm, в Koffer ff: все краткие."
  x14.prompt: "Наберите слово «часы»."
  x14.r1: "В Uhr после U стоит h: долгое u пишется uh."
  x14.expl: "Uhr также означает «час» при указании времени: drei Uhr."
  x15.prompt: "В каком слове долгое o пишется oo?"
  x15.o2.fb: "В Brot долгое o, но пишется одной o."
  x15.o3.fb: "В Sohn долгое o пишется oh, а не oo."
  x15.expl: "Долгую гласную пишут тремя способами: одной буквой, с h или удвоенно."
  tip: "Помните с прошлого урока: lang — долгий, kurz — краткий."
