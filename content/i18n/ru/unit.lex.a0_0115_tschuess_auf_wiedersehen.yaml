strings:
  title: "Прощания: Tschüss и Auf Wiedersehen"
  summary: "Tschüss — со знакомыми, Auf Wiedersehen — вежливо с кем угодно; Bis bald и Bis morgen — когда ещё увидитесь."
  obj: "Выбирать прощание, подходящее человеку, и говорить, когда увидитесь снова."
  intro: "Tschüss — неформальное прощание с друзьями, одноклассниками и знакомыми коллегами. Auf Wiedersehen — вежливое прощание: у окошка, в магазине, с малознакомыми людьми. Bis bald — «до скорого»; Bis morgen — «до завтра». Оба можно сказать после Tschüss."
  examples: "Прощания в коротких сценах."
  summary_block: "**Tschüss** — неформально. **Auf Wiedersehen** — вежливо. **Bis bald** — «до скорого», **Bis morgen** — «до завтра»."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Пока, Анна! (подруге)"
  ex.2: "До свидания, господин Кляйн! (вежливо)"
  ex.3: "До скорого!"
  ex.4: "До завтра, госпожа Вебер! (коллеге)"
  ex.5: "Пока и до скорого!"
  x1.prompt: "Вы уходите с вечеринки друга. Что вы скажете?"
