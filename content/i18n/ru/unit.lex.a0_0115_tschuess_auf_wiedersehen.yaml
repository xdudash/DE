strings:
  title: "Прощания: Tschüss и Auf Wiedersehen"
  summary: "Tschüss — со знакомыми, Auf Wiedersehen — вежливо с кем угодно; Bis bald и Bis morgen — когда ещё увидитесь."
  obj: "Выбирать прощание, подходящее человеку, и говорить, когда увидитесь снова."
  intro: "Tschüss — неформальное прощание с друзьями, одноклассниками и знакомыми коллегами. Auf Wiedersehen — вежливое прощание: у окошка, в магазине, с малознакомыми людьми. Bis bald — «до скорого»; Bis morgen — «до завтра». Оба можно сказать после Tschüss."
  examples: "Прощания в коротких сценах."
  summary_block: "**Tschüss** — неформально. **Auf Wiedersehen** — вежливо. **Bis bald** — «до скорого», **Bis morgen** — «до завтра»."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Пока, Анна! (подруге; ü краткое)"
  ex.2: "До свидания, господин Кляйн! (вежливо; ie — долгое и, h не произносится)"
  ex.3: "До скорого!"
  ex.4: "До завтра, госпожа Вебер! (morgen здесь значит «завтра» и пишется со строчной)"
  ex.5: "Пока и до скорого!"
  x1.prompt: "Соедините две части каждого прощания."
  x1.expl: "Auf Wiedersehen, Bis bald и Gute Nacht — устойчивые выражения."
  x2.prompt: "Вы уходите с вечеринки друга. Что вы скажете?"
  x2.o2.fb: "Guten Tag — приветствие при встрече, а не при прощании."
  x2.o3.fb: "Hallo — это приветствие, а вы уходите."
  x2.expl: "С друзьями прощаются словом Tschüss."
  x3.prompt: "Правда или нет? (= означает «то же самое, что»)"
  x3.wrong: "Guten Tag — приветствие при встрече; Bis bald — прощание до скорой встречи."
  x3.expl: "Bis bald — прощание, Guten Tag — приветствие."
  x4.prompt: "Вы увидите коллегу завтра. Дополните прощание."
  x4.r1: "Bis bald — «до скорого», без дня; на завтра говорите Bis morgen."
  x4.r2: "В Bis bald нет дня; на завтра говорите Bis morgen."
  x4.expl: "Morgen здесь означает «завтра»: Bis morgen."
  x5.prompt: "Что из этого — прощания?"
  x5.o4.fb: "Guten Morgen — утреннее приветствие."
  x5.o5.fb: "Hallo — приветствие при встрече."
  x5.expl: "Tschüss, Auf Wiedersehen и Bis bald завершают разговор."
  x6.prompt: "Расставьте слова в правильном порядке."
  x6.expl: "Сначала прощание, потом имя."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Hallo начинает разговор, а госпожа Вебер уходит."
  x7.o3.fb: "Guten Morgen — приветствие, а здесь прощание."
  x7.expl: "На вежливое прощание отвечайте вежливо."
  x8.prompt: "Правда или нет? (= означает «то же самое, что»)"
  x8.wrong: "Bis morgen называет день: завтра. Bis bald — «скоро», без дня."
  x8.expl: "morgen — завтра, bald — скоро."
  x9.prompt: "Дополните прощание двух друзей."
  x9.expl: "Bis morgen или Bis bald, и Tschüss в ответ."
  x10.prompt: "Вы отходите от окошка в банке. Какое прощание подходит?"
  x10.o2.fb: "Tschüss — неформально; в банке лучше вежливое прощание."
  x10.o3.fb: "Bis bald значит, что вы скоро увидитесь, а когда снова увидите сотрудника банка — неизвестно."
  x10.expl: "С незнакомыми вежливо сказать Auf Wiedersehen."
  x11.prompt: "Сделайте это прощание вежливым."
  x11.expl: "С Frau и фамилией вежливо сказать Auf Wiedersehen."
  x12.prompt: "Ваша подруга Анна уходит; вы увидитесь завтра. Что вы ответите?"
  x12.o2.fb: "Guten Tag — приветствие при встрече, а Анна уходит."
  x12.o3.fb: "Не тот человек: вы говорите с подругой Анной, а не с господином Кляйном."
  x12.expl: "Tschüss в ответ и bis morgen, потому что увидитесь завтра."
  x13.prompt: "Напишите вежливое прощание (два слова)."
  x13.r1: "Wieder- пишется с ie: Wiedersehen."
  x13.r2: "Wiedersehen — существительное: пишите с заглавной W."
  x13.r3: "На письме — полная форма Wiedersehen, с -en."
  x13.expl: "Auf Wiedersehen: два слова, Wiedersehen с ie и заглавной W."
  x14.prompt: "Какое слово означает «скоро»?"
  x14.o2.fb: "morgen — завтра."
  x14.o3.fb: "bis — «до»: Bis bald дословно «до скорого»."
  x14.expl: "bald — скоро: Bis bald!"
  x15.prompt: "Это правильно? (+ означает «и»)"
  x15.wrong: "Это верно: wieder — снова, sehen — видеть."
  x15.expl: "Auf Wiedersehen дословно «до новой встречи»."
  x16.prompt: "Напишите по-немецки: «До завтра!»"
  x16.r1: "Здесь morgen означает «завтра» и пишется со строчной m."
  x16.r2: "Bis bald — «до скорого»; «до завтра» — Bis morgen."
  x16.expl: "Bis morgen: morgen со строчной m означает «завтра»."
  tip: "Tschüss и Tschüs — оба написания правильные. Wiedersehen = wieder (снова) + sehen (видеть). Разделение такое же, как в русском: Tschüss ≈ «пока», Auf Wiedersehen ≈ «до свидания»."
