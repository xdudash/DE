translator: claude (AI draft, 2026-10-25)
strings:
  title: "Проверка блока: звуки, приветствия и числа"
  summary: "Смешанное повторение блока A0.01: буквы, умлауты, ß, приветствия, прощания и числа 0–20."
  obj: "Показать, что вы умеете использовать буквы, приветствия и числа блока A0.01."
  intro: "Этот урок проверяет блок A0.01. Каждое упражнение — из другого предыдущего урока. Если какое-то трудное, вернитесь к тому уроку, прежде чем начать блок A0.02."
  examples: "Что было в блоке A0.01."
  summary_block: "Если большинство ответов правильные, начинайте блок **A0.02**. Если нет, повторите уроки, названные в объяснениях."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Алфавит с умлаутами и ß."
  ex.2: "Приветствия по времени суток."
  ex.3: "Неформальное и официальное прощание."
  ex.4: "Числа от 0 до 20."
  ex.5: "Как представиться."
  x1.prompt: "Какая буква называется «ве»?"
  x1.o2.fb: "V называется «фау»; W — «ве»."
  x1.o3.fb: "B называется «бе»."
  x1.expl: "W называется «ве». Урок: алфавит."
  x2.prompt: "Напишите имя, которое продиктовали: A – N – N – A."
  x2.r1: "Там две N: A – N – N – A."
  x2.expl: "A, N, N, A — это Anna. Урок: как диктовать имена."
  x3.prompt: "Соедините каждое слово с его умлаутом."
  x3.expl: "В Käse — ä, в schön — ö, в über — ü. Уроки: умлауты."
  x4.prompt: "Правда или нет?"
  x4.wrong: "Это правда: после долгого a в Straße пишут ß."
  x4.expl: "Straße: долгая гласная, потом ß. Урок: ß и ss."
  x5.prompt: "Дополните приветствие для 8 утра."
  x5.r1: "Guten Tag — днём; в 8 утра говорят Guten Morgen."
  x5.r2: "Здесь Morgen — существительное: пишите с заглавной M."
  x5.expl: "Guten Morgen — утром. Урок: Guten Morgen и Guten Abend."
  x6.prompt: "Что из этого — прощания?"
  x6.o4.fb: "Hallo — приветствие, а не прощание."
  x6.expl: "Tschüss, Auf Wiedersehen и Bis bald завершают разговор. Урок: прощания."
  x7.prompt: "Расставьте слова в правильном порядке."
  x7.expl: "Ich heiße Anna. Урок: представиться на курсе."
  x8.prompt: "Официант спрашивает. Выберите ваш заказ."
  x8.o2.fb: "Freut mich — для знакомства, а не для заказа."
  x8.o3.fb: "Gute Nacht говорят, уходя поздно вечером."
  x8.expl: "Число, напиток и bitte. Урок: заказ в кафе."
  x9.prompt: "Запишите число цифрами."
  x9.expl: "Vier — это 4. Урок: числа от 0 до 5."
  x10.prompt: "Какое число — zwölf?"
  x10.o2.fb: "2 — это zwei; zwölf начинается так же, но это 12."
  x10.o3.fb: "20 — это zwanzig."
  x10.expl: "Zwölf — это 12. Урок: числа от 6 до 12."
  x11.prompt: "Впишите пропущенные числа."
  x11.expl: "Fünfzehn — это 15. Урок: числа от 13 до 20."
  x12.prompt: "Это правильно?"
  x12.wrong: "Нет: в 16 s от sechs выпадает: sechzehn."
  x12.expl: "Sechzehn, без s. Урок: числа от 13 до 20."
  x13.prompt: "Сделайте это приветствие вежливым."
  x13.expl: "С Herr и фамилией вежливо — Guten Tag. Урок: Hallo и Guten Tag."
  x14.prompt: "Выберите правильный ответ."
  x14.o2.fb: "Ja, danke — ответ на Ist das alles?, а не на вопрос о цене."
  x14.o3.fb: "Freut mich — для знакомства."
  x14.expl: "На вопрос о цене — цена. Урок: покупки на рынке."
  x15.prompt: "Напишите число 7 словом."
  x15.r1: "Sieben пишется с ie."
  x15.expl: "Sieben: s, ie, b, e, n. Урок: числа от 6 до 12."
  x16.prompt: "Соедините каждое слово с цифрой."
  x16.expl: "Fünf 5, elf 11, neunzehn 19, zwanzig 20."
  x17.prompt: "Какое приветствие подходит для 21:00?"
  x17.o2.fb: "Guten Morgen — для утра."
  x17.o3.fb: "Guten Tag — для дня."
  x17.expl: "Guten Abend — вечером. Урок: Guten Morgen и Guten Abend."
  x18.prompt: "Запишите цену цифрами."
  x18.expl: "Acht Euro — это 8 евро. Урок: заказ в кафе."
