strings:
  title: "Проверка блока: звуки, приветствия и числа"
  summary: "Смешанное повторение блока A0.01: буквы и звуки, приветствия, вежливые фразы и числа 0–20."
  obj: "Показать, что вы умеете использовать буквы, звуки, приветствия и числа блока A0.01."
  intro: "Этот урок проверяет блок A0.01. Каждое упражнение — из одного предыдущего урока, и в объяснении назван этот урок. Если упражнение трудное, вернитесь к тому уроку, прежде чем начать блок A0.02."
  examples: "Что было в блоке A0.01."
  summary_block: "Если большинство ответов правильные, начинайте блок **A0.02**. Если нет, повторите уроки, названные в объяснениях."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Алфавит с умлаутами и ß."
  ex.2: "Долгие и краткие гласные."
  ex.3: "Звуки ch, sch, st и sp."
  ex.4: "Приветствия, благодарность и прощания."
  ex.5: "Числа от 0 до 20."
  x1.prompt: "Какая буква называется «ве»?"
  x1.o2.fb: "V называется «фау»; W — «ве»."
  x1.o3.fb: "B называется «бе»."
  x1.expl: "W называется «ве». Урок: как диктовать имена."
  x2.prompt: "Прочитайте адрес lena@gmx.de вслух. Какого слова не хватает?"
  x2.r1: "Ät — это @; точка перед de — Punkt."
  x2.r2: "Bindestrich — это знак -; точка — Punkt."
  x2.expl: "Точку в адресе читают Punkt. Урок: буквы в повседневной жизни."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Нет: Ö — отдельная буква со своим звуком, как e с округлёнными губами."
  x3.expl: "Точки — часть буквы. Урок: умлауты, звуки."
  x4.prompt: "Соедините каждое слово с его умлаутом."
  x4.expl: "В München — ü, в Köln — ö, в Mädchen — ä. Урок: умлауты в словах и названиях городов."
  x5.prompt: "Какое написание правильное в Германии?"
  x5.o2.fb: "После долгого a пишут ß, а не одно s."
  x5.o3.fb: "Z звучит как «ц»; в Straße — ß."
  x5.expl: "Долгая гласная + ß: Straße. Урок: ß и ss."
  x6.prompt: "Напишите слово «кровать»: в нём краткое e."
  x6.r1: "После краткого e — удвоенная согласная: Bett."
  x6.r2: "Ee сделало бы e долгим; в Bett краткое e и tt."
  x6.expl: "Das Bett: краткое e, двойное t. Урок: долгие и краткие a, e, i."
  x7.prompt: "В каких словах долгое o или u?"
  x7.o4.fb: "В Sonne краткое o: это видно по двойному n."
  x7.expl: "В Boot, rot и gut — долгие гласные. Урок: долгие и краткие o и u."
  x8.prompt: "Впишите долгое i в число 7."
  x8.r1: "Ei — другой звук, как в drei; долгое i пишется ie."
  x8.r2: "Одно i здесь было бы кратким; долгое i — ie: sieben."
  x8.expl: "Sieben: ie — долгое i. Урок: двойные гласные и ie."
  x9.prompt: "Это правильно?"
  x9.wrong: "Это правильно: после u слышен ach-звук, как в Buch и acht."
  x9.expl: "После a, o, u и au — ach-звук. Урок: звуки ch и sch."
  x10.prompt: "Как произносят St в начале слова «Stadt»?"
  x10.o2.fb: "S-t — для st внутри или в конце слова, как в Fenster; в начале говорят scht."
  x10.o3.fb: "«Ц» — это звук z, а не st."
  x10.expl: "St- в начале слова звучит как scht-. Урок: st и sp."
  x11.prompt: "Сделайте это приветствие вежливым."
  x11.expl: "С Herr и фамилией вежливо — Guten Tag. Урок: Hallo и Guten Tag."
  x12.prompt: "В каких словах конец звучит как краткое a?"
  x12.o4.fb: "В rot r в начале, перед гласной: чёткое r."
  x12.expl: "Окончание -er звучит мягко, как краткое a. Урок: звук r и -er."
  x13.prompt: "Дополните приветствие для 8 утра."
  x13.r1: "Guten Tag — днём; в 8 утра говорят Guten Morgen."
  x13.r2: "Guten Abend — для вечера."
  x13.expl: "Guten Morgen — утром. Урок: Guten Morgen и Guten Abend."
  x14.prompt: "Что из этого — прощания?"
  x14.o4.fb: "Hallo — приветствие, а не прощание."
  x14.expl: "Tschüss, Auf Wiedersehen и Bis bald завершают разговор. Урок: прощания."
  x15.prompt: "Выберите правильный ответ."
  x15.o2.fb: "Tschüss — прощание; на благодарность отвечайте Bitte."
  x15.o3.fb: "Guten Abend — приветствие; на Danke отвечают, например, Bitte."
  x15.expl: "Danke! – Bitte! Урок: Danke и Bitte."
  x16.prompt: "Запишите число цифрами."
  x16.expl: "Vier — это 4. Урок: числа от 0 до 5."
  x17.prompt: "Вы не поняли. Что вы вежливо скажете?"
  x17.o2.fb: "Одно Was? может звучать грубо для незнакомых; Wie bitte? — вежливо."
  x17.o3.fb: "Gute Nacht говорят, уходя поздно вечером."
  x17.expl: "Wie bitte? — просьба повторить. Урок: Wie bitte?"
  x18.prompt: "Как вы ответите?"
  x18.o2.fb: "Danke schön — благодарность; на извинение говорят Kein Problem."
  x18.o3.fb: "Guten Morgen — приветствие, а не ответ на извинение."
  x18.expl: "Entschuldigung! – Kein Problem! Урок: Gern geschehen и Entschuldigung."
  x19.prompt: "Составьте вопрос другому слушателю."
  x19.expl: "Wie heißt du? — вопрос об имени слушателя. Урок: представиться на курсе."
  x20.prompt: "Какое число — zwölf?"
  x20.o2.fb: "2 — это zwei; zwölf начинается так же, но это 12."
  x20.o3.fb: "20 — это zwanzig."
  x20.expl: "Zwölf — это 12. Урок: числа от 6 до 12."
  x21.prompt: "Напишите число 16 словом."
  x21.r1: "В 16 s от sechs выпадает: sechzehn."
  x21.expl: "Sechzehn, без s. Урок: числа от 13 до 20."
  x22.prompt: "Официант спрашивает. Выберите ваш заказ."
  x22.o2.fb: "Freut mich — для знакомства, а не для заказа."
  x22.o3.fb: "Это говорит официант, когда вы платите."
  x22.expl: "Число, напиток и bitte. Урок: заказ в кафе."
  x23.prompt: "Дополните диалог."
  x23.expl: "Was kostet das? — вопрос о цене. Урок: покупки на рынке."
  x24.prompt: "Соедините каждое слово с цифрой."
  x24.expl: "Fünf 5, elf 11, neunzehn 19, zwanzig 20. Уроки: числа от 0 до 20."
