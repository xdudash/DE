translator: Codex (AI draft, 2026-10-26)
strings:
  title: "Отделяемые глаголы: приставка в конце"
  summary: "Спрягайте основу глагола и ставьте отделяемую приставку в конец простого главного предложения."
  obj.recognize: "Распознавать, как отделяемый глагол разделяется в главном предложении."
  obj.form: "Составлять простые утверждения и общие вопросы с отделяемым глаголом."
  b.intro: |
    У некоторых немецких глаголов есть приставка, которая отделяется в простом главном предложении. Например, *anrufen* («звонить») превращается в *Ich rufe dich an.* Спрягается основа, а приставка переходит в конец.

    Представьте эти две части как рамку вокруг остальных сведений: спрягаемый глагол находится ближе к началу, а приставка завершает предложение.
  b.pattern.caption: "Спрягаемый глагол ближе к началу, приставка — в конце"
  col.subject: "Подлежащее / вопрос"
  col.finite: "Спрягаемый глагол"
  col.middle: "Другие сведения"
  col.prefix: "Приставка в конце"
  b.examples.title: "Отделяемые глаголы на каждый день"
  ex.call: "Я позвоню тебе позже."
  ex.get_up: "Мара встаёт в семь."
  ex.shop: "Мы ходим за покупками в субботу."
  ex.come: "Ты пойдёшь сегодня вечером с нами?"
  ex.infinitive: "Я хотел(а) бы сегодня вечером куда-нибудь выйти."
  b.rule: |
    В утверждении спрягаемый глагол остаётся на втором месте, а приставка уходит в конец: *Heute rufe ich dich an.* Если на первом месте стоит обстоятельство *Heute*, подлежащее идёт после глагола.

    В общем вопросе спрягаемый глагол ставится первым, а приставка остаётся в конце: *Kommst du heute mit?* После модального глагола отделяемый глагол обычно остаётся цельным инфинитивом: *Ich möchte heute Abend ausgehen.*
  b.errors.title: "Сохраняйте правильное место обеих частей"
  e.prefix: "В простом главном предложении проспрягайте основу (*rufe*), а приставку (*an*) поставьте в конец: *Ich rufe dich später an.*"
  e.subject: "Если *Heute* стоит первым, спрягаемый глагол остаётся вторым, а подлежащее идёт после него: *Heute stehe ich früh auf.*"
  b.summary: |
    - Спрягайте основу глагола: *anrufen → ich rufe*.
    - Ставьте отделяемую приставку в конец простого главного предложения: *Ich rufe dich an.*
    - Если предложение начинается с другого элемента, глагол всё равно стоит вторым: *Heute rufe ich dich an.*
    - В общем вопросе спрягаемый глагол ставится первым: *Rufst du mich an?*
    - После модального глагола отделяемый глагол остаётся цельным инфинитивом: *Ich möchte ausgehen.*
  b.practice.title: "Разделите глаголы правильно"
  fb.correct: "Правильно."
  fb.incorrect: "Пока не совсем. Найдите спрягаемый глагол и проверьте, где должна стоять приставка."
  x.choose.prompt: "Выберите правильно составленное предложение с *anrufen*."
  x.choose.a: "Спрягаемая часть должна стоять ближе к началу, а приставка здесь не отделена."
  x.choose.c: "В этом главном предложении приставка должна стоять в конце."
  x.choose.explanation: "В предложении *Ich rufe dich am Abend an* форма *rufe* спрягается, а *an* завершает предложение."
  x.match.prompt: "Соедините инфинитив с его разделённой формой настоящего времени."
  x.match.explanation: "Спрягаемая основа стоит ближе к началу, а *an*, *auf*, *ein* или *mit* переходят в конец."
  x.cloze.prompt: "Дополните предложение правильными частями глагола *aufstehen*."
  x.cloze.explanation: "С *Mara* используйте форму *steht*. Отделяемая приставка *auf* ставится в конец: *Mara steht um sieben Uhr auf.*"
  x.order.prompt: "Составьте предложение: «Я позвоню тебе вечером»."
  x.order.explanation: "Оставьте подлежащее на первом месте, проспрягайте *anrufen* как *rufe*, а приставку *an* поставьте в конец."
  x.transform.prompt: "Преобразуйте утверждение в общий вопрос."
  x.transform.explanation: "В прямом общем вопросе спрягаемый глагол переходит на первое место. Приставка всё равно остаётся в конце: *Stehst du am Sonntag früh auf?*"
  x.categorize.prompt: "Распределите предложения: разделён ли отделяемый глагол в этом предложении?"
  x.categorize.split: "Части разделены"
  x.categorize.together: "Инфинитив пишется слитно"
  x.categorize.explanation: "В простом главном предложении спрягаемая форма отделяется от приставки. После модального глагола отделяемый глагол остаётся цельным инфинитивом: *möchte ausgehen*."
  x.true_false.prompt: "Верно или неверно? В простом главном предложении отделяемая приставка обычно стоит в конце."
  x.true_false.wrong: "Спрягаемая основа находится раньше в предложении, а отделяемая приставка завершает его."
  x.true_false.explanation: "Например: *Wir kaufen am Samstag ein.* Приставка *ein* стоит в конце."
  x.correct.prompt: "Исправьте порядок слов в предложении."
  x.correct.explanation: "*Heute* стоит на первом месте, поэтому спрягаемый глагол *kaufe* занимает второе место, а подлежащее *ich* идёт после него. Приставка *ein* остаётся в конце."
