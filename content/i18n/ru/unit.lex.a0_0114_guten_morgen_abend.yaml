strings:
  title: "Приветствия: Guten Morgen и Guten Abend"
  summary: "Приветствие меняется со временем суток: утро, день, вечер, ночь."
  obj: "Выбирать приветствие, подходящее времени суток."
  intro: "Guten Morgen означает «доброе утро»; обычно его говорят примерно до 10–11 часов. Потом днём говорят Guten Tag. Guten Abend означает «добрый вечер», примерно с 18 часов. Gute Nacht — не приветствие при встрече: обычно так говорят поздно, когда кто-то идёт спать или когда вы уходите поздно вечером."
  examples: "Приветствия в течение дня."
  summary_block: "**Guten Morgen** — утром, **Guten Tag** — днём, **Guten Abend** — вечером. **Gute Nacht** — обычно когда кто-то идёт спать или вы уходите поздно."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Доброе утро, господин Кляйн! (примерно до 10–11 часов)"
  ex.2: "Утро доброе, Том! (коротко и разговорно)"
  ex.3: "Добрый день! (днём; g в конце Tag звучит как к)"
  ex.4: "Добрый вечер, госпожа Вебер! (примерно с 18 часов; d в конце Abend звучит как т)"
  ex.5: "Спокойной ночи, Лиза! (когда кто-то идёт спать; Gute без -n)"
  x1.prompt: "Соедините каждую фразу со временем, когда её говорят."
  x1.expl: "Утро, день, вечер, ночь: фраза зависит от времени."
  x2.prompt: "Восемь утра. Вы входите в офис. Что вы скажете?"
  x2.o2.fb: "Guten Abend — для вечера, примерно с 18 часов."
  x2.o3.fb: "Gute Nacht говорят поздно, когда кто-то идёт спать."
  x2.expl: "Примерно до 10–11 часов говорят Guten Morgen."
  x3.prompt: "Правда или нет? (= означает «то же самое, что»)"
  x3.wrong: "Это верно: Morgen! — короткая разговорная форма Guten Morgen."
  x3.expl: "Коллеги и друзья часто говорят просто Morgen!"
  x4.prompt: "Восемь вечера. Дополните приветствие."
  x4.r1: "Guten Morgen — для утра; в 20:00 говорят Guten Abend."
  x4.r2: "Guten Tag — для дня; в 20:00 уже вечер."
  x4.r3: "Abend — существительное: пишите с заглавной A."
  x4.r4: "Фраза правильная; здесь напишите только пропущенное слово: Abend."
  x4.expl: "Примерно с 18 часов: Guten Abend."
  x5.prompt: "Что из этого слышно вечером или ночью?"
  x5.o3.fb: "Guten Morgen — для утра."
  x5.o4.fb: "Guten Tag — для дня; примерно с 18 часов говорят Guten Abend."
  x5.expl: "Guten Abend — приветствие вечером; Gute Nacht говорят поздно, перед сном."
  x6.prompt: "Расставьте слова в правильном порядке."
  x6.expl: "Сначала приветствие, потом имя."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Лиза поздоровалась утром; отвечайте тем же временем суток."
  x7.o3.fb: "Gute Nacht — когда идут спать, а не утреннее приветствие."
  x7.expl: "Отвечайте тем же приветствием и именем собеседника."
  x8.prompt: "Правда или нет? (= означает «то же самое, что»)"
  x8.wrong: "Guten Abend — приветствие вечером; Gute Nacht говорят, когда кто-то идёт спать."
  x8.expl: "Abend — вечер, Nacht — ночь."
  x9.prompt: "Дополните утренний диалог."
  x9.expl: "Господин Кляйн отвечает тем же утренним приветствием."
  x10.prompt: "Какое слово означает «вечер»?"
  x10.o2.fb: "Morgen — утро."
  x10.o3.fb: "Nacht — ночь; она наступает после вечера."
  x10.expl: "Abend — вечер: Guten Abend."
  x11.prompt: "Измените приветствие для вечера."
  x11.r1: "Gute Nacht — когда идут спать; вечером здороваются Guten Abend."
  x11.expl: "Меняется только слово времени: Morgen становится Abend."
  x12.prompt: "Ваш друг идёт спать. Как вы ответите?"
  x12.o2.fb: "Guten Morgen — для утра, а друг идёт спать."
  x12.o3.fb: "Guten Abend — приветствие вечером при встрече, а друг желает спокойной ночи."
  x12.expl: "На Gute Nacht отвечают Gute Nacht."
  x13.prompt: "Ваш ребёнок ложится спать. Напишите, что вы скажете."
  x13.r1: "С Nacht — Gute, без -n: Gute Nacht."
  x13.r2: "Nacht — существительное: пишите с заглавной N."
  x13.expl: "Gute Nacht: Gute без -n, в отличие от Guten Morgen и Guten Abend."
  x14.prompt: "Вы слышите это в Австрии. Какое приветствие понимают везде?"
  x14.o2.fb: "Gute Nacht говорят перед сном, а Grüß Gott — приветствие."
  x14.o3.fb: "Tschüss — прощание, а не приветствие."
  x14.expl: "Guten Tag понимают в Германии, Австрии и Швейцарии."
  x15.prompt: "Утро в пекарне. Дополните приветствие."
  x15.r1: "С Morgen — Guten, с -n. Без -n только Gute Nacht."
  x15.r2: "Фраза правильная; здесь напишите только пропущенное слово: Guten."
  x15.expl: "Guten Morgen, Guten Tag, Guten Abend — но Gute Nacht."
  x16.prompt: "Напишите короткое разговорное утреннее приветствие (одно слово)."
  x16.r1: "Правильно, но здесь напишите только краткую форму: Morgen."
  x16.expl: "Morgen! — разговорная краткая форма среди коллег и друзей."
  tip: "На юге Германии и в Австрии вы услышите также Grüß Gott, а в Швейцарии — Grüezi. Пока они вам не нужны: Guten Morgen, Guten Tag и Guten Abend понимают везде. Как и русское «спокойной ночи», Gute Nacht — пожелание перед сном, а не приветствие."
