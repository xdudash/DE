strings:
  title: "Приветствия: Guten Morgen и Guten Abend"
  summary: "Приветствие меняется со временем суток: утро, день, вечер, ночь."
  obj: "Выбирать приветствие, подходящее времени суток."
  intro: "Guten Morgen означает «доброе утро»; его говорят примерно до 10–11 часов. Потом днём говорят Guten Tag. Guten Abend означает «добрый вечер», примерно с 18 часов. Gute Nacht — не приветствие при встрече: так говорят ночью, когда кто-то идёт спать или когда вы уходите поздно."
  examples: "Приветствия в течение дня."
  summary_block: "**Guten Morgen** — утром, **Guten Tag** — днём, **Guten Abend** — вечером. **Gute Nacht** — только когда кто-то идёт спать или вы уходите поздно."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Доброе утро, господин Кляйн! (примерно до 10–11 часов)"
  ex.2: "Утро доброе, Том! (коротко и разговорно)"
  ex.3: "Добрый день! (днём)"
  ex.4: "Добрый вечер, госпожа Вебер! (примерно с 18 часов)"
  ex.5: "Спокойной ночи, Лиза! (когда кто-то идёт спать)"
  x1.prompt: "Восемь утра. Вы входите в офис. Что вы скажете?"
  x1.o2.fb: "Guten Abend — для вечера, примерно с 18 часов."
  x1.o3.fb: "Gute Nacht говорят ночью, когда кто-то идёт спать."
  x1.expl: "Примерно до 10–11 часов говорят Guten Morgen."
  x2.prompt: "Напишите приветствие для вечера."
  x2.r1: "Приветствие — Guten с -n: Guten Abend."
  x2.r2: "Abend — существительное: пишите с заглавной A."
  x2.expl: "Guten Abend: два слова; Abend — вечер."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Gute Nacht — для ночи, когда кто-то идёт спать или вы уходите поздно. Утром говорите Guten Morgen."
  x3.expl: "Nacht — ночь, Morgen — утро."
  x4.prompt: "Соедините каждую фразу со временем, когда её говорят."
  x4.expl: "Утро, день, вечер, ночь: фраза зависит от времени."
  x5.prompt: "Что из этого слышно вечером или ночью?"
  x5.o3.fb: "Guten Morgen — для утра."
  x5.expl: "Guten Abend — приветствие вечером; Gute Nacht говорят поздно, перед сном."
  x6.prompt: "Восемь вечера. Дополните приветствие."
  x6.r1: "Guten Morgen — для утра; в 20:00 говорят Guten Abend."
  x6.r2: "Guten Tag — для дня; в 20:00 уже вечер."
  x6.expl: "Примерно с 18 часов: Guten Abend."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Вас поприветствовали утром; отвечайте тем же временем суток."
  x7.o3.fb: "Gute Nacht — когда идут спать, а не утреннее приветствие."
  x7.expl: "На приветствие отвечайте тем же приветствием."
  x8.prompt: "Расставьте слова в правильном порядке."
  x8.expl: "Сначала приветствие, потом имя."
  x9.prompt: "Это правильно?"
  x9.wrong: "Это правильно: Morgen! — короткая разговорная форма Guten Morgen."
  x9.expl: "Коллеги и друзья часто говорят просто Morgen!"
  x10.prompt: "Дополните утренний диалог."
  x10.expl: "Господин Кляйн отвечает тем же утренним приветствием."
  x11.prompt: "Какое слово означает «вечер»?"
  x11.o2.fb: "Morgen — утро."
  x11.o3.fb: "Nacht — ночь."
  x11.expl: "Abend — вечер: Guten Abend."
  x12.prompt: "Измените приветствие для вечера."
  x12.r1: "Gute Nacht — когда идут спать; вечером здороваются Guten Abend."
  x12.expl: "Меняется только слово времени: Morgen становится Abend."
  x13.prompt: "Как вы ответите?"
  x13.o2.fb: "Guten Morgen — для утра, а друг идёт спать."
  x13.o3.fb: "Hallo — приветствие при встрече, а друг желает спокойной ночи."
  x13.expl: "На Gute Nacht отвечают Gute Nacht."
  x14.prompt: "Составьте пожелание спокойной ночи."
  x14.expl: "Сначала Gute Nacht, потом имя."
  x15.prompt: "В Австрии вы слышите Grüß Gott. Какое приветствие понимают везде?"
  x15.o2.fb: "Gute Nacht — только перед сном."
  x15.o3.fb: "Tschüss — прощание, а не приветствие."
  x15.expl: "Guten Tag понимают в Германии, Австрии и Швейцарии."
  x16.prompt: "Напишите приветствие для 7 утра."
  x16.r1: "Morgen — существительное: пишите с заглавной M."
  x16.r2: "Приветствие — Guten с -n: Guten Morgen."
  x16.expl: "Guten Morgen или разговорно просто Morgen."
  tip: "На юге Германии и в Австрии вы услышите также Grüß Gott, а в Швейцарии — Grüezi. Пока они вам не нужны: Guten Morgen, Guten Tag и Guten Abend понимают везде."
