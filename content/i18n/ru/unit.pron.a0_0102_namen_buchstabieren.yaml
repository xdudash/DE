strings:
  title: "Алфавит: как продиктовать имя"
  summary: "Продиктуйте своё имя по буквам и поймите продиктованное имя."
  obj: "Диктовать имя немецкими названиями букв и записывать продиктованное имя."
  intro: "На ресепшене или по телефону часто спрашивают: Wie schreibt man das? (Как это пишется?). Отвечайте названиями букв с короткой паузой: M – E – Y – E – R. Некоторые названия отличаются от английских: V — «фау», W — «ве», J — «йот», Y — «ипсилон». Для двух одинаковых букв часто говорят Doppel-, например Doppel-L."
  examples: "Как диктуют имя."
  summary_block: "**Wie schreibt man das?** Отвечайте названиями букв: **M – E – Y – E – R**. Помните: **V = фау, W = ве, J = йот, Y = ипсилон** и **Doppel-L** для LL."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Как это пишется?"
  ex.2: "Meyer по буквам: эм – е – ипсилон – е – эр."
  ex.3: "Müller: вместо двух L говорят Doppel-L."
  ex.4: "V называется «фау», W — «ве»."
  ex.5: "J называется «йот», Y — «ипсилон»."
  ex.6: "W как в Wasser: слово делает букву понятной по телефону."
  x1.prompt: "Как по-немецки называется буква W?"
  x1.o2.fb: "«Двойное U» — английское название. По-немецки W — «ве»."
  x1.o3.fb: "«Фау» — это буква V, а не W."
  x1.expl: "W называется «ве»; V — «фау»."
  x2.prompt: "Запишите имя, которое продиктовали: M – E – Y – E – R."
  x2.r1: "Meier — другое написание, но здесь есть Y: M – E – Y – E – R."
  x2.r2: "Вторая буква — E, а не A: Meyer."
  x2.expl: "Пишите именно те буквы, которые слышите: M, E, Y, E, R."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Это правильно: V называется «фау» и часто звучит как f."
  x3.expl: "V — «фау»: Vater произносят со звуком f."
  x4.prompt: "Соедините букву с её немецким названием."
  x4.expl: "Эти четыре названия сильнее всего отличаются от английских."
  x5.prompt: "Какие буквы дважды встречаются в имени Anna?"
  x5.o3.fb: "В Anna нет M: A – N – N – A."
  x5.expl: "Anna — это A – Doppel-N – A: и A, и N встречаются дважды."
  x6.prompt: "Допишите последнюю букву в слове Müller."
  x6.r1: "Müller заканчивается на -er, поэтому последняя буква — R."
  x6.expl: "Müller: M – Ü – Doppel-L – E – R."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Это повтор имени, а спрашивают про буквы."
  x7.o3.fb: "Danke не отвечает на вопрос, как пишется имя."
  x7.expl: "Wie schreibt man das? — это просьба назвать буквы."
  x8.prompt: "Расставьте слова, чтобы спросить, как что-то пишется."
  x8.expl: "Сначала вопросительное слово Wie, потом глагол schreibt."
  x9.prompt: "Это правильно?"
  x9.wrong: "Это правильно: для двух одинаковых букв часто говорят Doppel-, например Doppel-L в Müller."
  x9.expl: "Doppel означает «двойной»."
  x10.prompt: "Напишите букву, которая называется «йот»."
  x10.r1: "Y называется «ипсилон». «Йот» — это J."
  x10.r2: "I называется «и». «Йот» — это J."
  x10.expl: "J — «йот», как в Januar."
  x11.prompt: "Какая буква называется «ипсилон»?"
  x11.o2.fb: "I называется просто «и»."
  x11.o3.fb: "J называется «йот»."
  x11.expl: "Y — «ипсилон», как в Meyer."
  x12.prompt: "Дополните короткий диалог."
  x12.expl: "На Wie schreibt man das? отвечают буквами, а потом всем именем."
  x13.prompt: "Что из этого — немецкие названия букв?"
  x13.o4.fb: "Double-u — английское название. По-немецки W — «ве»."
  x13.expl: "B — «бе», H — «ха», V — «фау»."
  x14.prompt: "Продиктуйте это имя по буквам, через тире."
  x14.expl: "Klein: K – L – E – I – N, буква за буквой."
  x15.prompt: "Как вы ответите?"
  x15.o2.fb: "Это приветствие, а спрашивают ваше имя."
  x15.o3.fb: "Tschüss завершает разговор, а спрашивают ваше имя."
  x15.expl: "Назовите имя и сразу продиктуйте его: так не будет лишнего вопроса."
  tip: "Называйте буквы медленно, с паузой, а умлауты — как отдельные буквы: Ü, а не U."
