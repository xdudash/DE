strings:
  title: "Буквы в повседневной жизни: e-mail и улица"
  summary: "Продиктуйте адрес электронной почты и название улицы."
  obj: "Диктовать и понимать адрес e-mail и продиктованное название улицы."
  intro: "Когда диктуете адрес e-mail, называйте знаки словами: @ — «эт», точка — Punkt, - — Bindestrich, _ — Unterstrich. Во многих адресах умлауты пишут без точек: ü становится ue, ö — oe, ä — ae. Когда диктуете название улицы, ß называйте «эсцет»."
  examples: "Адреса вслух."
  summary_block: "**@ = ät, . = Punkt, - = Bindestrich, _ = Unterstrich.** В адресах **ü → ue, ö → oe, ä → ae**. **ß** диктуйте как **eszett**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Произносят: anna Punkt berg ät web Punkt de."
  ex.2: "Punkt: точка (.) в адресе."
  ex.3: "Bindestrich: дефис (-)."
  ex.4: "Unterstrich: нижнее подчёркивание (_)."
  ex.5: "@ произносят «эт», от английского „at“."
  ex.6: "В адресах ü часто пишут как ue: Müller → mueller."
  x1.prompt: "Как произнести знак @ в адресе e-mail?"
  x1.o2.fb: "Punkt — это точка (.), а не @."
  x1.o3.fb: "Bindestrich — это дефис (-), а не @."
  x1.expl: "@ произносят «эт»."
  x2.prompt: "Напишите немецкое слово для точки в адресе e-mail."
  x2.r1: "Punkt заканчивается на -kt."
  x2.r2: "По-немецки здесь пишут k: Punkt."
  x2.expl: "Точка — der Punkt."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Это правильно: - называется Bindestrich."
  x3.expl: "Binde- означает «соединять»: дефис соединяет две части."
  x4.prompt: "Соедините знак с его немецким названием."
  x4.expl: "Punkt, Bindestrich и Unterstrich — самые нужные знаки в адресах."
  x5.prompt: "Какие слова нужны, чтобы продиктовать „anna.berg@web.de“?"
  x5.o3.fb: "В этом адресе нет дефиса (-)."
  x5.o4.fb: "В этом адресе нет подчёркивания (_)."
  x5.expl: "anna Punkt berg ät web Punkt de."
  x6.prompt: "Дополните, как произнести anna@web.de."
  x6.r1: "Punkt — это точка. Здесь знак @, его произносят «эт»."
  x6.expl: "Между именем и почтовым сервисом стоит @ — «эт»."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Это только фамилия по буквам, а спрашивают весь адрес."
  x7.o3.fb: "Это ваше имя, а не адрес e-mail."
  x7.expl: "Назовите весь адрес с Punkt и ät."
  x8.prompt: "Расставьте части, чтобы сказать web.de."
  x8.expl: "web.de произносят web Punkt de."
  x9.prompt: "Это правильно?"
  x9.wrong: "Это правильно: во многих адресах ü пишут как ue, например mueller."
  x9.expl: "Ue, oe и ae заменяют умлауты, когда точки нельзя использовать."
  x10.prompt: "Напишите Müller так, как его часто пишут в адресе e-mail, без умлаута."
  x10.r1: "Без точек ü становится ue, а не u: mueller."
  x10.r2: "Здесь остался умлаут. Во многих адресах пишут ue: mueller."
  x10.expl: "Müller → mueller: ü заменяют на ue."
  x11.prompt: "Кто-то диктует S – T – R – A – ß – E. Какое это слово?"
  x11.o2.fb: "Strasse пишется с двумя S, а продиктовали ß (эсцет)."
  x11.o3.fb: "В Strase одна S, а продиктовали ß (эсцет)."
  x11.expl: "ß диктуют как «эсцет»: Straße."
  x12.prompt: "Дополните, как произнести lisa.koch@gmx.de."
  x12.expl: "Каждую точку произносят Punkt."
  x13.prompt: "Что из этого может быть частью адреса e-mail?"
  x13.o4.fb: "Запятая (Komma) в адресах e-mail не используется."
  x13.expl: "Точки, подчёркивания и дефисы встречаются в адресах, а запятые — нет."
  x14.prompt: "Напишите, как произнести этот адрес."
  x14.r1: "Punkt — существительное: пишите с заглавной P."
  x14.expl: "tom@web.de: tom ät web Punkt de."
  x15.prompt: "Как вы ответите?"
  x15.o2.fb: "Это название и номер, а спрашивают буквы."
  x15.o3.fb: "Danke не отвечает на вопрос, как пишется улица."
  x15.expl: "Wie schreibt man …? — это просьба продиктовать буквы."
