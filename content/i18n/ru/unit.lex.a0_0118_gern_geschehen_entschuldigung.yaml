strings:
  title: "Gern geschehen и Entschuldigung"
  summary: "Отвечайте на благодарность Gern geschehen или Kein Problem, а Entschuldigung говорите, чтобы извиниться или привлечь внимание."
  obj: "Отвечать на благодарность по-разному и использовать Entschuldigung, чтобы извиниться или привлечь внимание."
  intro: "Кроме Bitte, на благодарность можно ответить Gern geschehen (не за что, с удовольствием), коротко Gern или разговорно Kein Problem (без проблем). У Entschuldigung два употребления: это извинение, например когда вы кого-то толкнули, и способ обратиться к незнакомцу перед вопросом: Entschuldigung, wo ist der Bahnhof?"
  examples: "Ответ на благодарность и извинение."
  summary_block: "**Gern geschehen**, **Gern** и **Kein Problem** — ответы на благодарность. **Entschuldigung** — извинение или обращение перед вопросом."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Спасибо! – Не за что!"
  ex.2: "Спасибо! – Пожалуйста! (коротко)"
  ex.3: "Большое спасибо! – Без проблем! (разговорно)"
  ex.4: "Ой, извините! (вы кого-то толкнули)"
  ex.5: "Извините, где вокзал?"
  ex.6: "Извините! – Ничего страшного!"
  x1.prompt: "Вас благодарят за помощь. Какой ответ означает «не за что»?"
  x1.o2.fb: "Entschuldigung — извинение или обращение, а не ответ на благодарность."
  x1.o3.fb: "Danke — благодарность, а благодарят именно вас."
  x1.expl: "Gern geschehen — тёплый ответ на благодарность."
  x2.prompt: "Напишите вежливый ответ на благодарность со словом geschehen."
  x2.r1: "Geschehen — ge-sche-hen: пишите полностью."
  x2.expl: "Gern geschehen (также Gerne geschehen) — «не за что, с удовольствием»."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Это правильно: Kein Problem — разговорный ответ на благодарность."
  x3.expl: "Kein Problem — разговорно; Gern geschehen — чуть вежливее."
  x4.prompt: "Соедините две части каждой фразы."
  x4.expl: "Gern geschehen, Kein Problem и Vielen Dank — устойчивые фразы."
  x5.prompt: "Какие ответы подходят после «Danke!»?"
  x5.o5.fb: "Entschuldigung — извинение, а здесь извиняться не за что."
  x5.expl: "Gern geschehen, Gern, Kein Problem и Bitte — всё это ответы на благодарность."
  x6.prompt: "Вы наступили кому-то на ногу. Извинитесь."
  x6.r1: "Слово — Entschuldigung, с окончанием -ung."
  x6.r2: "Entschuldigung — существительное: пишите с заглавной E."
  x6.expl: "Entschuldigung — извинение."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Gern geschehen — ответ на благодарность, а не на извинение."
  x7.o3.fb: "Guten Abend — приветствие, а человек извиняется."
  x7.expl: "Kein Problem — так принимают извинение."
  x8.prompt: "Расставьте слова в правильном порядке."
  x8.expl: "Сначала Entschuldigung, чтобы привлечь внимание, потом вопрос."
  x9.prompt: "Это правильно?"
  x9.wrong: "Entschuldigung — извинение или обращение; на Danke отвечают Bitte или Gern geschehen."
  x9.expl: "На Danke отвечают Bitte, Gern geschehen или Kein Problem."
  x10.prompt: "Дополните диалог на улице."
  x10.expl: "Entschuldigung открывает вопрос; Gern geschehen отвечает на благодарность. Da links — «там слева»."
  x11.prompt: "Вы хотите задать вопрос незнакомцу на улице. С чего начать?"
  x11.o2.fb: "Gern geschehen — ответ на благодарность; с него не начинают вопрос."
  x11.o3.fb: "Tschüss — прощание, а вы только начинаете разговор."
  x11.expl: "Entschuldigung вежливо привлекает внимание незнакомца."
  x12.prompt: "Ответьте на благодарность вежливее, со словом geschehen."
  x12.expl: "Kein Problem — разговорно; Gern geschehen — теплее и вежливее."
  x13.prompt: "Как вы ответите?"
  x13.o2.fb: "Извиняться не за что; ответьте на благодарность."
  x13.o3.fb: "Вы услышали благодарность; переспрашивать не нужно."
  x13.expl: "Für die Hilfe — «за помощь». Отвечайте Gern geschehen."
  x14.prompt: "Составьте ответ."
  x14.expl: "Сначала Kein Problem, потом имя."
  x15.prompt: "Какую роль выполняет Entschuldigung в «Entschuldigung, wo ist der Bahnhof?»"
  x15.o1: "Вежливо привлекает внимание."
  x15.o2: "Это благодарность."
  x15.o2.fb: "Благодарность — это Danke или Vielen Dank."
  x15.o3: "Это прощание."
  x15.o3.fb: "Прощание — это Tschüss или Auf Wiedersehen."
  x15.expl: "Перед вопросом Entschuldigung означает «извините»."
  x16.prompt: "Напишите разговорный ответ на благодарность со словом Problem."
  x16.r1: "Пишется Kein, без -e: Kein Problem — устойчивое выражение."
  x16.r2: "Problem пишется P-r-o-b-l-e-m."
  x16.expl: "Kein Problem — «без проблем»."
