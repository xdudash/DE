strings:
  title: "Личные местоимения в Akkusativ"
  summary: "Заменяйте прямое дополнение личным местоимением: mich, dich, ihn, sie, es, uns, euch, sie/Sie."
  obj.forms: "Распознавать личные местоимения в Akkusativ."
  obj.replace: "Заменять прямое дополнение подходящим местоимением в Akkusativ."
  b.intro: |
    Если человек или предмет — **прямое дополнение**, используйте местоимение в Akkusativ. Сравните: *Der Mann ist nett. Ich mag ihn.* (Мужчина приятный. Он мне нравится.) Существительное *der Mann* мужского рода, поэтому в роли дополнения используется *ihn*.

    В простом повествовательном предложении местоимение обычно стоит после спрягаемого глагола: *Sie sieht mich.*
  b.pattern.caption: "Местоимения-подлежащее меняются, когда становятся прямым дополнением"
  col.subject: "Подлежащее"
  col.object: "Прямое дополнение"
  col.example: "Пример"
  b.examples.title: "Заменяем повторяющиеся существительные местоимениями"
  ex.friend: "Я знаю мужчину. Я его знаю."
  ex.friend_f: "Мы навещаем соседку. Мы её навещаем."
  ex.thing: "Он берёт книгу. Он её берёт."
  ex.plural: "Она звонит детям. Она им звонит."
  b.rule: |
    Запомните пары: *ich → mich*, *du → dich*, *er → ihn*, *sie → sie*, *es → es*, *wir → uns*, *ihr → euch*, *sie/Sie → sie/Sie*.

    Обратите внимание на пару *er → ihn*: форму *er* нельзя использовать как прямое дополнение. *Sie* женского рода, *es* среднего рода и *sie* множественного числа выглядят так же, как формы подлежащего, но их роль в предложении меняется.
  b.summary: |
    - Используйте местоимение в Akkusativ для человека или предмета в роли прямого дополнения.
    - Запомните пары *ich/mich*, *du/dich*, *er/ihn*, *wir/uns*, *ihr/euch*.
    - Формы *sie* и *es* могут выглядеть одинаково; определяйте падеж по роли в предложении.
    - В простом предложении местоимение обычно стоит после спрягаемого глагола: *Ich sehe dich.*
  b.practice.title: "Практика: выбираем и заменяем местоимения"
  fb.correct: "Верно."
  fb.incorrect: "Пока не совсем. Проверьте, является ли местоимение подлежащим или прямым дополнением."
  x.ihn.prompt: "Выберите местоимение, которое заменит «мужчину» в роли дополнения."
  x.ihn.a: "*Er* — форма подлежащего. Здесь этот человек является дополнением при *mag*."
  x.ihn.c: "*Ihm* — форма Dativ. Здесь *mögen* принимает прямое дополнение."
  x.ihn.explanation: "Мужчина является прямым дополнением после *mag*, поэтому используйте Akkusativ *ihn*."
  x.cloze.prompt: "Замените Анну подходящим местоимением."
  x.cloze.explanation: "Анна — женщина и прямое дополнение, поэтому используйте *sie*."
  x.match.prompt: "Сопоставьте местоимения-подлежащее с формами Akkusativ."
  x.match.explanation: "Важные изменённые формы: *ich/mich*, *du/dich*, *er/ihn* и *wir/uns*."
  x.order.prompt: "Составьте предложение «Я вижу вас сегодня». Поставьте *Ich* первым."
  x.order.explanation: "Местоимение-дополнение стоит после глагола: *Ich sehe euch heute.*"
  x.transform.prompt: "Замените *den Lehrer* местоимением."
  x.transform.explanation: "*Der Lehrer* — мужского рода. В Akkusativ местоимение — *ihn*."
  x.error.prompt: "Исправьте форму местоимения."
  x.error.rule: "После *sieht* говорящий является прямым дополнением: используйте *mich*, а не форму подлежащего *ich*."
  x.error.explanation: "Подлежащее — *er*. Человек, которого он видит, является дополнением, поэтому нужно *mich*."
  x.true_false.prompt: "Определите, верно ли утверждение."
  x.true_false.wrong: "Форма подлежащего — *er*, а форма Akkusativ — *ihn*."
  x.true_false.explanation: "Для прямого дополнения мужского рода *er* меняется на *ihn*."
