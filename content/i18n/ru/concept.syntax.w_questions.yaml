strings:
  title: W-вопросы
  summary: 'Открытые вопросы с wer, was, wann, wo, wohin, woher, wie и wie viel. Вопросительное слово стоит на первом месте, спрягаемый глагол — на втором.'
  pattern.scope: "Открытый вопрос в главном предложении запрашивает одну недостающую часть информации. На первом месте стоит вопросительное слово, за ним на втором месте — спрягаемый глагол. Подлежащее, например *du* или *der Bus*, обычно следует за глаголом."
  pattern.limits: "В вопросе *Wer wohnt hier?* слово *wer* само является подлежащим, поэтому отдельного подлежащего после глагола нет. Общие вопросы начинаются с глагола. В косвенном вопросе после *weißt du, …* или *ich frage, …* глагол уходит в конец; в этом уроке такая конструкция не рассматривается."
  ex.when: "Когда отправляется автобус?"
  ex.where: "Где ты живёшь?"
  ex.who_subject: "Кто здесь живёт?"
  ex.where_from: "Откуда Вы? (вежливое обращение)"
  ex.price: "Сколько стоит билет?"
  err.verb_third: "Вопросительное слово уже занимает первое место. Сразу после него поставьте спрягаемый глагол, а затем подлежащее: *Wo wohnst du?*"
