strings:
  title: "Умлауты: звуки"
  summary: "Ä, Ö и Ü имеют каждый свой звук. Учите их вместе со словом."
  obj: "Различать ä, ö и ü и писать их в простых словах."
  intro: "Ä, Ö и Ü — отдельные буквы. Ä звучит близко к э в «bed», часто дольше. Для ö скажите «э» и округлите губы. Для ü скажите «и» и округлите губы. Точки важны: без них слово другое или неправильное."
  examples: "Слово для каждого умлаута."
  summary_block: "**ä** ≈ э в «bed». **ö** = э с округлёнными губами. **ü** = и с округлёнными губами. Точки — часть буквы."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Käse (сыр): ä, близко к э в «bed», но дольше."
  ex.2: "Bär (медведь): долгое ä."
  ex.3: "schön (красивый): э с округлёнными губами."
  ex.4: "Öl (масло): долгое ö в начале слова."
  ex.5: "über (над): и с округлёнными губами."
  ex.6: "Tür (дверь): ü в середине слова."
  x1.prompt: "Какой умлаут получается, если сказать «э» с округлёнными губами?"
  x1.o2.fb: "ä близко к э в «bed», без округлённых губ."
  x1.o3.fb: "ü — это «и» с округлёнными губами, а не «э»."
  x1.expl: "э + округлённые губы = ö, как в schön."
  x2.prompt: "Напишите немецкое слово «сыр». В нём есть ä."
  x2.r1: "Käse нужны две точки: ä."
  x2.r2: "Kaese — написание без клавиши умлаута; обычно пишут ä: Käse."
  x2.expl: "Käse: K – Ä – S – E."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Это правильно: скажите «и», округлите губы — и получится ü."
  x3.expl: "Ü = и с округлёнными губами, как в über."
  x4.prompt: "Соедините слово с его умлаутом."
  x4.expl: "В Käse — ä, в schön — ö, в über — ü."
  x5.prompt: "В каких словах есть звук ü?"
  x5.o3.fb: "В Tor (ворота) o, а не ü."
  x5.o4.fb: "В Hut (шляпа) u без точек."
  x5.expl: "В über и Tür — ü; в Tor и Hut — обычные o и u."
  x6.prompt: "Вставьте пропущенный умлаут: sch_n (красивый)."
  x6.r1: "Без точек это o; в schön нужно ö."
  x6.r2: "ü — другой умлаут; в schön — ö."
  x6.expl: "schön: S – C – H – Ö – N."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Это O без точек; в schön — Ö."
  x7.o3.fb: "Ä — другой умлаут; в schön — Ö."
  x7.expl: "Умлаут диктуют как отдельную букву: Ö."
  x8.prompt: "Вставьте умлауты."
  x8.expl: "В Käse — ä; в schön — ö."
  x9.prompt: "Это правильно?"
  x9.wrong: "Нет: Ö и O — разные буквы с разными звуками."
  x9.expl: "Точки образуют новую букву: O и Ö — не одно и то же."
  x10.prompt: "Напишите немецкое слово «дверь». В нём есть ü."
  x10.r1: "Tür нужны точки: ü."
  x10.r2: "Tor — это ворота. Дверь — Tür, с ü."
  x10.expl: "Tür: T – Ü – R."
  x11.prompt: "Какая буква есть в „Bär“ (медведь)?"
  x11.o2.fb: "В Bär над a две точки: ä."
  x11.o3.fb: "Звук близок к э, но буква — ä."
  x11.expl: "Bär: B – Ä – R."
  x12.prompt: "Исправьте написание: этому слову нужен умлаут."
  x12.expl: "über пишется с ü."
  x13.prompt: "В каких словах есть звук ö?"
  x13.o3.fb: "В Bär — ä, а не ö."
  x13.o4.fb: "В Ofen (печь) o без точек."
  x13.expl: "В schön и Öl — ö."
  x14.prompt: "Какая буква пропущена? B_r (медведь)"
  x14.r1: "Без точек это a; в Bär нужно ä."
  x14.r2: "Звук близок к э, но Bär пишут с ä."
  x14.expl: "Bär: долгое ä."
  x15.prompt: "Как вы ответите?"
  x15.o2.fb: "В über две точки: Ü."
  x15.o3.fb: "Ö — другой умлаут; в über — Ü."
  x15.expl: "über: Ü с двумя точками."
