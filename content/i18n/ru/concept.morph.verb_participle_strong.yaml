  title: Причастие сильных и смешанных глаголов (ge-…-en)
  summary: 'Сильные глаголы оканчиваются на -en и часто меняют корневую гласную: sprechen → gesprochen, gehen → gegangen. Такие формы нужно запоминать по отдельности.'
