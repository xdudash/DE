strings:
  title: "Умлауты в словах и названиях мест"
  summary: "Точки меняют слово: schon и schön — два разных слова."
  obj: "Находить и писать умлаут в повседневных словах и названиях мест."
  intro: "Умлаут — часть написания. Schon (уже) и schön (красивый) — разные слова. Многие повседневные слова и названия мест содержат умлауты: Mädchen, Brötchen, München, Köln, Zürich, Österreich. Пишите точки каждый раз."
  examples: "Слова и названия с умлаутами."
  summary_block: "**Умлаут принадлежит слову.** schon ≠ schön. Пишите точки в словах и названиях: **München, Köln, Zürich, Österreich**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Mädchen (девочка): ä."
  ex.2: "Brötchen (булочка): ö."
  ex.3: "München (Мюнхен): ü."
  ex.4: "Köln (Кёльн): ö."
  ex.5: "Zürich (Цюрих): ü, город в Швейцарии."
  ex.6: "Österreich (Австрия): начинается с Ö."
  x1.prompt: "Какой город пишется с ü?"
  x1.o2.fb: "В Köln — ö, а не ü."
  x1.o3.fb: "В Wien (Вена) нет умлаута."
  x1.expl: "München: M – Ü – N – C – H – E – N."
  x2.prompt: "Напишите немецкое название Австрии."
  x2.r1: "Österreich начинается с Ö, с двумя точками."
  x2.r2: "Oe — написание без клавиши умлаута; пишите Ö."
  x2.expl: "Österreich: Ö в начале, дальше sterreich."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Нет: schon — «уже», schön — «красивый». Точки меняют слово."
  x3.expl: "Две точки образуют новое слово."
  x4.prompt: "Соедините слово с его умлаутом."
  x4.expl: "Mädchen – ä, Brötchen – ö, Zürich – ü."
  x5.prompt: "В каких словах есть умлаут?"
  x5.o3.fb: "В Berlin нет умлаута."
  x5.o4.fb: "В Wien нет умлаута: W – I – E – N."
  x5.expl: "В Mädchen — ä, в Köln — ö."
  x6.prompt: "Вставьте пропущенную букву: M_nchen."
  x6.r1: "München нужно ü с двумя точками."
  x6.r2: "ö — другой умлаут; в München — ü."
  x6.expl: "München: ü."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "В Köln — Ö, а не O."
  x7.o3.fb: "Ü — другой умлаут; в Köln — Ö."
  x7.expl: "Умлаут диктуют как отдельную букву: Ö."
  x8.prompt: "Вставьте умлауты в этот заказ в пекарне."
  x8.expl: "В Brötchen — ö, в Käse — ä."
  x9.prompt: "Это правильно?"
  x9.wrong: "Это правильно: Zürich пишется с ü."
  x9.expl: "Zürich: Z – Ü – R – I – C – H."
  x10.prompt: "Напишите немецкое слово «девочка». В нём есть ä."
  x10.r1: "Mädchen нужно ä с двумя точками."
  x10.r2: "Mädchen пишется с ch, а не sch."
  x10.expl: "Mädchen: M – Ä – D – C – H – E – N."
  x11.prompt: "Какое слово означает «красивый»?"
  x11.o2.fb: "schon без точек означает «уже»."
  x11.o3.fb: "Sohn означает «сын»; умлаута нет."
  x11.expl: "schön (красивый) содержит ö."
  x12.prompt: "Исправьте написание этого города: в нём есть ü."
  x12.expl: "Düsseldorf пишется с ü."
  x13.prompt: "В каких словах есть ö?"
  x13.o4.fb: "В München — ü, а не ö."
  x13.expl: "В Brötchen, Köln и Österreich — ö."
  x14.prompt: "Какая буква пропущена? T_r (дверь)"
  x14.r1: "Tor — ворота; дверь — Tür с ü."
  x14.r2: "Без точек это u; в Tür нужно ü."
  x14.expl: "Tür (дверь): ü."
  x15.prompt: "Как вы ответите?"
  x15.o2.fb: "Без точек получилось бы schon (уже)."
  x15.o3.fb: "ä — другой умлаут; в schön — ö."
  x15.expl: "schön: ö."
