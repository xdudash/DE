strings:
  title: "Сценарий: заказ в кафе"
  summary: "Вежливо закажите напитки, поймите цену и расплатитесь."
  obj: "Заказать от одного до трёх напитков и понять цену до двадцати евро."
  intro: "В кафе официант спрашивает «Was möchten Sie?». Вы отвечаете числом и названием напитка и добавляете bitte. Когда вы платите, официант говорит «Das macht … Euro.», а вы отдаёте деньги со словами «Hier, bitte!»."
  examples: "Фразы в кафе."
  summary_block: "**Was möchten Sie?** — **Zwei Kaffee, bitte.** — **Das macht sechs Euro.** — **Hier, bitte!**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Что вы желаете? (официант)"
  ex.2: "Один чай, пожалуйста. Перед словом «один» — ein, а не eins."
  ex.3: "Два кофе, пожалуйста."
  ex.4: "Три воды, пожалуйста."
  ex.5: "С вас шесть евро."
  ex.6: "Вот, пожалуйста! (когда платите)"
  x1.prompt: "Официант спрашивает. Выберите ваш заказ."
  x1.o2.fb: "Gute Nacht говорят, уходя ночью, а не заказывая."
  x1.o3.fb: "Это говорит официант, когда вы платите."
  x1.expl: "На Was möchten Sie? отвечайте числом, напитком и bitte."
  x2.prompt: "Сколько это стоит? Запишите цену цифрами."
  x2.expl: "Neun Euro — это 9 евро."
  x3.prompt: "Соедините каждый заказ с количеством напитков."
  x3.expl: "Ein 1, zwei 2, drei 3."
  x4.prompt: "Правда или нет?"
  x4.wrong: "Это правда: Das macht … Euro означает, сколько платить."
  x4.expl: "Das macht fünf Euro: с вас пять евро."
  x5.prompt: "Дополните вежливый заказ."
  x5.r1: "Danke — благодарность; чтобы вежливо попросить, говорите bitte."
  x5.r2: "Bitte пишется с двойным t."
  x5.expl: "Bitte делает заказ вежливым."
  x6.prompt: "Вы отдаёте деньги. Что вы скажете?"
  x6.o2.fb: "Это вопрос официанта."
  x6.o3.fb: "Это заказ, а не то, что говорят при оплате."
  x6.expl: "Hier, bitte: вот, пожалуйста."
  x7.prompt: "Расставьте слова в правильном порядке."
  x7.expl: "Число, напиток, потом bitte."
  x8.prompt: "Какие предложения — вежливые заказы?"
  x8.o3.fb: "Без bitte это звучит грубо."
  x8.o4.fb: "Это цена, а не заказ."
  x8.expl: "Вежливый заказ — напиток и bitte."
  x9.prompt: "Дополните диалог."
  x9.expl: "Zwei Kaffee, bitte. – Das macht vier Euro."
  x10.prompt: "Как вы ответите?"
  x10.o2.fb: "Вы уже заказали; ответьте на благодарность."
  x10.o3.fb: "Это вопрос официанта, а не ответ на благодарность."
  x10.expl: "Bitte schön — ответ на Danke schön."
  x11.prompt: "Кофе стоит 8 евро. Напишите число словом."
  x11.r1: "Acht заканчивается на t."
  x11.r2: "В acht перед t стоит ch."
  x11.expl: "Acht Euro: восемь евро."
  x12.prompt: "Это правильно?"
  x12.wrong: "Нет: Euro не меняется после числа: sechs Euro."
  x12.expl: "Das macht sechs Euro."
  x13.prompt: "Составьте вопрос официанта."
  x13.expl: "Was möchten Sie? — что вы желаете?"
  x14.prompt: "Вы хотите один чай. Какой заказ правильный?"
  x14.o2.fb: "При счёте — eins, а перед словом — ein: ein Tee."
  x14.o3.fb: "Elf — это 11, а не один."
  x14.expl: "Ein Tee, bitte: один чай, пожалуйста."
  x15.prompt: "Запишите количество чашек кофе цифрами."
  x15.expl: "Drei Kaffee: три кофе."
  tip: "Euro не меняется после числа: ein Euro, sechs Euro. В заказе Kaffee тоже не меняется: zwei Kaffee."
