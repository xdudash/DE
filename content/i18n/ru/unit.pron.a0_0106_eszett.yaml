strings:
  title: "ß и ss"
  summary: "После долгого гласного пишут ß, после короткого — ss."
  obj: "Выбирать ß или ss по гласному перед ним."
  intro: "ß и ss звучат одинаково: это чёткое «с». Написание определяет гласный перед ними. После долгого гласного (или ei, au) пишут ß: Straße, groß, Fuß. После короткого — ss: Fluss, Wasser. В Швейцарии ß не используют: везде пишут ss (Strasse)."
  examples: "Слова с ß и ss."
  summary_block: "**Долгий гласный + ß:** Straße, groß, Fuß. **Краткий гласный + ss:** Fluss, Wasser. В Швейцарии пишут **ss** в обоих случаях."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Straße (улица): ß после долгого a."
  ex.2: "groß (большой): ß после долгого o."
  ex.3: "Fuß (нога, стопа): ß после долгого u."
  ex.4: "Fluss (река): ss после короткого u."
  ex.5: "Wasser (вода): ss после короткого a."
  ex.6: "В Швейцарии: Strasse с ss."
  x1.prompt: "Какое написание используют в Германии и Австрии?"
