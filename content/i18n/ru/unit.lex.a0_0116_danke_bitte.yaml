strings:
  title: "Danke и Bitte"
  summary: "Благодарите, просите со словом bitte и отвечайте на благодарность."
  obj: "Благодарить, вежливо просить с bitte и отвечать на благодарность."
  intro: "Danke означает «спасибо»; Danke schön и Vielen Dank — теплее. Bitte выполняет две роли: в просьбе это «пожалуйста» (Ein Wasser, bitte.), а после Danke — «пожалуйста / не за что». Bitte schön также говорят, когда что-то подают человеку."
  examples: "Благодарность и просьба в коротких сценах."
  summary_block: "**Danke**, **Danke schön**, **Vielen Dank** — благодарность. **Bitte** — «пожалуйста» в просьбе и ответ на благодарность. **Bitte schön** — когда что-то подаёте."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Спасибо!"
  ex.2: "Большое спасибо! (чуть теплее)"
  ex.3: "Большое спасибо!"
  ex.4: "Воду, пожалуйста. (заказ)"
  ex.5: "Спасибо! – Пожалуйста!"
  ex.6: "Пожалуйста, вот! (когда что-то подают)"
  x1.prompt: "Кто-то придерживает для вас дверь. Что вы скажете?"
