status: machine_draft
translator: claude (AI draft, 2026-10-12)
strings:
  title: "Порядок слов: глагол на втором месте (V2)"
  summary: "В немецком повествовательном предложении спрягаемый глагол всегда стоит на позиции 2 — что бы ни стояло первым."
  obj.identify: "Находить спрягаемый глагол в утверждении и видеть, что он стоит на позиции 2."
  obj.produce: "Строить утверждения, которые начинаются со времени, места или дополнения, сохраняя глагол на позиции 2."
  obj.position_zero: "Отличать слова, которые не занимают позицию (und, aber, oder, denn, sondern), от слов, которые занимают позицию 1 (deshalb, dann, trotzdem)."
  obj.limits: "Узнавать типы предложений, где глагол НЕ стоит на позиции 2."

  b.intro: |
    В русском языке порядок слов довольно свободный: «Сегодня я работаю дома» и «Я сегодня работаю дома» — оба варианта нормальны.
    В немецком в **утверждении** (главном предложении, которое не является вопросом или просьбой)
    действует жёсткое правило: **спрягаемый глагол** — форма, которая меняется по лицам: *ich arbeit**e***, *du arbeit**est*** —
    всегда стоит на **позиции 2**.

    На позиции 1 может стоять подлежащее, но не обязательно. Там может быть время, место, дополнение
    или другой член предложения. Если первым стоит не подлежащее, то подлежащее переходит **за** глагол.
    Сам глагол своё место не меняет.
  b.pattern.caption: "Одно предложение, три разных начала — глагол остаётся на позиции 2"
  col.p1: "Позиция 1 (один член предложения)"
  col.p2: "Позиция 2 (спрягаемый глагол)"
  col.middle: "Середина (подлежащее, дополнения, детали)"
  col.end: "Конец (остальные части глагола)"
  b.position1: |
    **Позиция 1 — это один член предложения, а не одно слово.** *Seit Mai*, *am nächsten Montag* и
    *meine neue Kollegin aus Polen* — каждое считается **одним** членом, поэтому глагол стоит сразу после него.

    На позицию 1 ставят то, что лучше всего связано с предыдущей фразой, или то, что нужно выделить:
    *Seit Mai wohne ich in Berlin.* отвечает на вопрос «с какого времени?», *In Berlin wohne ich seit Mai.* подчёркивает место.
    В нейтральной речи чаще всего начинают с подлежащего или с указания времени.

    На позицию 2 идёт только **спрягаемый** глагол. Остальные части глагола — инфинитив после модального глагола
    (*muss … gehen*), причастие (*habe … abgeschickt*) или отделяемая приставка (*rufe … an*) — уходят в **конец**
    предложения. Вместе они образуют «рамку» вокруг середины предложения.
  b.examples.title: "Примеры из повседневной жизни"
  ex.work: "Со следующей недели я работаю в Линце."
  ex.doctor: "У врача часто приходится долго ждать."
  ex.object: "Эту квартиру я считаю слишком дорогой."
  ex.object.note: "Дополнение (*diese Wohnung*) стоит на позиции 1 для акцента; подлежащее *ich* идёт после глагола."
  ex.bracket: "Сегодня курс немецкого начинается в девять часов."
  ex.bracket.note: "*anfangen* — глагол с отделяемой приставкой: *fängt* стоит на позиции 2, приставка *an* уходит в конец."
  ex.perfect: "Вчера я отправил(а) свою налоговую декларацию."
  b.contrast.title: "Сравните"
  c.emphasis: "Смысл одинаковый, начало разное. В обоих предложениях глагол *arbeite* на позиции 2; когда первым стоит *heute*, подлежащее *ich* переходит за глагол."
  c.und_deshalb: "*und* не занимает позицию, поэтому *ich* стоит на позиции 1, а *lerne* — на позиции 2. *deshalb* (поэтому) **занимает** позицию 1, поэтому глагол идёт сразу после него, а подлежащее — после глагола."
  b.position0: |
    Некоторые короткие союзы стоят **перед** позицией 1 и не считаются. Это «позиция 0»:
    **und, aber, oder, denn, sondern**.

    - *Aber **ich** habe keine Zeit.* — *aber* = позиция 0, *ich* = позиция 1, *habe* = позиция 2.

    Слова **deshalb, dann, danach, trotzdem, außerdem, leider** ведут себя иначе: это обычные члены предложения,
    и они **занимают** позицию 1.

    - *Deshalb **lerne** ich Deutsch.* / *Dann **gehen** wir nach Hause.*

    *Ja*, *nein* и обращение по имени тоже не считаются: *Ja, ich komme.* — *Anna, ich bin gleich da.*
  b.errors.title: "Типичные ошибки"
  e.v3: "После *heute* (позиция 1) сразу должен идти глагол. Если поставить подлежащее первым, как в русском, глагол окажется на позиции 3."
  e.deshalb: "*deshalb* занимает позицию 1, поэтому глагол идёт сразу за ним: *Deshalb lerne ich …*"
  e.aber: "*aber* стоит на позиции 0. Позиция 1 ещё свободна, поэтому нужен обычный член предложения, чаще всего подлежащее: *Aber ich habe …*"
  e.adverb: "Наречие не может стоять между подлежащим на позиции 1 и глаголом. Поставьте его после глагола — или начните с него предложение: *Am Wochenende koche ich oft.*"
  e.bracket: "На позиции 2 стоит только спрягаемый глагол (*will*). Инфинитив *lernen* уходит в конец."
  b.limits: |
    V2 — правило для **утверждений** (главных предложений). Другие типы предложений устроены иначе, их вы изучите в отдельных темах:

    - **Общие вопросы** (да/нет) начинаются с глагола (позиция 1): *Kommst du morgen?*
    - **Просьбы и команды** тоже начинаются с глагола: *Komm bitte morgen!*
    - **W-вопросы** сохраняют глагол на позиции 2, вопросительное слово — на позиции 1: *Wann kommst du?*
    - В **придаточных предложениях** (после *weil*, *dass*, *wenn* …) глагол уходит в **конец**: *…, weil ich keine Zeit habe.*

    В устной речи можно услышать *weil* с глаголом на позиции 2 (*weil ich habe keine Zeit*). Это разговорный вариант,
    в нормативном письменном немецком он не принят, поэтому на письме после *weil* ставьте глагол в конец.
  b.regional: "Правило V2 одинаково в Германии, Австрии и Швейцарии. Региональные различия касаются лексики, например *Im Jänner* (Австрия) вместо *Im Januar* или *das Velo* (Швейцария) вместо *das Fahrrad* — порядок слов не меняется: *Im Jänner **fahre** ich nach Graz.*"
  b.summary: |
    - В утверждении **спрягаемый глагол всегда на позиции 2**.
    - Позиция 1 — **один член предложения** (в нём может быть несколько слов): подлежащее, время, место, дополнение …
    - Если на позиции 1 не подлежащее, **подлежащее идёт сразу после глагола**.
    - Остальные части глагола (инфинитив, причастие, приставка) — в **конце**.
    - *und, aber, oder, denn, sondern* не считаются; *deshalb, dann, trotzdem* — считаются.
  b.practice.title: "Упражнения"

  fb.correct: "Верно."
  fb.incorrect: "Не совсем. Проверьте, где стоит спрягаемый глагол."
  fb.v3: "Здесь глагол на позиции 3. После первого члена предложения сразу должен идти спрягаемый глагол, затем подлежащее."
  fb.subject_adverb: "Между подлежащим на позиции 1 и глаголом ничего не может стоять. Поставьте *morgen* после глагола или в начало."
  fb.bracket: "На позиции 2 только спрягаемый глагол (*muss*). Инфинитив *bezahlen* стоит в самом конце."
  fb.separable: "*anrufen* — глагол с отделяемой приставкой: *rufe* на позиции 2, а *an* — в самом конце предложения."
  fb.position_zero: "*aber* не занимает позицию. После *aber* всё равно нужна позиция 1 (например, *ich*), а затем глагол."
  fb.connective: "*deshalb* занимает позицию 1, поэтому глагол идёт сразу за ним: *Deshalb nehme ich …*"

  x.choose_correct.prompt: "Какое предложение правильное?"
  x.choose_correct.a: "*heute* стоит на позиции 1, значит, дальше должен идти глагол, а не подлежащее."
  x.choose_correct.c: "Здесь глагол на позиции 3. *frei* ставится после подлежащего."
  x.choose_correct.d: "Утверждение не начинается с глагола. С глаголом в начале фраза звучит как общий вопрос — и *heute ich* после него невозможно."
  x.choose_correct.explanation: "*Heute* занимает позицию 1, спрягаемый глагол *habe* — позицию 2, подлежащее *ich* идёт после глагола."

  x.position2.prompt: "Какое слово стоит на позиции 2 в этом предложении?"
  x.position2.a: "*Seit drei Jahren* — один член предложения (обстоятельство времени), он целиком занимает позицию 1."
  x.position2.b: "*Jahren* ещё входит в первый член предложения *Seit drei Jahren*."
  x.position2.d: "*meine Schwester* — подлежащее. Оно стоит после глагола, потому что позиция 1 уже занята."
  x.position2.explanation: "*Seit drei Jahren* — один член на позиции 1, поэтому спрягаемый глагол *wohnt* стоит на позиции 2."

  x.order_vienna.prompt: "Составьте утверждение: «Завтра я еду в Вену». Попробуйте начать с *morgen*."
  x.order_vienna.explanation: "Возможны варианты: *Morgen fahre ich nach Wien.* / *Ich fahre morgen nach Wien.* / *Nach Wien fahre ich morgen.* Везде *fahre* стоит на позиции 2."

  x.order_rent.prompt: "Составьте утверждение: «В понедельник я должен(-на) заплатить за квартиру»."
  x.order_rent.explanation: "*muss* на позиции 2, инфинитив *bezahlen* в конце. На позиции 1 может быть *am Montag*, *ich* или *die Miete*."

  x.order_call.prompt: "Составьте утверждение: «Сегодня я позвоню своей арендодательнице». (*anrufen* = звонить)"
  x.order_call.explanation: "*rufe* на позиции 2, отделяемая приставка *an* — в конце: *Heute rufe ich meine Vermieterin an.*"

  x.cloze_deshalb.prompt: "Вставьте *ich* и *lerne* в правильном порядке."
  x.cloze_deshalb.gap0_subject: "*Deshalb* уже занимает позицию 1, значит, на позиции 2 должен стоять глагол."
  x.cloze_deshalb.gap1_verb: "Здесь глагол должен стоять перед подлежащим, потому что *deshalb* занимает позицию 1."
  x.cloze_deshalb.explanation: "*Deshalb* — позиция 1 → *lerne* (позиция 2) → *ich*."

  x.transform_evening.prompt: "Перепишите предложение так, чтобы оно начиналось с *Heute Abend*."
  x.transform_evening.subject: "Подлежащее *ich* идёт сразу после глагола, перед остальной частью предложения."
  x.transform_evening.explanation: "*Heute Abend* (позиция 1) → *gehe* (позиция 2) → *ich* → *ins Kino*."

  x.transform_aber.prompt: "Добавьте *aber* в начало предложения."
  x.transform_aber.explanation: "*aber* стоит на позиции 0. Позиция 1 остаётся прежней (*ich*), *habe* остаётся на позиции 2. Можно сказать и так: *Aber heute habe ich keine Zeit.*"

  x.transform_deshalb.prompt: "Соедините два предложения с помощью *deshalb*: второе предложение — следствие."
  x.transform_deshalb.explanation: "*Deshalb* занимает позицию 1 во втором предложении, поэтому глагол *nehme* идёт сразу за ним: *Deshalb nehme ich ein Taxi.*"

  x.limits.prompt: "Все эти предложения правильные. В каком из них глагол НЕ на позиции 2?"
  x.limits.a: "*Morgen* на позиции 1, *komme* на позиции 2 — это обычное утверждение с V2."
  x.limits.c: "В W-вопросе вопросительное слово занимает позицию 1, а глагол стоит на позиции 2."
  x.limits.d: "*Ich* на позиции 1, *komme* на позиции 2."
  x.limits.explanation: "Общий вопрос (да/нет) начинается с глагола (позиция 1): *Kommst du morgen?*"

  # Interactive categorisation exercise: sort chunks by V2 sentence role.
  x.categorize_v2.prompt: "Распределите части предложения «Heute arbeite ich von zu Hause.» по их роли в предложении."
  x.categorize_v2.category.first: "Позиция 1 · первый элемент"
  x.categorize_v2.category.verb: "Позиция 2 · спрягаемый глагол"
  x.categorize_v2.category.middle: "Середина · подлежащее или детали"
  x.categorize_v2.item.verb: "Спрягаемый глагол остаётся на позиции 2, сразу после первого элемента."
  x.categorize_v2.explanation: "Heute — первый элемент, arbeite — спрягаемый глагол на позиции 2, а ich von zu Hause стоят в середине."

  x.listening_v2.prompt: "Прослушайте предложение и выберите его значение."
  x.listening_v2.a: "Сегодня я работаю из дома."
  x.listening_v2.b: "Завтра я работаю дома."
  x.listening_v2.b.feedback: "*Heute* означает «сегодня», а не «завтра»."
  x.listening_v2.c: "Я работаю из дома каждый день."
  x.listening_v2.c.feedback: "В предложении сказано *heute* («сегодня»), а не «каждый день»."
  x.listening_v2.explanation: "*Heute* — первый элемент, а *arbeite*, спрягаемый глагол, стоит на позиции 2."
  x.dictation_monday.prompt: "Прослушайте и запишите предложение полностью на немецком."
  x.dictation_monday.explanation: "*Am Montag* — первый элемент, *fahre* — спрягаемый глагол на позиции 2, за ним следует *ich*."
  x.correct_v2.prompt: "Перепишите предложение, исправив порядок слов."
  x.correct_v2.verb: "После первого элемента *Heute* поставьте спрягаемый глагол *arbeite* перед подлежащим."
  x.correct_v2.explanation: "*Heute* занимает позицию 1, *arbeite* — спрягаемый глагол на позиции 2, затем идёт *ich*."
