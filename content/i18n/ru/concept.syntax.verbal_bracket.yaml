strings:
  title: Глагольная рамка (Satzklammer)
  summary: Инфинитив после модального глагола, причастие в Perfekt и отделяемые приставки уходят в конец предложения.
  pattern.scope: "В главном предложении спрягаемый глагол стоит на втором месте, а неспрягаемая часть сказуемого замыкает рамку в конце."
  pattern.limits: "Это обзор инфинитива после модального глагола, причастия Perfekt и отделяемых приставок; придаточные предложения и сложные цепочки глаголов изучаются позднее."
  ex.modal: "Я могу сегодня остаться подольше."
  ex.perfect: "Мы поехали на поезде."
  ex.separable: "Она звонит своей маме."
