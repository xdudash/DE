strings:
  title: "Долгие и краткие a, e, i"
  summary: "Буквы после гласной показывают, долгая она или краткая."
  obj: "Различать долгие и краткие a, e, i по написанию слова."
  intro: "Немецкие гласные бывают долгими и краткими, и написание обычно это показывает. Гласная перед удвоенной согласной (nn, tt) или двумя согласными (tz, nd) обычно краткая: Mann, Bett, Kind. Гласная перед одной согласной, а также с h, удвоенной гласной или ie обычно долгая: Tag, Zahl, Tee, Tier."
  examples: "Долгие и краткие гласные в словах."
  summary_block: "**Удвоенная согласная или две согласные:** краткая гласная (Mann, Bett, Kind). **Одна согласная, h, удвоенная гласная или ie:** долгая гласная (Tag, Zahl, Tee, Tier)."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "день: долгое a, после него одно g"
  ex.2: "мужчина: краткое a, удвоенное n"
  ex.3: "число: долгое a, отмечено h"
  ex.4: "чай: долгое e, пишется ee"
  ex.5: "кровать: краткое e, удвоенное t"
  ex.6: "животное: долгое i, пишется ie"
  ex.7: "ребёнок: краткое i, две согласные nd"
  ex.8: "имя: долгое a, одно m"
  x1.prompt: "В каком слове долгое a?"
  x1.o2.fb: "В Mann после a стоит nn, поэтому a краткое."
  x1.o3.fb: "В Platz после a стоит tz, поэтому a краткое."
  x1.expl: "В Tag после a одна согласная, поэтому a долгое."
  x2.prompt: "Напишите слово «мужчина»: краткое a, удвоенное n."
  x2.r1: "С одним n man — другое слово. «Мужчина» — Mann, с nn для краткого a."
  x2.expl: "Mann: удвоенное n показывает краткое a."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Это правда: в Bett после e стоит tt, поэтому e краткое."
  x3.expl: "Удвоенная согласная после гласной делает её краткой."
  x4.prompt: "Соедините каждое слово с его гласной."
  x4.expl: "nn и tt — кратко. Одна согласная или ee — долго."
  x5.prompt: "В каких словах краткая гласная?"
  x5.o4.fb: "Tier пишется с ie, а ie — это долгое i."
  x5.o5.fb: "В Name после a одно m, поэтому a долгое."
  x5.expl: "В Mann, Bett и Kind после гласной удвоенная согласная или две согласные."
  x6.prompt: "Дополните слово «кровать»."
  x6.r1: "С одним t e было бы долгим. В Bett краткое e, поэтому нужно tt."
  x6.expl: "Bett: tt после краткого e."
  x7.prompt: "Одногруппник спрашивает вас. Что вы ответите?"
  x7.o2.fb: "В Name после a только одно m, поэтому a долгое."
  x7.o3.fb: "Name пишется N-a-m-e: там есть a."
  x7.expl: "Lang означает «долгий»: после a одна согласная."
  x8.prompt: "Краткие гласные: дополните каждое слово удвоенной согласной."
  x8.expl: "Mann, Bitte и Wetter: удвоенная согласная показывает краткую гласную."
  x9.prompt: "Это правильно?"
  x9.wrong: "Tier пишется с ie, а ie — всегда долгое i."
  x9.expl: "ie обозначает долгое i."
  x10.prompt: "Напишите слово «чай»: долгое e, два e."
  x10.r1: "В Tee удвоенное e: долгое e пишется ee."
  x10.r2: "Tea — по-английски. По-немецки Tee."
  x10.expl: "Tee: ee — долгое e."
  x11.prompt: "В каком слове краткое i?"
  x11.o2.fb: "В Kino после i одно n, поэтому i долгое."
  x11.o3.fb: "В Tier ie, а это долгое i."
  x11.expl: "В Kind после i стоит nd, поэтому i краткое."
  x12.prompt: "Дополните словом «чай» (долгое e)."
  x12.r1: "Долгое e пишется ee: Tee."
  x12.expl: "Ich trinke Tee означает «я пью чай»."
  x13.prompt: "В каких словах долгая гласная?"
  x13.o4.fb: "В Mann nn, поэтому a краткое."
  x13.o5.fb: "В Bitte tt, поэтому i краткое."
  x13.expl: "В Name одна согласная, в Tee — ee, в Tier — ie: все долгие."
  x14.prompt: "Напишите по буквам слово «имя» (долгое a)."
  x14.r1: "В Name нет h: N-a-m-e. Одно m уже показывает долгое a."
  x14.r2: "С mm a было бы кратким. В Name одно m."
  x14.expl: "Name: одно m после долгого a."
  x15.prompt: "В каком слове долгое a отмечено h?"
  x15.o2.fb: "В Stadt после a стоит dt, поэтому a краткое, и h нет."
  x15.o3.fb: "В Katze после a tz, поэтому a краткое."
  x15.expl: "Zahl: h после a обозначает, что она долгая."
  tip: "В упражнениях lang означает «долгий», kurz — «краткий». Правило говорит «обычно»: несколько коротких слов его нарушают."
