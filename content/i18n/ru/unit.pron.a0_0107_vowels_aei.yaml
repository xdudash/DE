strings:
  title: "Долгие и краткие a, e, i"
  summary: "Буквы после гласной обычно показывают, долгая она или краткая."
  obj: "Различать долгие и краткие a, e, i по написанию слова."
  intro: "Немецкие гласные бывают долгими и краткими, и долгота может изменить слово: в Bett (кровать) краткое e, а в Beet (грядка) — долгое. В русском долгота гласных слова не различает, поэтому на неё стоит обращать внимание отдельно. Гласная перед удвоенной согласной (nn, tt) или двумя согласными (tz, nd) обычно краткая: Mann, Bett, Kind. Гласная перед одной согласной, а также с h, удвоенной гласной или ie обычно долгая: Tag, Zahl, Tee, Tier."
  examples: "Долгие и краткие гласные в словах."
  summary_block: "**Удвоенная согласная или две согласные:** обычно краткая гласная (Mann, Bett, Kind). **Одна согласная, h, удвоенная гласная или ie:** обычно долгая гласная (Tag, Zahl, Tee, Tier). **Исключения:** короткие слова вроде mit, das."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "день: долгое a, после него одно g (g в конце звучит как k)"
  ex.2: "мужчина: краткое a, удвоенное n"
  ex.3: "число: долгое a, отмечено h"
  ex.4: "чай: долгое e, пишется ee"
  ex.5: "кровать: краткое e, удвоенное t"
  ex.6: "животное: долгое i, пишется ie"
  ex.7: "ребёнок: краткое i, две согласные nd (d в конце звучит как t)"
  ex.8: "имя: долгое a, одно m"
  ex.9: "Я пью чай."
  ex.10: "Меня зовут Том."
  x1.prompt: "В каком слове долгое a?"
  x1.o2.fb: "В Mann после a стоит nn, поэтому a краткое."
  x1.o3.fb: "В Platz после a стоит tz, поэтому a краткое."
  x1.expl: "В Tag после a одна согласная, поэтому a долгое."
  x2.prompt: "Соедините каждое слово с его гласной (kurz — краткая, lang — долгая)."
  x2.expl: "nn и nd — кратко. Одно m и ie — долго."
  x3.prompt: "Правда или нет? (kurz — краткий)"
  x3.wrong: "Это верно: в Bett после e стоит tt, поэтому e краткое."
  x3.expl: "Удвоенная согласная после гласной обычно делает её краткой."
  x4.prompt: "Дополните слово «кровать». (Кровать новая.)"
  x4.r1: "С одним t e было бы долгим. В Bett краткое e, поэтому нужно tt."
  x4.r2: "Beet — это грядка, с долгим e. Кровать — Bett, с tt."
  x4.expl: "Bett: tt после краткого e."
  x5.prompt: "В каких словах краткая гласная?"
  x5.o4.fb: "Tier пишется с ie, а ie — это долгое i."
  x5.o5.fb: "В Name после a одно m, поэтому a долгое."
  x5.expl: "В Mann, Bett и Kind после гласной удвоенная согласная или две согласные."
  x6.prompt: "Напишите немецкое слово «чай»."
  x6.r1: "В Tee удвоенное e: долгое e пишется ee."
  x6.r2: "Tea — по-английски. По-немецки Tee."
  x6.expl: "Tee: ee — долгое e."
  x7.prompt: "Одногруппник спрашивает (Wie heißt das auf Deutsch? — Как это по-немецки?). Что вы ответите?"
  x7.o2.fb: "Без e долгое i не обозначено. Животное — Tier."
  x7.o3.fb: "Tür — это дверь. Животное — Tier, с ie."
  x7.expl: "das Tier: T-i-e-r, долгое i."
  x8.prompt: "Составьте предложение «Я пью чай»."
  x8.expl: "Ich trinke Tee: долгое e в Tee пишется ee."
  x9.prompt: "Какое из двух слов имеет долгое e?"
  x9.o2.fb: "В Bett tt, поэтому его e краткое."
  x9.o3: "оба"
  x9.o3.fb: "Только в Beet ee. В Bett краткое e."
  x9.expl: "Beet (грядка) и Bett (кровать) различаются только долготой e."
  x10.prompt: "Исправьте ошибку в написании."
  x10.expl: "В Name нет h: одно m уже показывает долгое a. В Zahl есть h, в Name — нет."
  x11.prompt: "Это правильно? (lang — долгий)"
  x11.wrong: "mit — короткое слово с кратким i, исключение из правила одной согласной."
  x11.expl: "Короткие слова вроде mit и das обычно имеют краткую гласную."
  x12.prompt: "Краткие гласные: дополните каждое слово."
  x12.expl: "Katze (кошка), Mitte (середина), Wetter (погода): согласные после гласной показывают, что она краткая."
  x13.prompt: "Какое написание слова «ребёнок» правильное?"
  x13.o2.fb: "В конце слышно t, но слово пишется с d: Kind."
  x13.o3.fb: "ie сделало бы i долгим. В Kind краткое i."
  x13.expl: "das Kind: краткое i перед nd; d звучит как t."
  x14.prompt: "Одногруппник говорит это (ich glaube — я думаю). Что вы ответите?"
  x14.o2.fb: "В Mann после a стоит nn, поэтому a краткое."
  x14.o3.fb: "В Name одно m и долгое a; в Mann nn и краткое a."
  x14.expl: "Nein — нет: удвоенное n показывает краткое a."
  x15.prompt: "Дополните слово «число»."
  x15.r1: "Zal — такого слова нет. Долгое a в Zahl отмечено h."
  x15.r2: "ll сделало бы a кратким. В Zahl долгое a, отмеченное h."
  x15.expl: "die Zahl: h после a обозначает долгое a."
  tip: "lang — долгий, kurz — краткий. Правило говорит «обычно»: короткие слова вроде mit и das имеют краткую гласную даже с одной согласной."
