strings:
  title: "Числа от 0 до 5"
  summary: "От нуля до пяти: для комнат, автобусов, цен и номеров телефонов."
  obj: "Называть, читать и писать числа от 0 до 5."
  intro: "Первые числа — null, eins, zwei, drei, vier, fünf. Вы слышите их каждый день: номер комнаты, номер автобуса, цена. Числа пишутся со строчной буквы."
  examples: "Числа в повседневных фразах."
  summary_block: "**null 0 · eins 1 · zwei 2 · drei 3 · vier 4 · fünf 5**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "0, 1, 2: счёт от нуля."
  ex.2: "комната три"
  ex.3: "автобус номер четыре"
  ex.4: "пять евро. В fünf есть ü."
  ex.5: "один или два?"
  x1.prompt: "Какое слово означает число 0?"
  x1.o2.fb: "Eins — это 1, первое число после null."
  x1.o3.fb: "Zwei — это 2."
  x1.expl: "Null — это 0. Оно нужно для номеров телефонов."
  x2.prompt: "Запишите число цифрами."
  x2.expl: "Drei — это 3."
  x3.prompt: "Соедините каждое слово с цифрой."
  x3.expl: "Null, eins, zwei, drei: 0, 1, 2, 3."
  x4.prompt: "Правда или нет?"
  x4.wrong: "Это правда: fünf — это 5."
  x4.expl: "Fünf — это 5; помните про ü."
  x5.prompt: "Напишите число 4 словом."
  x5.r1: "Vier пишется с v, хотя звучит как f."
  x5.r2: "В vier есть ie: долгое i."
  x5.expl: "Vier: v в начале, ie в середине."
  x6.prompt: "Какие слова — числа от 0 до 5?"
  x6.o4.fb: "Zimmer означает «комната»; это не число."
  x6.expl: "Null, eins и fünf — числа; Zimmer — существительное."
  x7.prompt: "Составьте фразу «автобус номер два»."
  x7.expl: "Bus Nummer zwei: число стоит после Nummer."
  x8.prompt: "Что дальше?"
  x8.o2.fb: "После zwei идёт drei; fünf — позже."
  x8.o3.fb: "Null стоит перед eins, а не после zwei."
  x8.expl: "Eins, zwei, drei: 1, 2, 3."
  x9.prompt: "Впишите пропущенные числа."
  x9.expl: "Пропущенные числа: zwei (2) и vier (4)."
  x10.prompt: "Вы едете на автобусе 5. Какой это автобус?"
  x10.o2.fb: "Vier — это 4, а не 5."
  x10.o3.fb: "Zwei — это 2, а не 5."
  x10.expl: "Fünf — это 5."
  x11.prompt: "Какая цифра соответствует этому слову?"
  x11.expl: "Fünf — это 5."
  x12.prompt: "Это правильно?"
  x12.wrong: "Нет: eins — это 1, а zwei — 2."
  x12.expl: "Eins — это 1."
  x13.prompt: "Напишите номер комнаты словом."
  x13.r1: "Звук «ай» пишется ei: drei."
  x13.r2: "Внутри фразы числа пишут со строчной буквы: Zimmer drei."
  x13.expl: "Zimmer drei: комната три."
  x14.prompt: "Соедините комнату с её номером."
  x14.expl: "Zimmer vier — 4, Zimmer fünf — 5, Zimmer eins — 1."
  x15.prompt: "Напишите число 5 словом."
  x15.r1: "В fünf есть ü с двумя точками."
  x15.r2: "Fünf заканчивается на f."
  x15.expl: "Fünf: f, ü, n, f."
  x16.prompt: "Какие из этих чисел меньше, чем drei?"
  x16.o4.fb: "Vier — это 4, больше 3."
  x16.expl: "Null, eins и zwei — 0, 1 и 2: все меньше 3."
  tip: "Vier начинается с v, но звучит как f. По телефону часто говорят zwo вместо zwei, чтобы не спутать с drei."
