strings:
  title: "Числа от 0 до 5"
  summary: "От нуля до пяти: для комнат, автобусов, цен и номеров телефонов."
  obj: "Называть, читать и писать числа от 0 до 5 и использовать их для комнат, автобусов, цен и номеров телефонов."
  intro: "Первые числа — null, eins, zwei, drei, vier, fünf. Вы слышите их каждый день: номер комнаты, номер автобуса, цена, номер телефона. Числительные пишут со строчной буквы, кроме начала предложения. Телефонные номера обычно читают по одной цифре: null – eins – fünf – zwei."
  examples: "Числа в повседневных фразах."
  summary_block: "**null 0 · eins 1 · zwei 2 · drei 3 · vier 4 · fünf 5**. Телефонные номера — по одной цифре."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "0, 1, 2: счёт от нуля."
  ex.2: "комната три. Welches Zimmer? = какая комната?"
  ex.3: "автобус номер четыре"
  ex.4: "пять евро. Euro не меняется после числа."
  ex.5: "номер телефона, по одной цифре. Ihre Nummer? = ваш номер?"
  x1.prompt: "Соедините каждое слово с цифрой."
  x1.expl: "Null 0, eins 1, zwei 2, drei 3, vier 4, fünf 5."
  x2.prompt: "На табличке на остановке — 4. Как это сказать?"
  x2.o2.fb: "Fünf — это 5. Vier тоже начинается со звука f, но пишется с v и означает 4."
  x2.o3.fb: "Drei — это 3."
  x2.expl: "Vier — это 4: Bus Nummer vier."
  x3.prompt: "Напишите число 4 словом."
  x3.r1: "Vier пишется с v, хотя начинается со звука f."
  x3.r2: "В vier в середине ie: v-ie-r."
  x3.expl: "Vier: v, ie, r."
  x4.prompt: "Правда или нет? (klingt = звучит, am Anfang = в начале)"
  x4.wrong: "Это верно: vier пишется с v, но начинается со звука f."
  x4.expl: "В немецких словах v обычно звучит как f: vier, Vater."
  x5.prompt: "Впишите пропущенные числа."
  x5.expl: "Счёт: null, eins, zwei, drei, vier, fünf."
  x6.prompt: "Какие из этих чисел меньше, чем drei?"
  x6.o4.fb: "Vier — это 4, больше 3."
  x6.expl: "Null, eins и zwei — 0, 1 и 2: все меньше 3."
  x7.prompt: "Составьте фразу «комната номер четыре»."
  x7.expl: "Zimmer Nummer vier: число стоит в конце."
  x8.prompt: "На ценнике 3 €. Как это прочитать?"
  x8.o2.fb: "Euro не меняется после числа: drei Euro."
  x8.o3.fb: "Zwei — это 2, а на ценнике 3."
  x8.expl: "3 € = drei Euro."
  x9.prompt: "Напишите номер автобуса словом."
  x9.r1: "Звук «ай» пишется ei: zwei."
  x9.r2: "Zwo говорят по телефону; на письме — zwei."
  x9.expl: "Bus Nummer zwei: автобус номер два."
  x10.prompt: "Какие числительные пишутся с ei?"
  x10.o4.fb: "В vier — ie, а не ei: ie — долгое i, ei звучит как «ай»."
  x10.expl: "В eins, zwei, drei — ei; в vier — ie."
  x11.prompt: "Это правильно?"
  x11.wrong: "Это верно: 4 + 1 = 5."
  x11.expl: "Vier (4) + eins (1) = fünf (5)."
  x12.prompt: "Кто-то диктует номер телефона. Запишите его цифрами."
  x12.expl: "Null eins fünf zwei: 0152."
  x13.prompt: "Ваш номер — 0 1 5 2. Ответьте на вопрос."
  x13.o2.fb: "Vier — это 4; в вашем номере 5: fünf."
  x13.o3.fb: "Порядок неверный: ваш номер начинается с null."
  x13.expl: "Номер телефона читают по одной цифре, по порядку."
  x14.prompt: "Напишите этот номер телефона словами."
  x14.expl: "0 3 4: null drei vier."
  x15.prompt: "На вашем ключе — 5. Ответьте на вопрос."
  x15.o2.fb: "Vier — это 4, а на ключе 5."
  x15.o3.fb: "Eins — это 1, а на ключе 5."
  x15.expl: "Fünf — это 5: Zimmer fünf."
  tip: "Vier пишется с v, но начинается со звука f. Zwei начинается с «цв». По телефону часто говорят zwo вместо zwei, чтобы не спутать с drei."
