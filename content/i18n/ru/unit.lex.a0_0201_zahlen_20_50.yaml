strings:
  title: "Числа от 20 до 50"
  summary: "Десятки от 20 до 50 и числа вроде einundzwanzig."
  obj: "Читать, произносить и писать числа от 20 до 50."
  intro: "Десятки: zwanzig (20), dreißig (30), vierzig (40) и fünfzig (50). Большинство заканчивается на -zig; dreißig — исключение, пишется с ß. В стандартном немецком в Германии окончание -zig произносят как -цих (ch как в ich); на юге, в Австрии и Швейцарии обычно слышно -цик. Числа между десятками пишутся одним словом, и единицы идут первыми: einundzwanzig — это ein + und + zwanzig, 21. По-русски наоборот: «двадцать один» — сначала десятки."
  examples: "Числа в повседневной жизни."
  summary_block: "**zwanzig 20 · dreißig 30 · vierzig 40 · fünfzig 50.** Между ними: единицы + **und** + десятки, одним словом: **einundzwanzig 21**, **fünfunddreißig 35**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "двадцать евро"
  ex.2: "автобус номер тридцать"
  ex.3: "сорок минут"
  ex.4: "пятьдесят центов"
  ex.5: "двадцать один: ein + und + zwanzig, одним словом"
  ex.6: "Сколько тебе лет? – Мне тридцать три."
  ex.7: "Сорок больше, чем тридцать (mehr als = больше, чем)."
  x1.prompt: "Соедините слова с числами."
  x1.expl: "Это четыре десятка этого урока."
  x2.prompt: "13 или 30? Какое слово означает 30?"
  x2.o2.fb: "Dreizehn — это 13: drei + zehn. Десятки заканчиваются на -zig, а 30 — на -ßig."
  x2.o3.fb: "Drei — это 3."
  x2.expl: "-zehn — это 13–19; -zig и -ßig — десятки."
  x3.prompt: "Напишите это число словом."
  x3.r1: "Fünfzehn — это 15. 50 — fünfzig."
  x3.r2: "В fünfzig есть ü: f-ü-n-f-z-i-g (или ue, если нет ü)."
  x3.expl: "Fünf + -zig: fünfzig."
  x4.prompt: "Какие из этих слов заканчиваются на -zig?"
  x4.o4.fb: "Dreißig — исключение: заканчивается на -ßig."
  x4.o5.fb: "Vierzehn (14) заканчивается на -zehn."
  x4.expl: "Zwanzig, vierzig и fünfzig — на -zig; dreißig — на -ßig."
  x5.prompt: "Дополните число 21."
  x5.r1: "Перед und eins теряет s: einundzwanzig."
  x5.r2: "Zwei даст zweiundzwanzig, 22."
  x5.expl: "21 = ein + und + zwanzig."
  x6.prompt: "Правда или нет?"
  x6.wrong: "Это верно: 20 + 10 = 30."
  x6.expl: "Zwanzig 20, zehn 10, dreißig 30."
  x7.prompt: "Расставьте слова: номер автобуса."
  x7.expl: "Сначала Bus, потом Nummer, потом число."
  x8.prompt: "Как обычно произносят конец слова „zwanzig“ в Германии?"
  x8.o1: "-цих, с ch как в ich"
  x8.o2: "-циг, с g как в слове «гол»"
  x8.o2.fb: "Звонкое g в конце не произносят. В Германии слышно -цих; на юге, в Австрии и Швейцарии обычно -цик."
  x8.expl: "Пишем -zig, произносим -цих в Германии (-цик на юге, в Австрии, Швейцарии)."
  x9.prompt: "Запишите это число цифрами."
  x9.r1: "В слове единицы первыми: sieben (7) и vierzig (40) — это 47."
  x9.expl: "Sieben + und + vierzig = 47."
  x10.prompt: "Выберите правильный ответ."
  x10.o2.fb: "По-немецки единицы первыми: dreiunddreißig, одним словом."
  x10.o3.fb: "Euro — для цен; о возрасте говорите Ich bin + число."
  x10.expl: "Wie alt bist du? – Ich bin + число."
  x11.prompt: "Напишите число словами."
  x11.r1: "Единицы первыми: drei + und + dreißig."
  x11.r2: "Пишите одним словом: dreiunddreißig."
  x11.expl: "33 = drei + und + dreißig, одним словом."
  x12.prompt: "Какое слово означает 35?"
  x12.o2.fb: "Dreiundfünfzig — это 53: части переставлены. 35 — fünf + und + dreißig."
  x12.o3.fb: "По-немецки единицы первыми: fünfunddreißig."
  x12.expl: "Fünf (5) + und + dreißig (30)."
  x13.prompt: "Напишите числа словами."
  x13.expl: "Vierzig Euro und zwanzig Cent: 40 евро 20 центов."
  x14.prompt: "Правда или нет? (mehr als = больше, чем)"
  x14.wrong: "Нет: vierzig — 40, fünfzig — 50, значит, vierzig меньше."
  x14.expl: "40 меньше 50."
  x15.prompt: "Какие числа больше 30?"
  x15.o3.fb: "Neunundzwanzig — это 29, чуть меньше 30."
  x15.o4.fb: "Dreizehn — это 13."
  x15.expl: "Einunddreißig — 31, vierzig — 40."
  tip: "Сначала единицы, потом und, потом десятки: 34 = vierunddreißig, то есть «четыре и тридцать». Eins перед und становится ein: einundzwanzig. Типичная ошибка русскоязычных — dreißigvier по образцу «тридцать четыре»."
