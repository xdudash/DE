strings:
  title: "Числа от 20 до 50"
  summary: "Десятки от 20 до 50 и числа вроде einundzwanzig."
  obj: "Читать и писать числа от 20 до 50."
  intro: "Десятки: zwanzig (20), dreißig (30), vierzig (40) и fünfzig (50). Большинство заканчивается на -zig; dreißig — исключение, пишется с ß. Числа между ними пишутся одним словом, и единицы идут первыми: einundzwanzig — это ein + und + zwanzig, 21."
  examples: "Числа в повседневной жизни."
  summary_block: "**zwanzig 20 · dreißig 30 · vierzig 40 · fünfzig 50.** Между ними: единицы + **und** + десятки, одним словом: **einundzwanzig 21**, **fünfunddreißig 35**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "двадцать евро"
  ex.2: "автобус номер тридцать"
  ex.3: "сорок минут"
  ex.4: "пятьдесят центов"
  ex.5: "двадцать один: ein + und + zwanzig, одним словом"
  ex.6: "Сколько тебе лет? – Мне тридцать три."
  x1.prompt: "Как сказать 30?"
  x1.o2.fb: "Dreizehn — это 13: drei + zehn. 30 — dreißig."
  x1.o3.fb: "Слова dreizig нет: 30 — исключение, dreißig с ß."
  x1.expl: "Dreißig — единственный десяток, который заканчивается на -ßig."
  x2.prompt: "Запишите число цифрами: vierzig."
  x2.r1: "14 — это vierzehn. Vierzig заканчивается на -zig, значит, это десяток: 40."
  x2.expl: "Vierzig — четыре десятка: 40."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Это правильно: ein + und + zwanzig = 21."
  x3.expl: "Единицы первыми: ein (1) и zwanzig (20)."
  x4.prompt: "Соедините слова с числами."
  x4.expl: "Это четыре десятка этого урока."
  x5.prompt: "Какие из этих чисел больше 30?"
  x5.o4.fb: "Zwanzig — это 20, меньше 30."
  x5.o5.fb: "Dreizehn — это 13, а не 30."
  x5.expl: "Vierzig — 40, fünfzig — 50, einunddreißig — 31."
  x6.prompt: "Напишите 50 словом."
  x6.r1: "Fünfzehn — это 15. 50 — fünfzig."
  x6.r2: "В fünfzig есть ü: f-ü-n-f-z-i-g."
  x6.expl: "Fünf + -zig: fünfzig."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Uhr — это время суток, а спрашивают цену."
  x7.o3.fb: "Это приветствие, а не цена."
  x7.expl: "Was kostet das? спрашивает цену: число и Euro."
  x8.prompt: "Расставьте слова в правильном порядке."
  x8.expl: "Глагол kostet на втором месте: Das kostet dreißig Euro."
  x9.prompt: "Это правильно?"
  x9.wrong: "Нет: vierundzwanzig — это 24, vier (4) + zwanzig (20). 42 — zweiundvierzig."
  x9.expl: "Единицы слышны первыми, но цифрами десятки пишут первыми: 24."
  x10.prompt: "Дополните число 21."
  x10.r1: "Перед und eins теряет s: einundzwanzig."
  x10.r2: "Zwei даст zweiundzwanzig, 22."
  x10.expl: "21 = ein + und + zwanzig."
  x11.prompt: "Какое слово означает 35?"
  x11.o2.fb: "Dreiundfünfzig — это 53. Единицы первыми, поэтому 35 — fünf + und + dreißig."
  x11.o3.fb: "Fünfzehn — это 15."
  x11.expl: "Fünf (5) + und + dreißig (30)."
  x12.prompt: "Какое это число? Запишите цифрами: siebenundvierzig."
  x12.r1: "В слове единицы первыми: sieben (7) и vierzig (40) — это 47."
  x12.expl: "Sieben + und + vierzig = 47."
  x13.prompt: "Какие слова означают число между 20 и 30?"
  x13.o3.fb: "Zweiunddreißig — это 32, больше 30."
  x13.o4.fb: "Zwölf — это 12."
  x13.expl: "Einundzwanzig — 21, achtundzwanzig — 28."
  x14.prompt: "Дополните примеры."
  x14.expl: "10 + 20 = 30 и 20 + 20 = 40."
  x15.prompt: "Как вы ответите?"
  x15.o2.fb: "Euro — для цен; о возрасте говорят только число."
  x15.o3.fb: "Uhr — для времени суток, а спрашивают возраст."
  x15.expl: "Wie alt bist du? – Ich bin + число."
  tip: "Сначала единицы, потом und, потом десятки: 34 = vierunddreißig. Eins перед und становится ein: einundzwanzig."
