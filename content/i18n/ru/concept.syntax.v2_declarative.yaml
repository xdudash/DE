strings:
  title: "Глагол на втором месте (V2) в повествовательном предложении"
  summary: "В немецком повествовательном главном предложении спрягаемый глагол стоит на позиции 2; перед ним — ровно один член предложения."
  rel.v1: "В общих вопросах (да/нет) спрягаемый глагол стоит на позиции 1."
  rel.imperative: "В повелительном наклонении глагол стоит на позиции 1."
  rel.verb_final: "В придаточных предложениях спрягаемый глагол стоит в конце."
  rel.bracket: "Неспрягаемые части глагола уходят в конец и образуют рамку с глаголом на позиции 2."
  rel.position_zero: "und, aber, oder, denn, sondern стоят перед позицией 1."
  rel.connective: "deshalb, trotzdem, dann … занимают позицию 1 и вызывают инверсию."
  rel.w_questions: "W-вопросы тоже V2: вопросительное слово на позиции 1."
  pattern.scope: "Повествовательные главные предложения, в том числе второе предложение после und/aber/oder/denn/sondern, а также W-вопросы."
  pattern.limits: "Не действует в общих вопросах и повелительных предложениях (глагол первый) и в придаточных (глагол последний). Разговорное weil + V2 не является нормой письменной речи."
  ex.subject_first: "Я живу в Берлине с мая."
  ex.time_first: "С мая я живу в Берлине."
  ex.object_first: "Договор я подпишу завтра."
  ex.object_first.note: "Дополнение на позиции 1 — для акцента или противопоставления."
  ex.modal: "В понедельник мне нужно сходить в Bürgeramt (городскую службу регистрации)."
  err.v3_adverbial: "Перенос порядка слов из родного языка: подлежащее ставится перед глаголом после обстоятельства в начале — глагол оказывается на позиции 3."
  err.subject_adverb_verb: "Наречие между подлежащим и глаголом сдвигает глагол на позицию 3."
