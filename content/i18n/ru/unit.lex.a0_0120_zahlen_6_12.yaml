  x10.prompt: "В футбольной команде 11 игроков. Какое это слово?"
  x10.o2.fb: "Zwölf — это 12."
  x10.o3.fb: "Zehn — это 10."
  x10.expl: "Elf — это 11: elf Spieler."
  x11.prompt: "Какая цифра соответствует этому слову?"
  x11.expl: "Acht — это 8."
  x12.prompt: "Это правильно?"
  x12.wrong: "Нет: zwölf — это 12. Двадцать — другое слово, оно будет в следующем уроке."
  x12.expl: "Zwölf — это 12."
  x13.prompt: "Напишите пропущенное число словом."
  x13.r1: "В zwölf — ö, а не e."
  x13.r2: "Zwölf заканчивается на f."
  x13.expl: "Ein Jahr hat zwölf Monate: в году двенадцать месяцев."
  x14.prompt: "Соедините время с часами."
  x14.expl: "Uhr после числа означает «час»."
  x15.prompt: "Напишите число 9 словом."
  x15.r1: "Neun: звук «ой» пишется eu, и в конце нет e."
  x15.expl: "Neun: n, eu, n."
  x16.prompt: "Какие из этих чисел чётные?"
  x16.o4.fb: "Sieben — это 7, нечётное число."
  x16.expl: "Sechs, acht и zehn — 6, 8 и 10: чётные числа."
  tip: "Sieben пишется с ie, neun — с eu, а zwölf — с ö и без e после w."
