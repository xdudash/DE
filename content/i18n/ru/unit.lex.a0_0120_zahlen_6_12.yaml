strings:
  title: "Числа от 6 до 12"
  summary: "От шести до двенадцати: для времени, дней, месяцев и игроков."
  obj: "Называть, читать и писать числа от 6 до 12 и использовать их, чтобы сказать время."
  intro: "Следующие числа — sechs, sieben, acht, neun, zehn, elf, zwölf. Elf и zwölf — отдельные слова: они не образуются от zehn. Со словом Uhr после числа называют время: acht Uhr — это 8:00."
  examples: "Числа в повседневных фразах."
  summary_block: "**sechs 6 · sieben 7 · acht 8 · neun 9 · zehn 10 · elf 11 · zwölf 12**. **Es ist acht Uhr.** = Восемь часов."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Шесть часов. Wie viel Uhr ist es? = который час?"
  ex.2: "семь дней: неделя"
  ex.3: "автобус номер восемь"
  ex.4: "одиннадцать игроков: футбольная команда"
  ex.5: "В году двенадцать месяцев."
  ex.6: "neun — это 9; nein означает «нет»."
  x1.prompt: "Часы показывают 9:00. Который час?"
  x1.o2.fb: "Nein означает «нет». Девять — neun, с eu."
  x1.o3.fb: "Acht Uhr — это 8:00."
  x1.expl: "9:00 = neun Uhr."
  x2.prompt: "Впишите пропущенные числа."
  x2.expl: "Счёт: sechs, sieben, acht, neun, zehn."
  x3.prompt: "Какие числа больше, чем zehn?"
  x3.o3.fb: "Neun — это 9, меньше 10."
  x3.o4.fb: "Acht — это 8, меньше 10."
  x3.expl: "Elf (11) и zwölf (12) идут после zehn."
  x4.prompt: "Напишите число 7 словом."
  x4.r1: "Sieben пишется с ie: долгое i."
  x4.r2: "Ei звучит как «ай»; долгое i пишется ie: sieben."
  x4.expl: "Sieben: s, ie, b, e, n."
  x5.prompt: "Правда или нет? (nein = нет, dasselbe Wort = то же слово)"
  x5.wrong: "Нет: neun — это 9, звучит с «ой»; nein — «нет», звучит с «ай»."
  x5.expl: "Eu звучит как «ой», ei — как «ай»."
  x6.prompt: "Соедините каждое слово с цифрой."
  x6.expl: "Sechs 6, sieben 7, acht 8, neun 9, elf 11, zwölf 12."
  x7.prompt: "Часы показывают 10:00. Ответьте на вопрос."
  x7.o2.fb: "Elf — это 11, а часы показывают 10."
  x7.o3.fb: "Euro — это деньги; для времени говорите Uhr."
  x7.expl: "Wie viel Uhr ist es? – Es ist zehn Uhr."
  x8.prompt: "Часы показывают 12:00. Дополните предложение."
  x8.r1: "В zwölf — ö, а не e."
  x8.r2: "Zwölf заканчивается на f."
  x8.r3: "Oe — так пишут ö в адресах; в словах пишите ö: zwölf."
  x8.expl: "Es ist zwölf Uhr: двенадцать часов."
  x9.prompt: "В футбольной команде 11 игроков. Как это сказать?"
  x9.o2.fb: "Zwölf — это 12."
  x9.o3.fb: "11 не образуется из eins и zehn: это elf."
  x9.expl: "Elf — это 11, отдельное слово."
  x10.prompt: "Расставьте слова в правильном порядке."
  x10.expl: "Ein Jahr hat zwölf Monate: в году двенадцать месяцев."
  x11.prompt: "Какие из этих чисел чётные?"
  x11.o4.fb: "Sieben — это 7, нечётное число."
  x11.o5.fb: "Elf — это 11, нечётное число."
  x11.expl: "Sechs, acht и zwölf — 6, 8 и 12: чётные числа."
  x12.prompt: "Запишите время цифрами."
  x12.expl: "Sieben Uhr — это 7:00."
  x13.prompt: "Это правильно?"
  x13.wrong: "Это верно: 6 + 6 = 12."
  x13.expl: "Sechs (6) + sechs (6) = zwölf (12)."
  x14.prompt: "Запишите номер автобуса цифрами."
  x14.expl: "Acht — это 8."
  x15.prompt: "Напишите это время словами."
  x15.expl: "6:00 = sechs Uhr."
  tip: "В sechs сочетание chs звучит как «кс». Sieben пишется с ie, neun — с eu (звучит как «ой»), а zwölf — с ö и без e после w."
