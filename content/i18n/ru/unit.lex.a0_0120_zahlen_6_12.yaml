  x5.prompt: "Напишите число 7 словом."
  x5.r1: "Sieben пишется с ie: долгое i."
  x5.r2: "Sieben начинается с s; s перед гласной звучит звонко."
  x5.expl: "Sieben: s, ie, b, e, n."
  x6.prompt: "Какие числа больше, чем zehn?"
  x6.o3.fb: "Neun — это 9, меньше 10."
  x6.o4.fb: "Acht — это 8, меньше 10."
  x6.expl: "Elf (11) и zwölf (12) идут после zehn."
  x7.prompt: "Составьте фразу «комната номер десять»."
  x7.expl: "Zimmer Nummer zehn: число стоит в конце."
  x8.prompt: "Что дальше?"
  x8.o2.fb: "Zwölf — это 12; после zehn идёт elf."
  x8.o3.fb: "Sieben — это 7; оно стоит перед zehn."
  x8.expl: "Neun, zehn, elf: 9, 10, 11."
  x9.prompt: "Впишите пропущенные числа."
