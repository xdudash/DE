  ex.2: "семь дней: неделя"
  ex.3: "восемь евро"
  ex.4: "комната десять"
  ex.5: "одиннадцать игроков: футбольная команда"
  ex.6: "двенадцать месяцев: год"
  x1.prompt: "Какое число — sieben?"
  x1.o2.fb: "6 — это sechs."
  x1.o3.fb: "9 — это neun."
  x1.expl: "Sieben — это 7."
  x2.prompt: "Запишите число цифрами."
  x2.expl: "Zwölf — это 12."
  x3.prompt: "Соедините каждое слово с цифрой."
  x3.expl: "Sechs 6, acht 8, zehn 10, elf 11."
  x4.prompt: "Правда или нет?"
