  intro: "Следующие числа — sechs, sieben, acht, neun, zehn, elf, zwölf. Elf и zwölf — отдельные слова: они не образуются от zehn."
  examples: "Числа в повседневных фразах."
  summary_block: "**sechs 6 · sieben 7 · acht 8 · neun 9 · zehn 10 · elf 11 · zwölf 12**"
