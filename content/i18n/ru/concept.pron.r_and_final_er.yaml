strings:
  title: "Немецкий r и окончание -er"
  summary: "r перед гласной — согласный, обычно горловой (rot, drei). После гласной в конце слога и в окончании -er он становится почти гласным, близким к краткому мягкому a (Uhr, Vater, aber)."
  pattern.scope: "r в начале слова или перед гласной; r после долгой гласной в конце слога; безударное окончание -er."
  pattern.limits: "Разницу между горловым и раскатистым r письменно не проверяем. Раскатистый r распространён в Баварии, Австрии и Швейцарии, и он тоже правильный."
  ex.rot: "rot (красный): r в начале — согласный."
  ex.drei: "drei (три): r перед гласной — согласный."
  ex.vater: "Vater (отец): -er в конце звучит как мягкое a."
  ex.uhr: "Uhr (часы): r после гласной в конце мягкий."
