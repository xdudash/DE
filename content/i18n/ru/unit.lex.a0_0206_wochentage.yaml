strings:
  title: "Дни недели"
  summary: "От Montag до Sonntag, am Montag и Heute ist …"
  obj: "Называть дни недели и говорить, какой сегодня день."
  intro: "В Германии, Австрии и Швейцарии неделя начинается с Montag: Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag. Samstag и Sonntag — выходные. Дни — существительные, поэтому пишутся с заглавной буквы. «В понедельник» — am Montag (не «in Montag»)."
  examples: "Дни в повседневной жизни."
  summary_block: "**Montag · Dienstag · Mittwoch · Donnerstag · Freitag · Samstag · Sonntag.** В какой-то день: **am Montag**. Сегодня: **Heute ist …**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Сегодня понедельник."
  ex.2: "во вторник"
  ex.3: "В среду занятие."
  ex.4: "До пятницы!"
  ex.5: "Суббота и воскресенье — выходные."
  ex.6: "С понедельника по пятницу, с 9 до 18 (часы работы на табличке)"
  ex.7: "Какой сегодня день?"
  x1.prompt: "Как вы ответите?"
  x1.o2.fb: "Guten Tag — приветствие, а друг прощается."
  x1.o3.fb: "Januar — месяц, и с месяцами говорят im, а не am. Друг имеет в виду Freitag."
  x1.expl: "Bis + день: до встречи в этот день."
  x2.prompt: "Дополните: сегодня суббота."
  x2.r1: "Дни — существительные: пишите Samstag с заглавной S."
  x2.r2: "Sonntag — воскресенье; суббота — Samstag."
  x2.expl: "Heute ist Samstag."
  x3.prompt: "Какие дни рабочие для большинства людей?"
  x3.o4.fb: "Sonntag — выходной; большинство магазинов и учреждений закрыты."
  x3.expl: "Montag–Freitag — рабочие дни для большинства людей."
  x4.prompt: "Правда или нет? (ein anderes Wort für = другое слово для)"
  x4.wrong: "Это верно: Sonnabend означает Samstag; так говорят в основном на севере и востоке Германии."
  x4.expl: "Оба слова правильные."
  x5.prompt: "Напишите полное название дня."
  x5.r1: "Sonntag — это So.; Sa. — Samstag."
  x5.expl: "Sa. = Samstag (на севере также Sonnabend)."
  x6.prompt: "Выберите правильный ответ."
  x6.o2.fb: "Januar — месяц, а спрашивают про день."
  x6.o3.fb: "Это время, а спрашивают про день."
  x6.expl: "Welcher Tag ist heute? – Heute ist + день."
  x7.prompt: "Расставьте слова в правильном порядке."
  x7.expl: "Heute ist Montag: глагол ist на втором месте."
  x8.prompt: "Какие слова — дни недели?"
  x8.o3.fb: "Januar — месяц."
  x8.o4.fb: "Morgen — утро, как в Guten Morgen."
  x8.expl: "Sonntag и Dienstag заканчиваются на -tag, как большинство дней."
  x9.prompt: "Дополните неделю."
  x9.expl: "Третий день — Mittwoch, пятый — Freitag."
  x10.prompt: "Вы видите эту табличку на магазине. Открыт ли он в субботу?"
  x10.o1: "Нет, только с понедельника по пятницу"
  x10.o2: "Да, каждый день"
  x10.o2.fb: "Mo.–Fr. означает с Montag по Freitag; Sa. и So. на табличке нет."
  x10.o3: "Только в субботу"
  x10.o3.fb: "Суббота — это Sa.; на табличке Mo.–Fr."
  x10.expl: "Mo.–Fr.: Montag bis Freitag."
  x11.prompt: "Дополните: в пятницу."
  x11.r1: "С днями используйте am: am Freitag."
  x11.r2: "Im — с месяцами (im Mai). С днями — am."
  x11.r3: "Не in: с днями в немецком — am."
  x11.expl: "Am + день: am Freitag."
  x12.prompt: "Правда или нет?"
  x12.wrong: "Это верно: Samstag и Sonntag — выходные."
  x12.expl: "Wochenende — выходные."
  x13.prompt: "Напишите день, который идёт перед ним."
  x13.r1: "Sonntag идёт после Samstag, а не перед ним."
  x13.r2: "Freitag заканчивается на g, хотя звучит как k."
  x13.expl: "Freitag, потом Samstag."
  x14.prompt: "Какой день идёт следующим?"
  x14.o2.fb: "Mittwoch идёт после Dienstag; это третий день."
  x14.o3.fb: "Sonntag — день перед Montag."
  x14.expl: "Montag, потом Dienstag."
  x15.prompt: "Соедините каждый день с его местом в неделе."
  x15.expl: "Немецкая неделя начинается с Montag (1) и заканчивается Sonntag (7)."
  tip: "Краткие формы на табличках: Mo. Di. Mi. Do. Fr. Sa. So. На севере и востоке Германии вместо Samstag говорят и Sonnabend; оба слова правильные."
