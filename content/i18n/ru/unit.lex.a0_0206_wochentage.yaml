strings:
  title: "Дни недели"
  summary: "От Montag до Sonntag, am Montag и heute ist …"
  obj: "Называть дни недели и говорить, какой сегодня день."
  intro: "В Германии, Австрии и Швейцарии неделя начинается с Montag: Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag. Samstag и Sonntag — выходные. Дни — существительные, поэтому пишутся с заглавной буквы. «В понедельник» — am Montag."
  examples: "Дни в повседневной жизни."
  summary_block: "**Montag · Dienstag · Mittwoch · Donnerstag · Freitag · Samstag · Sonntag.** В какой-то день: **am Montag**. Сегодня: **Heute ist …**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Сегодня понедельник."
  ex.2: "во вторник"
  ex.3: "В среду занятие."
  ex.4: "До пятницы!"
  ex.5: "Суббота и воскресенье — выходные."
  ex.6: "С понедельника по пятницу, с 9 до 18 (часы работы на табличке)"
  x1.prompt: "Какой день идёт после Montag?"
  x1.o2.fb: "Mittwoch идёт после Dienstag; это третий день."
  x1.o3.fb: "Sonntag — день перед Montag."
  x1.expl: "Montag, потом Dienstag."
  x2.prompt: "Напишите день после Mittwoch."
  x2.r1: "В Donnerstag двойное n: Don-ners-tag."
  x2.r2: "Dienstag идёт перед Mittwoch, а не после."
  x2.expl: "Mittwoch, потом Donnerstag."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Это правильно: Samstag и Sonntag — выходные."
  x3.expl: "Wochenende — выходные."
  x4.prompt: "Соедините каждый день с его сокращением."
  x4.expl: "Сокращение — первые две буквы и точка."
  x5.prompt: "Какие дни рабочие для большинства людей?"
  x5.o4.fb: "Sonntag — выходной; большинство магазинов и учреждений закрыты."
  x5.expl: "Montag–Freitag — рабочие дни для большинства людей."
  x6.prompt: "Дополните: в пятницу."
  x6.r1: "С днями используйте am: am Freitag."
  x6.r2: "Im — с месяцами (im Mai). С днями — am."
  x6.expl: "Am + день: am Freitag."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Januar — месяц, а не день недели."
  x7.o3.fb: "Это время, а спрашивают про день."
  x7.expl: "Welcher Tag ist heute? спрашивает, какой сегодня день: Heute ist + день."
  x8.prompt: "Расставьте слова в правильном порядке."
  x8.expl: "Heute ist Montag: глагол ist на втором месте."
  x9.prompt: "Это правильно?"
  x9.wrong: "Нет: сначала Mittwoch, потом Donnerstag."
  x9.expl: "Montag, Dienstag, Mittwoch, Donnerstag …"
  x10.prompt: "Немецкая неделя начинается с Montag (день 1). Какой номер у Freitag? Запишите цифрой."
  x10.r1: "6 — это Samstag. Считайте: Montag 1, Dienstag 2, Mittwoch 3, Donnerstag 4, Freitag 5."
  x10.expl: "Freitag — пятый день."
  x11.prompt: "Какой день в середине недели?"
  x11.o2.fb: "Montag — первый день недели."
  x11.o3.fb: "Donnerstag — четвёртый день; середина — Mittwoch."
  x11.expl: "Mittwoch буквально означает «середина недели»."
  x12.prompt: "Превратите день в «в …»."
  x12.expl: "Am + день: am Samstag."
  x13.prompt: "Какие слова — дни недели?"
  x13.o3.fb: "Januar — месяц."
  x13.o4.fb: "Morgen — утро (как в Guten Morgen), а не день недели."
  x13.expl: "Sonntag и Dienstag заканчиваются на -tag, как большинство дней."
  x14.prompt: "Дополните неделю."
  x14.expl: "Третий день — Mittwoch, пятый — Freitag."
  x15.prompt: "Как вы ответите?"
  x15.o2.fb: "Freitag — день, а не имя, а Guten Tag — приветствие, а не прощание."
  x15.o3.fb: "Друг говорит Freitag — день этой недели; Januar — месяц."
  x15.expl: "Bis + день: до встречи в этот день."
  tip: "Краткие формы на табличках: Mo. Di. Mi. Do. Fr. Sa. So. На севере Германии вместо Samstag можно услышать Sonnabend."
