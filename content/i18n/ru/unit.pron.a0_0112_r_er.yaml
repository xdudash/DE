strings:
  title: "Звук r и окончание -er"
  summary: "r перед гласной — согласный; после гласной и в -er звучит как мягкое a."
  obj: "Различать, где r чёткий согласный, а где мягкий, и правильно писать -er."
  intro: "Перед гласной r — чёткий согласный, обычно горловой: rot, Reise, drei, Brot. После гласной в конце слова r становится мягким и звучит почти как краткое a: Uhr, hier, vier. Окончание -er тоже звучит как мягкое краткое a: Lehrer, Vater, Mutter, aber, oder. Пишут при этом r и -er."
  examples: "Слова с чётким и мягким r."
  summary_block: "**Перед гласной:** чёткий r (rot, drei). **После гласной в конце и в -er:** мягкий, как краткое a (Uhr, Vater). **Всегда пишите r и -er.**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "красный: чёткий r в начале"
  ex.2: "три: чёткий r перед гласной ei"
  ex.3: "поездка: чёткий r в начале"
  ex.4: "учитель: -er в конце звучит как мягкое a"
  ex.5: "отец: -er в конце звучит как мягкое a"
  ex.6: "но: -er в конце"
  ex.7: "здесь: мягкий r после гласной"
  ex.8: "часы: мягкий r после гласной"
  x1.prompt: "В каком слове r — чёткий согласный в начале?"
  x1.o2.fb: "В Uhr r стоит в конце после гласной, поэтому он мягкий."
  x1.o3.fb: "В aber r — часть -er в конце, которое звучит как мягкое a."
  x1.expl: "rot начинается с r перед гласной: чёткий согласный."
  x2.prompt: "Напишите слово «учитель» (мужчина)."
  x2.r1: "В конце слышно мягкое a, но пишут -er: Lehrer."
  x2.r2: "В Lehrer после первого e стоит h: она обозначает долгое e."
  x2.expl: "Lehrer: Leh-rer, с h для долгого e и -er в конце."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Это правда: -er в конце звучит как краткое мягкое a."
  x3.expl: "Vater пишется с -er, но звучит почти как «фата»."
  x4.prompt: "Соедините каждое слово с местом его r."
  x4.expl: "am Anfang — в начале, am Ende — в конце, nach dem Vokal — после гласной."
  x5.prompt: "Какие слова заканчиваются на -er?"
  x5.o4.fb: "Uhr заканчивается на hr, а не -er."
  x5.o5.fb: "В rot r в начале, а заканчивается оно на t."
  x5.expl: "Lehrer, Mutter и aber заканчиваются на -er."
  x6.prompt: "Дополните слово «но»."
  x6.r1: "Слышно a, но окончание пишется -er: aber."
  x6.r2: "Окончание -er, а не -ar: aber."
  x6.expl: "aber: -er в конце."
  x7.prompt: "Одногруппник спрашивает, как пишется слово. Какой ответ правильный?"
  x7.o2.fb: "Vater начинается с V (звучит как f) и заканчивается на -er, хотя слышно a."
  x7.o3.fb: "Конец звучит как a, но пишется -er."
  x7.expl: "Vater: V-a-t-e-r."
  x8.prompt: "Дополните слова: брат, часы, красный."
  x8.expl: "Bruder заканчивается на -er; Uhr — на r; rot начинается с r."
  x9.prompt: "В каком слове r стоит перед гласной?"
  x9.o2.fb: "В hier r в конце после гласной, поэтому мягкий."
  x9.o3.fb: "В oder r — часть -er в конце."
  x9.expl: "drei: r перед ei — чёткий согласный."
  x10.prompt: "Напишите по буквам слово «или»."
  x10.r1: "Окончание звучит как a, но пишется -er: oder."
  x10.expl: "oder: o-d-e-r."
  x11.prompt: "Это правильно?"
  x11.wrong: "В Uhr r стоит после гласной в конце, поэтому он мягкий, а не чёткий, как в rot."
  x11.expl: "r чёткий перед гласной и мягкий после неё."
  x12.prompt: "Дополните слово «мать»."
  x12.r1: "Пишите -er, хотя слышно a: Mutter."
  x12.expl: "Mutter: tt для краткого u и -er в конце."
  x13.prompt: "В каких словах r мягкий, в конце слова?"
  x13.o4.fb: "rot: r в начале, перед гласной."
  x13.o5.fb: "drei: r стоит перед гласной ei, поэтому чёткий."
  x13.expl: "hier, vier и Uhr заканчиваются на r после гласной."
  x14.prompt: "Наберите слово «здесь»."
  x14.r1: "В конце слышно мягкое a, но пишут r: hier."
  x14.r2: "В hier ie: долгое i пишется ie."
  x14.expl: "hier: h-i-e-r."
  x15.prompt: "Как обычно звучит -er в конце слова?"
  x15.o1: "как краткое мягкое a"
  x15.o2: "как чёткий раскатистый r"
  x15.o2.fb: "В стандартном немецком -er в конце — не чёткий r; оно звучит как мягкое a."
  x15.o3: "как долгое e"
  x15.o3.fb: "-er не звучит как долгое e; e слабое, а r переходит в мягкое a."
  x15.expl: "Lehrer, Vater, aber: -er звучит как мягкое a."
  tip: "В Баварии, Австрии и Швейцарии многие произносят раскатистый r кончиком языка. Это тоже правильно."
