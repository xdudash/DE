strings:
  title: "Wie bitte? Как попросить повторить"
  summary: "Просите повторить, говорить медленнее или говорите, что не понимаете."
  obj: "Просить повторить или говорить медленнее и говорить, что не понимаете."
  intro: "Когда вы что-то не расслышали, скажите Wie bitte? — это вежливый способ переспросить. Noch einmal, bitte. — просьба сказать ещё раз, Langsam, bitte. — просьба говорить медленнее, а Ich verstehe nicht. — «я не понимаю». Эти фразы помогают продолжить разговор, даже когда ваш немецкий ещё новый."
  examples: "Фразы, когда вы что-то не поняли."
  summary_block: "**Wie bitte?** — переспросить, **Noch einmal, bitte.** — ещё раз, **Langsam, bitte.** — медленнее, **Ich verstehe nicht.** — когда не понимаете."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Простите? (вы не расслышали)"
  ex.2: "Ещё раз, пожалуйста."
  ex.3: "Медленнее, пожалуйста."
  ex.4: "Я не понимаю."
  ex.5: "Простите? Ещё раз, пожалуйста."
  x1.prompt: "Вы не расслышали, что сказал кассир. Что вы скажете?"
  x1.o2.fb: "Danke — благодарность; она не просит повторить."
  x1.o3.fb: "Tschüss завершает разговор, а вы так и не узнали, что сказали."
  x1.expl: "Wie bitte? вежливо просит сказать ещё раз."
  x2.prompt: "Напишите вежливый способ сказать, что вы не расслышали (два слова)."
  x2.r1: "Bitte пишется с двойным t."
  x2.r2: "Was? само по себе звучит грубо; напишите вежливое Wie bitte?"
  x2.expl: "Wie bitte? — два слова, с вопросительным знаком."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Это правильно: Wie bitte? — вежливый способ попросить повторить."
  x3.expl: "höflich — вежливый."
  x4.prompt: "Соедините две части каждой фразы."
  x4.expl: "Wie bitte?, Noch einmal и Ich verstehe nicht — устойчивые фразы."
  x5.prompt: "Преподаватель говорит слишком быстро. Что можно сказать?"
  x5.o4.fb: "Gute Nacht — «спокойной ночи»; это не поможет понять преподавателя."
  x5.expl: "Все три фразы помогают, когда говорят слишком быстро."
  x6.prompt: "Попросите собеседника говорить медленнее."
  x6.r1: "Noch einmal — просьба повторить; чтобы говорили медленнее, говорите Langsam."
  x6.r2: "В langsam посередине ng: lang-sam."
  x6.expl: "Langsam — медленно."
  x7.prompt: "Выберите правильный ответ."
  x7.o2.fb: "Вы не поняли имя; благодарность не поможет. Попросите повторить."
  x7.o3.fb: "Разговор только начался; лучше попросите повторить имя."
  x7.expl: "Сложное имя? Попросите повторить."
  x8.prompt: "Расставьте слова в правильном порядке."
  x8.expl: "Сначала Noch einmal, потом bitte."
  x9.prompt: "Это правильно?"
  x9.wrong: "Wie bitte? — просьба повторить, а не прощание."
  x9.expl: "Verabschiedung — прощание, как Tschüss."
  x10.prompt: "Дополните диалог."
  x10.expl: "Wie bitte? и Noch einmal, bitte! — просьба повторить имя."
  x11.prompt: "Какая фраза значит, что вы не понимаете?"
  x11.o2.fb: "Ich verstehe означает «я понимаю»; нужно nicht."
  x11.o3.fb: "Langsam, bitte — просьба говорить медленнее, а не «я не понимаю»."
  x11.expl: "nicht — не: Ich verstehe nicht."
  x12.prompt: "Сделайте этот вопрос вежливым."
  x12.expl: "Wie bitte? заменяет резкое Was?"
  x13.prompt: "Кто-то не расслышал ваше имя. Как вы ответите?"
  x13.o2.fb: "Собеседник вас не расслышал; скажите имя ещё раз."
  x13.o3.fb: "Danke не повторяет сказанного."
  x13.expl: "Повторите имя, а если нужно — продиктуйте по буквам."
  x14.prompt: "Составьте предложение."
  x14.expl: "Ich verstehe nicht: nicht стоит в конце."
  x15.prompt: "Какое слово означает «медленно»?"
  x15.o2.fb: "einmal — один раз."
  x15.o3.fb: "nicht — не."
  x15.expl: "langsam — медленно."
  x16.prompt: "Напишите фразу «ещё раз» (два слова)."
  x16.r1: "Einmal — одно слово."
  x16.expl: "Noch einmal или разговорно Noch mal."
  tip: "Was? само по себе может звучать грубо для незнакомых. Wie bitte? — всегда вежливо."
