strings:
  title: "Два звука ch"
  summary: "ch после e, i, ä, ö, ü, ei, eu, l, r или n — мягкий ich-звук (ich, Milch); после a, o, u или au — ach-звук из глубины горла (acht, Buch). Решает гласная перед ch."
  pattern.scope: "ch после гласной или l, r, n внутри или в конце слова; sch как один звук."
  pattern.limits: "ch в начале слова (Chef, China, Chor) и окончание -chs (sechs) изучаем позже. В Швейцарии ach-звук распространён после всех гласных."
  ex.ich: "ich (я): ich-звук после i."
  ex.milch: "Milch (молоко): ich-звук после l."
  ex.acht: "acht (восемь): ach-звук после a."
  ex.buch: "Buch (книга): ach-звук после u."
