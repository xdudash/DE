  title: Два звука ch
  summary: Мягкий ich-Laut после e, i, ä, ö, ü, l, r, n (ich, nicht) и твёрдый ach-Laut после a, o, u, au (Buch, auch). Ни один из них не равен русскому «х» во всех положениях.
