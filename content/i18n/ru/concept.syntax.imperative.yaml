strings:
  title: Повелительное наклонение
  summary: Формы для du, ihr и Sie; глагол стоит первым.
  pattern.scope: "Частые формы приказа: *Mach!* (du), *Macht!* (ihr), *Machen Sie!* (вежливо). Отделяемая приставка остаётся в конце."
  pattern.limits: "У некоторых глаголов особая форма повелительного наклонения. Вводный урок не охватывает все неправильные формы и прагматические различия приказа и просьбы."
  ex.du: "Открой окно, пожалуйста!"
  ex.ihr: "Откройте книги, пожалуйста!"
  ex.sie: "Откройте дверь, пожалуйста! (вежливо)"
  err.sie_order: "В вежливом приказе поставьте глагол первым, затем *Sie*: *Machen Sie die Tür auf!*"
