strings:
  title: "Сценарий: представиться на курсе"
  summary: "Поздоровайтесь с группой, назовите себя, спросите имя и попрощайтесь."
  obj: "Представиться и спросить имя в короткой беседе на курсе."
  intro: "В первый день курса вы здороваетесь с группой, называете себя фразой «Ich heiße …» и спрашиваете «Wie heißt du?». Слушатели курса обычно обращаются друг к другу на du; преподавателя можно спросить «Wie heißen Sie?». В конце вы прощаетесь."
  examples: "Фразы для первого дня на курсе."
  summary_block: "**Ich heiße …** — ваше имя. **Wie heißt du?** — вопрос слушателю, **Wie heißen Sie?** — преподавателю. **Freut mich!** — приятно познакомиться. **Tschüss, bis morgen!** — в конце."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "Доброе утро всем!"
  ex.2: "Привет, меня зовут Анна."
  ex.3: "Как тебя зовут? (другому слушателю)"
  ex.4: "Как вас зовут? (вежливо, преподавателю)"
  ex.5: "Приятно познакомиться!"
  ex.6: "Пока, до завтра!"
  x1.prompt: "Вы хотите назвать своё имя. Какое предложение вы скажете?"
  x1.o2.fb: "Это вопрос о чужом имени."
  x1.o3.fb: "Freut mich — «приятно познакомиться»; имени здесь нет."
  x1.expl: "Ich heiße … — так называют своё имя."
  x2.prompt: "Дополните: «Меня зовут Том»."
  x2.r1: "Пишите ß (или ss в Швейцарии): heiße."
  x2.r2: "Heißt — с du; с ich — heiße."
  x2.expl: "Ich heiße Tom: с ich глагол оканчивается на -e."
  x3.prompt: "Соедините каждую реплику с ответом."
  x3.expl: "На вопрос об имени — имя; на Freut mich — Freut mich auch; на прощание — прощание."
  x4.prompt: "Правда или нет?"
  x4.wrong: "Это правда: Wie heißt du? спрашивает имя."
  x4.expl: "Wie heißt du? — «как тебя зовут»."
  x5.prompt: "Напишите два слова, которые означают «приятно познакомиться»."
  x5.r1: "Звук «ой» пишется eu: Freut."
  x5.r2: "Правильно Freut mich, с mich."
  x5.expl: "Freut mich говорят при знакомстве."
  x6.prompt: "Выберите правильный ответ."
  x6.o2.fb: "Лена — её имя; назовите своё."
  x6.o3.fb: "Auf Wiedersehen завершает разговор, а Лена хочет знать ваше имя."
  x6.expl: "Und du? задаёт вам тот же вопрос: назовите имя."
  x7.prompt: "Расставьте слова в правильном порядке."
  x7.expl: "Сначала вопросительное слово, потом глагол: Wie heißt du?"
  x8.prompt: "Какими репликами можно начать первый урок?"
  x8.o3.fb: "Так заканчивают день, а не начинают."
  x8.o4.fb: "Gute Nacht говорят, уходя поздно вечером."
  x8.expl: "Приветствия открывают урок, прощания — завершают."
  x9.prompt: "Дополните диалог."
  x9.expl: "Du heißt, ich heiße: окончание меняется с лицом."
  x10.prompt: "Как вы ответите?"
  x10.o2.fb: "Gute Nacht — для прощания поздно вечером, а не для знакомства."
  x10.o3.fb: "Это прощание, а вы только познакомились."
  x10.expl: "Freut mich auch: мне тоже приятно."
  x11.prompt: "Задайте тот же вопрос преподавателю, вежливо."
  x11.expl: "С преподавателем — вежливое Sie: Wie heißen Sie?"
  x12.prompt: "Это правильно?"
  x12.wrong: "Это правильно: heißen — «зваться», поэтому Ich heiße Anna называет имя."
  x12.expl: "Ich heiße Anna = меня зовут Анна."
  x13.prompt: "Составьте приветствие для всей группы."
  x13.expl: "Guten Morgen zusammen: доброе утро всем."
  x14.prompt: "Урок закончился. Что вы скажете группе?"
  x14.o2.fb: "Hallo zusammen приветствует группу в начале."
  x14.o3.fb: "Freut mich — для нового знакомства."
  x14.expl: "Bis morgen: до завтра, до следующего урока."
  x15.prompt: "Дополните прощание."
  x15.expl: "Bis morgen — «до завтра»."
  tip: "В Швейцарии ß не используют: пишут heisse и heisst. Здесь принимаются оба написания."
