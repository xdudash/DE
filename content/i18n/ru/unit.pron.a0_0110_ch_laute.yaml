strings:
  title: "Звуки ch и sch"
  summary: "У ch два звука, в зависимости от гласной перед ним; sch — один звук."
  obj: "Различать ich-звук и ach-звук по букве перед ch и писать sch."
  intro: "После e, i, ä, ö, ü, ei, eu, l, r или n ch — мягкий ich-звук, произносимый спереди рта: ich, Milch, Küche. После a, o, u или au ch — ach-звук из глубины горла, похожий на русское х: acht, noch, Buch, auch. Три буквы sch дают один звук, как ш: Schule, Tisch, schön."
  examples: "Слова с ch и sch."
  summary_block: "**ich-звук** после e, i, ä, ö, ü, ei, eu, l, r, n (ich, Milch). **ach-звук** после a, o, u, au (acht, Buch). **sch** — один звук (Schule)."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не совсем. Прочитайте объяснение."
  ex.1: "я: ich-звук после i"
  ex.2: "молоко: ich-звук после l"
  ex.3: "кухня: ich-звук после ü"
  ex.4: "восемь: ach-звук после a"
  ex.5: "книга: ach-звук после u"
  ex.6: "тоже: ach-звук после au"
  ex.7: "школа: sch — один звук"
  ex.8: "стол: sch в конце"
  x1.prompt: "В каком слове ch — это ach-звук?"
  x1.o2.fb: "В ich ch стоит после i, поэтому это ich-звук."
  x1.o3.fb: "В Milch ch стоит после l, поэтому это ich-звук."
  x1.expl: "acht: ch после a — ach-звук."
  x2.prompt: "Напишите слово «школа»."
  x2.r1: "По-немецки этот звук пишут тремя буквами: sch."
  x2.r2: "В Schule нет h после u: S-c-h-u-l-e."
  x2.expl: "Schule: sch в начале, потом u-l-e."
  x3.prompt: "Правда или нет?"
  x3.wrong: "Это правда: ch после u — ach-звук."
  x3.expl: "u — одна из гласных a, o, u, au, после которых звучит ach-звук."
  x4.prompt: "Соедините каждое слово с его звуком."
  x4.expl: "ich: после i. Buch: после u. Schule: sch."
  x5.prompt: "В каких словах ich-звук?"
  x5.o4.fb: "auch: ch после au — ach-звук."
  x5.o5.fb: "noch: ch после o — ach-звук."
  x5.expl: "i, l и ü перед ch дают ich-звук."
  x6.prompt: "Дополните слово «стол»."
  x6.r1: "По-немецки этот звук пишется sch: Tisch."
  x6.r2: "Tich — такого слова нет. Стол — Tisch, с sch."
  x6.expl: "Tisch: sch в конце слова."
  x7.prompt: "Одногруппник спрашивает, как пишется слово. Какой ответ правильный?"
  x7.o2.fb: "Для этого звука в немецком нужны три буквы: s, c, h."
  x7.o3.fb: "Так получилось бы chön. schön начинается с s, c, h."
  x7.expl: "schön (красивый): s-c-h-ö-n."
  x8.prompt: "Дополните слова: я, восемь, школа."
  x8.expl: "ich и acht оба пишутся с ch, хотя звуки разные; Schule начинается с Sch."
  x9.prompt: "Какое слово начинается с sch?"
  x9.o2.fb: "Milch заканчивается на ch (ich-звук); оно не начинается с sch."
  x9.o3.fb: "acht начинается с гласной; его ch — ach-звук."
  x9.expl: "schön начинается с sch."
  x10.prompt: "Напишите по буквам слово «молоко»."
  x10.r1: "Milch пишется с ch, а не sch: ich-звук после l."
  x10.r2: "Звук после l пишется ch: Milch."
  x10.expl: "Milch: ch после l."
  x11.prompt: "Это правильно?"
  x11.wrong: "После i звучит ich-звук, как в ich и nicht."
  x11.expl: "ach-звук бывает только после a, o, u и au."
  x12.prompt: "Дополните слово «пирог»."
  x12.r1: "Kuschen — такого слова нет. Пирог — Kuchen, с ch."
  x12.r2: "Одной h недостаточно: звук пишется ch."
  x12.expl: "Kuchen: ch после u — ach-звук."
  x13.prompt: "В каких словах ach-звук?"
  x13.o4.fb: "ich: после i — ich-звук."
  x13.o5.fb: "Küche: после ü — ich-звук."
  x13.expl: "a, u и au перед ch дают ach-звук."
  x14.prompt: "Наберите слово «рыба»."
  x14.r1: "Fish — по-английски. По-немецки пишут sch: Fisch."
  x14.r2: "Fich — такого слова нет. Рыба — Fisch, с sch."
  x14.expl: "der Fisch: sch в конце."
  x15.prompt: "Какая буква перед ch даёт ich-звук?"
  x15.o2.fb: "После a звучит ach-звук, как в acht."
  x15.o3.fb: "После u звучит ach-звук, как в Buch."
  x15.expl: "i — одна из букв, после которых звучит ich-звук."
  tip: "ich-Laut и ach-Laut — немецкие названия этих двух звуков. ich-звук — не то же самое, что sch: ich — это не «иш»."
