strings:
  title: 'Модальные глаголы: können, müssen, wollen, dürfen, sollen, möchten'
  summary: Модальные глаголы выражают возможность, необходимость, намерение и разрешение. В единственном числе они неправильные, а основной глагол уходит в конец в инфинитиве.
  pattern.scope: "Здесь рассматриваются основные формы модальных глаголов в настоящем времени, их значения в главных предложениях и общих вопросах."
  pattern.limits: "Формы прошедшего времени, придаточные предложения и тонкие различия между wollen и möchten изучаются позднее."
  ex.ability: "Я могу сегодня остаться подольше."
  ex.necessity: "Нам нужно сейчас идти."
  ex.permission: "Можно мне здесь подождать?"
