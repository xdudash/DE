strings:
  title: 'Общие вопросы: глагол на первом месте'
  summary: Прямые вопросы, на которые отвечают ja или nein, начинаются со спрягаемого глагола, за которым следует подлежащее.
  pattern.scope: "В прямом общем вопросе поставьте спрягаемый глагол на первое место, а сразу после него — подлежащее: *Wohnst du in Wien?* В этом уроке рассматриваются вопросы в простом настоящем времени."
  pattern.limits: "W-вопрос начинается с вопросительного слова, а глагол остаётся на втором месте: *Wo wohnst du?* В косвенном вопросе после *ob* спрягаемый глагол уходит в конец: *Ich weiß nicht, ob du in Wien wohnst.* С модальным глаголом, вспомогательным глаголом или отделяемой приставкой вперёд выносится только спрягаемая часть; такие глагольные конструкции изучаются отдельно."
  ex.come: "Ты сегодня придёшь?"
  ex.work: "Она работает завтра?"
  ex.appointment: "У Вас есть назначенное время? (вежливое обращение)"
  ex.live: "Ты живёшь в Вене?"
  err.verb_agreement: "С *du* используйте *arbeitest*. Окончание глагола должно согласовываться с подлежащим: *Arbeitest du heute?*"
