entity: unit.pron.a0_0111_st_sp
lang: en
based_on_version: 1.0.0
status: draft
translator: claude (AI draft, 2026-10-25)
strings:
  title: "st and sp at the start of a word"
  summary: "At the start of a word you say scht and schp, but you write st and sp."
  obj: "Say st and sp correctly by their place in the word, and write them as st and sp."
  intro: "At the start of a word, st is said scht and sp is said schp: Straße, Stadt, Stunde, Sport, sprechen, spielen. The spelling stays st and sp. Inside a word or at the end, st and sp are said as they are written: Fenster, ist, Post, Wespe."
  examples: "st and sp at the start and inside words."
  summary_block: "**St- and Sp- at the start:** say scht- and schp- (Straße, Sport). **st and sp inside or at the end:** say s-t and s-p (Fenster, ist). **Always write st and sp.**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "street: said Schtraße"
  ex.2: "city: said Schtadt"
  ex.3: "hour, lesson: said Schtunde"
  ex.4: "sport: said Schport"
  ex.5: "to speak: said schprechen"
  ex.6: "window: st inside, said s-t"
  ex.7: "is: st at the end, said s-t"
  x1.prompt: "In which word do you say scht?"
  x1.o2.fb: "In ist, st is at the end, so you say s-t as written."
  x1.o3.fb: "In Post, st is at the end, so you say s-t."
  x1.expl: "Straße: St- at the start is said scht."
  x2.prompt: "Write the word for “street”."
  x2.r1: "You say scht, but you write St: Straße."
  x2.r2: "After the long a comes ß (or ss in Switzerland): Straße."
  x2.expl: "Straße, or Strasse in Switzerland."
  x3.prompt: "True or false?"
  x3.wrong: "st is inside the word Fenster, so you say s-t, as written."
  x3.expl: "Only st at the start of a word is said scht."
  x4.prompt: "Match each word to how its st or sp is said."
  x4.expl: "Sport and Stadt start with Sp and St; in Fenster, st is inside."
  x5.prompt: "In which words is st or sp said scht or schp?"
  x5.o4.fb: "ist: st at the end is said s-t."
  x5.o5.fb: "Wespe: sp inside the word is said s-p."
  x5.expl: "sprechen, Stunde and spielen start with sp or st."
  x6.prompt: "Complete the word for “sport” as it is written."
  x6.r1: "You say schp, but you write Sp: Sport."
  x6.expl: "Sport is written with Sp."
  x7.prompt: "A classmate asks how to spell a word. Which answer is right?"
  x7.o2.fb: "You hear scht, but the word is written with St."
  x7.o3.fb: "Stadt ends in dt: S-t-a-d-t."
  x7.expl: "Stadt: St at the start, dt at the end."
  x8.prompt: "Complete the words: street, to play, window."
  x8.expl: "All three are written st or sp, whatever the sound."
  x9.prompt: "In which word is sp said as written, s-p?"
  x9.o2.fb: "Sport: sp at the start is said schp."
  x9.o3.fb: "sprechen: sp at the start is said schp."
  x9.expl: "Wespe (wasp): sp inside the word is said s-p."
  x10.prompt: "Spell the word for “to speak”."
  x10.r1: "Write sp, even though you say schp."
  x10.r2: "sprechen ends in -en."
  x10.expl: "sprechen: sp at the start, ch inside, -en at the end."
  x11.prompt: "Is this right?"
  x11.wrong: "It is true: st at the start of a word is said scht."
  x11.expl: "Stunde starts with St, so it is said Schtunde."
  x12.prompt: "Complete the word for “fun”."
  x12.r1: "Write Sp, say schp: Spaß."
  x12.expl: "Spaß (fun): Sp at the start, ß after the long a."
  x13.prompt: "Which words have st or sp inside or at the end?"
  x13.o4.fb: "Straße: St is at the start."
  x13.o5.fb: "Sport: Sp is at the start."
  x13.expl: "In Fenster, ist and Post you say s-t, as written."
  x14.prompt: "Type the word for “city”."
  x14.r1: "Stadt is written with dt at the end."
  x14.r2: "Write St, say scht: Stadt."
  x14.expl: "die Stadt: St-a-d-t."
  x15.prompt: "Which word starts with the sound schp?"
  x15.o2.fb: "Stadt starts with scht, not schp."
  x15.o3.fb: "Schule starts with sch alone, not schp."
  x15.expl: "Spaß: Sp at the start is said schp."
  tip: "In Switzerland the street is written Strasse, with ss instead of ß. Both spellings are correct there."
