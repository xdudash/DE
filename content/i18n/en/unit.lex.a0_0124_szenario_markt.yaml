translator: claude (AI draft, 2026-10-25)
strings:
  title: "Scenario: shopping at the market"
  summary: "Greet the seller, ask the price, order, pay and say goodbye."
  obj: "Buy a few items at a market stall and understand the price."
  intro: "At a market stall you greet the seller, ask “Was kostet das?” and say how many you want. The seller tells you the price with “Das kostet …” and asks “Ist das alles?”. You pay, thank the seller and say goodbye."
  examples: "Lines at a market stall."
  summary_block: "**Was kostet das?** — **Das kostet zwei Euro.** — **Drei Äpfel, bitte.** — **Ist das alles?** — **Ja, danke.**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "How much is that?"
  ex.2: "That costs two euros."
  ex.3: "Three apples, please. One Apfel, several Äpfel."
  ex.4: "Is that everything? (the seller)"
  ex.5: "Yes, thank you."
  ex.6: "Thank you very much! Bye!"
  x1.prompt: "You want to know the price. What do you ask?"
  x1.o2.fb: "That asks for a name, not a price."
  x1.o3.fb: "That is the seller's question: is that everything?"
  x1.expl: "Kosten means to cost: Was kostet das?"
  x2.prompt: "Write the price as digits."
  x2.expl: "Sieben Euro is 7 euros."
  x3.prompt: "Match each question to its answer."
  x3.expl: "A price question gets a price; Ist das alles? gets yes or no; Was möchten Sie? gets your order."
  x4.prompt: "True or false?"
  x4.wrong: "It is true: kosten means to cost, so the question asks the price."
  x4.expl: "Was kostet das? = how much is that?"
  x5.prompt: "The seller says 10 euros. Write the number as a word."
  x5.r1: "Zehn has an h: z-e-h-n."
  x5.r2: "Zehn starts with z, which sounds like ts."
  x5.expl: "Zehn Euro: ten euros."
  x6.prompt: "Choose the right reply."
  x6.o2.fb: "Tschüss ends the conversation; the seller has just asked what you want."
  x6.o3.fb: "The seller asks what you want, not your name."
  x6.expl: "Answer with the number, the item and bitte."
  x7.prompt: "Put the words in order."
  x7.expl: "Question word first, then the verb: Was kostet das?"
  x8.prompt: "Which lines are polite at a market stall?"
  x8.o4.fb: "Without a number and bitte, one word sounds rude."
  x8.expl: "Greet, say bitte and danke: that is polite at any stall."
  x9.prompt: "Complete the dialogue."
  x9.expl: "Was kostet das? … Hier, bitte!"
  x10.prompt: "How do you answer?"
  x10.o2.fb: "You greeted at the start; now the seller asks if you want more."
  x10.o3.fb: "Hallo zusammen greets a group; the seller asks a question."
  x10.expl: "Ist das alles? — Ja, danke: yes, that is all."
  x11.prompt: "Complete the order: three apples, please."
  x11.r1: "One Apfel, two or more Äpfel: the plural has Ä."
  x11.r2: "Write Ä with two dots: Äpfel."
  x11.expl: "Drei Äpfel, bitte: three apples, please."
  x12.prompt: "Is this right?"
  x12.wrong: "No: Danke schön says thank you; it is not a question."
  x12.expl: "Danke schön = thank you very much."
  x13.prompt: "Match the price to the digits."
  x13.expl: "Zwei 2, fünf 5, zwölf 12."
  x14.prompt: "You leave the stall. What do you say?"
  x14.o2.fb: "That asks the price; you are already leaving."
  x14.o3.fb: "Guten Morgen greets; you are leaving."
  x14.expl: "Thank the seller and say goodbye."
  x15.prompt: "Write the number of apples as digits."
  x15.expl: "Vier Äpfel: four apples."
  tip: "Point at the fruit and ask “Was kostet das?”: das means “that”, so you do not need the name of the fruit."
