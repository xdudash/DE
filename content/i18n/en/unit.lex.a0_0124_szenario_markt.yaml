strings:
  title: "Scenario: shopping at the market"
  summary: "Greet the seller, ask the price and pay."
  obj: "Buy a few items at a market and ask the price."
  intro: "At a market stall, greet the seller, ask “Was kostet das?”, name the amount and thank the seller."
  examples: "Phrases for a market stall."
  summary_block: "**Was kostet das?** — What does that cost? **Drei Äpfel, bitte.** — Three apples, please. **Danke schön!** — Thank you."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Look at the situation again."
  fb.not_this: "Not this one. Read the explanation."
  ex.1: "What does that cost?"
  ex.2: "Three apples, please."
  ex.3: "Thank you very much."
  x1.prompt: "Which greeting fits a market stall at 9 am?"
  x1.expl: "Guten Morgen is for the morning."
  x2.prompt: "Choose the right reply."
  x2.expl: "Name what you want and how many."
  x3.prompt: "Which question asks for the price?"
  x3.expl: "Kostet means costs."
  x4.prompt: "Match each word to its digit."
  x4.expl: "Each word matches one digit."
  x5.prompt: "Write as digits: sieben."
  x5.expl: "sieben is 7."
  x6.prompt: "Write the word for 2."
  x6.expl: "2 is written zwei."
  x7.prompt: "Is this statement true?"
  x7.expl: "Was kostet das? asks how much it costs."
  x8.prompt: "Is this statement true?"
  x8.expl: "A question has a question mark."
  x8.wrong: "Danke schön is thanks, not a question."
  x9.prompt: "Which words can you say at a market?"
  x9.expl: "Hallo and Danke are polite at a market; Gute Nacht is for night."
  x10.prompt: "The seller says “Das macht zwei Euro.” What do you say when paying?"
  x10.expl: "Hier, bitte is said when you pay."
  x11.prompt: "Choose the right reply."
  x11.expl: "Say goodbye when you leave the stall."
  x12.prompt: "Write the thanks at the end of the purchase."
  x12.expl: "Danke schön is the polite form."
  x13.prompt: "Which is the German word for 10?"
  x13.expl: "Zehn is 10."
  x14.prompt: "Is this statement true?"
  x14.expl: "At 9 am it is still morning."
  x15.prompt: "Which sentence orders three apples?"
  x15.expl: "Äpfel is the plural of Apfel."
