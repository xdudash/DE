translator: claude (AI draft, 2026-10-25)
strings:
  title: "The two ch sounds"
  summary: "ch after e, i, ä, ö, ü, ei, eu, l, r or n is the soft ich-sound (ich, Milch); after a, o, u or au it is the ach-sound from the back of the throat (acht, Buch). The vowel before ch decides."
  pattern.scope: "ch after a vowel or l, r, n inside or at the end of a word; sch as one sound."
  pattern.limits: "ch at the start of a word (Chef, China, Chor) and the ending -chs (sechs) are taught later. In Switzerland the ach-sound is common after all vowels."
  ex.ich: "ich (I): ich-sound after i."
  ex.milch: "Milch (milk): ich-sound after l."
  ex.acht: "acht (eight): ach-sound after a."
  ex.buch: "Buch (book): ach-sound after u."
