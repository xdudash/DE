strings:
  title: "Numbers 0 to 5"
  summary: "Zero to five: the first numbers you need every day."
  obj: "Read and write the numbers 0 to 5."
  intro: "Numbers are single words. Learn zero to five first: null, eins, zwei, drei, vier, fünf. You will need them for prices, phone numbers and ages."
  examples: "Numbers 0 to 5."
  summary_block: "**null 0 · eins 1 · zwei 2 · drei 3 · vier 4 · fünf 5**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Look at the situation again."
  fb.not_this: "Not this one. Read the explanation."
  ex.1: "null (zero), 0."
  ex.2: "drei (three), 3."
  ex.3: "fünf (five), 5. The ü has two dots."
  x1.prompt: "Which word means 0?"
  x1.expl: "null is 0."
  x2.prompt: "Which word means 5?"
  x2.expl: "fünf is 5."
  x3.prompt: "Which word means 3?"
  x3.expl: "drei is 3."
  x4.prompt: "Which word means 2?"
  x4.expl: "zwei is 2."
  x5.prompt: "Match each word to its digit."
  x5.expl: "Each word matches one digit."
  x6.prompt: "Write as digits: drei."
  x6.expl: "drei is 3."
  x7.prompt: "Write the word for 4."
  x7.expl: "4 is written vier."
  x8.prompt: "Is this statement true?"
  x8.expl: "Check the number."
  x9.prompt: "Is this statement true?"
  x9.expl: "Check the number."
  x9.wrong: "Eins is 1. Zwei is 2."
  x10.prompt: "Which words are numbers from 0 to 5?"
  x10.expl: "Eins and fünf are in the range; acht is 8."
  x11.prompt: "Which of these numbers are odd?"
  x11.expl: "Odd numbers end in 1, 3, 5, 7 or 9. Zwei is even."
  x12.prompt: "Which number comes after drei?"
  x12.expl: "After drei comes vier."
  x13.prompt: "Which number comes before zwei?"
  x13.expl: "Eins comes before zwei."
  x14.prompt: "Which word is the number 1?"
  x14.expl: "Eins is 1."
  x15.prompt: "Write as digits: null."
  x15.expl: "null is 0."
