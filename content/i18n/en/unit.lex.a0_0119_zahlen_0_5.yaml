strings:
  title: "Numbers 0 to 5"
  summary: "Zero to five: for rooms, buses, prices and phone numbers."
  obj: "Say, read and write the numbers 0 to 5 and use them for rooms, buses, prices and phone numbers."
  intro: "The first numbers are null, eins, zwei, drei, vier, fünf. You hear them every day: a room number, a bus number, a price, a phone number. Number words are written in lower case, except at the start of a sentence. Phone numbers are usually read digit by digit: null – eins – fünf – zwei."
  examples: "Numbers in everyday phrases."
  summary_block: "**null 0 · eins 1 · zwei 2 · drei 3 · vier 4 · fünf 5**. Phone numbers: one digit at a time."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "0, 1, 2: counting from zero."
  ex.2: "room three. Welches Zimmer? = which room?"
  ex.3: "bus number four"
  ex.4: "five euros. Euro does not change after a number."
  ex.5: "a phone number, read digit by digit. Ihre Nummer? = your number?"
  x1.prompt: "Match each word to its digit."
  x1.expl: "Null 0, eins 1, zwei 2, drei 3, vier 4, fünf 5."
  x2.prompt: "The sign at the stop says 4. How do you say it?"
  x2.o2.fb: "Fünf is 5. Vier also starts with an f sound, but it is written with v and means 4."
  x2.o3.fb: "Drei is 3."
  x2.expl: "Vier is 4: Bus Nummer vier."
  x3.prompt: "Write the number 4 as a word."
  x3.r1: "Vier is written with v, although it starts with an f sound."
  x3.r2: "Vier has ie in the middle: v-ie-r."
  x3.expl: "Vier: v, ie, r."
  x4.prompt: "True or false? (klingt = sounds, am Anfang = at the start)"
  x4.wrong: "It is true: vier is written with v but starts with an f sound."
  x4.expl: "V usually sounds like f in German words: vier, Vater."
  x5.prompt: "Fill in the missing numbers."
  x5.expl: "Counting: null, eins, zwei, drei, vier, fünf."
  x6.prompt: "Which of these numbers are smaller than drei?"
  x6.o4.fb: "Vier is 4, bigger than 3."
  x6.expl: "Null, eins and zwei are 0, 1 and 2: all smaller than 3."
  x7.prompt: "Build the phrase “room number four”."
  x7.expl: "Zimmer Nummer vier: the number comes last."
  x8.prompt: "A price tag says 3 €. How do you read it?"
  x8.o2.fb: "Euro does not change after a number: drei Euro."
  x8.o3.fb: "Zwei is 2; the tag says 3."
  x8.expl: "3 € = drei Euro."
  x9.prompt: "Write the bus number as a word."
  x9.r1: "The sound ai is written ei: zwei."
  x9.r2: "Zwo is what people say on the phone; in writing use zwei."
  x9.expl: "Bus Nummer zwei: bus number two."
  x10.prompt: "Which number words are written with ei?"
  x10.o4.fb: "Vier has ie, not ei: ie is a long i, ei sounds like ai."
  x10.expl: "Eins, zwei, drei have ei; vier has ie."
  x11.prompt: "Is this right?"
  x11.wrong: "It is true: 4 + 1 = 5."
  x11.expl: "Vier (4) + eins (1) = fünf (5)."
  x12.prompt: "Someone says a phone number. Write it in digits."
  x12.expl: "Null eins fünf zwei: 0152."
  x13.prompt: "Your number is 0 1 5 2. Answer the question."
  x13.o2.fb: "Vier is 4; your number has a 5: fünf."
  x13.o3.fb: "The order is wrong: your number starts with null."
  x13.expl: "Read a phone number one digit at a time, in order."
  x14.prompt: "Write this phone number in words."
  x14.expl: "0 3 4: null drei vier."
  x15.prompt: "Your room key says 5. Answer the question."
  x15.o2.fb: "Vier is 4; your key says 5."
  x15.o3.fb: "Eins is 1; your key says 5."
  x15.expl: "Fünf is 5: Zimmer fünf."
  tip: "Vier is written with v but starts with an f sound. Zwei starts with ts-v. On the phone, people often say zwo instead of zwei so that it is not confused with drei."
