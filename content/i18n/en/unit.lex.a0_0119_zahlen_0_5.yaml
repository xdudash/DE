strings:
  title: "Numbers 0 to 5"
  summary: "Zero to five: for rooms, buses, prices and phone numbers."
  obj: "Say, read and write the numbers 0 to 5."
  intro: "The first numbers are null, eins, zwei, drei, vier, fünf. You hear them every day: a room number, a bus number, a price. Numbers are written in lower case."
  examples: "Numbers in everyday phrases."
  summary_block: "**null 0 · eins 1 · zwei 2 · drei 3 · vier 4 · fünf 5**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "0, 1, 2: counting from zero."
  ex.2: "room three"
  ex.3: "bus number four"
  ex.4: "five euros. Fünf has ü."
  ex.5: "one or two?"
  x1.prompt: "Which word is the number 0?"
  x1.o2.fb: "Eins is 1, the first number after null."
  x1.o3.fb: "Zwei is 2."
  x1.expl: "Null is 0. You need it for phone numbers."
  x2.prompt: "Write the number as digits."
  x2.expl: "Drei is 3."
  x3.prompt: "Match each word to its digit."
  x3.expl: "Null, eins, zwei, drei: 0, 1, 2, 3."
  x4.prompt: "True or false?"
  x4.wrong: "It is true: fünf is 5."
  x4.expl: "Fünf is 5; remember the ü."
  x5.prompt: "Write the number 4 as a word."
  x5.r1: "Vier is written with v, although it sounds like f."
  x5.r2: "Vier has ie: a long i."
  x5.expl: "Vier: v at the start, ie in the middle."
  x6.prompt: "Which words are numbers from 0 to 5?"
  x6.o4.fb: "Zimmer means room; it is not a number."
  x6.expl: "Null, eins and fünf are numbers; Zimmer is a noun."
  x7.prompt: "Build the phrase “bus number two”."
  x7.expl: "Bus Nummer zwei: the number comes after Nummer."
  x8.prompt: "What comes next?"
  x8.o2.fb: "After zwei comes drei; fünf comes later."
  x8.o3.fb: "Null comes before eins, not after zwei."
  x8.expl: "Eins, zwei, drei: 1, 2, 3."
  x9.prompt: "Fill in the missing numbers."
  x9.expl: "The missing numbers are zwei (2) and vier (4)."
  x10.prompt: "You take bus 5. Which bus is it?"
  x10.o2.fb: "Vier is 4, not 5."
  x10.o3.fb: "Zwei is 2, not 5."
  x10.expl: "Fünf is 5."
  x11.prompt: "Which digit is this word?"
  x11.expl: "Fünf is 5."
  x12.prompt: "Is this right?"
  x12.wrong: "No: eins is 1 and zwei is 2."
  x12.expl: "Eins is 1."
  x13.prompt: "Write the room number as a word."
  x13.r1: "The sound ai is written ei: drei."
  x13.r2: "Inside a phrase, numbers are written in lower case: Zimmer drei."
  x13.expl: "Zimmer drei: room three."
  x14.prompt: "Match the room to its number."
  x14.expl: "Zimmer vier is 4, Zimmer fünf is 5, Zimmer eins is 1."
  x15.prompt: "Write the number 5 as a word."
  x15.r1: "Fünf has ü with two dots."
  x15.r2: "Fünf ends in f."
  x15.expl: "Fünf: f, ü, n, f."
  x16.prompt: "Which of these numbers are smaller than drei?"
  x16.o4.fb: "Vier is 4, bigger than 3."
  x16.expl: "Null, eins and zwei are 0, 1 and 2: all smaller than 3."
  tip: "Vier starts with v but sounds like f. On the phone, people often say zwo instead of zwei so it is not confused with drei."
