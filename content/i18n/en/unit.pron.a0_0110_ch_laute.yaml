strings:
  title: "The sounds ch and sch"
  summary: "ch has two sounds, chosen by the vowel before it; sch is one sound."
  obj: "Tell the ich-sound from the ach-sound by the letter before ch, and write sch."
  intro: "After e, i, ä, ö, ü, ei, eu, l, r or n, ch is the soft ich-sound, made at the front of the mouth: ich, Milch, Küche. After a, o, u or au, ch is the ach-sound, made at the back of the throat: acht, noch, Buch, auch. Three letters, sch, make one sound, like sh in English: Schule, Tisch, schön."
  examples: "Words with ch and sch."
  summary_block: "**ich-sound** after e, i, ä, ö, ü, ei, eu, l, r, n (ich, Milch). **ach-sound** after a, o, u, au (acht, Buch). **sch** is one sound (Schule)."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "I: ich-sound after i"
  ex.2: "milk: ich-sound after l"
  ex.3: "kitchen: ich-sound after ü"
  ex.4: "eight: ach-sound after a"
  ex.5: "book: ach-sound after u"
  ex.6: "also: ach-sound after au"
  ex.7: "school: sch is one sound"
  ex.8: "table: sch at the end"
  x1.prompt: "In which word is ch the ach-sound?"
  x1.o2.fb: "In ich, ch comes after i, so it is the ich-sound."
  x1.o3.fb: "In Milch, ch comes after l, so it is the ich-sound."
  x1.expl: "acht: ch after a is the ach-sound."
  x2.prompt: "Write the word for “school”."
  x2.r1: "German writes this sound with three letters: sch."
  x2.r2: "Schule has no h: S-c-h-u-l-e."
  x2.expl: "Schule: sch at the start, then u-l-e."
  x3.prompt: "True or false?"
  x3.wrong: "It is true: ch after u is the ach-sound."
  x3.expl: "u is one of the vowels a, o, u, au that give the ach-sound."
  x4.prompt: "Match each word to its sound."
  x4.expl: "ich: after i. Buch: after u. Schule: sch."
  x5.prompt: "Which words have the ich-sound?"
  x5.o4.fb: "auch: ch after au is the ach-sound."
  x5.o5.fb: "noch: ch after o is the ach-sound."
  x5.expl: "i, l and ü before ch give the ich-sound."
  x6.prompt: "Complete the word for “table”."
  x6.r1: "German writes this sound sch: Tisch."
  x6.r2: "Tich is not a word. The table is Tisch, with sch."
  x6.expl: "Tisch: sch at the end of the word."
  x7.prompt: "A classmate asks how to spell a word. Which answer is right?"
  x7.o2.fb: "German needs three letters for this sound: s, c, h."
  x7.o3.fb: "That would be chön. schön starts with s, c, h."
  x7.expl: "schön (nice): s-c-h-ö-n."
  x8.prompt: "Complete the words: I, eight, school."
  x8.expl: "ich and acht are both written with ch, though the sounds differ; Schule starts with Sch."
  x9.prompt: "Which word starts with sch?"
  x9.o2.fb: "Milch ends in ch, the ich-sound; it does not start with sch."
  x9.o3.fb: "acht starts with a vowel; its ch is the ach-sound."
  x9.expl: "schön starts with sch."
  x10.prompt: "Spell the word for “milk”."
  x10.r1: "Milch is written with ch, not sch: the ich-sound after l."
  x10.r2: "The sound after l is written ch: Milch."
  x10.expl: "Milch: ch after l."
  x11.prompt: "Is this right?"
  x11.wrong: "After i you say the ich-sound, as in ich and nicht."
  x11.expl: "The ach-sound comes only after a, o, u and au."
  x12.prompt: "Complete the word for “cake”."
  x12.r1: "Kuschen is not a word. The cake is Kuchen, with ch."
  x12.r2: "One h is not enough: the sound is written ch."
  x12.expl: "Kuchen: ch after u is the ach-sound."
  x13.prompt: "Which words have the ach-sound?"
  x13.o4.fb: "ich: after i, the ich-sound."
  x13.o5.fb: "Küche: after ü, the ich-sound."
  x13.expl: "a, u and au before ch give the ach-sound."
  x14.prompt: "Type the word for “fish”."
  x14.r1: "Fish is English. German writes sch: Fisch."
  x14.r2: "Fich is not a word. The fish is Fisch, with sch."
  x14.expl: "der Fisch: sch at the end."
  x15.prompt: "Which letter before ch gives the ich-sound?"
  x15.o2.fb: "After a you say the ach-sound, as in acht."
  x15.o3.fb: "After u you say the ach-sound, as in Buch."
  x15.expl: "i is one of the letters that give the ich-sound."
  tip: "ich-Laut and ach-Laut are the German names of the two sounds. The ich-sound is not the same as sch: ich is not isch."
