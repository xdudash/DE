strings:
  title: "Block check: sounds, greetings and numbers"
  summary: "A mixed review of block A0.01: letters, umlauts, ß, greetings, goodbyes and numbers 0–20."
  obj: "Show that you can use the letters, greetings and numbers of block A0.01."
  intro: "This lesson checks block A0.01. Each exercise comes from a different earlier lesson. If one is hard, go back to that lesson before you start block A0.02."
  examples: "What block A0.01 covered."
  summary_block: "If you got most answers right, start block **A0.02**. If not, repeat the lessons named in the explanations."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "The alphabet with the umlauts and ß."
  ex.2: "Greetings by time of day."
  ex.3: "Informal and formal goodbyes."
  ex.4: "The numbers 0 to 20."
  ex.5: "Introducing yourself."
  x1.prompt: "Which letter has the name “we”?"
  x1.o2.fb: "V is called “fau”; W is called “we”."
  x1.o3.fb: "B is called “be”."
  x1.expl: "W is called “we”. Lesson: the alphabet."
  x2.prompt: "Write the name that is spelled: A – N – N – A."
  x2.r1: "There are two N: A – N – N – A."
  x2.expl: "A, N, N, A spells Anna. Lesson: spelling names."
  x3.prompt: "Match each word to its umlaut."
  x3.expl: "Käse has ä, schön has ö, über has ü. Lessons: umlauts."
  x4.prompt: "True or false?"
  x4.wrong: "It is true: after the long a in Straße you write ß."
  x4.expl: "Straße: long vowel, then ß. Lesson: ß and ss."
  x5.prompt: "Complete the greeting for 8 a.m."
  x5.r1: "Guten Tag is for the day; at 8 a.m. say Guten Morgen."
  x5.r2: "Morgen is a noun here: write it with a capital M."
  x5.expl: "Guten Morgen in the morning. Lesson: Guten Morgen and Guten Abend."
  x6.prompt: "Which of these are goodbyes?"
  x6.o4.fb: "Hallo is a greeting, not a goodbye."
  x6.expl: "Tschüss, Auf Wiedersehen and Bis bald end a conversation. Lesson: goodbyes."
  x7.prompt: "Put the words in order."
  x7.expl: "Ich heiße Anna. Lesson: introduce yourself in a course."
  x8.prompt: "The waiter asks. Choose your order."
  x8.o2.fb: "Freut mich is for meeting someone, not for ordering."
  x8.o3.fb: "Gute Nacht is for leaving late at night."
  x8.expl: "Number, drink and bitte. Lesson: order at a café."
  x9.prompt: "Write the number as digits."
  x9.expl: "Vier is 4. Lesson: numbers 0 to 5."
  x10.prompt: "Which number is zwölf?"
  x10.o2.fb: "2 is zwei; zwölf starts the same way but is 12."
  x10.o3.fb: "20 is zwanzig."
  x10.expl: "Zwölf is 12. Lesson: numbers 6 to 12."
  x11.prompt: "Fill in the missing numbers."
  x11.expl: "Fünfzehn is 15. Lesson: numbers 13 to 20."
  x12.prompt: "Is this right?"
  x12.wrong: "No: in 16 the s of sechs drops: sechzehn."
  x12.expl: "Sechzehn, without the s. Lesson: numbers 13 to 20."
  x13.prompt: "Make this greeting polite."
  x13.expl: "With Herr and a surname, Guten Tag is polite. Lesson: Hallo and Guten Tag."
  x14.prompt: "Choose the right reply."
  x14.o2.fb: "Ja, danke answers Ist das alles?, not a price question."
  x14.o3.fb: "Freut mich is for meeting someone."
  x14.expl: "A price question gets a price. Lesson: shopping at the market."
  x15.prompt: "Write the number 7 as a word."
  x15.r1: "Sieben is written with ie."
  x15.expl: "Sieben: s, ie, b, e, n. Lesson: numbers 6 to 12."
  x16.prompt: "Match each word to its digit."
  x16.expl: "Fünf 5, elf 11, neunzehn 19, zwanzig 20."
  x17.prompt: "Which greeting fits 9 p.m.?"
  x17.o2.fb: "Guten Morgen is for the morning."
  x17.o3.fb: "Guten Tag is for the daytime."
  x17.expl: "Guten Abend in the evening. Lesson: Guten Morgen and Guten Abend."
  x18.prompt: "Write the price as digits."
  x18.expl: "Acht Euro is 8 euros. Lesson: order at a café."
