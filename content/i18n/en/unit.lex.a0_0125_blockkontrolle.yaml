strings:
  title: "Block check: sounds, greetings and numbers"
  summary: "A mixed review of block A0.01: letters and sounds, greetings, polite phrases and numbers 0–20."
  obj: "Show that you can use the letters, sounds, greetings and numbers of block A0.01."
  intro: "This lesson checks block A0.01. Each exercise comes from one earlier lesson, and its explanation names that lesson. If an exercise is hard, go back to that lesson before you start block A0.02."
  examples: "What block A0.01 covered."
  summary_block: "If you got most answers right, start block **A0.02**. If not, repeat the lessons named in the explanations."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "The alphabet with the umlauts and ß."
  ex.2: "Long and short vowels."
  ex.3: "The sounds ch, sch, st and sp."
  ex.4: "Greetings, thanks and goodbyes."
  ex.5: "The numbers 0 to 20."
  x1.prompt: "Which letter has the name “we”?"
  x1.o2.fb: "V is called “fau”; W is called “we”."
  x1.o3.fb: "B is called “be”."
  x1.expl: "W is called “we”. Lesson: spelling names."
  x2.prompt: "Read the address lena@gmx.de aloud. Which word is missing?"
  x2.r1: "Ät is the @; the dot before de is Punkt."
  x2.r2: "Bindestrich is the sign -; the dot is Punkt."
  x2.expl: "The dot in an address is read Punkt. Lesson: letters in everyday life."
  x3.prompt: "True or false?"
  x3.wrong: "No: Ö is a letter of its own with its own sound, like e with rounded lips."
  x3.expl: "The dots belong to the letter. Lesson: umlauts, the sounds."
  x4.prompt: "Match each word to its umlaut."
  x4.expl: "München has ü, Köln has ö, Mädchen has ä. Lesson: umlauts in words and place names."
  x5.prompt: "Which spelling is correct in Germany?"
  x5.o2.fb: "After a long a you write ß, not a single s."
  x5.o3.fb: "Z sounds like ts; Straße has ß."
  x5.expl: "Long vowel + ß: Straße. Lesson: ß and ss."
  x6.prompt: "Write the word for “bed”: it has a short e."
  x6.r1: "A short e is followed by a double consonant: Bett."
  x6.r2: "Ee would make the e long; Bett has a short e and tt."
  x6.expl: "Das Bett: short e, double t. Lesson: long and short a, e, i."
  x7.prompt: "Which words have a long o or u?"
  x7.o4.fb: "Sonne has a short o: the double n shows it."
  x7.expl: "Boot, rot and gut have long vowels. Lesson: long and short o and u."
  x8.prompt: "Fill in the long i of the number 7."
  x8.r1: "Ei is a different sound, as in drei; the long i is written ie."
  x8.r2: "One i would be short here; the long i is ie: sieben."
  x8.expl: "Sieben: ie is a long i. Lesson: double vowels and ie."
  x9.prompt: "Is this right?"
  x9.wrong: "It is right: after u you hear the ach-sound, as in Buch and acht."
  x9.expl: "After a, o, u and au: ach-sound. Lesson: the sounds ch and sch."
  x10.prompt: "How do you say the St at the start of “Stadt”?"
  x10.o2.fb: "S-t is for st inside or at the end of a word, as in Fenster; at the start say scht."
  x10.o3.fb: "Ts is the sound of z, not of st."
  x10.expl: "St- at the start of a word sounds scht-. Lesson: st and sp."
  x11.prompt: "Make this greeting polite."
  x11.expl: "With Herr and a surname, Guten Tag is polite. Lesson: Hallo and Guten Tag."
  x12.prompt: "In which words does the end sound like a short a?"
  x12.o4.fb: "In rot the r is at the start, before a vowel: a clear r."
  x12.expl: "The ending -er sounds soft, like a short a. Lesson: the r sound and -er."
  x13.prompt: "Complete the greeting for 8 a.m."
  x13.r1: "Guten Tag is for the day; at 8 a.m. say Guten Morgen."
  x13.r2: "Guten Abend is for the evening."
  x13.expl: "Guten Morgen in the morning. Lesson: Guten Morgen and Guten Abend."
  x14.prompt: "Which of these are goodbyes?"
  x14.o4.fb: "Hallo is a greeting, not a goodbye."
  x14.expl: "Tschüss, Auf Wiedersehen and Bis bald end a conversation. Lesson: goodbyes."
  x15.prompt: "Choose the right reply."
  x15.o2.fb: "Tschüss says goodbye; answer the thanks with Bitte."
  x15.o3.fb: "Guten Abend is a greeting; Danke needs an answer like Bitte."
  x15.expl: "Danke! – Bitte! Lesson: Danke and Bitte."
  x16.prompt: "Write the number as digits."
  x16.expl: "Vier is 4. Lesson: numbers 0 to 5."
  x17.prompt: "You did not understand. What do you say politely?"
  x17.o2.fb: "Was? on its own can sound rude to strangers; Wie bitte? is polite."
  x17.o3.fb: "Gute Nacht is for leaving late at night."
  x17.expl: "Wie bitte? asks someone to say it again. Lesson: Wie bitte?"
  x18.prompt: "How do you answer?"
  x18.o2.fb: "Danke schön thanks someone; to an apology say Kein Problem."
  x18.o3.fb: "Guten Morgen greets; it does not answer an apology."
  x18.expl: "Entschuldigung! – Kein Problem! Lesson: Gern geschehen and Entschuldigung."
  x19.prompt: "Build the question you ask another learner."
  x19.expl: "Wie heißt du? asks a learner's name. Lesson: introduce yourself in a course."
  x20.prompt: "Which number is zwölf?"
  x20.o2.fb: "2 is zwei; zwölf starts the same way but is 12."
  x20.o3.fb: "20 is zwanzig."
  x20.expl: "Zwölf is 12. Lesson: numbers 6 to 12."
  x21.prompt: "Write the number 16 as a word."
  x21.r1: "In 16 the s of sechs drops: sechzehn."
  x21.expl: "Sechzehn, without the s. Lesson: numbers 13 to 20."
  x22.prompt: "The waiter asks. Choose your order."
  x22.o2.fb: "Freut mich is for meeting someone, not for ordering."
  x22.o3.fb: "That is what the waiter says when you pay."
  x22.expl: "Number, drink and bitte. Lesson: order at a café."
  x23.prompt: "Complete the dialogue."
  x23.expl: "Was kostet das? asks the price. Lesson: shopping at the market."
  x24.prompt: "Match each word to its digit."
  x24.expl: "Fünf 5, elf 11, neunzehn 19, zwanzig 20. Lessons: numbers 0 to 20."
