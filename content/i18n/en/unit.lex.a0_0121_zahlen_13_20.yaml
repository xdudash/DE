strings:
  title: "Numbers 13 to 20"
  summary: "Thirteen to twenty: the -zehn numbers and zwanzig."
  obj: "Say, read and write the numbers 13 to 20 and use them for buses, rooms, ages and times."
  intro: "From 13 to 19 you say the small number first and then -zehn: drei + zehn = dreizehn, just like English thirteen. Two forms are shortened: sechzehn (without the s of sechs) and siebzehn (without the -en of sieben). Twenty is a new word: zwanzig. Watch the sounds: sechzehn is said with the ich-sound (sech-), not with the ks of sechs, and the i in vierzehn is short, although it is written ie."
  examples: "Numbers in everyday phrases."
  summary_block: "**dreizehn 13 · vierzehn 14 · fünfzehn 15 · sechzehn 16 · siebzehn 17 · achtzehn 18 · neunzehn 19 · zwanzig 20**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "bus number thirteen"
  ex.2: "fourteen euros: the i is short"
  ex.3: "4 p.m. (16:00): sech- with the ich-sound"
  ex.4: "I am eighteen. Wie alt bist du? = how old are you?"
  ex.5: "room nineteen"
  ex.6: "The bus comes in twenty minutes."
  x1.prompt: "Match each word to its digit."
  x1.expl: "The small number first, then -zehn; zwanzig is 20."
  x2.prompt: "Which number is vierzehn?"
  x2.o2.fb: "40 is vierzig, with -zig; -zehn adds ten."
  x2.o3.fb: "4 is vier; -zehn adds ten: 14."
  x2.expl: "Vierzehn = vier + zehn = 14."
  x3.prompt: "Write the number 16 as a word."
  x3.r1: "In 16 the s of sechs drops: sechzehn."
  x3.r2: "Zehn has an h: sechzehn."
  x3.expl: "Sechzehn: sech + zehn, said with the ich-sound."
  x4.prompt: "True or false?"
  x4.wrong: "It is true: 14 + 1 = 15."
  x4.expl: "Vierzehn (14) + eins (1) = fünfzehn (15)."
  x5.prompt: "Which of these numbers are bigger than 15?"
  x5.o4.fb: "Vierzehn is 14, smaller than 15."
  x5.expl: "Siebzehn 17, achtzehn 18, zwanzig 20: all bigger than 15."
  x6.prompt: "Fill in the missing numbers."
  x6.expl: "Counting: dreizehn, vierzehn, fünfzehn … achtzehn, neunzehn, zwanzig."
  x7.prompt: "True or false? (hört man = you hear, wie in = as in)"
  x7.wrong: "It is true: sechzehn is said with the ich-sound, sech-zehn, not with the ks of sechs."
  x7.expl: "Sechs has ks, but sechzehn has the ich-sound."
  x8.prompt: "Put the words in order."
  x8.expl: "Der Bus kommt in zwanzig Minuten: the bus comes in twenty minutes."
  x9.prompt: "Your bus is the 13. Write its number as a word."
  x9.r1: "Zehn has an h: dreizehn."
  x9.r2: "Dreißig is 30; 13 is dreizehn."
  x9.expl: "Bus Nummer dreizehn: bus number thirteen."
  x10.prompt: "The film starts at 17:00. When is it?"
  x10.o2.fb: "Sieben Uhr is 7:00."
  x10.o3.fb: "Siebzig is 70; 17 ends in -zehn: siebzehn."
  x10.expl: "17:00 = siebzehn Uhr; um = at."
  x11.prompt: "-zehn or -zig? Complete the number 14."
  x11.r1: "-zig makes tens: vierzig is 40. For 14 add -zehn: vierzehn."
  x11.r2: "Zehn has an h: vierzehn."
  x11.expl: "14 = vierzehn."
  x12.prompt: "You are 18. Answer the question."
  x12.o2.fb: "Achtzig is 80; 18 is achtzehn."
  x12.o3.fb: "Acht is 8; 18 is achtzehn."
  x12.expl: "Wie alt bist du? – Ich bin achtzehn."
  x13.prompt: "The receptionist says your room. Write the number in digits."
  x13.expl: "Neunzehn is 19."
  x14.prompt: "Write this price in words."
  x14.r1: "Vierzig is 40; 14 is vierzehn."
  x14.r2: "Euro does not change after a number: vierzehn Euro."
  x14.expl: "14 € = vierzehn Euro."
  x15.prompt: "Write the time in digits."
  x15.r1: "Neun Uhr is 9:00; neunzehn Uhr is 19:00."
  x15.expl: "Neunzehn Uhr is 19:00, 7 p.m."
  tip: "Do not confuse -zehn (13–19) with -zig (20, 30 …): vierzehn is 14, vierzig is 40. The ending -ig in zwanzig is said -ich in standard German in Germany and -ik in southern Germany, Austria and Switzerland."
