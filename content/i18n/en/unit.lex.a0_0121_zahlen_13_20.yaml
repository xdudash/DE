strings:
  title: "Numbers 13 to 20"
  summary: "Thirteen to twenty: the -zehn numbers."
  obj: "Read and write the numbers 13 to 20."
  intro: "From 13 to 19 the number ends in -zehn, and the digit comes first in the word: dreizehn (3 + 10). Twenty is zwanzig, and it does not end in -zehn."
  examples: "Numbers 13 to 20."
  summary_block: "**dreizehn 13 · vierzehn 14 · fünfzehn 15 · sechzehn 16 · siebzehn 17 · achtzehn 18 · neunzehn 19 · zwanzig 20**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Look at the situation again."
  fb.not_this: "Not this one. Read the explanation."
  ex.1: "dreizehn (thirteen), 13: drei + zehn."
  ex.2: "siebzehn (seventeen), 17. Sieb- with a b, not sieben."
  ex.3: "zwanzig (twenty), 20."
  x1.prompt: "Which word means 13?"
  x1.expl: "dreizehn is 13."
  x2.prompt: "Which word means 15?"
  x2.expl: "fünfzehn is 15."
  x3.prompt: "Which word means 20?"
  x3.expl: "zwanzig is 20."
  x4.prompt: "Which word means 17?"
  x4.expl: "siebzehn is 17."
  x5.prompt: "Match each word to its digit."
  x5.expl: "The digit comes first, then -zehn."
  x6.prompt: "Write as digits: siebzehn."
  x6.expl: "siebzehn is 17."
  x7.prompt: "Write the word for 14."
  x7.expl: "14 is written vierzehn."
  x8.prompt: "Write the word for 19."
  x8.expl: "19 is written neunzehn."
  x9.prompt: "Is this statement true?"
  x9.expl: "Check the number."
  x10.prompt: "Is this statement true?"
  x10.expl: "Check the number."
  x10.wrong: "Siebzehn is 17. Achtzehn is 18."
  x11.prompt: "Which numbers from 13 to 19 end in -zehn?"
  x11.expl: "Zwanzig is 20, outside 13 to 19, and does not end in -zehn."
  x12.prompt: "Which of these are between 13 and 16?"
  x12.expl: "Siebzehn is 17."
  x13.prompt: "Which number comes after neunzehn?"
  x13.expl: "After neunzehn comes zwanzig."
  x14.prompt: "Which number comes before dreizehn?"
  x14.expl: "Zwölf is 12, the number before 13."
