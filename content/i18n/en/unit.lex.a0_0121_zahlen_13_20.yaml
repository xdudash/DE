strings:
  title: "Numbers 13 to 20"
  summary: "Thirteen to twenty: the -zehn numbers and zwanzig."
  obj: "Say, read and write the numbers 13 to 20."
  intro: "From 13 to 19 the number is the unit plus -zehn: drei + zehn = dreizehn. The unit comes first, as in English thirteen. Two forms are shortened: sechzehn (no s from sechs) and siebzehn (no -en from sieben). Twenty is a new word: zwanzig."
  examples: "Numbers in everyday phrases."
  summary_block: "**dreizehn 13 · vierzehn 14 · fünfzehn 15 · sechzehn 16 · siebzehn 17 · achtzehn 18 · neunzehn 19 · zwanzig 20**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "bus number thirteen"
  ex.2: "fourteen days: two weeks"
  ex.3: "sixteen euros: sech-, without the s"
  ex.4: "five p.m. (17:00): sieb-, without -en"
  ex.5: "eighteen years"
  ex.6: "twenty minutes"
  x1.prompt: "Which number is vierzehn?"
  x1.o2.fb: "40 is vierzig, with -zig; -zehn means plus ten."
  x1.o3.fb: "4 is vier; -zehn adds ten."
  x1.expl: "Vierzehn = vier + zehn = 14."
  x2.prompt: "Write the number as digits."
  x2.expl: "Achtzehn = acht + zehn = 18."
  x3.prompt: "Match each word to its digit."
  x3.expl: "The unit comes first, then -zehn; zwanzig is 20."
  x4.prompt: "True or false?"
  x4.wrong: "It is true: sechzehn is 16, written without the s of sechs."
  x4.expl: "Sechzehn is 16."
  x5.prompt: "Write the number 16 as a word."
  x5.r1: "In 16 the s of sechs drops: sechzehn."
  x5.r2: "Zehn has an h: sechzehn."
  x5.expl: "Sechzehn: sech + zehn."
  x6.prompt: "Which words end in -zehn?"
  x6.o4.fb: "Zwanzig is 20 and ends in -zig."
  x6.expl: "13 to 19 end in -zehn; 20 is zwanzig."
  x7.prompt: "Build the phrase “bus number fifteen”."
  x7.expl: "Bus Nummer fünfzehn: the number comes last."
  x8.prompt: "What comes next?"
  x8.o2.fb: "Zehn is 10; after 19 comes 20."
  x8.o3.fb: "Neunzig is 90; twenty is zwanzig."
  x8.expl: "Achtzehn, neunzehn, zwanzig: 18, 19, 20."
  x9.prompt: "Fill in the missing numbers."
  x9.expl: "The missing numbers are vierzehn (14) and sechzehn (16)."
  x10.prompt: "The film starts at 17:00. When is it?"
  x10.o2.fb: "Sieben Uhr is 7:00."
  x10.o3.fb: "Siebzig is 70; there is no 70 o'clock."
  x10.expl: "17:00 is siebzehn Uhr."
  x11.prompt: "Which digit is this word?"
  x11.expl: "Dreizehn = drei + zehn = 13."
  x12.prompt: "Is this right?"
  x12.wrong: "No: in 17 the -en of sieben drops: siebzehn."
  x12.expl: "The written form is siebzehn."
  x13.prompt: "Write the missing number as a word."
  x13.r1: "Write -ig at the end; in many regions it sounds like -ich."
  x13.r2: "Twenty is zwanzig, not a -zehn number."
  x13.expl: "Der Bus kommt in zwanzig Minuten: the bus comes in twenty minutes."
  x14.prompt: "Match the price to the number."
  x14.expl: "Dreizehn 13, sechzehn 16, neunzehn 19."
  x15.prompt: "Write the number 17 as a word."
  x15.r1: "In 17 the -en of sieben drops: siebzehn."
  x15.r2: "Siebzig is 70; 17 ends in -zehn."
  x15.expl: "Siebzehn: sieb + zehn."
  x16.prompt: "Which of these numbers are between 13 and 16?"
  x16.o3.fb: "Zwölf is 12, below 13."
  x16.o4.fb: "Achtzehn is 18, above 16."
  x16.expl: "Vierzehn (14) and fünfzehn (15) lie between 13 and 16."
  tip: "Do not confuse -zehn (13–19) with -zig (20, 30 …): vierzehn is 14, vierzig is 40."
