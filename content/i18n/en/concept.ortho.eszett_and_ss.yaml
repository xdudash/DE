strings:
  title: "ß and ss"
  summary: "ß and ss both sound like a sharp s. ß comes after a long vowel or a diphthong; ss after a short vowel."
  pattern.scope: "ß follows long vowels and diphthongs; ss follows short vowels."
  pattern.limits: "Switzerland writes ss instead of ß; this regional difference is taught later (ADR-0020)."
  ex.strasse: "Straße (street): ß after the long a."
  ex.fluss: "Fluss (river): ss after the short u."
  ex.gross: "groß (big): ß after the long o."
