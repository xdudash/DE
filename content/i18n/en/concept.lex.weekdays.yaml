strings:
  title: "Days of the week"
  summary: "The German week starts on Montag and ends on Sonntag. Samstag and Sonntag are the weekend."
  pattern.scope: "The seven weekdays, written with a capital letter."
  pattern.limits: "Sonnabend, a regional word for Saturday in northern Germany, is not taught as a main word."
  ex.montag: "Montag (Monday): the first day of the week here."
  ex.mittwoch: "Mittwoch (Wednesday): the middle of the week."
  ex.sonntag: "Sonntag (Sunday): the last day of the week here."
