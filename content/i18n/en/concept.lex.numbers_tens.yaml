strings:
  title: "Tens: 20 to 100"
  summary: "The tens are single words. Most end in -zig; dreißig ends in -ßig; hundert is 100."
  pattern.scope: "Tens from 20 to 90, hundert (100), and the numbers in between (units + und + tens, as one word), written as words and as digits."
  pattern.limits: "Numbers above 100 are taught in A0.02.3."
  ex.dreissig: "dreißig (thirty), 30: note ß."
  ex.neunzig: "neunzig (ninety), 90."
