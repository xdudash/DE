translator: claude (AI draft, 2026-10-25)
strings:
  title: "Alphabet: spelling names"
  summary: "Spell your name letter by letter and understand a spelt name."
  obj: "Spell a name aloud with German letter names and write a spelt name."
  intro: "At a reception desk or on the phone you are often asked: Wie schreibt man das? (How do you spell that?). Answer with the names of the letters, with a short pause between them: M – E – Y – E – R. Some letter names differ from English: V is „fau“, W is „we“, J is „jot“, Y is „ypsilon“. For two equal letters many people say Doppel-, for example Doppel-L."
  examples: "Spelling a name."
  summary_block: "**Wie schreibt man das?** Answer with letter names: **M – E – Y – E – R**. Remember **V = fau, W = we, J = jot, Y = ypsilon** and **Doppel-L** for LL."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "How do you spell that?"
  ex.2: "Meyer, spelt: em – e – ypsilon – e – er."
  ex.3: "Müller: for the two L people say Doppel-L."
  ex.4: "V is called „fau“, W is called „we“."
  ex.5: "J is called „jot“, Y is called „ypsilon“."
  ex.6: "W as in Wasser: a word makes a letter clear on the phone."
  x1.prompt: "What is the German name of the letter W?"
  x1.o2.fb: "Double U is the English name. In German, W is „we“."
  x1.o3.fb: "„Fau“ is the letter V, not W."
  x1.expl: "W is called „we“; V is called „fau“."
  x2.prompt: "Write the name that is spelt: M – E – Y – E – R."
  x2.r1: "Meier is another spelling of the name, but this one has Y: M – E – Y – E – R."
  x2.r2: "The second letter was E, not A: Meyer."
  x2.expl: "Write exactly the letters you hear: M, E, Y, E, R."
  x3.prompt: "True or false?"
  x3.wrong: "It is right: V is called „fau“, and it often sounds like f."
  x3.expl: "V is „fau“: Vater is said with an f sound."
  x4.prompt: "Match each letter to its German name."
  x4.expl: "These four names differ most from English."
  x5.prompt: "Which letters appear twice in the name Anna?"
  x5.o3.fb: "There is no M in Anna: A – N – N – A."
  x5.expl: "Anna is A – Doppel-N – A: both A and N appear twice."
  x6.prompt: "Complete the spelling of Müller with the last letter."
  x6.r1: "Müller ends in -er, so the last letter is R."
  x6.expl: "Müller: M – Ü – Doppel-L – E – R."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "This repeats the name; the question asks for its letters."
  x7.o3.fb: "Danke does not answer the question how the name is written."
  x7.expl: "Wie schreibt man das? asks for the letters."
  x8.prompt: "Put the words in order to ask how something is spelt."
  x8.expl: "The question word Wie comes first, then the verb schreibt."
  x9.prompt: "Is this right?"
  x9.wrong: "It is right: for two equal letters people often say Doppel-, for example Doppel-L in Müller."
  x9.expl: "Doppel means double."
  x10.prompt: "Write the letter that is called „jot“."
  x10.r1: "Y is called „ypsilon“. „Jot“ is J."
  x10.r2: "I is called „i“. „Jot“ is J."
  x10.expl: "J is „jot“, as in Januar."
  x11.prompt: "Which letter has the name „ypsilon“?"
  x11.o2.fb: "I is called „i“, a short name."
  x11.o3.fb: "J is called „jot“."
  x11.expl: "Y is „ypsilon“, as in Meyer."
  x12.prompt: "Complete the short dialogue."
  x12.expl: "Wie schreibt man das? is answered with the letters, then the whole name."
  x13.prompt: "Which of these are German letter names?"
  x13.o4.fb: "Double-u is English. In German W is „we“."
  x13.expl: "B is „be“, H is „ha“, V is „fau“."
  x14.prompt: "Spell this name letter by letter, with dashes."
  x14.expl: "Klein: K – L – E – I – N, one letter after the other."
  x15.prompt: "How do you answer?"
  x15.o2.fb: "That is a greeting; the question asks for your name."
  x15.o3.fb: "Tschüss ends the conversation; the question asks for your name."
  x15.expl: "Give the name and spell it at once: that saves a question."
  tip: "Say the letters slowly, with a pause, and name umlauts as letters of their own: Ü, not U."
