strings:
  title: "Long and short vowels"
  summary: "A vowel is long or short. The consonant after it is often the clue."
  pattern.scope: "A single vowel before a single consonant is usually long; before a double consonant it is usually short."
  pattern.limits: "These are rules of thumb. Exceptions are learned with the words."
  ex.tag: "Tag (day): long a, one vowel before one consonant."
  ex.mann: "Mann (man): short a, before a double consonant."
  ex.tier: "Tier (animal): ie is always a long i."
