strings:
  title: "Numbers 0 to 20"
  summary: "The numbers from zero to twenty. Each one is a single word, and 13 to 19 end in -zehn."
  pattern.scope: "Cardinal numbers 0 to 20, written as words and as digits."
  pattern.limits: "Numbers from 21 upward are taught later in A0.02."
  ex.sieben: "sieben (seven)."
  ex.zwoelf: "zwölf (twelve): the ö is written with two dots."
  ex.dreizehn: "dreizehn (thirteen): 13 to 19 end in -zehn."
