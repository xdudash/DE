strings:
  title: "The r sound and the ending -er"
  summary: "r before a vowel is a consonant; after a vowel and in -er it sounds like a soft a."
  obj: "Tell where r is a clear consonant and where it becomes soft, and write -er correctly."
  intro: "Before a vowel, r is a clear consonant, usually made in the throat: rot, Reise, drei, Brot. After a vowel at the end of a word, r becomes soft and sounds almost like a short a: Uhr, hier, vier. The ending -er sounds like a soft, short a too: Lehrer, Vater, Mutter, aber, oder. You still write r and -er."
  examples: "Words with a clear r and a soft r."
  summary_block: "**Before a vowel:** clear r (rot, drei). **After a vowel at the end and in -er:** soft, like a short a (Uhr, Vater). **Always write r and -er.**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "red: clear r at the start"
  ex.2: "three: clear r before the vowel ei"
  ex.3: "trip: clear r at the start"
  ex.4: "teacher: -er at the end sounds like a soft a"
  ex.5: "father: -er at the end sounds like a soft a"
  ex.6: "but: -er at the end"
  ex.7: "here: soft r after the vowel"
  ex.8: "clock: soft r after the vowel"
  x1.prompt: "In which word is r a clear consonant at the start?"
  x1.o2.fb: "In Uhr, r is at the end after a vowel, so it is soft."
  x1.o3.fb: "In aber, r is part of -er at the end, which sounds like a soft a."
  x1.expl: "rot starts with r before a vowel: a clear consonant."
  x2.prompt: "Write the word for “teacher” (a man)."
  x2.r1: "You hear a soft a at the end, but you write -er: Lehrer."
  x2.r2: "Lehrer has an h after the first e: it marks the long e."
  x2.expl: "Lehrer: Leh-rer, with h for the long e and -er at the end."
  x3.prompt: "True or false?"
  x3.wrong: "It is true: -er at the end sounds like a short, soft a."
  x3.expl: "Vater is written with -er but sounds like Vata."
  x4.prompt: "Match each word to where its r is."
  x4.expl: "am Anfang means at the start, am Ende at the end, nach dem Vokal after the vowel."
  x5.prompt: "Which words end in -er?"
  x5.o4.fb: "Uhr ends in hr, not -er."
  x5.o5.fb: "rot has r at the start and ends in t."
  x5.expl: "Lehrer, Mutter and aber all end in -er."
  x6.prompt: "Complete the word for “but”."
  x6.r1: "You hear a, but the ending is written -er: aber."
  x6.r2: "The ending is -er, not -ar: aber."
  x6.expl: "aber: -er at the end."
  x7.prompt: "A classmate asks how to spell a word. Which answer is right?"
  x7.o2.fb: "Vater starts with V (said like f) and ends in -er, even though you hear a."
  x7.o3.fb: "The end sounds like a, but it is written -er."
  x7.expl: "Vater: V-a-t-e-r."
  x8.prompt: "Complete the words: brother, clock, red."
  x8.expl: "Bruder ends in -er; Uhr ends in r; rot starts with r."
  x9.prompt: "In which word does r come before a vowel?"
  x9.o2.fb: "In hier, r is at the end after the vowel, so it is soft."
  x9.o3.fb: "In oder, r is part of -er at the end."
  x9.expl: "drei: r before ei is a clear consonant."
  x10.prompt: "Spell the word for “or”."
  x10.r1: "The ending sounds like a, but you write -er: oder."
  x10.expl: "oder: o-d-e-r."
  x11.prompt: "Is this right?"
  x11.wrong: "In Uhr the r comes after the vowel at the end, so it is soft, not clear like in rot."
  x11.expl: "r is clear before a vowel and soft after it."
  x12.prompt: "Complete the word for “mother”."
  x12.r1: "Write -er, even though you hear a: Mutter."
  x12.expl: "Mutter: tt for the short u and -er at the end."
  x13.prompt: "In which words is r soft, at the end of the word?"
  x13.o4.fb: "rot: the r is at the start, before a vowel."
  x13.o5.fb: "drei: the r comes before the vowel ei, so it is clear."
  x13.expl: "hier, vier and Uhr end in r after a vowel."
  x14.prompt: "Type the word for “here”."
  x14.r1: "You hear a soft a at the end, but you write r: hier."
  x14.r2: "hier has ie: the long i is written ie."
  x14.expl: "hier: h-i-e-r."
  x15.prompt: "How is -er at the end of a word usually said?"
  x15.o1: "like a short, soft a"
  x15.o2: "like a clear, rolled r"
  x15.o2.fb: "In standard German, -er at the end is not a clear r; it sounds like a soft a."
  x15.o3: "like a long e"
  x15.o3.fb: "-er does not sound like a long e; the e is weak and the r turns into a soft a."
  x15.expl: "Lehrer, Vater, aber: -er sounds like a soft a."
  tip: "In Bavaria, Austria and Switzerland many people roll the r with the tip of the tongue. That is correct too."
