translator: claude (AI draft, 2026-10-25)
strings:
  title: "Scenario: introduce yourself in a course"
  summary: "Greet the group, say your name, ask a name and say goodbye."
  obj: "Introduce yourself and ask a name in a short course conversation."
  intro: "On the first day of a German course you greet the group, say your name with “Ich heiße …” and ask “Wie heißt du?”. Learners in a course usually say du to each other; to the teacher you can say “Wie heißen Sie?”. At the end you say goodbye."
  examples: "Lines for the first day in a course."
  summary_block: "**Ich heiße …** says your name. **Wie heißt du?** asks a learner, **Wie heißen Sie?** asks the teacher. **Freut mich!** — nice to meet you. **Tschüss, bis morgen!** at the end."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Good morning, everyone!"
  ex.2: "Hi, my name is Anna."
  ex.3: "What is your name? (to another learner)"
  ex.4: "What is your name? (polite, to the teacher)"
  ex.5: "Nice to meet you!"
  ex.6: "Bye, see you tomorrow!"
  x1.prompt: "You want to say your name. Which sentence do you use?"
  x1.o2.fb: "This asks for someone else's name."
  x1.o3.fb: "Freut mich means nice to meet you; it does not give your name."
  x1.expl: "Ich heiße … introduces your name."
  x2.prompt: "Complete: “My name is Tom.”"
  x2.r1: "Write ß (or ss in Switzerland): heiße."
  x2.r2: "Heißt goes with du; with ich it is heiße."
  x2.expl: "Ich heiße Tom: with ich the verb ends in -e."
  x3.prompt: "Match each line to its reply."
  x3.expl: "A question about the name gets a name; Freut mich gets Freut mich auch; a goodbye gets a goodbye."
  x4.prompt: "True or false?"
  x4.wrong: "It is true: Wie heißt du? asks for a name."
  x4.expl: "Wie heißt du? means what is your name."
  x5.prompt: "Write the two words that mean “nice to meet you”."
  x5.r1: "The sound oi is written eu: Freut."
  x5.r2: "It is Freut mich, with mich."
  x5.expl: "Freut mich: you say it when you meet someone."
  x6.prompt: "Choose the right reply."
  x6.o2.fb: "Lena is her name; say your own."
  x6.o3.fb: "Auf Wiedersehen ends the conversation; Lena wants to know your name."
  x6.expl: "Und du? asks you the same question: give your name."
  x7.prompt: "Put the words in order."
  x7.expl: "The question word comes first, then the verb: Wie heißt du?"
  x8.prompt: "Which lines can start the first lesson?"
  x8.o3.fb: "This ends the day; it does not start it."
  x8.o4.fb: "Gute Nacht is for leaving late at night."
  x8.expl: "Greetings open the lesson; goodbyes close it."
  x9.prompt: "Complete the dialogue."
  x9.expl: "Du heißt, ich heiße: the ending changes with the person."
  x10.prompt: "How do you answer?"
  x10.o2.fb: "Gute Nacht is for leaving late at night, not for meeting someone."
  x10.o3.fb: "That says goodbye; you have just met."
  x10.expl: "Freut mich auch: nice to meet you too."
  x11.prompt: "Ask the teacher the same question, politely."
  x11.expl: "With the teacher, use the polite Sie: Wie heißen Sie?"
  x12.prompt: "Is this right?"
  x12.wrong: "It is right: heißen means to be called, so Ich heiße Anna gives the name."
  x12.expl: "Ich heiße Anna = my name is Anna."
  x13.prompt: "Build the greeting for the whole group."
  x13.expl: "Guten Morgen zusammen: good morning, everyone."
  x14.prompt: "The lesson ends. What do you say to the group?"
  x14.o2.fb: "Hallo zusammen greets the group at the start."
  x14.o3.fb: "Freut mich is for meeting someone new."
  x14.expl: "Bis morgen: see you tomorrow, at the next lesson."
  x15.prompt: "Complete the goodbye."
  x15.expl: "Bis morgen means see you tomorrow."
  tip: "In Switzerland ß is not used: people write heisse and heisst. Both spellings are accepted here."
