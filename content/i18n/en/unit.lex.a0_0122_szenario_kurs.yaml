strings:
  title: "Scenario: introduce yourself in a course"
  summary: "Greet the group, say your name and say goodbye."
  obj: "Introduce yourself in a short course conversation."
  intro: "In a course, greet the group, say your name with “Ich heiße …”, and say goodbye at the end."
  examples: "Phrases for a course."
  summary_block: "**Hallo, ich heiße Anna.** Then: **Freut mich.** At the end: **Auf Wiedersehen!**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Look at the situation again."
  fb.not_this: "Not this one. Read the explanation."
  ex.1: "Hi, my name is Anna."
  ex.2: "Nice to meet you."
  ex.3: "Goodbye (formal)."
  x1.prompt: "How do you say your name in a course?"
  x1.expl: "“Ich heiße” introduces your name."
  x2.prompt: "Choose the right reply."
  x2.expl: "Answer the greeting and give your own name."
  x3.prompt: "Write the greeting to start a course in the morning."
  x3.expl: "Guten Morgen is for the morning."
  x4.prompt: "Is this statement true?"
  x4.expl: "Heißen means to be called."
  x5.prompt: "Is this statement true?"
  x5.expl: "Gute Nacht is for the night."
  x5.wrong: "In the morning say Guten Morgen."
  x6.prompt: "Which phrases introduce your name?"
  x6.expl: "Both “heiße” and “bin” introduce yourself; Tschüss is a goodbye."
  x7.prompt: "Which sentence is a polite reply to “Freut mich”?"
  x7.expl: "“Freut mich auch” means nice to meet you too."
  x8.prompt: "Is this statement true?"
  x8.expl: "It is said when you meet someone."
  x9.prompt: "What do you say after someone says “Danke”?"
  x9.expl: "Bitte answers thanks."
  x10.prompt: "Which words can start a course introduction?"
  x10.expl: "Gute Nacht is said at night, not at the start of a course."
  x11.prompt: "Choose the right reply."
  x11.expl: "Say goodbye with the same formal phrase."
  x12.prompt: "Peter says “Guten Tag, ich heiße Peter.” Which answer?"
  x12.expl: "Answer with your own name."
  x13.prompt: "Write the greeting for the afternoon."
  x13.expl: "Guten Tag is used during the day."
  x14.prompt: "Write the phrase for “Nice to meet you”."
  x14.expl: "Freut mich is said when you meet someone."
  x15.prompt: "Is this statement true?"
  x15.expl: "It is said when you leave."
  x15.wrong: "Auf Wiedersehen is a goodbye."
