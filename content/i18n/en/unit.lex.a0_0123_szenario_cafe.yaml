strings:
  title: "Scenario: order at a café"
  summary: "Order drinks politely, understand the price and pay."
  obj: "Order one to three drinks and understand a price up to twenty euros."
  intro: "At a café the waiter asks “Was möchten Sie?”. You answer with the number and the drink and add bitte. When you pay, the waiter says “Das macht … Euro.”, and you hand over the money with “Hier, bitte!”."
  examples: "Lines at a café."
  summary_block: "**Was möchten Sie?** — **Zwei Kaffee, bitte.** — **Das macht sechs Euro.** — **Hier, bitte!**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "What would you like? (the waiter)"
  ex.2: "A tea, please. Before a word, one is ein, not eins."
  ex.3: "Two coffees, please."
  ex.4: "Three waters, please."
  ex.5: "That comes to six euros."
  ex.6: "Here you are! (when you pay)"
  x1.prompt: "The waiter asks. Choose your order."
  x1.o2.fb: "Gute Nacht is for leaving at night, not for ordering."
  x1.o3.fb: "This is what the waiter says when you pay."
  x1.expl: "Answer Was möchten Sie? with the number, the drink and bitte."
  x2.prompt: "How much is it? Write the price as digits."
  x2.expl: "Neun Euro is 9 euros."
  x3.prompt: "Match each order to the number of drinks."
  x3.expl: "Ein 1, zwei 2, drei 3."
  x4.prompt: "True or false?"
  x4.wrong: "It is true: Das macht … Euro tells you what to pay."
  x4.expl: "Das macht fünf Euro: that comes to five euros."
  x5.prompt: "Complete the polite order."
  x5.r1: "Danke thanks someone; to ask politely, say bitte."
  x5.r2: "Bitte has a double t."
  x5.expl: "Bitte makes the order polite."
  x6.prompt: "You hand over the money. What do you say?"
  x6.o2.fb: "That is the waiter's question."
  x6.o3.fb: "That is an order, not what you say when you pay."
  x6.expl: "Hier, bitte: here you are."
  x7.prompt: "Put the words in order."
  x7.expl: "Number, drink, then bitte."
  x8.prompt: "Which sentences are polite orders?"
  x8.o3.fb: "Without bitte this sounds rude."
  x8.o4.fb: "This is the price, not an order."
  x8.expl: "A polite order has the drink and bitte."
  x9.prompt: "Complete the dialogue."
  x9.expl: "Zwei Kaffee, bitte. – Das macht vier Euro."
  x10.prompt: "How do you answer?"
  x10.o2.fb: "You have already ordered; answer the thanks."
  x10.o3.fb: "That is the waiter's question, not a reply to thanks."
  x10.expl: "Bitte schön answers Danke schön."
  x11.prompt: "The coffee costs 8 euros. Write the number as a word."
  x11.r1: "Acht ends in t."
  x11.r2: "Acht has ch before the t."
  x11.expl: "Acht Euro: eight euros."
  x12.prompt: "Is this right?"
  x12.wrong: "No: Euro does not change after a number: sechs Euro."
  x12.expl: "Das macht sechs Euro."
  x13.prompt: "Build the waiter's question."
  x13.expl: "Was möchten Sie? — what would you like?"
  x14.prompt: "You want one tea. Which order is right?"
  x14.o2.fb: "When counting say eins, but before a word say ein: ein Tee."
  x14.o3.fb: "Elf is 11, not one."
  x14.expl: "Ein Tee, bitte: one tea, please."
  x15.prompt: "Write the number of coffees as digits."
  x15.expl: "Drei Kaffee: three coffees."
  tip: "Euro does not change after a number: ein Euro, sechs Euro. When you order, Kaffee also stays the same: zwei Kaffee."
