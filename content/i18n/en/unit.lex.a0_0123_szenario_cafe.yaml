strings:
  title: "Scenario: order at a café"
  summary: "Order drinks and pay with numbers up to twelve."
  obj: "Order two or three drinks and understand the price."
  intro: "At a café, say how many drinks you want with a number, then pay. Use the numbers 0 to 12 you have learned."
  examples: "Phrases for a café."
  summary_block: "**Zwei Kaffee, bitte.** **Das macht zehn Euro.** **Hier, bitte!**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Look at the situation again."
  fb.not_this: "Not this one. Read the explanation."
  ex.1: "Two coffees, please."
  ex.2: "That is ten euros."
  ex.3: "Here you are."
  x1.prompt: "Which sentence orders two coffees?"
  x1.expl: "Zwei is 2; zwölf is 12."
  x2.prompt: "Choose the right reply."
  x2.expl: "Answer the question with what you want."
  x3.prompt: "Write as digits: zehn."
  x3.expl: "zehn is 10."
  x4.prompt: "Write the word for 3."
  x4.expl: "3 is written drei."
  x5.prompt: "Is this statement true?"
  x5.expl: "Macht means makes, as in the total."
  x6.prompt: "Is this statement true?"
  x6.expl: "“Ich möchte” means I would like."
  x6.wrong: "Möchte means would like."
  x7.prompt: "Which words are numbers you can use to order?"
  x7.expl: "Zwei and acht are numbers; Kaffee and Bitte are not."
  x8.prompt: "Which sentence says that the bill is five euros?"
  x8.expl: "Euro is the currency; Tage and Uhr are not money."
  x9.prompt: "Which order is polite?"
  x9.expl: "Bitte makes the order polite."
  x10.prompt: "Choose the right reply."
  x10.expl: "When you pay, say “Hier, bitte!”."
  x11.prompt: "What is the reply to “Danke schön”?"
  x11.expl: "Bitte schön is the polite reply."
  x12.prompt: "Write the word for 9."
  x12.expl: "9 is written neun."
  x13.prompt: "Write as digits: vier Tees."
  x13.expl: "vier Tees is 4."
  x14.prompt: "Is this statement true?"
  x14.expl: "It is the usual café order."
  x15.prompt: "Which phrases end an order politely?"
  x15.expl: "Gute Nacht does not fit a café."
