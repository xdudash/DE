strings:
  title: "Long and short a, e, i"
  summary: "The letters after a vowel show whether it is long or short."
  obj: "Tell long and short a, e and i apart from the spelling of a word."
  intro: "German vowels can be long or short, and the spelling usually shows which. A vowel before a double consonant (nn, tt) or two consonants (tz, nd) is usually short: Mann, Bett, Kind. A vowel before one consonant, or followed by h, a double vowel or ie, is usually long: Tag, Zahl, Tee, Tier."
  examples: "Long and short vowels in words."
  summary_block: "**Double consonant or two consonants:** short vowel (Mann, Bett, Kind). **One consonant, h, double vowel or ie:** long vowel (Tag, Zahl, Tee, Tier)."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "day: long a, one g after it"
  ex.2: "man: short a, double n"
  ex.3: "number: long a, marked by h"
  ex.4: "tea: long e, written ee"
  ex.5: "bed: short e, double t"
  ex.6: "animal: long i, written ie"
  ex.7: "child: short i, two consonants nd"
  ex.8: "name: long a, one m"
  x1.prompt: "Which word has a long a?"
  x1.o2.fb: "Mann has nn after the a, so the a is short."
  x1.o3.fb: "Platz has tz after the a, so the a is short."
  x1.expl: "Tag has one consonant after the a, so the a is long."
  x2.prompt: "Write the word for “man”: short a, double n."
  x2.r1: "With one n, man is a different word. The man is Mann, with nn for the short a."
  x2.expl: "Mann: the double n shows the short a."
  x3.prompt: "True or false?"
  x3.wrong: "It is true: Bett has tt after the e, so the e is short."
  x3.expl: "A double consonant after a vowel makes it short."
  x4.prompt: "Match each word to its vowel."
  x4.expl: "nn and tt: short. One consonant or ee: long."
  x5.prompt: "Which words have a short vowel?"
  x5.o4.fb: "Tier is written with ie, and ie is a long i."
  x5.o5.fb: "Name has one m after the a, so the a is long."
  x5.expl: "Mann, Bett and Kind have a double consonant or two consonants after the vowel."
  x6.prompt: "Complete the word for “bed”."
  x6.r1: "With one t the e would be long. Bett has a short e, so it needs tt."
  x6.expl: "Bett: tt after the short e."
  x7.prompt: "A classmate asks you. What do you answer?"
  x7.o2.fb: "Name has only one m after the a, so the a is long."
  x7.o3.fb: "Name is spelt N-a-m-e: there is an a."
  x7.expl: "Lang means long: one consonant after the a."
  x8.prompt: "Short vowels: complete each word with a double consonant."
  x8.expl: "Mann, Bitte and Wetter: the double consonant shows the short vowel."
  x9.prompt: "Is this right?"
  x9.wrong: "Tier is written with ie, and ie is always a long i."
  x9.expl: "ie marks a long i."
  x10.prompt: "Write the word for “tea”: long e, two e."
  x10.r1: "Tee has a double e: the long e is written ee."
  x10.r2: "Tea is English. German writes Tee."
  x10.expl: "Tee: ee is a long e."
  x11.prompt: "Which word has a short i?"
  x11.o2.fb: "Kino has one n after the i, so the i is long."
  x11.o3.fb: "Tier has ie, which is a long i."
  x11.expl: "Kind has nd after the i, so the i is short."
  x12.prompt: "Complete with the word for “tea” (long e)."
  x12.r1: "The long e is written ee: Tee."
  x12.expl: "Ich trinke Tee means I drink tea."
  x13.prompt: "Which words have a long vowel?"
  x13.o4.fb: "Mann has nn, so the a is short."
  x13.o5.fb: "Bitte has tt, so the i is short."
  x13.expl: "Name has one consonant, Tee has ee and Tier has ie: all long."
  x14.prompt: "Spell the word for “name” (long a)."
  x14.r1: "Name has no h: N-a-m-e. The single m already shows the long a."
  x14.r2: "With mm the a would be short. Name has one m."
  x14.expl: "Name: one m after the long a."
  x15.prompt: "Which word shows the long a with an h?"
  x15.o2.fb: "Stadt has dt after the a, so the a is short, and there is no h."
  x15.o3.fb: "Katze has tz after the a, so the a is short."
  x15.expl: "Zahl: the h after the a marks it as long."
  tip: "In the exercises, lang means long and kurz means short. The rule says “usually”: a few short words break it."
