strings:
  title: "Long and short a, e, i"
  summary: "The letters after a vowel usually show whether it is long or short."
  obj: "Tell long and short a, e and i apart from the spelling of a word."
  intro: "German vowels can be long or short, and the length can change the word: Bett (bed) has a short e, Beet (flower bed) a long one. The spelling usually shows the length. A vowel before a double consonant (nn, tt) or two consonants (tz, nd) is usually short: Mann, Bett, Kind. A vowel before one consonant, or followed by h, a double vowel or ie, is usually long: Tag, Zahl, Tee, Tier."
  examples: "Long and short vowels in words."
  summary_block: "**Double consonant or two consonants:** usually a short vowel (Mann, Bett, Kind). **One consonant, h, double vowel or ie:** usually a long vowel (Tag, Zahl, Tee, Tier). **Exceptions:** short words like mit, das."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "day: long a, one g after it (the g at the end is said like k)"
  ex.2: "man: short a, double n"
  ex.3: "number: long a, marked by h"
  ex.4: "tea: long e, written ee"
  ex.5: "bed: short e, double t"
  ex.6: "animal: long i, written ie"
  ex.7: "child: short i, two consonants nd (the d at the end is said like t)"
  ex.8: "name: long a, one m"
  ex.9: "I drink tea."
  ex.10: "My name is Tom."
  x1.prompt: "Which word has a long a?"
  x1.o2.fb: "Mann has nn after the a, so the a is short."
  x1.o3.fb: "Platz has tz after the a, so the a is short."
  x1.expl: "Tag has one consonant after the a, so the a is long."
  x2.prompt: "Match each word to its vowel (kurz = short, lang = long)."
  x2.expl: "nn and nd: short. One m and ie: long."
  x3.prompt: "True or false? (kurz = short)"
  x3.wrong: "It is true: Bett has tt after the e, so the e is short."
  x3.expl: "A double consonant after a vowel usually makes it short."
  x4.prompt: "Complete the word for “bed”. (The bed is new.)"
  x4.r1: "With one t the e would be long. Bett has a short e, so it needs tt."
  x4.r2: "Beet is a flower bed, with a long e. The bed you sleep in is Bett, with tt."
  x4.expl: "Bett: tt after the short e."
  x5.prompt: "Which words have a short vowel?"
  x5.o4.fb: "Tier is written with ie, and ie is a long i."
  x5.o5.fb: "Name has one m after the a, so the a is long."
  x5.expl: "Mann, Bett and Kind have a double consonant or two consonants after the vowel."
  x6.prompt: "Write the German word for “tea”."
  x6.r1: "Tee has a double e: the long e is written ee."
  x6.r2: "Tea is English. German writes Tee."
  x6.expl: "Tee: ee is a long e."
  x7.prompt: "A classmate asks (Wie heißt das auf Deutsch? = What is that in German?). What do you answer?"
  x7.o2.fb: "Without the e the long i is not marked. The animal is Tier."
  x7.o3.fb: "Tür is the door. The animal is Tier, with ie."
  x7.expl: "das Tier: T-i-e-r, long i."
  x8.prompt: "Build the sentence “I drink tea.”"
  x8.expl: "Ich trinke Tee: the long e of Tee is written ee."
  x9.prompt: "Which of the two words has a long e?"
  x9.o2.fb: "Bett has tt, so its e is short."
  x9.o3: "both"
  x9.o3.fb: "Only Beet has ee. Bett has a short e."
  x9.expl: "Beet (flower bed) and Bett (bed) differ only in the length of the e."
  x10.prompt: "Correct the spelling mistake."
  x10.expl: "Name has no h: the single m already shows the long a. Zahl has an h, Name does not."
  x11.prompt: "Is this right? (lang = long)"
  x11.wrong: "mit is a short word with a short i, an exception to the one-consonant rule."
  x11.expl: "Short words like mit and das usually have a short vowel."
  x12.prompt: "Short vowels: complete each word."
  x12.expl: "Katze (cat), Mitte (middle), Wetter (weather): the consonants after the vowel show it is short."
  x13.prompt: "Which is the right spelling of the word for “child”?"
  x13.o2.fb: "You hear t at the end, but the word is written with d: Kind."
  x13.o3.fb: "ie would make the i long. Kind has a short i."
  x13.expl: "das Kind: short i before nd; the d is said like t."
  x14.prompt: "A classmate says this (ich glaube = I think). What do you answer?"
  x14.o2.fb: "Mann has nn after the a, so the a is short."
  x14.o3.fb: "Name has one m and a long a; Mann has nn and a short a."
  x14.expl: "Nein means no: the double n shows a short a."
  x15.prompt: "Complete the word for “number”."
  x15.r1: "Zal is not a word. The long a in Zahl is marked by h."
  x15.r2: "ll would make the a short. Zahl has a long a, marked by h."
  x15.expl: "die Zahl: h after the a marks it as long."
  tip: "lang means long, kurz means short. The rule says “usually”: short words such as mit and das have a short vowel even with one consonant."
