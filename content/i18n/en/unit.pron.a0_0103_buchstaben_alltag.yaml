strings:
  title: "Letters in everyday life: e-mail and street"
  summary: "Say an e-mail address and spell a street name."
  obj: "Say and understand an e-mail address and a spelt street name."
  intro: "When you give an e-mail address, say the signs as words: @ is „ät“, the dot is Punkt, - is Bindestrich and _ is Unterstrich. Many addresses write umlauts without dots: ü becomes ue, ö becomes oe, ä becomes ae. When you spell a street, say ß as „eszett“."
  examples: "Addresses, said aloud."
  summary_block: "**@ = ät, . = Punkt, - = Bindestrich, _ = Unterstrich.** In addresses **ü → ue, ö → oe, ä → ae**. Spell **ß** as **eszett**."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Said: anna Punkt berg ät web Punkt de."
  ex.2: "Punkt: the dot (.) in an address."
  ex.3: "Bindestrich: the hyphen (-)."
  ex.4: "Unterstrich: the underscore (_)."
  ex.5: "@ is said „ät“, from English „at“."
  ex.6: "In addresses, ü is often written ue: Müller → mueller."
  x1.prompt: "How do you say the sign @ in an e-mail address?"
  x1.o2.fb: "Punkt is the dot (.), not @."
  x1.o3.fb: "Bindestrich is the hyphen (-), not @."
  x1.expl: "@ is said „ät“."
  x2.prompt: "Write the German word for the dot in an e-mail address."
  x2.r1: "Punkt ends in -kt."
  x2.r2: "German writes k here: Punkt."
  x2.expl: "The dot is der Punkt."
  x3.prompt: "True or false?"
  x3.wrong: "It is right: - is called Bindestrich."
  x3.expl: "Binde- means joining: the hyphen joins two parts."
  x4.prompt: "Match each sign to its German name."
  x4.expl: "Punkt, Bindestrich and Unterstrich are the signs you need most in addresses."
  x5.prompt: "Which words do you need to say „anna.berg@web.de“?"
  x5.o3.fb: "There is no hyphen (-) in this address."
  x5.o4.fb: "There is no underscore (_) in this address."
  x5.expl: "anna Punkt berg ät web Punkt de."
  x6.prompt: "Complete how you say anna@web.de."
  x6.r1: "Punkt is the dot. Here the sign is @, said „ät“."
  x6.expl: "Between the name and the provider stands @, said „ät“."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "That spells only the surname; the question asks for the whole address."
  x7.o3.fb: "That is your name, not your e-mail address."
  x7.expl: "Say the whole address with Punkt and ät."
  x8.prompt: "Put the parts in order to say web.de."
  x8.expl: "web.de is said web Punkt de."
  x9.prompt: "Is this right?"
  x9.wrong: "It is right: many addresses write ü as ue, for example mueller."
  x9.expl: "Ue, oe and ae replace the umlauts when dots cannot be used."
  x10.prompt: "Write Müller as it often appears in an e-mail address, without the umlaut."
  x10.r1: "Without dots, ü becomes ue, not u: mueller."
  x10.r2: "This keeps the umlaut. In many addresses it is written ue: mueller."
  x10.expl: "Müller → mueller: ü is replaced by ue."
  x11.prompt: "Someone spells S – T – R – A – ß – E. Which word is it?"
  x11.o2.fb: "Strasse is spelt with two S; the person said ß (eszett)."
  x11.o3.fb: "Strase has one S; the person said ß (eszett)."
  x11.expl: "ß is spelt aloud as „eszett“: Straße."
  x12.prompt: "Complete how you say lisa.koch@gmx.de."
  x12.expl: "Each dot is said Punkt."
  x13.prompt: "Which of these can be part of an e-mail address?"
  x13.o4.fb: "A comma (Komma) is not used in e-mail addresses."
  x13.expl: "Dots, underscores and hyphens are common in addresses; commas are not."
  x14.prompt: "Write how you say this address."
  x14.r1: "Punkt is a noun: write it with a capital P."
  x14.expl: "tom@web.de: tom ät web Punkt de."
  x15.prompt: "How do you answer?"
  x15.o2.fb: "That says the street and number; the question asks for the letters."
  x15.o3.fb: "Danke does not answer the question how the street is written."
  x15.expl: "Wie schreibt man …? asks for the letters, so spell the name."
