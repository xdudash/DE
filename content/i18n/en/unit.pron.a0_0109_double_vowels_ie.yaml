strings:
  title: "Double vowels and ie"
  summary: "aa, ee, oo and ie always show a long vowel."
  obj: "Read and write words with aa, ee, oo and ie."
  intro: "Some long vowels are written twice: aa as in Haar, ee as in See, oo as in Boot. The long i is usually written ie: Bier, vier, sieben. There is no double i or double u in German words. A double consonant (tt, nn) is the opposite signal: it shows a short vowel."
  examples: "Words with double vowels and ie."
  summary_block: "**aa, ee, oo:** long a, e, o (Haar, See, Boot). **ie:** long i (Bier, vier). **tt, nn:** short vowel."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "hair: long a, written aa"
  ex.2: "pair, couple: long a, written aa"
  ex.3: "lake: long e, written ee"
  ex.4: "sea: long e, written ee"
  ex.5: "zoo: long o, written oo"
  ex.6: "beer: long i, written ie"
  ex.7: "four: long i, written ie"
  ex.8: "seven: long i, written ie"
  x1.prompt: "Which word writes the long i as ie?"
  x1.o2.fb: "Mitte has tt after the i, so the i is short and written with one i."
  x1.o3.fb: "Kind has nd after the i, so the i is short."
  x1.expl: "vier: ie is the long i."
  x2.prompt: "Write the word for “lake”."
  x2.r1: "See has a double e: ee is the long e."
  x2.r2: "Sea is English. German writes See."
  x2.expl: "der See: ee for the long e."
  x3.prompt: "Match each word to how its long vowel is written."
  x3.expl: "Each long vowel has its own double spelling; the long i uses ie."
  x4.prompt: "True or false?"
  x4.wrong: "It is true: ie is read as one long i, as in Bier."
  x4.expl: "ie is one sound: a long i."
  x5.prompt: "Which words have a double vowel?"
  x5.o4.fb: "Sonne has a double consonant, nn, not a double vowel."
  x5.o5.fb: "Bett has a double consonant, tt, not a double vowel."
  x5.expl: "Haar, Meer and Zoo double the vowel; Sonne and Bett double the consonant."
  x6.prompt: "Complete the word for “four”."
  x6.r1: "vier is v-i-e-r: first i, then e. ei would be the sound of drei."
  x6.r2: "The long i needs ie: vier."
  x6.expl: "vier: ie for the long i."
  x7.prompt: "A classmate asks how to spell a word. Which answer is right?"
  x7.o2.fb: "That spells Beir. The long i is written i first, then e."
  x7.o3.fb: "Without the e, the long i is not marked. Bier needs ie."
  x7.expl: "Bier: B, i, e, r."
  x8.prompt: "Complete the long vowels: boat, lake, animal."
  x8.expl: "Boot, See, Tier: oo, ee and ie."
  x9.prompt: "Which word writes the long a as aa?"
  x9.o2.fb: "Mann has nn after the a, so the a is short."
  x9.o3.fb: "Tag has a long a, but it is written with one a."
  x9.expl: "Paar: aa is a long a."
  x10.prompt: "Spell the word for “beer”."
  x10.r1: "Bier needs the e: ie is the long i."
  x10.r2: "Beer is English. German writes the long i as ie: Bier."
  x10.r3: "Beir swaps the letters. Write i first, then e: Bier."
  x10.expl: "Bier: B-i-e-r."
  x11.prompt: "Is this right?"
  x11.wrong: "Haar has aa. A double vowel is always long."
  x11.expl: "aa, ee and oo show a long vowel."
  x12.prompt: "Complete the word for “seven”."
  x12.r1: "sieben has a long i, written ie."
  x12.r2: "seiben is not a word. The long i is ie: sieben."
  x12.expl: "sieben: ie for the long i."
  x13.prompt: "Which words have a long i?"
  x13.o4.fb: "Kind has nd after the i, so the i is short."
  x13.o5.fb: "bitte has tt after the i, so the i is short."
  x13.expl: "sieben, Tier and wie all have ie."
  x14.prompt: "Type the word for “zoo”."
  x14.r1: "Zoo has a double o: the long o is written oo."
  x14.expl: "der Zoo: oo for the long o."
  x15.prompt: "Which spelling shows a short vowel?"
  x15.o2.fb: "ie shows a long i."
  x15.o3.fb: "oo shows a long o."
  x15.expl: "A double consonant like tt shows a short vowel; a double vowel shows a long one."
  tip: "Do not mix up ie and ei: ie is a long i (vier), ei is a different sound (drei, ein)."
