strings:
  title: "Long and short o and u"
  summary: "Read o and u as long or short from the letters around them."
  obj: "Tell long and short o and u apart from the spelling of a word."
  intro: "The same spelling rule works for o and u. A double consonant (nn, tt, mm) or two consonants (st, nd) after the vowel usually make it short: Sonne, Mutter, Post, Hund. One consonant, an h or a double vowel usually make it long: rot, gut, Sohn, Uhr, Boot."
  examples: "Long and short o and u in words."
  summary_block: "**Short o and u:** Sonne, Post, Mutter, Hund. **Long o and u:** Boot, Sohn, rot, gut, Uhr."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "boat: long o, written oo"
  ex.2: "sun: short o, double n"
  ex.3: "son: long o, marked by h"
  ex.4: "red: long o, one t"
  ex.5: "mother: short u, double t"
  ex.6: "good: long u, one t"
  ex.7: "clock: long u, marked by h"
  ex.8: "dog: short u, two consonants nd"
  x1.prompt: "Which words have a long o?"
  x1.o4.fb: "Sonne has nn after the o, so the o is short."
  x1.o5.fb: "Post has two consonants, st, after the o, so the o is short."
  x1.expl: "Boot has oo, Sohn has oh and rot has one consonant: all long."
  x2.prompt: "Complete the word for “mother”."
  x2.r1: "With one t the u would be long. Mutter has a short u, so it needs tt."
  x2.expl: "Mutter: tt after the short u."
  x3.prompt: "Which word has a short u?"
  x3.o2.fb: "gut has one t after the u, so the u is long."
  x3.o3.fb: "Uhr has an h after the u, so the u is long."
  x3.expl: "Hund has nd after the u, so the u is short."
  x4.prompt: "Match each word to its vowel."
  x4.expl: "oo and one consonant: long. nn and tt: short."
  x5.prompt: "True or false?"
  x5.wrong: "It is true: Sohn has an h after the o, and oh is a long o."
  x5.expl: "An h after a vowel marks it as long."
  x6.prompt: "Write the word for “boat”."
  x6.r1: "Boot has a double o for the long o."
  x6.r2: "Boat is English. German writes Boot."
  x6.expl: "Boot: oo is a long o."
  x7.prompt: "A classmate asks you. What do you answer?"
  x7.o2.fb: "Butter has tt after the u, so the u is short."
  x7.o3.fb: "Butter is spelt B-u-t-t-e-r: there is a u."
  x7.expl: "Kurz means short: tt follows the u."
  x8.prompt: "Short o: complete each word with a double consonant."
  x8.expl: "Sonne, kommen and Koffer: the double consonant shows the short o."
  x9.prompt: "Which word shows the long u with an h?"
  x9.o2.fb: "Hund has nd after the u, so the u is short, and there is no h."
  x9.o3.fb: "Mutter has tt after the u, so the u is short."
  x9.expl: "Uhr: the h after the u marks it as long."
  x10.prompt: "Spell the word for “good” (long u)."
  x10.r1: "With tt the u would be short. gut has one t."
  x10.r2: "gut has no h: g-u-t. One t already shows the long u."
  x10.expl: "gut: one t after the long u."
  x11.prompt: "Is this right?"
  x11.wrong: "Post has two consonants, st, after the o, so the o is short."
  x11.expl: "Two consonants after a vowel usually make it short."
  x12.prompt: "Complete with the word for “sun” (short o, nn)."
  x12.r1: "Sonne needs nn: the o is short."
  x12.expl: "Die Sonne ist warm means the sun is warm."
  x13.prompt: "Which words have a short vowel?"
  x13.o4.fb: "Brot has one t after the o, so the o is long."
  x13.o5.fb: "Schuh has an h after the u, so the u is long."
  x13.expl: "Hund has nd, kommen mm and Koffer ff: all short."
  x14.prompt: "Type the word for “clock”."
  x14.r1: "Uhr has an h after the U: the long u is written uh."
  x14.expl: "Uhr also means o'clock: drei Uhr."
  x15.prompt: "Which word writes the long o as oo?"
  x15.o2.fb: "Brot has a long o, but it is written with one o."
  x15.o3.fb: "Sohn has a long o written oh, not oo."
  x15.expl: "A long vowel can be written three ways: one letter, with h, or doubled."
  tip: "Remember from the last lesson: lang means long, kurz means short."
