strings:
  title: "Long and short o and u"
  summary: "Read o and u as long or short from the letters around them; a few words are exceptions."
  obj: "Tell long and short o and u apart from the spelling of a word."
  intro: "The rule from the last lesson works for o and u too. A double consonant (nn, tt, mm) or two consonants (st, nd) after the vowel usually make it short: Sonne, Mutter, Post, Hund. One consonant, an h or a double vowel usually make it long: rot, gut, Sohn, Uhr, Boot. Length matters: Sohn (son) and Sonne (sun) differ in it."
  examples: "Long and short o and u in words."
  summary_block: "**Usually short o and u:** Sonne, Post, Mutter, Hund. **Usually long o and u:** Boot, Sohn, rot, gut, Uhr. **Exception:** Buch, Kuchen (long u before ch)."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "boat: long o, written oo"
  ex.2: "sun: short o, double n"
  ex.3: "son: long o, marked by h"
  ex.4: "red: long o, one t"
  ex.5: "mother: short u, double t"
  ex.6: "good: long u, one t"
  ex.7: "clock: long u, marked by h"
  ex.8: "dog: short u, two consonants nd (the d at the end is said like t)"
  ex.9: "The clock is red."
  ex.10: "The bread is good."
  x1.prompt: "Which words have a long o?"
  x1.o4.fb: "Sonne has nn after the o, so the o is short."
  x1.o5.fb: "Post has two consonants, st, after the o, so the o is short."
  x1.expl: "Boot has oo, Sohn has oh and rot has one consonant: all long."
  x2.prompt: "Match each word to its vowel (kurz = short, lang = long)."
  x2.expl: "nn and nd: short. One t: long (Brot, Hut)."
  x3.prompt: "True or false? (lang = long)"
  x3.wrong: "It is true: Sohn has an h after the o, and oh is a long o."
  x3.expl: "An h after a vowel marks it as long."
  x4.prompt: "Complete the word for “mother”. (My mother is a teacher.)"
  x4.r1: "With one t the u would be long. Mutter has a short u, so it needs tt."
  x4.expl: "Mutter: tt after the short u."
  x5.prompt: "Which word has a short u?"
  x5.o2.fb: "gut has one t after the u, so the u is long."
  x5.o3.fb: "Uhr has an h after the u, so the u is long."
  x5.expl: "Hund has nd after the u, so the u is short."
  x6.prompt: "Write the German word for “boat”."
  x6.r1: "Boot has a double o for the long o."
  x6.r2: "Boat is English. German writes Boot."
  x6.expl: "das Boot: oo is a long o."
  x7.prompt: "A classmate asks (Wie heißt das auf Deutsch? = What is that in German?). What do you answer?"
  x7.o2.fb: "With one n the o would be long. The sun is Sonne, with nn."
  x7.o3.fb: "Sohn is the son, with a long o. The sun is Sonne, with a short o."
  x7.expl: "die Sonne: short o before nn."
  x8.prompt: "Build the sentence “The clock is red.”"
  x8.expl: "Die Uhr ist rot: long u in Uhr, long o in rot."
  x9.prompt: "Which of the two words has a long o?"
  x9.o2.fb: "Sonne has nn, so its o is short."
  x9.o3: "both"
  x9.o3.fb: "Only Sohn has a long o (oh). Sonne has a short o."
  x9.expl: "Sohn (son) and Sonne (sun) differ in the length of the o."
  x10.prompt: "Correct the spelling mistake."
  x10.expl: "gut has one t: the u is long."
  x11.prompt: "Is this right? (lang = long)"
  x11.wrong: "It is true: Buch has a long u, although ch follows. Buch and Kuchen are exceptions."
  x11.expl: "The rule says “usually”: Buch and Kuchen have a long u before ch."
  x12.prompt: "Short o: complete the words for sun, to come and suitcase."
  x12.expl: "Sonne, kommen and Koffer: the double consonant shows the short o."
  x13.prompt: "Which is the right spelling of the word for “dog”?"
  x13.o2.fb: "You hear t at the end, but the word is written with d: Hund."
  x13.o3.fb: "h would mark a long u. Hund has a short u."
  x13.expl: "der Hund: short u before nd; the d is said like t."
  x14.prompt: "A classmate says this (ich glaube = I think). What do you answer?"
  x14.o2.fb: "Post has two consonants, st, after the o, so the o is short."
  x14.o3.fb: "Boot has oo and a long o; Post has st and a short o."
  x14.expl: "Nein means no: st after the o makes it short."
  x15.prompt: "Complete the word for “clock”."
  x15.r1: "Ur is not the clock. The long u is marked by h: Uhr."
  x15.expl: "die Uhr: h after the u marks it as long."
  tip: "Exception you will meet often: Buch (book) and Kuchen (cake) have a long u, although ch follows."
