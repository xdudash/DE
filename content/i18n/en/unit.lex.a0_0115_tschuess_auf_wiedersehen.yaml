schema: deutschgo.l10n/1
entity: unit.lex.a0_0115_tschuess_auf_wiedersehen
lang: en
based_on_version: 1.1.0
status: draft
translator: claude (AI draft, 2026-10-25)
strings:
  title: "Goodbyes: Tschüss and Auf Wiedersehen"
  summary: "Tschüss with people you know, Auf Wiedersehen politely with anyone; Bis bald and Bis morgen when you will meet again."
  obj: "Choose a goodbye that fits the person and say when you will meet again."
  intro: "Tschüss is the informal goodbye for friends, classmates and colleagues you know. Auf Wiedersehen is the polite goodbye: at a counter, in a shop, with people you do not know well. Bis bald means see you soon; Bis morgen means see you tomorrow. Both can follow Tschüss."
  examples: "Goodbyes in short scenes."
  summary_block: "**Tschüss** is informal. **Auf Wiedersehen** is polite. **Bis bald** means see you soon, **Bis morgen** see you tomorrow."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Bye, Anna! (to a friend; the ü is short)"
  ex.2: "Goodbye, Mr Klein! (polite; ie is a long i, the h is not spoken)"
  ex.3: "See you soon!"
  ex.4: "See you tomorrow, Ms Weber! (morgen here means tomorrow and is written small)"
  ex.5: "Bye, and see you soon!"
  x1.prompt: "Join the two halves of each goodbye."
  x1.expl: "Auf Wiedersehen, Bis bald and Gute Nacht are fixed phrases."
  x2.prompt: "You leave a friend's party. What do you say?"
  x2.o2.fb: "Guten Tag is a greeting for arriving, not for leaving."
  x2.o3.fb: "Hallo greets someone; you are leaving."
  x2.expl: "With friends the goodbye is Tschüss."
  x3.prompt: "True or false? (= means “means the same as”)"
  x3.wrong: "Guten Tag greets someone who arrives; Bis bald says goodbye until you meet again soon."
  x3.expl: "Bis bald is a goodbye, Guten Tag a greeting."
  x4.prompt: "You will see your colleague again tomorrow. Complete the goodbye."
  x4.r1: "Bis bald means see you soon, without a day; for tomorrow say Bis morgen."
  x4.r2: "Bis bald has no day; for tomorrow say Bis morgen."
  x4.expl: "Morgen here means tomorrow: Bis morgen."
  x5.prompt: "Which of these say goodbye?"
  x5.o4.fb: "Guten Morgen greets someone in the morning."
  x5.o5.fb: "Hallo greets someone who arrives."
  x5.expl: "Tschüss, Auf Wiedersehen and Bis bald close a conversation."
  x6.prompt: "Put the words in order."
  x6.expl: "The goodbye comes first, then the name."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "Hallo opens a conversation; Frau Weber is leaving."
  x7.o3.fb: "Guten Morgen is a greeting, but this is a goodbye."
  x7.expl: "Answer a polite goodbye with a polite goodbye."
  x8.prompt: "True or false? (= means “means the same as”)"
  x8.wrong: "Bis morgen names a day: tomorrow. Bis bald says soon, without a day."
  x8.expl: "morgen = tomorrow, bald = soon."
  x9.prompt: "Complete the goodbye between two friends."
  x9.expl: "Bis morgen or Bis bald, and Tschüss back."
  x10.prompt: "You leave the counter at the bank. Which goodbye fits?"
  x10.o2.fb: "Tschüss is informal; at a bank counter the polite goodbye is safer."
  x10.o3.fb: "Bis bald says you will meet soon; you do not know when you will see the bank clerk again."
  x10.expl: "With people you do not know, Auf Wiedersehen is the polite choice."
  x11.prompt: "Make this goodbye polite."
  x11.expl: "With Frau and a surname, Auf Wiedersehen is the polite goodbye."
  x12.prompt: "Your friend Anna is leaving; you will meet tomorrow. What do you answer?"
  x12.o2.fb: "Guten Tag greets someone who arrives; Anna is leaving."
  x12.o3.fb: "Wrong person: you are talking to your friend Anna, not Herr Klein."
  x12.expl: "Tschüss back, and bis morgen because you meet tomorrow."
  x13.prompt: "Write the polite goodbye (two words)."
  x13.r1: "Wieder- is written with ie: Wiedersehen."
  x13.r2: "Wiedersehen is a noun: write it with a capital W."
  x13.r3: "In writing use the full form Wiedersehen, with -en."
  x13.expl: "Auf Wiedersehen: two words, Wiedersehen with ie and a capital W."
  x14.prompt: "Which word means “soon”?"
  x14.o2.fb: "morgen means tomorrow."
  x14.o3.fb: "bis means until: Bis bald is literally until soon."
  x14.expl: "bald means soon: Bis bald!"
  x15.prompt: "Is this right? (+ means “and”)"
  x15.wrong: "It is true: wieder means again and sehen means to see."
  x15.expl: "Auf Wiedersehen is literally until seeing again."
  x16.prompt: "Write in German: “See you tomorrow!”"
  x16.r1: "Here morgen means tomorrow and is written with a small m."
  x16.r2: "Bis bald is see you soon; for tomorrow write Bis morgen."
  x16.expl: "Bis morgen: morgen with a small m means tomorrow."
  tip: "Tschüss and Tschüs are both correct spellings. Wiedersehen is wieder (again) + sehen (to see)."
