strings:
  title: "Goodbyes: Tschüss and Auf Wiedersehen"
  summary: "Tschüss with people you know, Auf Wiedersehen politely with anyone; Bis bald and Bis morgen when you will meet again."
  obj: "Choose a goodbye that fits the person and say when you will meet again."
  intro: "Tschüss is the informal goodbye for friends, classmates and colleagues you know. Auf Wiedersehen is the polite goodbye: at a counter, in a shop, with people you do not know well. Bis bald means see you soon; Bis morgen means see you tomorrow. Both can follow Tschüss."
  examples: "Goodbyes in short scenes."
  summary_block: "**Tschüss** is informal. **Auf Wiedersehen** is polite. **Bis bald** means see you soon, **Bis morgen** see you tomorrow."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Bye, Anna! (to a friend)"
  ex.2: "Goodbye, Mr Klein! (polite)"
  ex.3: "See you soon!"
  ex.4: "See you tomorrow, Ms Weber! (to a colleague)"
  ex.5: "Bye, and see you soon!"
  x1.prompt: "You leave a friend's party. What do you say?"
  x1.o2.fb: "Guten Tag is a greeting for arriving, not for leaving."
  x1.o3.fb: "Hallo greets someone; you are leaving."
  x1.expl: "With friends the goodbye is Tschüss."
  x2.prompt: "Write the polite goodbye (two words)."
  x2.r1: "Wieder- is written with ie: Wiedersehen."
  x2.r2: "Wiedersehen is a noun: write it with a capital W."
  x2.r3: "In writing use the full form Wiedersehen, with -en."
  x2.expl: "Auf Wiedersehen: two words, Wiedersehen with ie and a capital W."
  x3.prompt: "True or false?"
  x3.wrong: "It is right: Tschüss is the informal goodbye for friends."
  x3.expl: "Tschüss is informal and very common."
  x4.prompt: "Join the two halves of each goodbye."
  x4.expl: "Auf Wiedersehen, Bis bald and Gute Nacht are fixed phrases."
  x5.prompt: "Which of these say goodbye?"
  x5.o4.fb: "Guten Morgen greets someone in the morning."
  x5.expl: "Tschüss, Auf Wiedersehen and Bis bald close a conversation."
  x6.prompt: "You will see your colleague again tomorrow. Complete the goodbye."
  x6.r1: "Bis bald means see you soon, without a day; for tomorrow say Bis morgen."
  x6.expl: "Morgen here means tomorrow: Bis morgen."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "Hallo opens a conversation; Frau Weber is leaving."
  x7.o3.fb: "Guten Morgen is a greeting, but this is a goodbye."
  x7.expl: "Answer a polite goodbye with a polite goodbye."
  x8.prompt: "Put the words in order."
  x8.expl: "The goodbye comes first, then the name."
  x9.prompt: "Is this right?"
  x9.wrong: "Auf Wiedersehen is the polite goodbye; you can say it to anyone, also to people you do not know."
  x9.expl: "With friends Tschüss is more usual."
  x10.prompt: "Complete the goodbye between two friends."
  x10.expl: "Bis morgen or Bis bald, and Tschüss back."
  x11.prompt: "You leave the counter at the bank. Which goodbye fits?"
  x11.o2.fb: "Tschüss is informal; at a bank counter use the polite goodbye."
  x11.o3.fb: "Bis bald says you will meet soon; you do not know when you will see the bank clerk again."
  x11.expl: "With people you do not know, Auf Wiedersehen is the polite choice."
  x12.prompt: "Make this goodbye polite."
  x12.expl: "With Frau and a surname, Auf Wiedersehen is the polite goodbye."
  x13.prompt: "How do you answer?"
  x13.o2.fb: "Guten Morgen greets someone in the morning; your friend is leaving now."
  x13.o3.fb: "Hallo greets someone who arrives."
  x13.expl: "Repeating the goodbye is a natural answer."
  x14.prompt: "Build the polite goodbye."
  x14.expl: "Auf Wiedersehen first, then Herr and the surname."
  x15.prompt: "Which word means “soon”?"
  x15.o2.fb: "morgen means tomorrow."
  x15.o3.fb: "Nacht means night."
  x15.expl: "bald means soon: Bis bald!"
  x16.prompt: "Write the informal goodbye."
  x16.r1: "Tschüss has ü, with two dots."
  x16.expl: "Tschüss or Tschüs: both spellings are correct."
  tip: "Tschüss and Tschüs are both correct spellings. Wiedersehen means seeing again."
