  title: "Goodbyes: Tschüss and Auf Wiedersehen"
  summary: "Tschüss with friends, Auf Wiedersehen with people you respect."
  obj: "Choose the goodbye that fits the person."
  intro: "Tschüss is the informal goodbye, for friends and people of your age. Auf Wiedersehen is formal: use it with teachers, bosses and strangers. Bis bald means see you soon."
