schema: deutschgo.l10n/1
entity: unit.lex.a0_0118_gern_geschehen_entschuldigung
lang: en
based_on_version: 1.0.0
status: draft
translator: claude (AI draft, 2026-10-25)
strings:
  title: "Gern geschehen and Entschuldigung"
  summary: "Answer thanks with Gern geschehen or Kein Problem, and use Entschuldigung to say sorry or to get attention."
  obj: "Answer thanks in different ways and use Entschuldigung to apologise or to get attention."
  intro: "Besides Bitte, you can answer thanks with Gern geschehen (my pleasure), the short Gern, or the casual Kein Problem (no problem). Entschuldigung has two uses: it says sorry, for example when you bump into someone, and it gets a stranger's attention before a question: Entschuldigung, wo ist der Bahnhof?"
  examples: "Answering thanks and saying sorry."
  summary_block: "**Gern geschehen**, **Gern** and **Kein Problem** answer thanks. **Entschuldigung** says sorry or gets attention before a question."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Thanks! – My pleasure!"
  ex.2: "Thanks! – Sure! (short)"
  ex.3: "Many thanks! – No problem! (casual)"
  ex.4: "Oh, sorry! (you bumped into someone)"
  ex.5: "Excuse me, where is the station?"
  ex.6: "Sorry! – No problem!"
  x1.prompt: "Someone thanks you for your help. Which reply means “my pleasure”?"
  x1.o2.fb: "Entschuldigung says sorry or gets attention; it does not answer thanks."
  x1.o3.fb: "Danke thanks someone; here you are the one being thanked."
  x1.expl: "Gern geschehen answers thanks warmly."
  x2.prompt: "Write the polite reply to thanks with geschehen."
  x2.r1: "Geschehen is ge-sche-hen: write all of it."
  x2.expl: "Gern geschehen (also Gerne geschehen) means my pleasure."
  x3.prompt: "True or false?"
  x3.wrong: "It is right: Kein Problem is a casual reply to thanks."
  x3.expl: "Kein Problem is casual; Gern geschehen is a little more polite."
  x4.prompt: "Join the two halves of each phrase."
  x4.expl: "Gern geschehen, Kein Problem and Vielen Dank are fixed phrases."
  x5.prompt: "Which replies fit after “Danke!”?"
  x5.o5.fb: "Entschuldigung says sorry; nobody needs an apology here."
  x5.expl: "Gern geschehen, Gern, Kein Problem and Bitte all answer thanks."
  x6.prompt: "You step on someone's foot. Say sorry."
  x6.r1: "The word is Entschuldigung, ending in -ung."
  x6.r2: "Entschuldigung is a noun: write it with a capital E."
  x6.expl: "Entschuldigung says sorry."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "Gern geschehen answers thanks, not an apology."
  x7.o3.fb: "Guten Abend is a greeting; the person is apologising."
  x7.expl: "Kein Problem accepts an apology."
  x8.prompt: "Put the words in order."
  x8.expl: "Entschuldigung first, to get attention, then the question."
  x9.prompt: "Is this right?"
  x9.wrong: "Entschuldigung says sorry or gets attention; the reply to Danke is Bitte or Gern geschehen."
  x9.expl: "Danke is answered with Bitte, Gern geschehen or Kein Problem."
  x10.prompt: "Complete the dialogue in the street."
  x10.expl: "Entschuldigung opens the question; Gern geschehen answers the thanks. Da links means over there on the left."
  x11.prompt: "You want to ask a stranger in the street a question. How do you start?"
  x11.o2.fb: "Gern geschehen answers thanks; it cannot start a question."
  x11.o3.fb: "Tschüss says goodbye; you are only starting to talk."
  x11.expl: "Entschuldigung politely gets a stranger's attention."
  x12.prompt: "Answer the thanks more politely, with geschehen."
  x12.expl: "Kein Problem is casual; Gern geschehen is warmer and more polite."
  x13.prompt: "How do you answer?"
  x13.o2.fb: "There is nothing to apologise for; answer the thanks."
  x13.o3.fb: "You heard the thanks; there is no need to ask again."
  x13.expl: "Für die Hilfe means for the help. Answer with Gern geschehen."
  x14.prompt: "Build the reply."
  x14.expl: "Kein Problem first, then the name."
  x15.prompt: "What does Entschuldigung do in “Entschuldigung, wo ist der Bahnhof?”"
  x15.o1: "It politely gets attention."
  x15.o2: "It thanks someone."
  x15.o2.fb: "Thanking is Danke or Vielen Dank."
  x15.o3: "It says goodbye."
  x15.o3.fb: "Goodbye is Tschüss or Auf Wiedersehen."
  x15.expl: "Before a question, Entschuldigung means excuse me."
  x16.prompt: "Write the casual reply to thanks with Problem."
  x16.r1: "It is Kein, without -e: Kein Problem is a fixed phrase."
  x16.r2: "Problem is written P-r-o-b-l-e-m."
  x16.expl: "Kein Problem means no problem."
