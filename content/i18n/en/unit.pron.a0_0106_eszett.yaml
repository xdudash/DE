strings:
  title: "ß and ss"
  summary: "After a long vowel write ß; after a short vowel write ss."
  obj: "Choose ß or ss from the vowel before it."
  intro: "ß and ss sound the same: a sharp s. The vowel before them decides the spelling. After a long vowel (or ei, au) write ß: Straße, groß, Fuß. After a short vowel write ss: Fluss, Wasser. In Switzerland ß is not used: people write ss everywhere (Strasse)."
  examples: "Words with ß and ss."
  summary_block: "**Long vowel + ß:** Straße, groß, Fuß. **Short vowel + ss:** Fluss, Wasser. Switzerland writes **ss** for both."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Straße (street): ß after the long a."
  ex.2: "groß (big): ß after the long o."
  ex.3: "Fuß (foot): ß after the long u."
  ex.4: "Fluss (river): ss after the short u."
  ex.5: "Wasser (water): ss after the short a."
  ex.6: "In Switzerland: Strasse with ss."
  x1.prompt: "Which spelling is used in Germany and Austria?"
  x1.o2.fb: "Strasse is the Swiss spelling; Germany and Austria write Straße."
  x1.o3.fb: "One s is not enough here; after the long a write ß."
  x1.expl: "The a in Straße is long, so ß."
  x2.prompt: "Write the word for “big”. The o is long."
  x2.r1: "After the long o write ß: groß. Only Switzerland writes gross."
  x2.r2: "The sharp s after a long vowel is ß: groß."
  x2.expl: "groß: long o + ß."
  x3.prompt: "True or false?"
  x3.wrong: "It is right: after a short vowel write ss, as in Fluss."
  x3.expl: "Short vowel + ss: Fluss, Wasser."
  x4.prompt: "Join the halves of each word."
  x4.expl: "Hauptstraße (main street), Mineralwasser (mineral water), Fußball (football)."
  x5.prompt: "Which words are written with ß?"
  x5.o3.fb: "Fluss has a short u, so ss."
  x5.o4.fb: "Wasser has a short a, so ss."
  x5.expl: "Straße and groß have long vowels before ß."
  x6.prompt: "Fill in ß or ss: Fu_ (foot)."
  x6.r1: "The u in Fuß is long, so write ß."
  x6.r2: "One s is not the spelling here; write ß."
  x6.expl: "Fuß: long u + ß."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "One S is wrong; Straße has ß."
  x7.o3.fb: "Z is a different sound (ts); Straße has ß."
  x7.expl: "ß is spelt aloud as „eszett“."
  x8.prompt: "Fill in ß or ss."
  x8.expl: "Wasser: short a + ss. Fußball: long u + ß."
  x9.prompt: "Is this right?"
  x9.wrong: "It is right: Switzerland does not use ß and writes ss."
  x9.expl: "Swiss German spelling has no ß."
  x10.prompt: "Write the word for “river”. The u is short."
  x10.r1: "Fluß is the old spelling; today write Fluss (short u + ss)."
  x10.r2: "After the short u write ss: Fluss."
  x10.expl: "Fluss: short u + ss."
  x11.prompt: "Why is groß written with ß?"
  x11.o1: "The o is long."
  x11.o2: "The o is short."
  x11.o2.fb: "In groß the o is long; after a short vowel you would write ss."
  x11.o3: "ß comes at the end of every word."
  x11.o3.fb: "No: Fluss ends in ss. The vowel before it decides."
  x11.expl: "Long vowel + ß."
  x12.prompt: "Write this word the way it is spelt in Germany."
  x12.expl: "gross is the Swiss spelling; in Germany: groß."
  x13.prompt: "Which words have ss?"
  x13.o3.fb: "Fuß has a long u, so ß."
  x13.o4.fb: "groß has a long o, so ß."
  x13.expl: "Fluss and Wasser have short vowels before ss."
  x14.prompt: "Which is missing, ß or ss? Wa_er (water)"
  x14.r1: "The a in Wasser is short, so write ss."
  x14.r2: "One s would make the a long; Wasser has ss."
  x14.expl: "Wasser: short a + ss."
  x15.prompt: "How do you answer?"
  x15.o2.fb: "The u in Fuß is long, so ß."
  x15.o3.fb: "A single s is not the spelling; Fuß has ß."
  x15.expl: "Fuß: long u + ß."
  tip: "Not sure? Say the word slowly. If the vowel is long, write ß; if it is short and quick, write ss."
