translator: claude (AI draft, 2026-10-25)
strings:
  title: "Danke and Bitte"
  summary: "Say thank you, ask for something with bitte, and answer thanks."
  obj: "Thank someone, ask politely with bitte and answer thanks."
  intro: "Danke means thank you; Danke schön and Vielen Dank are warmer. Bitte has two jobs: in a request it means please (Ein Wasser, bitte.), and after Danke it means you're welcome. Bitte schön is also what you say when you hand something to someone."
  examples: "Thanks and please in short scenes."
  summary_block: "**Danke**, **Danke schön**, **Vielen Dank** thank someone. **Bitte** means please in a request and you're welcome after thanks. **Bitte schön** when you hand something over."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Thanks!"
  ex.2: "Thank you very much! (a little warmer)"
  ex.3: "Many thanks!"
  ex.4: "A water, please. (ordering)"
  ex.5: "Thanks! – You're welcome!"
  ex.6: "Here you are! (when handing something over)"
  x1.prompt: "Someone holds the door for you. What do you say?"
  x1.o2.fb: "Bitte answers someone else's thanks or asks for something; here you are the one who thanks."
  x1.o3.fb: "Tschüss is a goodbye; the person has done something kind for you."
  x1.expl: "For a small kindness, say Danke."
  x2.prompt: "Write the warmer way to say thanks with schön."
  x2.r1: "Schön is written s-c-h-ö-n, with ö."
  x2.expl: "Danke schön (also written Dankeschön) is a warmer thank you."
  x3.prompt: "True or false?"
  x3.wrong: "It is right: Bitte! is the usual reply to Danke!"
  x3.expl: "Antwort means answer. Danke! – Bitte! is a fixed pair."
  x4.prompt: "Join the two halves of each phrase."
  x4.expl: "Vielen Dank, Danke schön and Ein Wasser, bitte are fixed phrases."
  x5.prompt: "Which of these thank someone?"
  x5.o4.fb: "Bitte asks for something or answers thanks; it does not thank."
  x5.expl: "Danke, Danke schön and Vielen Dank all say thank you."
  x6.prompt: "Ask for a water politely."
  x6.r1: "Danke thanks someone; to ask for something, add bitte."
  x6.r2: "Bitte has a double t."
  x6.expl: "In a request, bitte means please."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "Saying Danke back does not answer the thanks; reply with Bitte."
  x7.o3.fb: "That is a goodbye, not a reply to thanks."
  x7.expl: "Danke! – Bitte! is the usual pair."
  x8.prompt: "Put the words in order."
  x8.expl: "First what you want, then bitte."
  x9.prompt: "Is this right?"
  x9.wrong: "Vielen Dank means many thanks; it is not a greeting."
  x9.expl: "Begrüßung means greeting, like Hallo or Guten Tag."
  x10.prompt: "Complete the scene at the café counter."
  x10.expl: "You ask with bitte, the waiter hands it over with Bitte schön, and you thank with Danke schön."
  x11.prompt: "You hand a customer the coffee they ordered. What do you say?"
  x11.o2.fb: "Danke schön thanks someone; when you hand something over, say Bitte schön."
  x11.o3.fb: "That is a greeting, not what you say when handing something over."
  x11.expl: "Bitte schön goes with handing something over."
  x12.prompt: "Make this request polite."
  x12.expl: "Add bitte: Ein Wasser, bitte."
  x13.prompt: "How do you answer?"
  x13.o2.fb: "Repeating the thanks does not answer it; reply with Bitte or Bitte schön."
  x13.o3.fb: "Guten Tag is a greeting, not a reply to thanks."
  x13.expl: "Bitte schön answers a warm thank you."
  x14.prompt: "Build the thank-you."
  x14.expl: "Vielen Dank first, then the name."
  x15.prompt: "Which word means “please”?"
  x15.o2.fb: "danke means thank you."
  x15.o3.fb: "schön means nice; in Danke schön it makes the thanks warmer."
  x15.expl: "bitte means please."
  x16.prompt: "Write a one-word reply to Danke."
  x16.r1: "Danke thanks someone; the reply to thanks is Bitte."
  x16.r2: "Bitte has a double t."
  x16.expl: "Danke! – Bitte!"
