strings:
  title: "Umlauts: the sounds"
  summary: "Ä, Ö and Ü each have their own sound. Learn each with a word."
  obj: "Tell ä, ö and ü apart and write them in simple words."
  intro: "Ä, Ö and Ü are letters of their own. Ä sounds close to the e in „bed“, often longer. For ö, say „e“ and round your lips. For ü, say „i“ and round your lips. The dots matter: without them the word is different or wrong."
  examples: "One word for each umlaut."
  summary_block: "**ä** ≈ e in „bed“. **ö** = e with rounded lips. **ü** = i with rounded lips. The dots belong to the letter."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Käse (cheese): ä, close to e in „bed“, but longer."
  ex.2: "Bär (bear): a long ä."
  ex.3: "schön (nice): say e with rounded lips."
  ex.4: "Öl (oil): a long ö at the start of the word."
  ex.5: "über (over): say i with rounded lips."
  ex.6: "Tür (door): ü in the middle of the word."
  x1.prompt: "Which umlaut do you get when you say „e“ with rounded lips?"
  x1.o2.fb: "ä is close to e in „bed“, without rounded lips."
  x1.o3.fb: "ü is „i“ with rounded lips, not „e“."
  x1.expl: "e + rounded lips = ö, as in schön."
  x2.prompt: "Write the German word for “cheese”. It has ä."
  x2.r1: "Käse needs the two dots: ä."
  x2.r2: "Kaese is the spelling without an umlaut key; in normal writing use ä: Käse."
  x2.expl: "Käse: K – Ä – S – E."
  x3.prompt: "True or false?"
  x3.wrong: "It is right: say „i“, round your lips, and you get ü."
  x3.expl: "Ü = i with rounded lips, as in über."
  x4.prompt: "Match each word to its umlaut."
  x4.expl: "Käse has ä, schön has ö, über has ü."
  x5.prompt: "Which words have the sound ü?"
  x5.o3.fb: "Tor (gate) has o, not ü."
  x5.o4.fb: "Hut (hat) has u without dots."
  x5.expl: "über and Tür have ü; Tor and Hut have plain o and u."
  x6.prompt: "Fill in the missing umlaut: sch_n (nice)."
  x6.r1: "Without dots it is o; schön needs ö."
  x6.r2: "ü is a different umlaut; schön has ö."
  x6.expl: "schön: S – C – H – Ö – N."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "That is O without dots; schön has Ö."
  x7.o3.fb: "Ä is a different umlaut; schön has Ö."
  x7.expl: "Spell the umlaut as a letter of its own: Ö."
  x8.prompt: "Fill in the umlauts."
  x8.expl: "Käse has ä; schön has ö."
  x9.prompt: "Is this right?"
  x9.wrong: "No: Ö and O are different letters with different sounds."
  x9.expl: "The dots make a new letter: O and Ö are not the same."
  x10.prompt: "Write the German word for “door”. It has ü."
  x10.r1: "Tür needs the dots: ü."
  x10.r2: "Tor is a gate. The door is Tür, with ü."
  x10.expl: "Tür: T – Ü – R."
  x11.prompt: "Which letter is in „Bär“ (bear)?"
  x11.o2.fb: "Bär has two dots on the a: ä."
  x11.o3.fb: "The sound is close to e, but the letter is ä."
  x11.expl: "Bär: B – Ä – R."
  x12.prompt: "Correct the spelling: this word needs an umlaut."
  x12.expl: "über is written with ü."
  x13.prompt: "Which words have the sound ö?"
  x13.o3.fb: "Bär has ä, not ö."
  x13.o4.fb: "Ofen (oven) has o without dots."
  x13.expl: "schön and Öl have ö."
  x14.prompt: "Which letter is missing? B_r (bear)"
  x14.r1: "Without dots it is a; Bär needs ä."
  x14.r2: "The sound is close to e, but Bär is written with ä."
  x14.expl: "Bär: the long ä."
  x15.prompt: "How do you answer?"
  x15.o2.fb: "über has two dots: Ü."
  x15.o3.fb: "Ö is a different umlaut; über has Ü."
  x15.expl: "über: Ü with two dots."
