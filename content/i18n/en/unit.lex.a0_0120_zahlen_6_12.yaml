strings:
  title: "Numbers 6 to 12"
  summary: "Six to twelve: for the time, days, months and players."
  obj: "Say, read and write the numbers 6 to 12 and use them for the time of day."
  intro: "The next numbers are sechs, sieben, acht, neun, zehn, elf, zwölf. Elf and zwölf are words of their own: they are not built from zehn. With Uhr after a number you say the time: acht Uhr is 8:00."
  examples: "Numbers in everyday phrases."
  summary_block: "**sechs 6 · sieben 7 · acht 8 · neun 9 · zehn 10 · elf 11 · zwölf 12**. **Es ist acht Uhr.** = It is eight o'clock."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "It is six o'clock. Wie viel Uhr ist es? = what time is it?"
  ex.2: "seven days: a week"
  ex.3: "bus number eight"
  ex.4: "eleven players: a football team"
  ex.5: "A year has twelve months."
  ex.6: "neun is 9; nein means no."
  x1.prompt: "The clock shows 9:00. What time is it?"
  x1.o2.fb: "Nein means no. Nine is neun, with eu."
  x1.o3.fb: "Acht Uhr is 8:00."
  x1.expl: "9:00 = neun Uhr."
  x2.prompt: "Fill in the missing numbers."
  x2.expl: "Counting: sechs, sieben, acht, neun, zehn."
  x3.prompt: "Which numbers are bigger than zehn?"
  x3.o3.fb: "Neun is 9, smaller than 10."
  x3.o4.fb: "Acht is 8, smaller than 10."
  x3.expl: "Elf (11) and zwölf (12) come after zehn."
  x4.prompt: "Write the number 7 as a word."
  x4.r1: "Sieben is written with ie: a long i."
  x4.r2: "Ei sounds like ai; the long i is written ie: sieben."
  x4.expl: "Sieben: s, ie, b, e, n."
  x5.prompt: "True or false? (nein = no, dasselbe Wort = the same word)"
  x5.wrong: "No: neun is 9 and is said with oi; nein means no and is said with ai."
  x5.expl: "Eu sounds like oi, ei like ai."
  x6.prompt: "Match each word to its digit."
  x6.expl: "Sechs 6, sieben 7, acht 8, neun 9, elf 11, zwölf 12."
  x7.prompt: "The clock shows 10:00. Answer the question."
  x7.o2.fb: "Elf is 11; the clock shows 10."
  x7.o3.fb: "Euro is money; for the time say Uhr."
  x7.expl: "Wie viel Uhr ist es? – Es ist zehn Uhr."
  x8.prompt: "The clock shows 12:00. Complete the sentence."
  x8.r1: "Zwölf has ö, not e."
  x8.r2: "Zwölf ends in f."
  x8.r3: "Oe is how ö is written in e-mail addresses; in words write ö: zwölf."
  x8.expl: "Es ist zwölf Uhr: it is twelve o'clock."
  x9.prompt: "A football team has 11 players. How do you say it?"
  x9.o2.fb: "Zwölf is 12."
  x9.o3.fb: "11 is not built from eins and zehn: it is elf."
  x9.expl: "Elf is 11, a word of its own."
  x10.prompt: "Put the words in order."
  x10.expl: "Ein Jahr hat zwölf Monate: a year has twelve months."
  x11.prompt: "Which of these are even numbers?"
  x11.o4.fb: "Sieben is 7, an odd number."
  x11.o5.fb: "Elf is 11, an odd number."
  x11.expl: "Sechs, acht and zwölf are 6, 8 and 12: even numbers."
  x12.prompt: "Write the time in digits."
  x12.expl: "Sieben Uhr is 7:00."
  x13.prompt: "Is this right?"
  x13.wrong: "It is true: 6 + 6 = 12."
  x13.expl: "Sechs (6) + sechs (6) = zwölf (12)."
  x14.prompt: "Write the bus number in digits."
  x14.expl: "Acht is 8."
  x15.prompt: "Write this time in words."
  x15.expl: "6:00 = sechs Uhr."
  tip: "In sechs, chs sounds like ks. Sieben is written with ie, neun with eu (said like oi), and zwölf with ö and no e after w."
