strings:
  title: "Numbers 6 to 12"
  summary: "Six to twelve: for times, days, months and prices."
  obj: "Say, read and write the numbers 6 to 12."
  intro: "The next numbers are sechs, sieben, acht, neun, zehn, elf, zwölf. Elf and zwölf are words of their own: they are not built from zehn."
  examples: "Numbers in everyday phrases."
  summary_block: "**sechs 6 · sieben 7 · acht 8 · neun 9 · zehn 10 · elf 11 · zwölf 12**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "six o'clock"
  ex.2: "seven days: a week"
  ex.3: "eight euros"
  ex.4: "room ten"
  ex.5: "eleven players: a football team"
  ex.6: "twelve months: a year"
  x1.prompt: "Which number is sieben?"
  x1.o2.fb: "6 is sechs."
  x1.o3.fb: "9 is neun."
  x1.expl: "Sieben is 7."
  x2.prompt: "Write the number as digits."
  x2.expl: "Zwölf is 12."
  x3.prompt: "Match each word to its digit."
  x3.expl: "Sechs 6, acht 8, zehn 10, elf 11."
  x4.prompt: "True or false?"
  x4.wrong: "It is true: elf is 11."
  x4.expl: "Elf is 11, a word of its own."
  x5.prompt: "Write the number 7 as a word."
  x5.r1: "Sieben is written with ie: a long i."
  x5.r2: "Sieben starts with s; s before a vowel sounds like z in English."
  x5.expl: "Sieben: s, ie, b, e, n."
  x6.prompt: "Which numbers are bigger than zehn?"
  x6.o3.fb: "Neun is 9, smaller than 10."
  x6.o4.fb: "Acht is 8, smaller than 10."
  x6.expl: "Elf (11) and zwölf (12) come after zehn."
  x7.prompt: "Build the phrase “room number ten”."
  x7.expl: "Zimmer Nummer zehn: the number comes last."
  x8.prompt: "What comes next?"
  x8.o2.fb: "Zwölf is 12; after zehn comes elf."
  x8.o3.fb: "Sieben is 7; it comes before zehn."
  x8.expl: "Neun, zehn, elf: 9, 10, 11."
  x9.prompt: "Fill in the missing numbers."
  x9.expl: "The missing numbers are sieben (7) and neun (9)."
  x10.prompt: "A football team has 11 players. Which word is it?"
  x10.o2.fb: "Zwölf is 12."
  x10.o3.fb: "Zehn is 10."
  x10.expl: "Elf is 11: elf Spieler."
  x11.prompt: "Which digit is this word?"
  x11.expl: "Acht is 8."
  x12.prompt: "Is this right?"
  x12.wrong: "No: zwölf is 12. Twenty is a different word, taught in the next lesson."
  x12.expl: "Zwölf is 12."
  x13.prompt: "Write the missing number as a word."
  x13.r1: "Zwölf has ö, not e."
  x13.r2: "Zwölf ends in f."
  x13.expl: "Ein Jahr hat zwölf Monate: a year has twelve months."
  x14.prompt: "Match the time to the clock."
  x14.expl: "Uhr after a number means o'clock."
  x15.prompt: "Write the number 9 as a word."
  x15.r1: "Neun: the sound oi is written eu, and there is no e at the end."
  x15.expl: "Neun: n, eu, n."
  x16.prompt: "Which of these are even numbers?"
  x16.o4.fb: "Sieben is 7, an odd number."
  x16.expl: "Sechs, acht and zehn are 6, 8 and 10: even numbers."
  tip: "Sieben is written with ie, neun with eu, and zwölf with ö and no e after w."
