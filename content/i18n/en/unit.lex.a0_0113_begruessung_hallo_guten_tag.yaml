schema: deutschgo.l10n/1
entity: unit.lex.a0_0113_begruessung_hallo_guten_tag
lang: en
based_on_version: 1.1.0
status: draft
translator: claude (AI draft, 2026-10-25)
strings:
  title: "Greetings: Hallo and Guten Tag"
  summary: "Hallo for people you know, Guten Tag for everyone, politely, during the day."
  obj: "Choose a greeting that fits the person and the situation."
  intro: "Hallo is the everyday greeting for friends, classmates and colleagues you know. Guten Tag is the polite greeting during the day: with strangers, at a reception desk, in a shop or an office. Both are used in Germany, Austria and Switzerland, and Guten Tag is always safe in a formal situation."
  examples: "Greetings in short scenes."
  summary_block: "**Hallo** with people you know. **Guten Tag** politely with anyone during the day, especially with **Herr** or **Frau** and a surname."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Hi, Anna! (to a friend)"
  ex.2: "Good day, Ms Weber! (polite, with the surname)"
  ex.3: "Good day, Mr Klein!"
  ex.4: "Hi everyone! (to a group you know)"
  ex.5: "Hi, Tom! (very casual, from English)"
  x1.prompt: "You meet a friend in the street. What do you say?"
  x1.o2.fb: "Auf Wiedersehen ends a conversation; you are just meeting."
  x1.o3.fb: "Gute Nacht is said late at night when you leave."
  x1.expl: "Hallo is the everyday greeting for people you know."
  x2.prompt: "Write the polite greeting for the daytime."
  x2.r1: "Guten ends in -n: Guten Tag."
  x2.r2: "Tag is a noun, so it has a capital T."
  x2.expl: "Guten Tag: two words, both with a capital letter at the start of the greeting."
  x3.prompt: "True or false?"
  x3.wrong: "Guten Tag is a greeting: you say it when you arrive. When you leave, say Auf Wiedersehen."
  x3.expl: "Verabschiedung means a goodbye. Guten Tag is a greeting."
  x4.prompt: "Join the two halves of each greeting."
  x4.expl: "Guten Tag, Hallo zusammen and Freut mich are fixed phrases."
  x5.prompt: "Which of these are greetings?"
  x5.o4.fb: "Tschüss is an informal goodbye."
  x5.expl: "Hallo, Guten Tag and Hi open a conversation; Tschüss closes it."
  x6.prompt: "Complete the polite greeting."
  x6.r1: "Tag is a noun: write it with a capital T."
  x6.r2: "Tag ends in g, even if it sounds like k."
  x6.expl: "Guten Tag, Frau Weber: polite greeting with the surname."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "Gute Nacht is for leaving at night; Anna has just said hello."
  x7.o3.fb: "Auf Wiedersehen would end the conversation Anna has just started."
  x7.expl: "Greet back with the same greeting and the name."
  x8.prompt: "Put the words in order."
  x8.expl: "The greeting comes first, then the name."
  x9.prompt: "Is this right?"
  x9.wrong: "It is right: Hallo is the everyday greeting with friends and colleagues."
  x9.expl: "Hallo works with people you know."
  x10.prompt: "Write the greeting for a group of friends (two words)."
  x10.r1: "Zusammen has a double m."
  x10.expl: "Zusammen means together; Hallo zusammen greets everyone at once."
  x11.prompt: "At a doctor's reception desk, which greeting is safest?"
  x11.o2.fb: "Hi is too casual for a reception desk."
  x11.o3.fb: "Hallo zusammen greets a group of friends, not one receptionist."
  x11.expl: "With people you do not know, Guten Tag is always polite."
  x12.prompt: "Complete the short dialogue."
  x12.expl: "Both people use the polite greeting with the surname."
  x13.prompt: "Which greetings are informal?"
  x13.o4.fb: "Guten Tag is polite; you can use it with anyone."
  x13.expl: "Hallo, Hi and Hallo zusammen are informal."
  x14.prompt: "Make this greeting polite."
  x14.expl: "With Frau and a surname, Guten Tag is the polite choice."
  x15.prompt: "How do you answer?"
  x15.o2.fb: "Hi with a bare surname sounds rude to someone you do not know."
  x15.o3.fb: "Tschüss says goodbye; the conversation is just starting."
  x15.expl: "Answer a polite greeting politely, with Frau and the surname."
  tip: "With Herr or Frau and a surname, use Guten Tag. With a first name, Hallo is normal."
