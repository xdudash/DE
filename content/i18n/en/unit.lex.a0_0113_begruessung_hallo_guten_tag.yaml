strings:
  title: "Greetings: Hallo and Guten Tag"
  summary: "Hallo for friends. Guten Tag for anyone, politely, during the day."
  obj: "Choose a greeting that fits the person and the time of day."
  intro: "Hallo is the everyday greeting for friends and people of your age. Guten Tag is the polite greeting during the day, with strangers, shop staff and officials. You hear both in Germany, Austria and Switzerland, but Guten Tag is always correct in a formal situation."
  examples: "Greetings in use."
  summary_block: "**Hallo** is informal. **Guten Tag** is polite and used during the day with anyone."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Look at the situation again."
  fb.not_this: "Not this one. Read the explanation."
  ex.1: "Hallo (hello): for friends, classmates and colleagues you know well."
  ex.2: "Guten Tag (good day): polite, during the day, with anyone."
  ex.3: "Hi: a casual word from English. Young people use it; Hallo is the safer choice."
