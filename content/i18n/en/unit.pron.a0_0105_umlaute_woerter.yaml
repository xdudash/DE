strings:
  title: "Umlauts in words and place names"
  summary: "The dots change the word: schon and schön are two words."
  obj: "Find and write the umlaut in everyday words and in place names."
  intro: "An umlaut is part of the spelling. Schon (already) and schön (nice) are different words. Many everyday words and place names have umlauts: Mädchen, Brötchen, München, Köln, Zürich, Österreich. Write the dots every time."
  examples: "Words and names with umlauts."
  summary_block: "**The umlaut belongs to the word.** schon ≠ schön. Write the dots in words and names: **München, Köln, Zürich, Österreich**."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Mädchen (girl): ä."
  ex.2: "Brötchen (bread roll): ö."
  ex.3: "München (Munich): ü."
  ex.4: "Köln (Cologne): ö."
  ex.5: "Zürich: ü, a city in Switzerland."
  ex.6: "Österreich (Austria): starts with Ö."
  x1.prompt: "Which city is written with ü?"
  x1.o2.fb: "Köln has ö, not ü."
  x1.o3.fb: "Wien (Vienna) has no umlaut."
  x1.expl: "München: M – Ü – N – C – H – E – N."
  x2.prompt: "Write the German name of Austria."
  x2.r1: "Österreich starts with Ö, with two dots."
  x2.r2: "Oe is the spelling without an umlaut key; write Ö."
  x2.expl: "Österreich: Ö at the start, then sterreich."
  x3.prompt: "True or false?"
  x3.wrong: "No: schon means already, schön means nice. The dots change the word."
  x3.expl: "One pair of dots makes a new word."
  x4.prompt: "Match each word to its umlaut."
  x4.expl: "Mädchen – ä, Brötchen – ö, Zürich – ü."
  x5.prompt: "Which words have an umlaut?"
  x5.o3.fb: "Berlin has no umlaut."
  x5.o4.fb: "Wien has no umlaut: W – I – E – N."
  x5.expl: "Mädchen has ä, Köln has ö."
  x6.prompt: "Fill in the missing letter: M_nchen."
  x6.r1: "München needs ü with two dots."
  x6.r2: "ö is a different umlaut; München has ü."
  x6.expl: "München: ü."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "Köln has Ö, not O."
  x7.o3.fb: "Ü is a different umlaut; Köln has Ö."
  x7.expl: "Spell the umlaut as its own letter: Ö."
  x8.prompt: "Fill in the umlauts in this order at a bakery."
  x8.expl: "Brötchen has ö, Käse has ä."
  x9.prompt: "Is this right?"
  x9.wrong: "It is right: Zürich is written with ü."
  x9.expl: "Zürich: Z – Ü – R – I – C – H."
  x10.prompt: "Write the German word for “girl”. It has ä."
  x10.r1: "Mädchen needs ä with two dots."
  x10.r2: "Mädchen is written with ch, not sch."
  x10.expl: "Mädchen: M – Ä – D – C – H – E – N."
  x11.prompt: "Which word means “nice”?"
  x11.o2.fb: "schon without dots means already."
  x11.o3.fb: "Sohn means son; it has no umlaut."
  x11.expl: "schön (nice) has ö."
  x12.prompt: "Correct the spelling of this city: it has ü."
  x12.expl: "Düsseldorf is written with ü."
  x13.prompt: "Which words have ö?"
  x13.o4.fb: "München has ü, not ö."
  x13.expl: "Brötchen, Köln and Österreich have ö."
  x14.prompt: "Which letter is missing? T_r (door)"
  x14.r1: "Tor is a gate; the door is Tür with ü."
  x14.r2: "Without dots it is u; Tür needs ü."
  x14.expl: "Tür (door): ü."
  x15.prompt: "How do you answer?"
  x15.o2.fb: "Without dots it would be schon (already)."
  x15.o3.fb: "ä is a different umlaut; schön has ö."
  x15.expl: "schön: ö."
