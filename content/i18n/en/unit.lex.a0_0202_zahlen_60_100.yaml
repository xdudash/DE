strings:
  title: "Numbers 60 to 100"
  summary: "Sechzig, siebzig, achtzig, neunzig and hundert, with numbers in between."
  obj: "Read, say and write the numbers from 60 to 100."
  intro: "The tens from 60 are sechzig, siebzig, achtzig and neunzig. Two are shortened: sechzig loses the s of sechs, and siebzig loses the -en of sieben. The ch in sechzig is the soft ch of ich, not the ks sound of sechs. 100 is hundert, or einhundert. Numbers in between follow the pattern you know: fünfundsiebzig is 5 + und + 70."
  examples: "Numbers in everyday use."
  summary_block: "**sechzig 60 · siebzig 70 · achtzig 80 · neunzig 90 · hundert 100.** In between: units + **und** + tens: **fünfundsiebzig 75**."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "sixty minutes, one hour"
  ex.2: "seventy euros"
  ex.3: "Grandma Erna is eighty (years old). Oma = grandma."
  ex.4: "ninety cents"
  ex.5: "That costs a hundred euros."
  ex.6: "seventy-five: fünf + und + siebzig"
  x1.prompt: "Match the words to the numbers."
  x1.expl: "The four tens from 60 to 90."
  x2.prompt: "16 or 60? Which word is 60?"
  x2.o2.fb: "Sechzehn is 16: -zehn is for 13 to 19. 60 is sechzig."
  x2.o3.fb: "Sechs is 6."
  x2.expl: "Sechzig: sech- + -zig."
  x3.prompt: "Write this number as a word."
  x3.r1: "Sechs loses its s in sechzig: sech-zig."
  x3.r2: "Sechzehn is 16. 60 is sechzig."
  x3.expl: "60 is sechzig, without the s of sechs."
  x4.prompt: "True or false?"
  x4.wrong: "It is true: einhundert and hundert both mean 100."
  x4.expl: "You can say hundert or einhundert."
  x5.prompt: "Complete the number 70."
  x5.r1: "Siebzig drops the -en of sieben: sieb-zig."
  x5.r2: "Siebzehn is 17. 70 ends in -zig."
  x5.expl: "70 = siebzig."
  x6.prompt: "How is the ch in „sechzig“ said?"
  x6.o1: "like the ch in ich"
  x6.o2: "like ks, as in sechs"
  x6.o2.fb: "In sechs, chs sounds like ks. In sechzig and sechzehn the ch is the soft ich-sound."
  x6.expl: "Sechs has ks; sechzig and sechzehn have the ich-sound."
  x7.prompt: "Write this number in digits."
  x7.r1: "The units come first in the word: drei (3) and sechzig (60) make 63."
  x7.expl: "Drei + und + sechzig = 63."
  x8.prompt: "Which of these are correct German numbers?"
  x8.o3.fb: "German says the units first: achtundneunzig (98)."
  x8.expl: "Units + und + tens: achtundneunzig 98, fünfundsiebzig 75."
  x9.prompt: "Put the words in order: the bus number."
  x9.expl: "First Bus, then Nummer, then the number."
  x10.prompt: "How do you say her age?"
  x10.o2.fb: "Neunzehn is 19; Oma Erna is 90: neunzig."
  x10.o3.fb: "Euro is for prices; for age you only say the number."
  x10.expl: "Sie ist neunzig: she is ninety."
  x11.prompt: "Write the number in words."
  x11.r1: "Units first: fünf + und + siebzig."
  x11.r2: "Siebzig drops the -en: fünfundsiebzig."
  x11.expl: "75 = fünf + und + siebzig, one word."
  x12.prompt: "Is this right?"
  x12.wrong: "It is true: 50 + 50 = 100."
  x12.expl: "Fünfzig 50, hundert 100."
  x13.prompt: "Write the numbers in words."
  x13.expl: "Achtzig Euro und neunzig Cent: 80 euros 90 cents."
  x14.prompt: "Which numbers are bigger than 80?"
  x14.o3.fb: "Achtzehn is 18, not 80."
  x14.o4.fb: "Neunundsiebzig is 79, just below 80."
  x14.expl: "Neunzig 90 and einundachtzig 81 are above 80."
  x15.prompt: "Choose the right reply."
  x15.o2.fb: "The seller says siebzig, 70, not siebzehn, 17."
  x15.o3.fb: "That is a greeting; the seller is asking you to pay."
  x15.expl: "Das macht … tells you the total; Hier, bitte is said as you pay."
  tip: "Two short forms: sechzig (from sechs) and siebzig (from sieben). The other tens keep the whole number: achtzig, neunzig."
