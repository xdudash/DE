status: draft
translator: claude (AI draft, 2026-10-25)
strings:
  title: "Numbers 60 to 100"
  summary: "Sechzig, siebzig, achtzig, neunzig and hundert, with numbers in between."
  obj: "Read and write the numbers from 60 to 100."
  intro: "The tens from 60 are sechzig, siebzig, achtzig and neunzig. Two of them are shortened: sechzig loses the s of sechs, and siebzig loses the -en of sieben. 100 is hundert, or einhundert. Numbers in between follow the same pattern as before: fünfundsiebzig is 5 + 70."
  examples: "Numbers in everyday use."
  summary_block: "**sechzig 60 · siebzig 70 · achtzig 80 · neunzig 90 · hundert 100.** In between: units + **und** + tens: **fünfundsiebzig 75**."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "sixty minutes, one hour"
  ex.2: "seventy euros"
  ex.3: "He is eighty (years old)."
  ex.4: "ninety cents"
  ex.5: "That costs a hundred euros."
  ex.6: "seventy-five: fünf + und + siebzig"
  x1.prompt: "How do you write 60?"
  x1.o2.fb: "Sechs loses its s in sechzig: sech-zig."
  x1.o3.fb: "Sechzehn is 16, not 60."
  x1.expl: "60 is sechzig, without the s of sechs."
  x2.prompt: "Write in digits: siebzig."
  x2.r1: "17 is siebzehn. Siebzig ends in -zig: 70."
  x2.expl: "Siebzig is seven tens: 70."
  x3.prompt: "True or false?"
  x3.wrong: "It is right: hundert, or einhundert, is 100."
  x3.expl: "Hundert is 100."
  x4.prompt: "Match the words to the numbers."
  x4.expl: "The four tens from 60 to 90."
  x5.prompt: "Which spellings are correct?"
  x5.o3.fb: "Siebzig drops the -en of sieben: sieb-zig."
  x5.o4.fb: "Sechzig drops the s of sechs: sech-zig."
  x5.expl: "Sechzig and siebzig are the two shortened tens."
  x6.prompt: "Write 90 as a word."
  x6.r1: "Neunzehn is 19; 90 is neunzig."
  x6.r2: "Keep neun whole: neun-zig."
  x6.expl: "Neun + -zig: neunzig."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "Uhr is for the time of day, and there is no 80 o'clock. A price is in Euro."
  x7.o3.fb: "That is a greeting, not a price."
  x7.expl: "A price: number + Euro."
  x8.prompt: "Put the words in order."
  x8.expl: "Er ist achtzig: he is eighty. The verb ist stands in second place."
  x9.prompt: "Is this right?"
  x9.wrong: "No: fünfundsiebzig is 75, fünf (5) + siebzig (70). 57 is siebenundfünfzig."
  x9.expl: "The units come first in the word, the tens first in digits."
  x10.prompt: "Complete the long form of 100."
  x10.r1: "Before hundert, eins loses its s: einhundert."
  x10.r2: "Zehnhundert would be 1000. 100 is einhundert."
  x10.expl: "Einhundert and hundert both mean 100."
  x11.prompt: "Which word is 99?"
  x11.o2.fb: "German says the units first: neun + und + neunzig."
  x11.o3.fb: "Neunundachtzig is 89: neun + achtzig."
  x11.expl: "99 = neun + und + neunzig."
  x12.prompt: "What number is this? Write it in digits: dreiundsechzig."
  x12.r1: "The units come first in the word: drei (3) and sechzig (60) make 63."
  x12.expl: "Drei + und + sechzig = 63."
  x13.prompt: "Which numbers are bigger than 80?"
  x13.o4.fb: "Siebzig is 70, smaller than 80."
  x13.o5.fb: "Achtzehn is 18, not 80."
  x13.expl: "Neunzig 90, hundert 100 and einundachtzig 81 are all above 80."
  x14.prompt: "Complete the sums."
  x14.expl: "50 + 50 = 100 and 10 + 60 = 70."
  x15.prompt: "How do you answer?"
  x15.o2.fb: "Euro is for prices; for age you only say the number."
  x15.o3.fb: "There is no achtzehnzig: 80 is achtzig, 18 is achtzehn."
  x15.expl: "Wie alt ist …? – Er ist + number."
  tip: "Watch two spellings: sechzig (not sechszig) and siebzig (not siebenzig). Hundert and einhundert both mean 100."
