strings:
  title: "Days of the week"
  summary: "Montag to Sonntag, am Montag and heute ist …"
  obj: "Name the days of the week and say which day it is."
  intro: "In Germany, Austria and Switzerland the week starts on Montag: Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag. Samstag and Sonntag are the weekend. Days are nouns, so they start with a capital letter. To say “on Monday”, use am: am Montag."
  examples: "Days in everyday use."
  summary_block: "**Montag · Dienstag · Mittwoch · Donnerstag · Freitag · Samstag · Sonntag.** On a day: **am Montag**. Today: **Heute ist …**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Today is Monday."
  ex.2: "on Tuesday"
  ex.3: "On Wednesday there is a class."
  ex.4: "See you on Friday!"
  ex.5: "Saturday and Sunday are the weekend."
  ex.6: "Monday to Friday, 9 am to 6 pm (opening hours on a sign)"
  x1.prompt: "Which day comes after Montag?"
  x1.o2.fb: "Mittwoch comes after Dienstag; it is the third day."
  x1.o3.fb: "Sonntag is the day before Montag."
  x1.expl: "Montag, then Dienstag."
  x2.prompt: "Write the day after Mittwoch."
  x2.r1: "Donnerstag has a double n: Don-ners-tag."
  x2.r2: "Dienstag comes before Mittwoch, not after it."
  x2.expl: "Mittwoch, then Donnerstag."
  x3.prompt: "True or false?"
  x3.wrong: "It is right: Samstag and Sonntag are the weekend."
  x3.expl: "Wochenende means weekend."
  x4.prompt: "Match each day to its short form."
  x4.expl: "The short form is the first two letters and a full stop."
  x5.prompt: "Which days are working days for most people?"
  x5.o4.fb: "Sonntag is the weekend; most shops and offices are closed."
  x5.expl: "Montag to Freitag are working days for most people."
  x6.prompt: "Complete: on Friday."
  x6.r1: "With days, use am: am Freitag."
  x6.r2: "Im is used with months (im Mai). With days, use am."
  x6.expl: "Am + day: am Freitag."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "Januar is a month, not a day of the week."
  x7.o3.fb: "That is a time; the question asks for the day."
  x7.expl: "Welcher Tag ist heute? asks which day it is: Heute ist + day."
  x8.prompt: "Put the words in order."
  x8.expl: "Heute ist Montag: the verb ist stands in second place."
  x9.prompt: "Is this right?"
  x9.wrong: "No: the order is Mittwoch, then Donnerstag."
  x9.expl: "Montag, Dienstag, Mittwoch, Donnerstag …"
  x10.prompt: "The German week starts on Montag (day 1). Which day number is Freitag? Write it in digits."
  x10.r1: "6 is Samstag. Count: Montag 1, Dienstag 2, Mittwoch 3, Donnerstag 4, Freitag 5."
  x10.expl: "Freitag is the fifth day."
  x11.prompt: "Which day is in the middle of the week?"
  x11.o2.fb: "Montag is the first day of the week."
  x11.o3.fb: "Donnerstag is the fourth day; the middle is Mittwoch."
  x11.expl: "Mittwoch literally means mid-week."
  x12.prompt: "Turn the day into “on …”."
  x12.expl: "Am + day: am Samstag."
  x13.prompt: "Which words are days of the week?"
  x13.o3.fb: "Januar is a month."
  x13.o4.fb: "Morgen means morning (as in Guten Morgen), not a day of the week."
  x13.expl: "Sonntag and Dienstag end in -tag, like most days."
  x14.prompt: "Complete the week."
  x14.expl: "The third day is Mittwoch, the fifth is Freitag."
  x15.prompt: "How do you answer?"
  x15.o2.fb: "Freitag is a day, not a name, and Guten Tag is a greeting, not a goodbye."
  x15.o3.fb: "Your friend says Freitag, a day this week; Januar is a month."
  x15.expl: "Bis + day: see you on that day."
  tip: "Short forms on signs: Mo. Di. Mi. Do. Fr. Sa. So. In northern Germany you may also hear Sonnabend for Samstag."
