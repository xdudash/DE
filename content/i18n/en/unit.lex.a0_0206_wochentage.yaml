strings:
  title: "Days of the week"
  summary: "Montag to Sonntag, am Montag and Heute ist …"
  obj: "Name the days of the week and say which day it is."
  intro: "In Germany, Austria and Switzerland the week starts on Montag: Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag. Samstag and Sonntag are the weekend. Days are nouns, so they start with a capital letter. To say “on Monday”, use am: am Montag."
  examples: "Days in everyday use."
  summary_block: "**Montag · Dienstag · Mittwoch · Donnerstag · Freitag · Samstag · Sonntag.** On a day: **am Montag**. Today: **Heute ist …**"
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Today is Monday."
  ex.2: "on Tuesday"
  ex.3: "On Wednesday there is a class."
  ex.4: "See you on Friday!"
  ex.5: "Saturday and Sunday are the weekend."
  ex.6: "Monday to Friday, 9 am to 6 pm (opening hours on a sign)"
  ex.7: "What day is it today?"
  x1.prompt: "How do you answer?"
  x1.o2.fb: "Guten Tag is a greeting; your friend is saying goodbye."
  x1.o3.fb: "Januar is a month, and with months you say im, not am. Your friend means Freitag."
  x1.expl: "Bis + day: see you on that day."
  x2.prompt: "Complete: today is Saturday."
  x2.r1: "Days are nouns: write Samstag with a capital S."
  x2.r2: "Sonntag is Sunday; Saturday is Samstag."
  x2.expl: "Heute ist Samstag."
  x3.prompt: "Which days are working days for most people?"
  x3.o4.fb: "Sonntag is the weekend; most shops and offices are closed."
  x3.expl: "Montag to Freitag are working days for most people."
  x4.prompt: "True or false? (ein anderes Wort für = another word for)"
  x4.wrong: "It is true: Sonnabend means Samstag; you hear it mainly in the north and east of Germany."
  x4.expl: "Both words are correct."
  x5.prompt: "Write the full name of the day."
  x5.r1: "Sonntag is So.; Sa. is Samstag."
  x5.expl: "Sa. = Samstag (in the north also Sonnabend)."
  x6.prompt: "Choose the right reply."
  x6.o2.fb: "Januar is a month; the question asks for the day."
  x6.o3.fb: "That is a time; the question asks for the day."
  x6.expl: "Welcher Tag ist heute? – Heute ist + day."
  x7.prompt: "Put the words in order."
  x7.expl: "Heute ist Montag: the verb ist stands in second place."
  x8.prompt: "Which words are days of the week?"
  x8.o3.fb: "Januar is a month."
  x8.o4.fb: "Morgen means morning, as in Guten Morgen."
  x8.expl: "Sonntag and Dienstag end in -tag, like most days."
  x9.prompt: "Complete the week."
  x9.expl: "The third day is Mittwoch, the fifth is Freitag."
  x10.prompt: "You see this sign on a shop. Is it open on Saturday?"
  x10.o1: "No, only Monday to Friday"
  x10.o2: "Yes, every day"
  x10.o2.fb: "Mo.–Fr. means Montag to Freitag; Sa. and So. are not on the sign."
  x10.o3: "Only on Saturday"
  x10.o3.fb: "Saturday would be Sa.; the sign says Mo.–Fr."
  x10.expl: "Mo.–Fr.: Montag bis Freitag."
  x11.prompt: "Complete: on Friday."
  x11.r1: "With days, use am: am Freitag."
  x11.r2: "Im is used with months (im Mai). With days, use am."
  x11.r3: "Not in: with days, German uses am."
  x11.expl: "Am + day: am Freitag."
  x12.prompt: "True or false?"
  x12.wrong: "It is true: Samstag and Sonntag are the weekend."
  x12.expl: "Wochenende means weekend."
  x13.prompt: "Write the day that comes before."
  x13.r1: "Sonntag comes after Samstag, not before it."
  x13.r2: "Freitag ends in g, even if it sounds like k."
  x13.expl: "Freitag, then Samstag."
  x14.prompt: "Which day comes next?"
  x14.o2.fb: "Mittwoch comes after Dienstag; it is the third day."
  x14.o3.fb: "Sonntag is the day before Montag."
  x14.expl: "Montag, then Dienstag."
  x15.prompt: "Match each day to its place in the week."
  x15.expl: "The German week starts with Montag (1) and ends with Sonntag (7)."
  tip: "Short forms on signs: Mo. Di. Mi. Do. Fr. Sa. So. In northern and eastern Germany you also hear Sonnabend for Samstag; both are correct."
