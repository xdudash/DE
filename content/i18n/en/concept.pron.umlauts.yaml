strings:
  title: "Umlauts: ä, ö, ü"
  summary: "Ä, Ö and Ü are vowels with two dots. Each has its own sound, which is not the same as plain a, o or u."
  pattern.scope: "The umlaut vowels are written with two dots; each has its own sound."
  pattern.limits: "Sounds are shown by example words; phonetic symbols are not used at A0."
  ex.kaese: "Käse (cheese): ä sounds like the e in „bed“, but longer."
  ex.schoen: "schön (nice): say e with rounded lips."
  ex.ueber: "über (over): say ee with rounded lips."
