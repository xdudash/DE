strings:
  title: "Wie bitte? Asking someone to repeat"
  summary: "Ask someone to repeat, to speak slowly, or say that you do not understand."
  obj: "Ask someone to repeat or slow down, and say that you do not understand."
  intro: "When you do not catch something, say Wie bitte? — it is the polite way to ask. Noch einmal, bitte. asks for one more time, Langsam, bitte. asks for slower speech, and Ich verstehe nicht. says that you do not understand. These phrases keep a conversation going even when your German is new."
  examples: "Phrases for when you do not catch something."
  summary_block: "**Wie bitte?** to ask again, **Noch einmal, bitte.** for one more time, **Langsam, bitte.** for slower speech, **Ich verstehe nicht.** when you do not understand."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Sorry? / Pardon? (you did not hear)"
  ex.2: "Once more, please."
  ex.3: "Slowly, please."
  ex.4: "I don't understand."
  ex.5: "Sorry? Once more, please."
  x1.prompt: "You did not hear what the cashier said. What do you say?"
  x1.o2.fb: "Danke thanks someone; it does not ask them to repeat."
  x1.o3.fb: "Tschüss ends the conversation before you know what was said."
  x1.expl: "Wie bitte? politely asks someone to say it again."
  x2.prompt: "Write the polite way to say you did not hear (two words)."
  x2.r1: "Bitte has a double t."
  x2.r2: "Was? alone can sound rude; write the polite Wie bitte?"
  x2.expl: "Wie bitte? — two words, with a question mark."
  x3.prompt: "True or false?"
  x3.wrong: "It is right: Wie bitte? is the polite way to ask someone to repeat."
  x3.expl: "höflich means polite."
  x4.prompt: "Join the two halves of each phrase."
  x4.expl: "Wie bitte?, Noch einmal and Ich verstehe nicht are fixed phrases."
  x5.prompt: "The teacher speaks too fast. What can you say?"
  x5.o4.fb: "Gute Nacht says good night; it does not help you follow the teacher."
  x5.expl: "All three phrases help when someone speaks too fast."
  x6.prompt: "Ask the speaker to talk slowly."
  x6.r1: "Noch einmal asks to repeat; to ask for slower speech, say Langsam."
  x6.r2: "Langsam has ng in the middle: lang-sam."
  x6.expl: "Langsam means slowly."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "You did not catch the name; thanking does not help. Ask to hear it again."
  x7.o3.fb: "The conversation has just started; ask to hear the name again instead."
  x7.expl: "A hard name? Ask for it again."
  x8.prompt: "Put the words in order."
  x8.expl: "Noch einmal first, then bitte."
  x9.prompt: "Is this right?"
  x9.wrong: "Wie bitte? asks someone to repeat; it is not a goodbye."
  x9.expl: "Verabschiedung means goodbye, like Tschüss."
  x10.prompt: "Complete the dialogue."
  x10.expl: "Wie bitte? and Noch einmal, bitte! ask for the name again."
  x11.prompt: "Which phrase says that you do not understand?"
  x11.o2.fb: "Ich verstehe means I understand; you need nicht."
  x11.o3.fb: "Langsam, bitte asks for slower speech; it does not say you do not understand."
  x11.expl: "nicht means not: Ich verstehe nicht."
  x12.prompt: "Make this question polite."
  x12.expl: "Wie bitte? replaces the abrupt Was?"
  x13.prompt: "Someone did not hear your name. How do you answer?"
  x13.o2.fb: "The other person did not hear you; say your name again."
  x13.o3.fb: "Danke does not repeat what you said."
  x13.expl: "Repeat the name, and spell it if it helps."
  x14.prompt: "Build the sentence."
  x14.expl: "Ich verstehe nicht: nicht comes at the end."
  x15.prompt: "Which word means “slowly”?"
  x15.o2.fb: "einmal means once."
  x15.o3.fb: "nicht means not."
  x15.expl: "langsam means slowly."
  x16.prompt: "Write the phrase that asks for one more time (two words)."
  x16.r1: "Einmal is one word."
  x16.expl: "Noch einmal, or casually Noch mal."
  tip: "Was? on its own can sound rude to strangers. Wie bitte? is always polite."
