strings:
  title: "Greetings: Guten Morgen and Guten Abend"
  summary: "The greeting changes with the time of day: morning, day, evening, night."
  obj: "Choose the greeting that fits the time of day."
  intro: "Guten Morgen means good morning; people usually say it until about 10 or 11 am. Then Guten Tag is used during the day. Guten Abend means good evening, from about 6 pm. Gute Nacht is not a greeting for arriving: you usually say it late, when someone goes to bed or when you leave late in the evening."
  examples: "Greetings through the day."
  summary_block: "**Guten Morgen** in the morning, **Guten Tag** during the day, **Guten Abend** in the evening. **Gute Nacht** usually when someone goes to bed or you leave late."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Good morning, Mr Klein! (until about 10 or 11 am)"
  ex.2: "Morning, Tom! (short and casual)"
  ex.3: "Good day! (during the day; the g at the end of Tag sounds like k)"
  ex.4: "Good evening, Ms Weber! (from about 6 pm; the d at the end of Abend sounds like t)"
  ex.5: "Good night, Lisa! (when someone goes to bed; Gute, without -n)"
  x1.prompt: "Match each phrase to the time when you say it."
  x1.expl: "Morning, day, evening, night: the phrase follows the clock."
  x2.prompt: "It is 8 am. You come into the office. What do you say?"
  x2.o2.fb: "Guten Abend is for the evening, from about 6 pm."
  x2.o3.fb: "Gute Nacht is said late, when someone goes to bed."
  x2.expl: "Until about 10 or 11 am the greeting is Guten Morgen."
  x3.prompt: "True or false? (= means “means the same as”)"
  x3.wrong: "It is true: Morgen! is a short, casual way to say Guten Morgen."
  x3.expl: "Colleagues and friends often say just Morgen!"
  x4.prompt: "It is 8 pm. Complete the greeting."
  x4.r1: "Guten Morgen is for the morning; at 8 pm say Guten Abend."
  x4.r2: "Guten Tag is for the day; at 8 pm it is evening."
  x4.r3: "Abend is a noun: write it with a capital A."
  x4.r4: "Right phrase; here write only the missing word: Abend."
  x4.expl: "From about 6 pm: Guten Abend."
  x5.prompt: "Which of these do you hear in the evening or at night?"
  x5.o3.fb: "Guten Morgen is for the morning."
  x5.o4.fb: "Guten Tag is for the day; from about 6 pm say Guten Abend."
  x5.expl: "Guten Abend greets someone in the evening; Gute Nacht is said late, before sleep."
  x6.prompt: "Put the words in order."
  x6.expl: "The greeting comes first, then the name."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "Lisa greeted you in the morning; answer with the same time of day."
  x7.o3.fb: "Gute Nacht is for going to bed, not for a morning greeting."
  x7.expl: "Answer a greeting with the same greeting and the other person's name."
  x8.prompt: "True or false? (= means “means the same as”)"
  x8.wrong: "Guten Abend greets someone in the evening; Gute Nacht is said when someone goes to bed."
  x8.expl: "Abend means evening, Nacht means night."
  x9.prompt: "Complete the morning dialogue."
  x9.expl: "Herr Klein answers with the same morning greeting."
  x10.prompt: "Which word means “evening”?"
  x10.o2.fb: "Morgen means morning."
  x10.o3.fb: "Nacht means night; it comes after the evening."
  x10.expl: "Abend means evening: Guten Abend."
  x11.prompt: "Make the greeting fit the evening."
  x11.r1: "Gute Nacht is for going to bed; to greet in the evening say Guten Abend."
  x11.expl: "Only the time word changes: Morgen becomes Abend."
  x12.prompt: "Your friend is going to bed. How do you answer?"
  x12.o2.fb: "Guten Morgen is for the morning; your friend is going to bed."
  x12.o3.fb: "Guten Abend greets someone who arrives in the evening; your friend is saying good night."
  x12.expl: "Gute Nacht is answered with Gute Nacht."
  x13.prompt: "Your child goes to bed. Write what you say."
  x13.r1: "With Nacht it is Gute, without -n: Gute Nacht."
  x13.r2: "Nacht is a noun: write it with a capital N."
  x13.expl: "Gute Nacht: Gute without -n, unlike Guten Morgen and Guten Abend."
  x14.prompt: "You hear this in Austria. Which greeting is understood everywhere instead?"
  x14.o2.fb: "Gute Nacht is said when someone goes to bed; Grüß Gott greets someone."
  x14.o3.fb: "Tschüss is a goodbye, not a greeting."
  x14.expl: "Guten Tag works in Germany, Austria and Switzerland."
  x15.prompt: "Morning at the bakery. Complete the greeting."
  x15.r1: "With Morgen it is Guten, with -n. Only Gute Nacht has no -n."
  x15.r2: "Right phrase; here write only the missing word: Guten."
  x15.expl: "Guten Morgen, Guten Tag, Guten Abend — but Gute Nacht."
  x16.prompt: "Write the short, casual morning greeting (one word)."
  x16.r1: "Correct, but here write only the short form: Morgen."
  x16.expl: "Morgen! is the casual short form among colleagues and friends."
  tip: "In southern Germany and Austria you will also hear Grüß Gott, and in Switzerland Grüezi. You do not need them yet: Guten Morgen, Guten Tag and Guten Abend are understood everywhere."
