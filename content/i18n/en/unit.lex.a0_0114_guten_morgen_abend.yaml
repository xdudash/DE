strings:
  title: "Greetings: Guten Morgen and Guten Abend"
  summary: "The greeting changes with the time of day: morning, day, evening, night."
  obj: "Choose the greeting that fits the time of day."
  intro: "Guten Morgen means good morning; it is used until about 10 or 11 am. Then Guten Tag is used during the day. Guten Abend means good evening, from about 6 pm. Gute Nacht is not a greeting for arriving: you say it at night, when someone goes to bed or when you leave late."
  examples: "Greetings through the day."
  summary_block: "**Guten Morgen** in the morning, **Guten Tag** during the day, **Guten Abend** in the evening. **Gute Nacht** only when someone goes to bed or you leave late."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "Good morning, Mr Klein! (until about 10 or 11 am)"
  ex.2: "Morning, Tom! (short and casual)"
  ex.3: "Good day! (during the day)"
  ex.4: "Good evening, Ms Weber! (from about 6 pm)"
  ex.5: "Good night, Lisa! (when someone goes to bed)"
  x1.prompt: "It is 8 am. You come into the office. What do you say?"
  x1.o2.fb: "Guten Abend is for the evening, from about 6 pm."
  x1.o3.fb: "Gute Nacht is said at night, when someone goes to bed."
  x1.expl: "Until about 10 or 11 am the greeting is Guten Morgen."
  x2.prompt: "Write the greeting for the evening."
  x2.r1: "The greeting is Guten with -n: Guten Abend."
  x2.r2: "Abend is a noun: write it with a capital A."
  x2.expl: "Guten Abend: two words; Abend means evening."
  x3.prompt: "True or false?"
  x3.wrong: "Gute Nacht is for the night, when someone goes to bed or you leave late. In the morning say Guten Morgen."
  x3.expl: "Nacht means night, Morgen means morning."
  x4.prompt: "Match each phrase to the time when you say it."
  x4.expl: "Morning, day, evening, night: the phrase follows the clock."
  x5.prompt: "Which of these do you hear in the evening or at night?"
  x5.o3.fb: "Guten Morgen is for the morning."
  x5.expl: "Guten Abend greets someone in the evening; Gute Nacht is said late, before sleep."
  x6.prompt: "It is 8 pm. Complete the greeting."
  x6.r1: "Guten Morgen is for the morning; at 8 pm say Guten Abend."
  x6.r2: "Guten Tag is for the day; at 8 pm it is evening."
  x6.expl: "From about 6 pm: Guten Abend."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "You were greeted in the morning; answer with the same time of day."
  x7.o3.fb: "Gute Nacht is for going to bed, not for a morning greeting."
  x7.expl: "Answer a greeting with the same greeting."
  x8.prompt: "Put the words in order."
  x8.expl: "The greeting comes first, then the name."
  x9.prompt: "Is this right?"
  x9.wrong: "It is right: Morgen! is a short, casual way to say Guten Morgen."
  x9.expl: "Colleagues and friends often say just Morgen!"
  x10.prompt: "Complete the morning dialogue."
  x10.expl: "Herr Klein answers with the same morning greeting."
  x11.prompt: "Which word means “evening”?"
  x11.o2.fb: "Morgen means morning."
  x11.o3.fb: "Nacht means night."
  x11.expl: "Abend means evening: Guten Abend."
  x12.prompt: "Make the greeting fit the evening."
  x12.r1: "Gute Nacht is for going to bed; to greet in the evening say Guten Abend."
  x12.expl: "Only the time word changes: Morgen becomes Abend."
  x13.prompt: "How do you answer?"
  x13.o2.fb: "Guten Morgen is for the morning; your friend is going to bed."
  x13.o3.fb: "Hallo greets someone who arrives; your friend is saying good night."
  x13.expl: "Gute Nacht is answered with Gute Nacht."
  x14.prompt: "Build the goodnight wish."
  x14.expl: "Gute Nacht first, then the name."
  x15.prompt: "In Austria you hear Grüß Gott. Which greeting is understood everywhere instead?"
  x15.o2.fb: "Gute Nacht is only for going to bed."
  x15.o3.fb: "Tschüss is a goodbye, not a greeting."
  x15.expl: "Guten Tag works in Germany, Austria and Switzerland."
  x16.prompt: "Write the greeting for 7 am."
  x16.r1: "Morgen is a noun: write it with a capital M."
  x16.r2: "The greeting is Guten with -n: Guten Morgen."
  x16.expl: "Guten Morgen, or casually just Morgen."
  tip: "In southern Germany and Austria you will also hear Grüß Gott, and in Switzerland Grüezi. You do not need them yet: Guten Morgen, Guten Tag and Guten Abend are understood everywhere."
