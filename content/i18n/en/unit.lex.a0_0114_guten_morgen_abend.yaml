  title: "Greetings: Guten Morgen and Guten Abend"
  summary: "Greetings change with the time of day."
  obj: "Choose the greeting that fits the time of day."
  intro: "Guten Morgen means good morning. Use it until about 10 or 11 am. Guten Abend means good evening. Use it from about 6 pm. Gute Nacht is not a greeting: you say it at night, when you go to sleep or leave late."
