strings:
  title: "Greetings in German-speaking countries"
  summary: "Hallo is the everyday greeting. Guten Tag is the polite greeting during the day. Both are used in Germany, Austria and Switzerland."
  pattern.scope: "Greetings for meeting people during the day, with friends and with strangers."
  pattern.limits: "Regional greetings such as Grüß Gott and Grüezi are not covered at A0."
  ex.hallo: "Hallo (hello): for friends and people you know well."
  ex.guten_tag: "Guten Tag (good day): polite, during the day, with anyone."
  ex.hi: "Hi: a casual word from English, mostly used by young people."
