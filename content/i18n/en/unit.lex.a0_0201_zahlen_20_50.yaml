strings:
  title: "Numbers 20 to 50"
  summary: "The tens 20 to 50, and numbers like einundzwanzig."
  obj: "Read and write the numbers from 20 to 50."
  intro: "The tens are zwanzig (20), dreißig (30), vierzig (40) and fünfzig (50). Most end in -zig; dreißig is the exception and is written with ß. Numbers in between are one word, and the units come first: einundzwanzig is ein + und + zwanzig, 21."
  examples: "Numbers in everyday use."
  summary_block: "**zwanzig 20 · dreißig 30 · vierzig 40 · fünfzig 50.** In between: units + **und** + tens, one word: **einundzwanzig 21**, **fünfunddreißig 35**."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "twenty euros"
  ex.2: "bus number thirty"
  ex.3: "forty minutes"
  ex.4: "fifty cents"
  ex.5: "twenty-one: ein + und + zwanzig, written as one word"
  ex.6: "How old are you? – I am thirty-three."
  x1.prompt: "How do you say 30?"
  x1.o2.fb: "Dreizehn is 13: drei + zehn. 30 is dreißig."
  x1.o3.fb: "There is no dreizig: 30 is the exception, dreißig with ß."
  x1.expl: "Dreißig is the only ten that ends in -ßig."
  x2.prompt: "Write the number in digits: vierzig."
  x2.r1: "14 is vierzehn. Vierzig ends in -zig, so it is a ten: 40."
  x2.expl: "Vierzig is four tens: 40."
  x3.prompt: "True or false?"
  x3.wrong: "It is right: ein + und + zwanzig = 21."
  x3.expl: "The units come first: ein (1) and zwanzig (20)."
  x4.prompt: "Match the words to the numbers."
  x4.expl: "These are the four tens of this lesson."
  x5.prompt: "Which of these numbers are bigger than 30?"
  x5.o4.fb: "Zwanzig is 20, smaller than 30."
  x5.o5.fb: "Dreizehn is 13, not 30."
  x5.expl: "Vierzig is 40, fünfzig 50, einunddreißig 31."
  x6.prompt: "Write 50 as a word."
  x6.r1: "Fünfzehn is 15. 50 is fünfzig."
  x6.r2: "Fünfzig has ü: f-ü-n-f-z-i-g."
  x6.expl: "Fünf + -zig: fünfzig."
  x7.prompt: "Choose the right reply."
  x7.o2.fb: "Uhr is a time of day; the question asks for a price."
  x7.o3.fb: "That is a greeting, not a price."
  x7.expl: "Was kostet das? asks for the price: a number and Euro."
  x8.prompt: "Put the words in order."
  x8.expl: "The verb kostet is in second place: Das kostet dreißig Euro."
  x9.prompt: "Is this right?"
  x9.wrong: "No: vierundzwanzig is 24, vier (4) + zwanzig (20). 42 is zweiundvierzig."
  x9.expl: "You hear the units first, but write the tens first in digits: 24."
  x10.prompt: "Complete the number 21."
  x10.r1: "Before und, eins loses its s: einundzwanzig."
  x10.r2: "Zwei would give zweiundzwanzig, 22."
  x10.expl: "21 = ein + und + zwanzig."
  x11.prompt: "Which word is 35?"
  x11.o2.fb: "Dreiundfünfzig is 53. The units come first, so 35 is fünf + und + dreißig."
  x11.o3.fb: "Fünfzehn is 15."
  x11.expl: "Fünf (5) + und + dreißig (30)."
  x12.prompt: "What number is this? Write it in digits: siebenundvierzig."
  x12.r1: "The units come first in the word: sieben (7) and vierzig (40) make 47."
  x12.expl: "Sieben + und + vierzig = 47."
  x13.prompt: "Which words mean a number between 20 and 30?"
  x13.o3.fb: "Zweiunddreißig is 32, above 30."
  x13.o4.fb: "Zwölf is 12."
  x13.expl: "Einundzwanzig is 21 and achtundzwanzig is 28."
  x14.prompt: "Complete the sums."
  x14.expl: "10 + 20 = 30 and 20 + 20 = 40."
  x15.prompt: "How do you answer?"
  x15.o2.fb: "Euro is for prices; for your age you only say the number."
  x15.o3.fb: "Uhr is for the time of day; the question asks your age."
  x15.expl: "Wie alt bist du? – Ich bin + number."
  tip: "Say the units first, then und, then the tens: 34 = vierunddreißig. Eins becomes ein before und: einundzwanzig."
