strings:
  title: "Numbers 20 to 50"
  summary: "The tens 20 to 50, and numbers like einundzwanzig."
  obj: "Read, say and write the numbers from 20 to 50."
  intro: "The tens are zwanzig (20), dreißig (30), vierzig (40) and fünfzig (50). Most end in -zig; dreißig is the exception and is written with ß. In standard German in Germany the ending -zig is said like -zich (the ch of ich); in the south, in Austria and in Switzerland you usually hear -zik. The numbers in between are one word, and the units come first: einundzwanzig is ein + und + zwanzig, 21."
  examples: "Numbers in everyday use."
  summary_block: "**zwanzig 20 · dreißig 30 · vierzig 40 · fünfzig 50.** In between: units + **und** + tens, one word: **einundzwanzig 21**, **fünfunddreißig 35**."
  practice: "Practice"
  fb.correct: "Correct."
  fb.incorrect: "Not quite. Read the explanation."
  ex.1: "twenty euros"
  ex.2: "bus number thirty"
  ex.3: "forty minutes"
  ex.4: "fifty cents"
  ex.5: "twenty-one: ein + und + zwanzig, written as one word"
  ex.6: "How old are you? – I am thirty-three."
  ex.7: "Forty is more than thirty (mehr als = more than)."
  x1.prompt: "Match the words to the numbers."
  x1.expl: "These are the four tens of this lesson."
  x2.prompt: "13 or 30? Which word is 30?"
  x2.o2.fb: "Dreizehn is 13: drei + zehn. The tens end in -zig or, for 30, -ßig."
  x2.o3.fb: "Drei is 3."
  x2.expl: "-zehn means 13 to 19; -zig and -ßig mean tens."
  x3.prompt: "Write this number as a word."
  x3.r1: "Fünfzehn is 15. 50 is fünfzig."
  x3.r2: "Fünfzig has ü: f-ü-n-f-z-i-g (or ue if you cannot type ü)."
  x3.expl: "Fünf + -zig: fünfzig."
  x4.prompt: "Which of these end in -zig?"
  x4.o4.fb: "Dreißig is the exception: it ends in -ßig."
  x4.o5.fb: "Vierzehn (14) ends in -zehn."
  x4.expl: "Zwanzig, vierzig and fünfzig end in -zig; dreißig in -ßig."
  x5.prompt: "Complete the number 21."
  x5.r1: "Before und, eins loses its s: einundzwanzig."
  x5.r2: "Zwei would give zweiundzwanzig, 22."
  x5.expl: "21 = ein + und + zwanzig."
  x6.prompt: "True or false?"
  x6.wrong: "It is true: 20 + 10 = 30."
  x6.expl: "Zwanzig 20, zehn 10, dreißig 30."
  x7.prompt: "Put the words in order: the bus number."
  x7.expl: "First Bus, then Nummer, then the number."
  x8.prompt: "How is the end of „zwanzig“ usually said in Germany?"
  x8.o1: "-zich, with the ch of ich"
  x8.o2: "-zig, with a g as in English “go”"
  x8.o2.fb: "A g like in “go” is not used at the end. In Germany you hear -zich; in the south, Austria and Switzerland usually -zik."
  x8.expl: "Written -zig, said -zich in standard German in Germany (-zik in the south, Austria, Switzerland)."
  x9.prompt: "Write this number in digits."
  x9.r1: "The units come first in the word: sieben (7) and vierzig (40) make 47."
  x9.expl: "Sieben + und + vierzig = 47."
  x10.prompt: "Choose the right reply."
  x10.o2.fb: "German says the units first: dreiunddreißig, one word."
  x10.o3.fb: "Euro is for prices; for your age say Ich bin + number."
  x10.expl: "Wie alt bist du? – Ich bin + number."
  x11.prompt: "Write the number in words."
  x11.r1: "Units first: drei + und + dreißig."
  x11.r2: "Write it as one word: dreiunddreißig."
  x11.expl: "33 = drei + und + dreißig, one word."
  x12.prompt: "Which word is 35?"
  x12.o2.fb: "Dreiundfünfzig is 53: the two parts are swapped. 35 is fünf + und + dreißig."
  x12.o3.fb: "German says the units first: fünfunddreißig."
  x12.expl: "Fünf (5) + und + dreißig (30)."
  x13.prompt: "Write the numbers in words."
  x13.expl: "Vierzig Euro und zwanzig Cent: 40 euros 20 cents."
  x14.prompt: "True or false? (mehr als = more than)"
  x14.wrong: "No: vierzig is 40 and fünfzig is 50, so vierzig is less."
  x14.expl: "40 is less than 50."
  x15.prompt: "Which numbers are bigger than 30?"
  x15.o3.fb: "Neunundzwanzig is 29, just below 30."
  x15.o4.fb: "Dreizehn is 13."
  x15.expl: "Einunddreißig is 31 and vierzig 40."
  tip: "Say the units first, then und, then the tens: 34 = vierunddreißig, like the old English “four-and-thirty”. Eins becomes ein before und: einundzwanzig."
