strings:
  title: "Числа від 60 до 100"
  summary: "Sechzig, siebzig, achtzig, neunzig і hundert та числа між ними."
  obj: "Читати, вимовляти й писати числа від 60 до 100."
  intro: "Десятки від 60: sechzig, siebzig, achtzig і neunzig. Два з них скорочені: sechzig втрачає s від sechs, а siebzig — -en від sieben. Ch у sechzig — м'який звук як в ich, а не «кс», як у sechs. 100 — hundert або einhundert. Числа між десятками будуються за знайомою моделлю: fünfundsiebzig — це 5 + und + 70, а не «сімдесят п'ять»."
  examples: "Числа в повсякденному житті."
  summary_block: "**sechzig 60 · siebzig 70 · achtzig 80 · neunzig 90 · hundert 100.** Між ними: одиниці + **und** + десятки: **fünfundsiebzig 75**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "шістдесят хвилин, одна година"
  ex.2: "сімдесят євро"
  ex.3: "Бабусі Ерні вісімдесят (років). Oma = бабуся."
  ex.4: "дев'яносто центів"
  ex.5: "Це коштує сто євро."
  ex.6: "сімдесят п'ять: fünf + und + siebzig"
  x1.prompt: "З'єднайте слова з числами."
  x1.expl: "Чотири десятки від 60 до 90."
  x2.prompt: "16 чи 60? Яке слово означає 60?"
  x2.o2.fb: "Sechzehn — це 16: -zehn — для 13–19. 60 — sechzig."
  x2.o3.fb: "Sechs — це 6."
  x2.expl: "Sechzig: sech- + -zig."
  x3.prompt: "Напишіть це число словом."
  x3.r1: "Sechs у sechzig втрачає s: sech-zig."
  x3.r2: "Sechzehn — це 16. 60 — sechzig."
  x3.expl: "60 — sechzig, без s від sechs."
  x4.prompt: "Правда чи ні?"
  x4.wrong: "Це правда: einhundert і hundert означають 100."
  x4.expl: "Можна сказати hundert або einhundert."
  x5.prompt: "Доповніть число 70."
  x5.r1: "Siebzig втрачає -en від sieben: sieb-zig."
  x5.r2: "Siebzehn — це 17. 70 закінчується на -zig."
  x5.expl: "70 = siebzig."
  x6.prompt: "Як вимовляють ch у слові „sechzig“?"
  x6.o1: "як ch в ich"
  x6.o2: "як «кс», як у sechs"
  x6.o2.fb: "У sechs chs звучить як «кс». У sechzig і sechzehn ch — м'який звук як в ich."
  x6.expl: "У sechs — «кс»; у sechzig і sechzehn — звук як в ich."
  x7.prompt: "Запишіть це число цифрами."
  x7.r1: "У слові одиниці першими: drei (3) і sechzig (60) — це 63."
  x7.expl: "Drei + und + sechzig = 63."
  x8.prompt: "Які з цих чисел правильні німецькою?"
  x8.o3.fb: "Німецькою одиниці першими: achtundneunzig (98)."
  x8.expl: "Одиниці + und + десятки: achtundneunzig 98, fünfundsiebzig 75."
  x9.prompt: "Розставте слова: номер автобуса."
  x9.expl: "Спершу Bus, потім Nummer, потім число."
  x10.prompt: "Як сказати її вік?"
  x10.o2.fb: "Neunzehn — це 19; бабусі Ерні 90: neunzig."
  x10.o3.fb: "Euro — для цін; про вік кажуть лише число."
  x10.expl: "Sie ist neunzig: їй дев'яносто."
  x11.prompt: "Напишіть число словами."
  x11.r1: "Одиниці першими: fünf + und + siebzig."
  x11.r2: "Siebzig втрачає -en: fünfundsiebzig."
  x11.expl: "75 = fünf + und + siebzig, одним словом."
  x12.prompt: "Це правильно?"
  x12.wrong: "Це правда: 50 + 50 = 100."
  x12.expl: "Fünfzig 50, hundert 100."
  x13.prompt: "Напишіть числа словами."
  x13.expl: "Achtzig Euro und neunzig Cent: 80 євро 90 центів."
  x14.prompt: "Які числа більші за 80?"
  x14.o3.fb: "Achtzehn — це 18, а не 80."
  x14.o4.fb: "Neunundsiebzig — це 79, трохи менше за 80."
  x14.expl: "Neunzig 90 і einundachtzig 81 — більші за 80."
  x15.prompt: "Оберіть правильну відповідь."
  x15.o2.fb: "Продавець каже siebzig, 70, а не siebzehn, 17."
  x15.o3.fb: "Це привітання, а продавець просить заплатити."
  x15.expl: "Das macht … — це сума; Hier, bitte кажуть, коли платять."
  tip: "Дві скорочені форми: sechzig (від sechs) і siebzig (від sieben). Інші десятки зберігають усе число: achtzig, neunzig."
