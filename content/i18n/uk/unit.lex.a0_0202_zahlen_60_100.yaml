strings:
  title: "Числа від 60 до 100"
  summary: "Sechzig, siebzig, achtzig, neunzig і hundert та числа між ними."
  obj: "Читати й писати числа від 60 до 100."
  intro: "Десятки від 60: sechzig, siebzig, achtzig і neunzig. Два з них скорочені: sechzig втрачає s від sechs, а siebzig — -en від sieben. 100 — hundert або einhundert. Числа між ними будуються так само: fünfundsiebzig — це 5 + 70."
  examples: "Числа в повсякденному житті."
  summary_block: "**sechzig 60 · siebzig 70 · achtzig 80 · neunzig 90 · hundert 100.** Між ними: одиниці + **und** + десятки: **fünfundsiebzig 75**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "шістдесят хвилин, одна година"
  ex.2: "сімдесят євро"
  ex.3: "Йому вісімдесят (років)."
  ex.4: "дев'яносто центів"
  ex.5: "Це коштує сто євро."
  ex.6: "сімдесят п'ять: fünf + und + siebzig"
  x1.prompt: "Як написати 60?"
  x1.o2.fb: "Sechs у sechzig втрачає s: sech-zig."
  x1.o3.fb: "Sechzehn — це 16, а не 60."
  x1.expl: "60 — sechzig, без s від sechs."
  x2.prompt: "Запишіть цифрами: siebzig."
  x2.r1: "17 — це siebzehn. Siebzig закінчується на -zig: 70."
  x2.expl: "Siebzig — сім десятків: 70."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правильно: hundert або einhundert — це 100."
  x3.expl: "Hundert — це 100."
  x4.prompt: "З'єднайте слова з числами."
  x4.expl: "Чотири десятки від 60 до 90."
  x5.prompt: "Які написання правильні?"
  x5.o3.fb: "Siebzig втрачає -en від sieben: sieb-zig."
  x5.o4.fb: "Sechzig втрачає s від sechs: sech-zig."
  x5.expl: "Sechzig і siebzig — два скорочені десятки."
  x6.prompt: "Напишіть 90 словом."
  x6.r1: "Neunzehn — це 19; 90 — neunzig."
  x6.r2: "Слово neun не скорочується: neun-zig."
  x6.expl: "Neun + -zig: neunzig."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Uhr — для часу доби, і 80 години не буває. Ціна — в Euro."
  x7.o3.fb: "Це привітання, а не ціна."
  x7.expl: "Ціна: число + Euro."
  x8.prompt: "Розставте слова в правильному порядку."
  x8.expl: "Er ist achtzig: йому вісімдесят. Дієслово ist на другому місці."
  x9.prompt: "Це правильно?"
  x9.wrong: "Ні: fünfundsiebzig — це 75, fünf (5) + siebzig (70). 57 — siebenundfünfzig."
  x9.expl: "У слові першими одиниці, у цифрах — десятки."
  x10.prompt: "Доповніть довгу форму числа 100."
  x10.r1: "Перед hundert eins втрачає s: einhundert."
  x10.r2: "Zehnhundert — це 1000. 100 — einhundert."
  x10.expl: "Einhundert і hundert означають 100."
  x11.prompt: "Яке слово означає 99?"
  x11.o2.fb: "Німецькою одиниці першими: neun + und + neunzig."
  x11.o3.fb: "Neunundachtzig — це 89: neun + achtzig."
  x11.expl: "99 = neun + und + neunzig."
  x12.prompt: "Яке це число? Запишіть цифрами: dreiundsechzig."
  x12.r1: "У слові одиниці першими: drei (3) і sechzig (60) — це 63."
  x12.expl: "Drei + und + sechzig = 63."
  x13.prompt: "Які числа більші за 80?"
  x13.o4.fb: "Siebzig — це 70, менше за 80."
  x13.o5.fb: "Achtzehn — це 18, а не 80."
  x13.expl: "Neunzig 90, hundert 100 і einundachtzig 81 — усі більші за 80."
  x14.prompt: "Доповніть приклади."
  x14.expl: "50 + 50 = 100 і 10 + 60 = 70."
  x15.prompt: "Як ви відповісте?"
  x15.o2.fb: "Euro — для цін; про вік кажуть лише число."
  x15.o3.fb: "Слова achtzehnzig немає: 80 — achtzig, 18 — achtzehn."
  x15.expl: "Wie alt ist …? – Er ist + число."
  tip: "Зверніть увагу на два написання: sechzig (не sechszig) і siebzig (не siebenzig). Hundert і einhundert означають 100."
