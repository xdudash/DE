strings:
  title: "Сценарій: представитися на курсі"
  summary: "Привітайтеся з групою, назвіть себе, спитайте ім'я й попрощайтеся."
  obj: "Представитися й спитати ім'я в короткій розмові на курсі."
  intro: "Першого дня курсу ви вітаєтеся з групою, називаєте себе фразою «Ich heiße …» і питаєте «Wie heißt du?». Слухачі курсу зазвичай звертаються одне до одного на du; викладача можна спитати «Wie heißen Sie?». Наприкінці ви прощаєтеся."
  examples: "Фрази для першого дня на курсі."
  summary_block: "**Ich heiße …** — ваше ім'я. **Wie heißt du?** — питання до слухача, **Wie heißen Sie?** — до викладача. **Freut mich!** — приємно познайомитися. **Tschüss, bis morgen!** — наприкінці."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Доброго ранку всім!"
  ex.2: "Привіт, мене звати Анна."
  ex.3: "Як тебе звати? (до іншого слухача)"
  ex.4: "Як вас звати? (ввічливо, до викладача)"
  ex.5: "Приємно познайомитися!"
  ex.6: "Бувай, до завтра!"
  x1.prompt: "Ви хочете назвати своє ім'я. Яке речення ви скажете?"
  x1.o2.fb: "Це питання про чуже ім'я."
  x1.o3.fb: "Freut mich — «приємно познайомитися»; ім'я тут не звучить."
  x1.expl: "Ich heiße … — так називають своє ім'я."
  x2.prompt: "Доповніть: «Мене звати Том»."
  x2.r1: "Пишіть ß (або ss у Швейцарії): heiße."
  x2.r2: "Heißt — з du; з ich — heiße."
  x2.expl: "Ich heiße Tom: з ich дієслово закінчується на -e."
  x3.prompt: "З'єднайте кожну репліку з відповіддю."
  x3.expl: "На питання про ім'я — ім'я; на Freut mich — Freut mich auch; на прощання — прощання."
  x4.prompt: "Правда чи ні?"
  x4.wrong: "Це правда: Wie heißt du? питає ім'я."
  x4.expl: "Wie heißt du? — «як тебе звати»."
  x5.prompt: "Напишіть два слова, що означають «приємно познайомитися»."
  x5.r1: "Звук «ой» пишеться eu: Freut."
  x5.r2: "Правильно Freut mich, з mich."
  x5.expl: "Freut mich кажуть під час знайомства."
  x6.prompt: "Оберіть правильну відповідь."
  x6.o2.fb: "Лена — її ім'я; назвіть своє."
  x6.o3.fb: "Auf Wiedersehen завершує розмову, а Лена хоче знати ваше ім'я."
  x6.expl: "Und du? ставить вам те саме питання: назвіть ім'я."
  x7.prompt: "Розставте слова в правильному порядку."
  x7.expl: "Спочатку питальне слово, потім дієслово: Wie heißt du?"
  x8.prompt: "Якими репліками можна почати перший урок?"
  x8.o3.fb: "Так завершують день, а не починають."
  x8.o4.fb: "Gute Nacht кажуть, коли йдуть пізно ввечері."
  x8.expl: "Привітання відкривають урок, прощання — завершують."
  x9.prompt: "Доповніть діалог."
  x9.expl: "Du heißt, ich heiße: закінчення змінюється з особою."
  x10.prompt: "Як ви відповісте?"
  x10.o2.fb: "Gute Nacht — для прощання пізно ввечері, а не для знайомства."
  x10.o3.fb: "Це прощання, а ви щойно познайомилися."
  x10.expl: "Freut mich auch: мені теж приємно."
  x11.prompt: "Поставте те саме питання викладачеві, ввічливо."
  x11.expl: "З викладачем — ввічливе Sie: Wie heißen Sie?"
  x12.prompt: "Це правильно?"
  x12.wrong: "Це правильно: heißen — «зватися», тож Ich heiße Anna називає ім'я."
  x12.expl: "Ich heiße Anna = мене звати Анна."
  x13.prompt: "Складіть привітання для всієї групи."
  x13.expl: "Guten Morgen zusammen: доброго ранку всім."
  x14.prompt: "Урок закінчився. Що ви скажете групі?"
  x14.o2.fb: "Hallo zusammen вітає групу на початку."
  x14.o3.fb: "Freut mich — для нового знайомства."
  x14.expl: "Bis morgen: до завтра, до наступного уроку."
  x15.prompt: "Доповніть прощання."
  x15.expl: "Bis morgen — «до завтра»."
  tip: "У Швейцарії ß не вживають: пишуть heisse і heisst. Тут приймаються обидва написання."
