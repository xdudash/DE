strings:
  title: "Дні тижня"
  summary: "Від Montag до Sonntag, am Montag і heute ist …"
  obj: "Називати дні тижня й казати, який сьогодні день."
  intro: "У Німеччині, Австрії та Швейцарії тиждень починається з Montag: Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag. Samstag і Sonntag — вихідні. Дні — іменники, тож пишуться з великої літери. «У понеділок» — am Montag."
  examples: "Дні в повсякденному житті."
  summary_block: "**Montag · Dienstag · Mittwoch · Donnerstag · Freitag · Samstag · Sonntag.** У якийсь день: **am Montag**. Сьогодні: **Heute ist …**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Сьогодні понеділок."
  ex.2: "у вівторок"
  ex.3: "У середу заняття."
  ex.4: "До п'ятниці!"
  ex.5: "Субота і неділя — вихідні."
  ex.6: "З понеділка по п'ятницю, з 9 до 18 (години роботи на табличці)"
  x1.prompt: "Який день іде після Montag?"
  x1.o2.fb: "Mittwoch іде після Dienstag; це третій день."
  x1.o3.fb: "Sonntag — день перед Montag."
  x1.expl: "Montag, потім Dienstag."
  x2.prompt: "Напишіть день після Mittwoch."
  x2.r1: "У Donnerstag подвійне n: Don-ners-tag."
  x2.r2: "Dienstag іде перед Mittwoch, а не після."
  x2.expl: "Mittwoch, потім Donnerstag."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правильно: Samstag і Sonntag — вихідні."
  x3.expl: "Wochenende — вихідні."
  x4.prompt: "З'єднайте кожен день з його скороченням."
  x4.expl: "Скорочення — перші дві літери і крапка."
  x5.prompt: "Які дні робочі для більшості людей?"
  x5.o4.fb: "Sonntag — вихідний; більшість магазинів і установ зачинені."
  x5.expl: "Montag–Freitag — робочі дні для більшості людей."
  x6.prompt: "Доповніть: у п'ятницю."
  x6.r1: "З днями вживайте am: am Freitag."
  x6.r2: "Im — з місяцями (im Mai). З днями — am."
  x6.expl: "Am + день: am Freitag."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Januar — місяць, а не день тижня."
  x7.o3.fb: "Це час, а питають про день."
  x7.expl: "Welcher Tag ist heute? питає, який сьогодні день: Heute ist + день."
  x8.prompt: "Розставте слова в правильному порядку."
  x8.expl: "Heute ist Montag: дієслово ist на другому місці."
  x9.prompt: "Це правильно?"
  x9.wrong: "Ні: спочатку Mittwoch, потім Donnerstag."
  x9.expl: "Montag, Dienstag, Mittwoch, Donnerstag …"
  x10.prompt: "Німецький тиждень починається з Montag (день 1). Який номер у Freitag? Запишіть цифрою."
  x10.r1: "6 — це Samstag. Рахуйте: Montag 1, Dienstag 2, Mittwoch 3, Donnerstag 4, Freitag 5."
  x10.expl: "Freitag — п'ятий день."
  x11.prompt: "Який день посередині тижня?"
  x11.o2.fb: "Montag — перший день тижня."
  x11.o3.fb: "Donnerstag — четвертий день; середина — Mittwoch."
  x11.expl: "Mittwoch буквально означає «середина тижня»."
  x12.prompt: "Перетворіть день на «у …»."
  x12.expl: "Am + день: am Samstag."
  x13.prompt: "Які слова — дні тижня?"
  x13.o3.fb: "Januar — місяць."
  x13.o4.fb: "Morgen — ранок (як у Guten Morgen), а не день тижня."
  x13.expl: "Sonntag і Dienstag закінчуються на -tag, як більшість днів."
  x14.prompt: "Доповніть тиждень."
  x14.expl: "Третій день — Mittwoch, п'ятий — Freitag."
  x15.prompt: "Як ви відповісте?"
  x15.o2.fb: "Freitag — день, а не ім'я, а Guten Tag — привітання, а не прощання."
  x15.o3.fb: "Друг каже Freitag — день цього тижня; Januar — місяць."
  x15.expl: "Bis + день: до зустрічі в цей день."
  tip: "Короткі форми на табличках: Mo. Di. Mi. Do. Fr. Sa. So. На півночі Німеччини замість Samstag можна почути Sonnabend."
