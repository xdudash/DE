strings:
  title: "Дні тижня"
  summary: "Від Montag до Sonntag, am Montag і Heute ist …"
  obj: "Називати дні тижня й казати, який сьогодні день."
  intro: "У Німеччині, Австрії та Швейцарії тиждень починається з Montag: Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag. Samstag і Sonntag — вихідні. Дні — іменники, тож пишуться з великої літери. «У понеділок» — am Montag (не «in Montag»)."
  examples: "Дні в повсякденному житті."
  summary_block: "**Montag · Dienstag · Mittwoch · Donnerstag · Freitag · Samstag · Sonntag.** У якийсь день: **am Montag**. Сьогодні: **Heute ist …**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Сьогодні понеділок."
  ex.2: "у вівторок"
  ex.3: "У середу заняття."
  ex.4: "До п'ятниці!"
  ex.5: "Субота і неділя — вихідні."
  ex.6: "З понеділка по п'ятницю, з 9 до 18 (години роботи на табличці)"
  ex.7: "Який сьогодні день?"
  x1.prompt: "Як ви відповісте?"
  x1.o2.fb: "Guten Tag — привітання, а друг прощається."
  x1.o3.fb: "Januar — місяць, і з місяцями кажуть im, а не am. Друг має на увазі Freitag."
  x1.expl: "Bis + день: до зустрічі в цей день."
  x2.prompt: "Доповніть: сьогодні субота."
  x2.r1: "Дні — іменники: пишіть Samstag з великої S."
  x2.r2: "Sonntag — неділя; субота — Samstag."
  x2.expl: "Heute ist Samstag."
  x3.prompt: "Які дні робочі для більшості людей?"
  x3.o4.fb: "Sonntag — вихідний; більшість магазинів і установ зачинені."
  x3.expl: "Montag–Freitag — робочі дні для більшості людей."
  x4.prompt: "Правда чи ні? (ein anderes Wort für = інше слово для)"
  x4.wrong: "Це правда: Sonnabend означає Samstag; так кажуть переважно на півночі та сході Німеччини."
  x4.expl: "Обидва слова правильні."
  x5.prompt: "Напишіть повну назву дня."
  x5.r1: "Sonntag — це So.; Sa. — Samstag."
  x5.expl: "Sa. = Samstag (на півночі також Sonnabend)."
  x6.prompt: "Оберіть правильну відповідь."
  x6.o2.fb: "Januar — місяць, а питають про день."
  x6.o3.fb: "Це час, а питають про день."
  x6.expl: "Welcher Tag ist heute? – Heute ist + день."
  x7.prompt: "Розставте слова в правильному порядку."
  x7.expl: "Heute ist Montag: дієслово ist на другому місці."
  x8.prompt: "Які слова — дні тижня?"
  x8.o3.fb: "Januar — місяць."
  x8.o4.fb: "Morgen — ранок, як у Guten Morgen."
  x8.expl: "Sonntag і Dienstag закінчуються на -tag, як більшість днів."
  x9.prompt: "Доповніть тиждень."
  x9.expl: "Третій день — Mittwoch, п'ятий — Freitag."
  x10.prompt: "Ви бачите цю табличку на магазині. Чи він відчинений у суботу?"
  x10.o1: "Ні, лише з понеділка по п'ятницю"
  x10.o2: "Так, щодня"
  x10.o2.fb: "Mo.–Fr. означає з Montag по Freitag; Sa. і So. на табличці немає."
  x10.o3: "Лише в суботу"
  x10.o3.fb: "Субота — це Sa.; на табличці Mo.–Fr."
  x10.expl: "Mo.–Fr.: Montag bis Freitag."
  x11.prompt: "Доповніть: у п'ятницю."
  x11.r1: "З днями вживайте am: am Freitag."
  x11.r2: "Im — з місяцями (im Mai). З днями — am."
  x11.r3: "Не in: з днями в німецькій — am."
  x11.expl: "Am + день: am Freitag."
  x12.prompt: "Правда чи ні?"
  x12.wrong: "Це правда: Samstag і Sonntag — вихідні."
  x12.expl: "Wochenende — вихідні."
  x13.prompt: "Напишіть день, який іде перед ним."
  x13.r1: "Sonntag іде після Samstag, а не перед ним."
  x13.r2: "Freitag закінчується на g, хоч звучить як k."
  x13.expl: "Freitag, потім Samstag."
  x14.prompt: "Який день іде наступним?"
  x14.o2.fb: "Mittwoch іде після Dienstag; це третій день."
  x14.o3.fb: "Sonntag — день перед Montag."
  x14.expl: "Montag, потім Dienstag."
  x15.prompt: "З'єднайте кожен день з його місцем у тижні."
  x15.expl: "Німецький тиждень починається з Montag (1) і закінчується Sonntag (7)."
  tip: "Короткі форми на табличках: Mo. Di. Mi. Do. Fr. Sa. So. На півночі та сході Німеччини замість Samstag кажуть і Sonnabend; обидва слова правильні."
