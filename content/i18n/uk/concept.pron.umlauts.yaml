strings:
  title: "Умлаути: ä, ö, ü"
  summary: "Ä, Ö і Ü — голосні з двома крапками. Кожна має власний звук, він не дорівнює простому a, o чи u."
  pattern.scope: "Голосні з умлаутом пишуться з двома крапками; кожна має власний звук."
  pattern.limits: "Звуки показано на прикладах слів; фонетичні знаки на A0 не використовуються."
  ex.kaese: "Käse (сир): ä — як „е“ в „bed“, тільки довше."
  ex.schoen: "schön (гарний): е з округленими губами."
  ex.ueber: "über (над): і з округленими губами."
