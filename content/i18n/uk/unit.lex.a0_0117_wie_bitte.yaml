strings:
  title: "Wie bitte? Як попросити повторити"
  summary: "Просіть повторити, говорити повільніше або кажіть, що не розумієте."
  obj: "Просити повторити чи говорити повільніше й казати, що не розумієте."
  intro: "Коли ви чогось не почули, скажіть Wie bitte? — це ввічливий спосіб перепитати. Noch einmal, bitte. — прохання сказати ще раз, Langsam, bitte. — прохання говорити повільніше, а Ich verstehe nicht. — «я не розумію». Ці фрази допомагають продовжити розмову, навіть коли ваша німецька ще нова."
  examples: "Фрази, коли ви чогось не зрозуміли."
  summary_block: "**Wie bitte?** — перепитати, **Noch einmal, bitte.** — ще раз, **Langsam, bitte.** — повільніше, **Ich verstehe nicht.** — коли не розумієте."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Перепрошую? (ви не почули)"
  ex.2: "Ще раз, будь ласка."
  ex.3: "Повільніше, будь ласка."
  ex.4: "Я не розумію."
  ex.5: "Перепрошую? Ще раз, будь ласка."
  x1.prompt: "Ви не почули, що сказав касир. Що ви скажете?"
  x1.o2.fb: "Danke — подяка; вона не просить повторити."
  x1.o3.fb: "Tschüss завершує розмову, а ви так і не дізналися, що сказали."
  x1.expl: "Wie bitte? ввічливо просить сказати ще раз."
  x2.prompt: "Напишіть ввічливий спосіб сказати, що ви не почули (два слова)."
  x2.r1: "Bitte пишеться з подвійним t."
  x2.r2: "Was? саме по собі звучить грубо; напишіть ввічливе Wie bitte?"
  x2.expl: "Wie bitte? — два слова, зі знаком питання."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правильно: Wie bitte? — ввічливий спосіб попросити повторити."
  x3.expl: "höflich — ввічливий."
  x4.prompt: "З'єднайте дві частини кожної фрази."
  x4.expl: "Wie bitte?, Noch einmal і Ich verstehe nicht — сталі фрази."
  x5.prompt: "Викладач говорить надто швидко. Що можна сказати?"
  x5.o4.fb: "Gute Nacht — «на добраніч»; це не допоможе зрозуміти викладача."
  x5.expl: "Усі три фрази допомагають, коли говорять надто швидко."
  x6.prompt: "Попросіть співрозмовника говорити повільніше."
  x6.r1: "Noch einmal — прохання повторити; щоб говорили повільніше, кажіть Langsam."
  x6.r2: "У langsam посередині ng: lang-sam."
  x6.expl: "Langsam — повільно."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Ви не зрозуміли ім'я; подяка не допоможе. Попросіть повторити."
  x7.o3.fb: "Розмова щойно почалася; краще попросіть повторити ім'я."
  x7.expl: "Складне ім'я? Попросіть повторити."
  x8.prompt: "Розставте слова в правильному порядку."
  x8.expl: "Спочатку Noch einmal, потім bitte."
  x9.prompt: "Це правильно?"
  x9.wrong: "Wie bitte? — прохання повторити, а не прощання."
  x9.expl: "Verabschiedung — прощання, як Tschüss."
  x10.prompt: "Доповніть діалог."
  x10.expl: "Wie bitte? і Noch einmal, bitte! — прохання повторити ім'я."
  x11.prompt: "Яка фраза означає, що ви не розумієте?"
  x11.o2.fb: "Ich verstehe означає «я розумію»; потрібне nicht."
  x11.o3.fb: "Langsam, bitte — прохання говорити повільніше, а не «я не розумію»."
  x11.expl: "nicht — не: Ich verstehe nicht."
  x12.prompt: "Зробіть це запитання ввічливим."
  x12.expl: "Wie bitte? замінює різке Was?"
  x13.prompt: "Хтось не почув вашого імені. Як ви відповісте?"
  x13.o2.fb: "Співрозмовник вас не почув; скажіть ім'я ще раз."
  x13.o3.fb: "Danke не повторює сказаного."
  x13.expl: "Повторіть ім'я, а якщо треба — продиктуйте по літерах."
  x14.prompt: "Складіть речення."
  x14.expl: "Ich verstehe nicht: nicht стоїть у кінці."
  x15.prompt: "Яке слово означає «повільно»?"
  x15.o2.fb: "einmal — один раз."
  x15.o3.fb: "nicht — не."
  x15.expl: "langsam — повільно."
  x16.prompt: "Напишіть фразу «ще раз» (два слова)."
  x16.r1: "Einmal — одне слово."
  x16.expl: "Noch einmal або розмовно Noch mal."
  tip: "Was? саме по собі може звучати грубо для незнайомих. Wie bitte? — завжди ввічливо."
