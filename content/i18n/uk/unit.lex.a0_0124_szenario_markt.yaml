strings:
  title: "Сценарій: покупки на ринку"
  summary: "Привітайтеся з продавцем, спитайте ціну, замовте, розплатіться й попрощайтеся."
  obj: "Купити кілька речей на ринку й зрозуміти ціну."
  intro: "На ринку ви вітаєтеся з продавцем, питаєте «Was kostet das?» і кажете, скільки вам потрібно. Продавець називає ціну («Das kostet …») і питає «Ist das alles?». Ви платите, дякуєте й прощаєтеся."
  examples: "Фрази на ринку."
  summary_block: "**Was kostet das?** — **Das kostet zwei Euro.** — **Drei Äpfel, bitte.** — **Ist das alles?** — **Ja, danke.**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Скільки це коштує?"
  ex.2: "Це коштує два євро."
  ex.3: "Три яблука, будь ласка. Один Apfel, кілька Äpfel."
  ex.4: "Це все? (продавець)"
  ex.5: "Так, дякую."
  ex.6: "Дуже дякую! Бувайте!"
  x1.prompt: "Ви хочете знати ціну. Що ви спитаєте?"
  x1.o2.fb: "Це питання про ім'я, а не про ціну."
  x1.o3.fb: "Це питання продавця: це все?"
  x1.expl: "Kosten — «коштувати»: Was kostet das?"
  x2.prompt: "Запишіть ціну цифрами."
  x2.expl: "Sieben Euro — це 7 євро."
  x3.prompt: "З'єднайте кожне питання з відповіддю."
  x3.expl: "На питання про ціну — ціна; на Ist das alles? — так чи ні; на Was möchten Sie? — замовлення."
  x4.prompt: "Правда чи ні?"
  x4.wrong: "Це правда: kosten — «коштувати», тож питання про ціну."
  x4.expl: "Was kostet das? = скільки це коштує?"
  x5.prompt: "Продавець каже 10 євро. Напишіть число словом."
  x5.r1: "У zehn є h: z-e-h-n."
  x5.r2: "Zehn починається з z, що звучить як «ц»."
  x5.expl: "Zehn Euro: десять євро."
  x6.prompt: "Оберіть правильну відповідь."
  x6.o2.fb: "Tschüss завершує розмову, а продавець щойно спитав, що ви бажаєте."
  x6.o3.fb: "Продавець питає, що ви бажаєте, а не ваше ім'я."
  x6.expl: "Відповідайте числом, назвою товару й bitte."
  x7.prompt: "Розставте слова в правильному порядку."
  x7.expl: "Спочатку питальне слово, потім дієслово: Was kostet das?"
  x8.prompt: "Які репліки ввічливі на ринку?"
  x8.o4.fb: "Без числа й bitte одне слово звучить грубо."
  x8.expl: "Привітання, bitte і danke — це ввічливо на будь-якому ринку."
  x9.prompt: "Доповніть діалог."
  x9.expl: "Was kostet das? … Hier, bitte!"
  x10.prompt: "Як ви відповісте?"
  x10.o2.fb: "Ви вже привіталися; тепер продавець питає, чи потрібно ще щось."
  x10.o3.fb: "Hallo zusammen вітає групу, а продавець ставить питання."
  x10.expl: "Ist das alles? — Ja, danke: так, це все."
  x11.prompt: "Доповніть замовлення: три яблука, будь ласка."
  x11.r1: "Один Apfel, два й більше — Äpfel: у множині Ä."
  x11.r2: "Пишіть Ä з двома крапками: Äpfel."
  x11.expl: "Drei Äpfel, bitte: три яблука, будь ласка."
  x12.prompt: "Це правильно?"
  x12.wrong: "Ні: Danke schön — подяка, а не питання."
  x12.expl: "Danke schön = дуже дякую."
  x13.prompt: "З'єднайте ціну з цифрами."
  x13.expl: "Zwei 2, fünf 5, zwölf 12."
  x14.prompt: "Ви відходите від прилавка. Що ви скажете?"
  x14.o2.fb: "Це питання про ціну, а ви вже йдете."
  x14.o3.fb: "Guten Morgen — привітання, а ви йдете."
  x14.expl: "Подякуйте продавцеві й попрощайтеся."
  x15.prompt: "Запишіть кількість яблук цифрами."
  x15.expl: "Vier Äpfel: чотири яблука."
  tip: "Покажіть на фрукти й спитайте «Was kostet das?»: das означає «це», тож назва фрукта не потрібна."
