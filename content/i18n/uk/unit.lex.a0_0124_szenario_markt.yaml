strings:
  title: "Сценарій: покупки на ринку"
  summary: "Привітайте продавця, спитайте ціну й розплатіться."
  obj: "Купити кілька речей на ринку й спитати ціну."
  intro: "На ринку привітайте продавця, спитайте «Was kostet das?», назвіть кількість і подякуйте."
  examples: "Фрази для ринку."
  summary_block: "**Was kostet das?** — Скільки це коштує? **Drei Äpfel, bitte.** — Три яблука, будь ласка. **Danke schön!** — Дякую."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Подивіться на ситуацію ще раз."
  fb.not_this: "Це не те. Прочитайте пояснення."
  ex.1: "Скільки це коштує?"
  ex.2: "Три яблука, будь ласка."
  ex.3: "Дуже дякую."
  x1.prompt: "Яке привітання пасує ринковому ряду о 9 ранку?"
  x1.expl: "Guten Morgen — для ранку."
  x2.prompt: "Оберіть правильну відповідь."
  x2.expl: "Назвіть, що хочете і скільки."
  x3.prompt: "Яке питання запитує ціну?"
  x3.expl: "Kostet — «коштує»."
  x4.prompt: "З'єднайте слово з цифрою."
  x4.expl: "Кожне слово відповідає одній цифрі."
  x5.prompt: "Запишіть цифрами: sieben."
  x5.expl: "sieben — це 7."
  x6.prompt: "Напишіть словом число 2."
  x6.expl: "2 пишеться zwei."
  x7.prompt: "Чи правдиве це твердження?"
  x7.expl: "Was kostet das? питає, скільки це коштує."
  x8.prompt: "Чи правдиве це твердження?"
  x8.expl: "Питання має знак питання."
  x8.wrong: "Danke schön — подяка, не питання."
  x9.prompt: "Які слова можна сказати на ринку?"
  x9.expl: "Hallo і Danke — ввічливо на ринку; Gute Nacht — для ночі."
  x10.prompt: "Продавець каже «Das macht zwei Euro.» Що скажете, розплачуючись?"
  x10.expl: "Hier, bitte — коли розплачуєтеся."
  x11.prompt: "Оберіть правильну відповідь."
  x11.expl: "Прощайтеся, коли відходите від прилавка."
  x12.prompt: "Напишіть подяку наприкінці покупки."
  x12.expl: "Danke schön — ввічлива форма."
  x13.prompt: "Яке німецьке слово для 10?"
  x13.expl: "Zehn — це 10."
  x14.prompt: "Чи правдиве це твердження?"
  x14.expl: "О 9 ранку ще ранок."
  x15.prompt: "Яке речення замовляє три яблука?"
  x15.expl: "Äpfel — множина від Apfel."
