strings:
  title: "Числа від 20 до 50"
  summary: "Десятки від 20 до 50 і числа на кшталт einundzwanzig."
  obj: "Читати, вимовляти й писати числа від 20 до 50."
  intro: "Десятки: zwanzig (20), dreißig (30), vierzig (40) і fünfzig (50). Більшість закінчується на -zig; dreißig — виняток, пишеться з ß. У стандартній німецькій у Німеччині закінчення -zig вимовляють як -ціх (ch як в ich); на півдні, в Австрії та Швейцарії зазвичай чути -цік. Числа між десятками пишуться одним словом, і одиниці стоять першими: einundzwanzig — це ein + und + zwanzig, 21. Українською навпаки: «двадцять один» — спочатку десятки."
  examples: "Числа в повсякденному житті."
  summary_block: "**zwanzig 20 · dreißig 30 · vierzig 40 · fünfzig 50.** Між ними: одиниці + **und** + десятки, одним словом: **einundzwanzig 21**, **fünfunddreißig 35**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "двадцять євро"
  ex.2: "автобус номер тридцять"
  ex.3: "сорок хвилин"
  ex.4: "п'ятдесят центів"
  ex.5: "двадцять один: ein + und + zwanzig, одним словом"
  ex.6: "Скільки тобі років? – Мені тридцять три."
  ex.7: "Сорок більше, ніж тридцять (mehr als = більше, ніж)."
  x1.prompt: "З'єднайте слова з числами."
  x1.expl: "Це чотири десятки цього уроку."
  x2.prompt: "13 чи 30? Яке слово означає 30?"
  x2.o2.fb: "Dreizehn — це 13: drei + zehn. Десятки закінчуються на -zig, а 30 — на -ßig."
  x2.o3.fb: "Drei — це 3."
  x2.expl: "-zehn — це 13–19; -zig і -ßig — десятки."
  x3.prompt: "Напишіть це число словом."
  x3.r1: "Fünfzehn — це 15. 50 — fünfzig."
  x3.r2: "У fünfzig є ü: f-ü-n-f-z-i-g (або ue, якщо немає ü)."
  x3.expl: "Fünf + -zig: fünfzig."
  x4.prompt: "Які з цих слів закінчуються на -zig?"
  x4.o4.fb: "Dreißig — виняток: закінчується на -ßig."
  x4.o5.fb: "Vierzehn (14) закінчується на -zehn."
  x4.expl: "Zwanzig, vierzig і fünfzig — на -zig; dreißig — на -ßig."
  x5.prompt: "Доповніть число 21."
  x5.r1: "Перед und eins втрачає s: einundzwanzig."
  x5.r2: "Zwei дасть zweiundzwanzig, 22."
  x5.expl: "21 = ein + und + zwanzig."
  x6.prompt: "Правда чи ні?"
  x6.wrong: "Це правда: 20 + 10 = 30."
  x6.expl: "Zwanzig 20, zehn 10, dreißig 30."
  x7.prompt: "Розставте слова: номер автобуса."
  x7.expl: "Спершу Bus, потім Nummer, потім число."
  x8.prompt: "Як зазвичай вимовляють кінець слова „zwanzig“ у Німеччині?"
  x8.o1: "-ціх, з ch як в ich"
  x8.o2: "-ціг, з g як у слові «гол»"
  x8.o2.fb: "Дзвінке g наприкінці не вимовляють. У Німеччині чути -ціх; на півдні, в Австрії та Швейцарії зазвичай -цік."
  x8.expl: "Пишемо -zig, вимовляємо -ціх у Німеччині (-цік на півдні, в Австрії, Швейцарії)."
  x9.prompt: "Запишіть це число цифрами."
  x9.r1: "У слові одиниці першими: sieben (7) і vierzig (40) — це 47."
  x9.expl: "Sieben + und + vierzig = 47."
  x10.prompt: "Оберіть правильну відповідь."
  x10.o2.fb: "Німецькою одиниці першими: dreiunddreißig, одним словом."
  x10.o3.fb: "Euro — для цін; про вік кажіть Ich bin + число."
  x10.expl: "Wie alt bist du? – Ich bin + число."
  x11.prompt: "Напишіть число словами."
  x11.r1: "Одиниці першими: drei + und + dreißig."
  x11.r2: "Пишіть одним словом: dreiunddreißig."
  x11.expl: "33 = drei + und + dreißig, одним словом."
  x12.prompt: "Яке слово означає 35?"
  x12.o2.fb: "Dreiundfünfzig — це 53: частини переставлені. 35 — fünf + und + dreißig."
  x12.o3.fb: "Німецькою одиниці першими: fünfunddreißig."
  x12.expl: "Fünf (5) + und + dreißig (30)."
  x13.prompt: "Напишіть числа словами."
  x13.expl: "Vierzig Euro und zwanzig Cent: 40 євро 20 центів."
  x14.prompt: "Правда чи ні? (mehr als = більше, ніж)"
  x14.wrong: "Ні: vierzig — 40, fünfzig — 50, тож vierzig менше."
  x14.expl: "40 менше за 50."
  x15.prompt: "Які числа більші за 30?"
  x15.o3.fb: "Neunundzwanzig — це 29, трохи менше за 30."
  x15.o4.fb: "Dreizehn — це 13."
  x15.expl: "Einunddreißig — 31, vierzig — 40."
  tip: "Спочатку одиниці, потім und, потім десятки: 34 = vierunddreißig, тобто «чотири і тридцять». Eins перед und стає ein: einundzwanzig. Типова помилка українськомовних — dreißigvier за зразком «тридцять чотири»."
