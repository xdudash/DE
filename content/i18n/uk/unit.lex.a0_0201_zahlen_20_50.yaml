strings:
  title: "Числа від 20 до 50"
  summary: "Десятки від 20 до 50 і числа на кшталт einundzwanzig."
  obj: "Читати й писати числа від 20 до 50."
  intro: "Десятки: zwanzig (20), dreißig (30), vierzig (40) і fünfzig (50). Більшість закінчується на -zig; dreißig — виняток, пишеться з ß. Числа між ними пишуться одним словом, і одиниці стоять першими: einundzwanzig — це ein + und + zwanzig, 21."
  examples: "Числа в повсякденному житті."
  summary_block: "**zwanzig 20 · dreißig 30 · vierzig 40 · fünfzig 50.** Між ними: одиниці + **und** + десятки, одним словом: **einundzwanzig 21**, **fünfunddreißig 35**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "двадцять євро"
  ex.2: "автобус номер тридцять"
  ex.3: "сорок хвилин"
  ex.4: "п'ятдесят центів"
  ex.5: "двадцять один: ein + und + zwanzig, одним словом"
  ex.6: "Скільки тобі років? – Мені тридцять три."
  x1.prompt: "Як сказати 30?"
  x1.o2.fb: "Dreizehn — це 13: drei + zehn. 30 — dreißig."
  x1.o3.fb: "Слова dreizig немає: 30 — виняток, dreißig з ß."
  x1.expl: "Dreißig — єдиний десяток, що закінчується на -ßig."
  x2.prompt: "Запишіть число цифрами: vierzig."
  x2.r1: "14 — це vierzehn. Vierzig закінчується на -zig, тож це десяток: 40."
  x2.expl: "Vierzig — чотири десятки: 40."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правильно: ein + und + zwanzig = 21."
  x3.expl: "Одиниці першими: ein (1) і zwanzig (20)."
  x4.prompt: "З'єднайте слова з числами."
  x4.expl: "Це чотири десятки цього уроку."
  x5.prompt: "Які з цих чисел більші за 30?"
  x5.o4.fb: "Zwanzig — це 20, менше за 30."
  x5.o5.fb: "Dreizehn — це 13, а не 30."
  x5.expl: "Vierzig — 40, fünfzig — 50, einunddreißig — 31."
  x6.prompt: "Напишіть 50 словом."
  x6.r1: "Fünfzehn — це 15. 50 — fünfzig."
  x6.r2: "У fünfzig є ü: f-ü-n-f-z-i-g."
  x6.expl: "Fünf + -zig: fünfzig."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Uhr — це час доби, а питають ціну."
  x7.o3.fb: "Це привітання, а не ціна."
  x7.expl: "Was kostet das? питає ціну: число і Euro."
  x8.prompt: "Розставте слова в правильному порядку."
  x8.expl: "Дієслово kostet на другому місці: Das kostet dreißig Euro."
  x9.prompt: "Це правильно?"
  x9.wrong: "Ні: vierundzwanzig — це 24, vier (4) + zwanzig (20). 42 — zweiundvierzig."
  x9.expl: "Одиниці чути першими, але цифрами десятки пишуть першими: 24."
  x10.prompt: "Доповніть число 21."
  x10.r1: "Перед und eins втрачає s: einundzwanzig."
  x10.r2: "Zwei дасть zweiundzwanzig, 22."
  x10.expl: "21 = ein + und + zwanzig."
  x11.prompt: "Яке слово означає 35?"
  x11.o2.fb: "Dreiundfünfzig — це 53. Одиниці першими, тож 35 — fünf + und + dreißig."
  x11.o3.fb: "Fünfzehn — це 15."
  x11.expl: "Fünf (5) + und + dreißig (30)."
  x12.prompt: "Яке це число? Запишіть цифрами: siebenundvierzig."
  x12.r1: "У слові одиниці першими: sieben (7) і vierzig (40) — це 47."
  x12.expl: "Sieben + und + vierzig = 47."
  x13.prompt: "Які слова означають число між 20 і 30?"
  x13.o3.fb: "Zweiunddreißig — це 32, більше за 30."
  x13.o4.fb: "Zwölf — це 12."
  x13.expl: "Einundzwanzig — 21, achtundzwanzig — 28."
  x14.prompt: "Доповніть приклади."
  x14.expl: "10 + 20 = 30 і 20 + 20 = 40."
  x15.prompt: "Як ви відповісте?"
  x15.o2.fb: "Euro — для цін; про вік кажуть лише число."
  x15.o3.fb: "Uhr — для часу доби, а питають про вік."
  x15.expl: "Wie alt bist du? – Ich bin + число."
  tip: "Спочатку одиниці, потім und, потім десятки: 34 = vierunddreißig. Eins перед und стає ein: einundzwanzig."
