strings:
  title: "Звуки ch і sch"
  summary: "ch має два звуки, залежно від голосного перед ним; sch — один звук."
  obj: "Розрізняти ich-звук і ach-звук за літерою перед ch і писати sch."
  intro: "Після e, i, ä, ö, ü, ei, eu, l, r або n ch — м'який ich-звук, вимовлений спереду рота: ich, Milch, Küche. Після a, o, u чи au ch — ach-звук із глибини горла, схожий на українське х: acht, noch, Buch, auch. Три літери sch дають один звук, як ш: Schule, Tisch, schön."
  examples: "Слова з ch і sch."
  summary_block: "**ich-звук** після e, i, ä, ö, ü, ei, eu, l, r, n (ich, Milch). **ach-звук** після a, o, u, au (acht, Buch). **sch** — один звук (Schule)."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "я: ich-звук після i"
  ex.2: "молоко: ich-звук після l"
  ex.3: "кухня: ich-звук після ü"
  ex.4: "вісім: ach-звук після a"
  ex.5: "книжка: ach-звук після u"
  ex.6: "також: ach-звук після au"
  ex.7: "школа: sch — один звук"
  ex.8: "стіл: sch у кінці"
  x1.prompt: "У якому слові ch — це ach-звук?"
  x1.o2.fb: "В ich ch стоїть після i, тому це ich-звук."
  x1.o3.fb: "У Milch ch стоїть після l, тому це ich-звук."
  x1.expl: "acht: ch після a — ach-звук."
  x2.prompt: "Напишіть слово «школа»."
  x2.r1: "Німецькою цей звук пишуть трьома літерами: sch."
  x2.r2: "У Schule немає h після u: S-c-h-u-l-e."
  x2.expl: "Schule: sch на початку, потім u-l-e."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правда: ch після u — ach-звук."
  x3.expl: "u — один із голосних a, o, u, au, після яких звучить ach-звук."
  x4.prompt: "З'єднайте кожне слово з його звуком."
  x4.expl: "ich: після i. Buch: після u. Schule: sch."
  x5.prompt: "У яких словах ich-звук?"
  x5.o4.fb: "auch: ch після au — ach-звук."
  x5.o5.fb: "noch: ch після o — ach-звук."
  x5.expl: "i, l і ü перед ch дають ich-звук."
  x6.prompt: "Доповніть слово «стіл»."
  x6.r1: "Німецькою цей звук пишеться sch: Tisch."
  x6.r2: "Tich — такого слова немає. Стіл — Tisch, із sch."
  x6.expl: "Tisch: sch у кінці слова."
  x7.prompt: "Одногрупник питає, як пишеться слово. Яка відповідь правильна?"
  x7.o2.fb: "Для цього звуку німецькій потрібні три літери: s, c, h."
  x7.o3.fb: "Так вийшло б chön. schön починається з s, c, h."
  x7.expl: "schön (гарний): s-c-h-ö-n."
  x8.prompt: "Доповніть слова: я, вісім, школа."
  x8.expl: "ich і acht обидва пишуться з ch, хоча звуки різні; Schule починається з Sch."
  x9.prompt: "Яке слово починається з sch?"
  x9.o2.fb: "Milch закінчується на ch (ich-звук); воно не починається з sch."
  x9.o3.fb: "acht починається з голосного; його ch — ach-звук."
  x9.expl: "schön починається з sch."
  x10.prompt: "Напишіть по літерах слово «молоко»."
  x10.r1: "Milch пишеться з ch, а не sch: ich-звук після l."
  x10.r2: "Звук після l пишеться ch: Milch."
  x10.expl: "Milch: ch після l."
  x11.prompt: "Це правильно?"
  x11.wrong: "Після i звучить ich-звук, як в ich і nicht."
  x11.expl: "ach-звук буває лише після a, o, u та au."
  x12.prompt: "Доповніть слово «пиріг»."
  x12.r1: "Kuschen — такого слова немає. Пиріг — Kuchen, із ch."
  x12.r2: "Одного h недостатньо: звук пишеться ch."
  x12.expl: "Kuchen: ch після u — ach-звук."
  x13.prompt: "У яких словах ach-звук?"
  x13.o4.fb: "ich: після i — ich-звук."
  x13.o5.fb: "Küche: після ü — ich-звук."
  x13.expl: "a, u та au перед ch дають ach-звук."
  x14.prompt: "Наберіть слово «риба»."
  x14.r1: "Fish — англійською. Німецькою пишуть sch: Fisch."
  x14.r2: "Fich — такого слова немає. Риба — Fisch, із sch."
  x14.expl: "der Fisch: sch у кінці."
  x15.prompt: "Яка літера перед ch дає ich-звук?"
  x15.o2.fb: "Після a звучить ach-звук, як в acht."
  x15.o3.fb: "Після u звучить ach-звук, як у Buch."
  x15.expl: "i — одна з літер, після яких звучить ich-звук."
  tip: "ich-Laut та ach-Laut — німецькі назви цих двох звуків. ich-звук — не те саме, що sch: ich — це не «іш»."
