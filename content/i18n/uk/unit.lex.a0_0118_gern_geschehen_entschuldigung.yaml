strings:
  title: "Gern geschehen і Entschuldigung"
  summary: "Відповідайте на подяку Gern geschehen або Kein Problem, а Entschuldigung кажіть, щоб вибачитися чи привернути увагу."
  obj: "Відповідати на подяку по-різному й вживати Entschuldigung, щоб вибачитися або привернути увагу."
  intro: "Окрім Bitte, на подяку можна відповісти Gern geschehen (нема за що, з радістю), коротко Gern або розмовно Kein Problem (без проблем). Entschuldigung має два вжитки: це вибачення, наприклад коли ви когось штовхнули, і спосіб звернутися до незнайомця перед запитанням: Entschuldigung, wo ist der Bahnhof?"
  examples: "Відповідь на подяку й вибачення."
  summary_block: "**Gern geschehen**, **Gern** і **Kein Problem** — відповіді на подяку. **Entschuldigung** — вибачення або звертання перед запитанням."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Дякую! – Нема за що!"
  ex.2: "Дякую! – Будь ласка! (коротко)"
  ex.3: "Щиро дякую! – Без проблем! (розмовно)"
  ex.4: "Ой, вибачте! (ви когось штовхнули)"
  ex.5: "Перепрошую, де вокзал?"
  ex.6: "Вибачте! – Нічого страшного!"
  x1.prompt: "Вам дякують за допомогу. Яка відповідь означає «нема за що»?"
  x1.o2.fb: "Entschuldigung — вибачення або звертання, а не відповідь на подяку."
  x1.o3.fb: "Danke — подяка, а дякують саме вам."
  x1.expl: "Gern geschehen — тепла відповідь на подяку."
  x2.prompt: "Напишіть ввічливу відповідь на подяку зі словом geschehen."
  x2.r1: "Geschehen — ge-sche-hen: пишіть повністю."
  x2.expl: "Gern geschehen (також Gerne geschehen) — «нема за що, з радістю»."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правильно: Kein Problem — розмовна відповідь на подяку."
  x3.expl: "Kein Problem — розмовно; Gern geschehen — трохи ввічливіше."
  x4.prompt: "З'єднайте дві частини кожної фрази."
  x4.expl: "Gern geschehen, Kein Problem і Vielen Dank — сталі фрази."
  x5.prompt: "Які відповіді пасують після «Danke!»?"
  x5.o5.fb: "Entschuldigung — вибачення, а тут вибачатися нема за що."
  x5.expl: "Gern geschehen, Gern, Kein Problem і Bitte — усе це відповіді на подяку."
  x6.prompt: "Ви наступили комусь на ногу. Вибачтеся."
  x6.r1: "Слово — Entschuldigung, із закінченням -ung."
  x6.r2: "Entschuldigung — іменник: пишіть з великої E."
  x6.expl: "Entschuldigung — вибачення."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Gern geschehen — відповідь на подяку, а не на вибачення."
  x7.o3.fb: "Guten Abend — привітання, а людина вибачається."
  x7.expl: "Kein Problem — так приймають вибачення."
  x8.prompt: "Розставте слова в правильному порядку."
  x8.expl: "Спочатку Entschuldigung, щоб привернути увагу, потім запитання."
  x9.prompt: "Це правильно?"
  x9.wrong: "Entschuldigung — вибачення або звертання; на Danke відповідають Bitte або Gern geschehen."
  x9.expl: "На Danke відповідають Bitte, Gern geschehen або Kein Problem."
  x10.prompt: "Доповніть діалог на вулиці."
  x10.expl: "Entschuldigung відкриває запитання; Gern geschehen відповідає на подяку. Da links — «там ліворуч»."
  x11.prompt: "Ви хочете поставити запитання незнайомцю на вулиці. З чого почати?"
  x11.o2.fb: "Gern geschehen — відповідь на подяку; з нього не починають запитання."
  x11.o3.fb: "Tschüss — прощання, а ви лише починаєте розмову."
  x11.expl: "Entschuldigung ввічливо привертає увагу незнайомця."
  x12.prompt: "Відповідайте на подяку ввічливіше, зі словом geschehen."
  x12.expl: "Kein Problem — розмовно; Gern geschehen — тепліше й ввічливіше."
  x13.prompt: "Як ви відповісте?"
  x13.o2.fb: "Вибачатися нема за що; відповідайте на подяку."
  x13.o3.fb: "Ви почули подяку; перепитувати не треба."
  x13.expl: "Für die Hilfe — «за допомогу». Відповідайте Gern geschehen."
  x14.prompt: "Складіть відповідь."
  x14.expl: "Спочатку Kein Problem, потім ім'я."
  x15.prompt: "Яку роль виконує Entschuldigung у «Entschuldigung, wo ist der Bahnhof?»"
  x15.o1: "Ввічливо привертає увагу."
  x15.o2: "Це подяка."
  x15.o2.fb: "Подяка — це Danke або Vielen Dank."
  x15.o3: "Це прощання."
  x15.o3.fb: "Прощання — це Tschüss або Auf Wiedersehen."
  x15.expl: "Перед запитанням Entschuldigung означає «перепрошую»."
  x16.prompt: "Напишіть розмовну відповідь на подяку зі словом Problem."
  x16.r1: "Пишеться Kein, без -e: Kein Problem — сталий вираз."
  x16.r2: "Problem пишеться P-r-o-b-l-e-m."
  x16.expl: "Kein Problem — «без проблем»."
