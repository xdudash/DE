  title: Два звуки ch
  summary: М'який ich-Laut після e, i, ä, ö, ü, l, r, n (ich, nicht) і твердий ach-Laut після a, o, u, au (Buch, auch). Жоден із них не дорівнює українському «х» у всіх позиціях.
