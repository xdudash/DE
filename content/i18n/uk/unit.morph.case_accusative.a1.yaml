strings:
  title: "Akkusativ: прямий додаток"
  summary: "Akkusativ позначає прямий додаток. Артиклі чоловічого роду змінюються; жіночий, середній і множинний артиклі в цій моделі зберігаються."
  obj.role: "Знаходити прямий додаток у простому реченні."
  obj.article: "Обирати означений або неозначений артикль для прямого додатка."
  b.intro: |
    **Akkusativ** часто позначає людину або предмет, на який безпосередньо спрямована дія. У реченні *Ich sehe den Hund* (Я бачу собаку) *ich* — той, хто діє, а *den Hund* — той, кого я бачу.

    Спочатку знайдіть підмет, а потім поставте після дієслова запитання **кого?** або **що?** Відповідь часто буде прямим додатком в Akkusativ.
  b.pattern.caption: "В Akkusativ змінюються лише артиклі чоловічого роду"
  col.nominative: "Форма підмета"
  col.accusative: "Форма додатка"
  col.example: "Приклад"
  b.examples.title: "Додатки в повсякденних реченнях"
  ex.book: "Я купую яблуко."
  ex.coffee: "Вона замовляє каву."
  ex.film: "Ми дивимося фільм."
  ex.fem: "Він відвідує родину."
  ex.neut: "Я беру велосипед."
  b.rule: |
    З іменником **чоловічого роду** означений артикль змінюється з *der* на *den*, а неозначений — з *ein* на *einen*. Так само змінюються *kein → keinen* і присвійні форми, наприклад *mein → meinen*.

    Артиклі жіночого роду *die*, середнього роду *das* і множини *die* у цій базовій моделі Akkusativ не змінюються. Сам іменник зазвичай залишається тим самим: *der Hund → den Hund*.
  b.summary: |
    - Підмет виконує дію і зазвичай стоїть у Nominativ.
    - Прямий додаток відповідає на запитання **кого?** або **що?** після дієслова.
    - Чоловічий рід: *der → den*, *ein → einen*, *kein → keinen*.
    - *Die* жіночого роду, *das* середнього роду та *die* множини тут не змінюються.
  b.practice.title: "Практика: знайди й утвори додаток"
  fb.correct: "Правильно."
  fb.incorrect: "Ще не зовсім. Знайдіть додаток і перевірте рід іменника."
  x.article.prompt: "Оберіть артикль для прямого додатка."
  x.article.a: "*Der* — форма чоловічого роду для підмета. Тут яблуко є додатком."
  x.article.c: "*Dem* вживається з деякими додатками в Dativ; тут потрібен Akkusativ."
  x.article.explanation: "*Apfel* — іменник чоловічого роду, а тут це те, що купують. Тому потрібен Akkusativ *den*."
  x.cloze.prompt: "Доповніть речення артиклем в Akkusativ."
  x.cloze.explanation: "*Bahnhof* — чоловічого роду. Як додаток після *suchen* він потребує форми *einen*."
  x.match.prompt: "Зіставте форму підмета з формою додатка в Akkusativ."
  x.match.explanation: "У цьому наборі змінюється лише артикль чоловічого роду: *der → den*."
  x.order.prompt: "Складіть речення «Я дивлюся фільм»."
  x.order.explanation: "Спочатку підмет, потім дієслово у відповідній формі та додаток: *Ich sehe einen Film.*"
  x.transform.prompt: "Виправте артикль: чоловік купує яблуко."
  x.transform.explanation: "Яблуко — прямий додаток. *Apfel* чоловічого роду, тому *der* змінюється на *den*."
  x.correct.prompt: "Виправте артикль у реченні."
  x.correct.rule: "Лікар — додаток після *besucht*. Використайте чоловічу форму Akkusativ *den Arzt*."
  x.correct.explanation: "*Sie* — підмет. Людина, яку вона відвідує, — прямий додаток: *den Arzt*."
  x.true_false.prompt: "Визначте, чи правильне твердження."
  x.true_false.wrong: "Тут *ich* — підмет, а *den Hund* — прямий додаток."
  x.true_false.explanation: "Після дієслова *sehen* побачений предмет є прямим додатком; *den Hund* стоїть в Akkusativ."
