strings:
  title: "Особові займенники в Akkusativ"
  summary: "Замінюйте прямий додаток особовим займенником: mich, dich, ihn, sie, es, uns, euch, sie/Sie."
  obj.forms: "Розпізнавати особові займенники в Akkusativ."
  obj.replace: "Замінювати прямий додаток відповідним займенником в Akkusativ."
  b.intro: |
    Якщо людина або предмет є **прямим додатком**, використовуйте займенник в Akkusativ. Порівняйте: *Der Mann ist nett. Ich mag ihn.* (Чоловік приємний. Він мені подобається.) Іменник *der Mann* чоловічого роду, тому в ролі додатка вживаємо *ihn*.

    У простому розповідному реченні займенник зазвичай стоїть після дієслова у відповідній формі: *Sie sieht mich.*
  b.pattern.caption: "Займенники-підмети змінюються, коли стають прямим додатком"
  col.subject: "Підмет"
  col.object: "Прямий додаток"
  col.example: "Приклад"
  b.examples.title: "Замінюємо повторювані іменники займенниками"
  ex.friend: "Я знаю чоловіка. Я його знаю."
  ex.friend_f: "Ми відвідуємо сусідку. Ми її відвідуємо."
  ex.thing: "Він бере книжку. Він її бере."
  ex.plural: "Вона телефонує дітям. Вона їм телефонує."
  b.rule: |
    Запам’ятайте пари: *ich → mich*, *du → dich*, *er → ihn*, *sie → sie*, *es → es*, *wir → uns*, *ihr → euch*, *sie/Sie → sie/Sie*.

    Зверніть увагу на пару *er → ihn*: форму *er* не можна використовувати як прямий додаток. *Sie* жіночого роду, *es* середнього роду та *sie* множини виглядають так само, як форми підмета, але їхня роль у реченні змінюється.
  b.summary: |
    - Використовуйте займенник в Akkusativ для людини або предмета в ролі прямого додатка.
    - Запам’ятайте пари *ich/mich*, *du/dich*, *er/ihn*, *wir/uns*, *ihr/euch*.
    - Форми *sie* і *es* можуть не змінюватися; визначайте відмінок за роллю у реченні.
    - У простому реченні займенник зазвичай стоїть після дієслова: *Ich sehe dich.*
  b.practice.title: "Практика: обираємо й замінюємо займенники"
  fb.correct: "Правильно."
  fb.incorrect: "Ще не зовсім. Перевірте, чи є займенник підметом або прямим додатком."
  x.ihn.prompt: "Оберіть займенник, який замінить «чоловіка» в ролі додатка."
  x.ihn.a: "*Er* — форма підмета. Тут ця людина є додатком при *mag*."
  x.ihn.c: "*Ihm* — форма Dativ. Тут *mögen* вживається з прямим додатком."
  x.ihn.explanation: "Чоловік є прямим додатком після *mag*, тому використовуйте Akkusativ *ihn*."
  x.cloze.prompt: "Замініть Анну відповідним займенником."
  x.cloze.explanation: "Анна — жінка і прямий додаток, тому використовуйте *sie*."
  x.match.prompt: "Зіставте займенники-підмети з формами Akkusativ."
  x.match.explanation: "Основні змінені форми: *ich/mich*, *du/dich*, *er/ihn* і *wir/uns*."
  x.order.prompt: "Складіть речення «Я бачу вас сьогодні». Поставте *Ich* першим."
  x.order.explanation: "Займенник-додаток стоїть після дієслова: *Ich sehe euch heute.*"
  x.transform.prompt: "Замініть *den Lehrer* займенником."
  x.transform.explanation: "*Der Lehrer* чоловічого роду. В Akkusativ займенник — *ihn*."
  x.error.prompt: "Виправте форму займенника."
  x.error.rule: "Після *sieht* мовець є прямим додатком: використовуйте *mich*, а не форму підмета *ich*."
  x.error.explanation: "Підмет — *er*. Людина, яку він бачить, є додатком, тому потрібно *mich*."
  x.true_false.prompt: "Визначте, чи правильне твердження."
  x.true_false.wrong: "Форма підмета — *er*, а форма Akkusativ — *ihn*."
  x.true_false.explanation: "Для прямого додатка чоловічого роду *er* змінюється на *ihn*."
