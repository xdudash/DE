strings:
  title: "Привітання: Hallo і Guten Tag"
  summary: "Hallo — для знайомих, Guten Tag — ввічливо для всіх удень."
  obj: "Обирати привітання, що пасує до людини й ситуації."
  intro: "Hallo — звичайне привітання для друзів, однокласників і знайомих колег. Guten Tag — ввічливе привітання вдень: з незнайомцями, на рецепції, у магазині чи установі. Обидва вживають у Німеччині, Австрії та Швейцарії, а Guten Tag завжди доречне у формальній ситуації."
  examples: "Привітання в коротких сценах."
  summary_block: "**Hallo** — зі знайомими. **Guten Tag** — ввічливо з будь-ким удень, особливо з **Herr** або **Frau** і прізвищем."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Привіт, Анно! (подрузі)"
  ex.2: "Добрий день, пані Вебер! (ввічливо, з прізвищем)"
  ex.3: "Добрий день, пане Кляйн!"
  ex.4: "Привіт усім! (знайомій групі)"
  ex.5: "Привіт, Томе! (дуже розмовно, з англійської)"
  x1.prompt: "Ви зустрічаєте друга на вулиці. Що ви скажете?"
  x1.o2.fb: "Auf Wiedersehen завершує розмову, а ви щойно зустрілися."
  x1.o3.fb: "Gute Nacht кажуть пізно ввечері, коли йдуть."
  x1.expl: "Hallo — звичайне привітання для знайомих."
  x2.prompt: "Напишіть ввічливе привітання для дня."
  x2.r1: "Guten закінчується на -n: Guten Tag."
  x2.r2: "Tag — іменник, тому з великої T."
  x2.expl: "Guten Tag: два слова, обидва з великої літери на початку привітання."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Guten Tag — привітання, його кажуть, коли приходять. Коли йдуть — Auf Wiedersehen."
  x3.expl: "Verabschiedung — прощання. Guten Tag — привітання."
  x4.prompt: "З'єднайте дві частини кожного привітання."
  x4.expl: "Guten Tag, Hallo zusammen і Freut mich — сталі вирази."
  x5.prompt: "Що з цього — привітання?"
  x5.o4.fb: "Tschüss — неформальне прощання."
  x5.expl: "Hallo, Guten Tag і Hi починають розмову; Tschüss її завершує."
  x6.prompt: "Доповніть ввічливе привітання."
  x6.r1: "Tag — іменник: пишіть з великої T."
  x6.r2: "Tag закінчується на g, хоч звучить як k."
  x6.expl: "Guten Tag, Frau Weber: ввічливе привітання з прізвищем."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Gute Nacht — коли йдуть уночі; Анна щойно привіталася."
  x7.o3.fb: "Auf Wiedersehen завершило б розмову, яку Анна щойно почала."
  x7.expl: "Привітайтеся у відповідь тим самим словом та ім'ям."
  x8.prompt: "Розставте слова в правильному порядку."
  x8.expl: "Спочатку привітання, потім ім'я."
  x9.prompt: "Це правильно?"
  x9.wrong: "Це правильно: Hallo — звичайне привітання з друзями й колегами."
  x9.expl: "Hallo пасує до знайомих людей."
  x10.prompt: "Напишіть привітання для групи друзів (два слова)."
  x10.r1: "Zusammen пишеться з подвійним m."
  x10.expl: "Zusammen — разом; Hallo zusammen вітає всіх одразу."
  x11.prompt: "Яке привітання найдоречніше на рецепції у лікаря?"
  x11.o2.fb: "Hi — занадто розмовно для рецепції."
  x11.o3.fb: "Hallo zusammen вітає групу друзів, а не одного адміністратора."
  x11.expl: "З незнайомими Guten Tag завжди ввічливе."
  x12.prompt: "Доповніть короткий діалог."
  x12.expl: "Обидва вживають ввічливе привітання з прізвищем."
  x13.prompt: "Які привітання неформальні?"
  x13.o4.fb: "Guten Tag — ввічливе; його можна вживати з будь-ким."
  x13.expl: "Hallo, Hi і Hallo zusammen — неформальні."
  x14.prompt: "Зробіть це привітання ввічливим."
  x14.expl: "З Frau і прізвищем ввічливо сказати Guten Tag."
  x15.prompt: "Як ви відповісте?"
  x15.o2.fb: "Hi з самим прізвищем звучить грубо до незнайомої людини."
  x15.o3.fb: "Tschüss — прощання, а розмова щойно почалася."
  x15.expl: "На ввічливе привітання відповідайте ввічливо, з Frau і прізвищем."
  tip: "З Herr або Frau і прізвищем кажіть Guten Tag. З ім'ям звичайно кажуть Hallo."
