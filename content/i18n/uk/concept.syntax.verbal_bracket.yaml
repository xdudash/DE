strings:
  title: Дієслівна рамка (Satzklammer)
  summary: Інфінітив після модального дієслова, дієприкметник у Perfekt і відокремлювані префікси йдуть у кінець речення.
  pattern.scope: "У головному реченні відмінюване дієслово стоїть на другому місці, а невідмінювана частина присудка замикає рамку в кінці."
  pattern.limits: "Це огляд інфінітива після модального дієслова, дієприкметника Perfekt і відокремлюваних префіксів; підрядні речення та складні ланцюжки дієслів вивчаються пізніше."
  ex.modal: "Я можу сьогодні залишитися довше."
  ex.perfect: "Ми поїхали потягом."
  ex.separable: "Вона телефонує своїй мамі."
