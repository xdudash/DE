strings:
  title: "Перевірка блоку: звуки, привітання й числа"
  summary: "Змішане повторення блоку A0.01: літери, умлаути, ß, привітання, прощання й числа 0–20."
  obj: "Показати, що ви вмієте вживати літери, привітання й числа блоку A0.01."
  intro: "Цей урок перевіряє блок A0.01. Кожна вправа — з іншого попереднього уроку. Якщо якась складна, поверніться до того уроку, перш ніж почати блок A0.02."
  examples: "Що було в блоці A0.01."
  summary_block: "Якщо більшість відповідей правильні, починайте блок **A0.02**. Якщо ні, повторіть уроки, названі в поясненнях."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Алфавіт з умлаутами та ß."
  ex.2: "Привітання за часом доби."
  ex.3: "Неформальне й формальне прощання."
  ex.4: "Числа від 0 до 20."
  ex.5: "Як представитися."
  x1.prompt: "Яка літера називається «ве»?"
  x1.o2.fb: "V називається «фау»; W — «ве»."
  x1.o3.fb: "B називається «бе»."
  x1.expl: "W називається «ве». Урок: алфавіт."
  x2.prompt: "Напишіть ім'я, яке продиктували: A – N – N – A."
  x2.r1: "Там дві N: A – N – N – A."
  x2.expl: "A, N, N, A — це Anna. Урок: як диктувати імена."
  x3.prompt: "З'єднайте кожне слово з його умлаутом."
  x3.expl: "У Käse — ä, у schön — ö, у über — ü. Уроки: умлаути."
  x4.prompt: "Правда чи ні?"
  x4.wrong: "Це правда: після довгого a у Straße пишуть ß."
  x4.expl: "Straße: довгий голосний, потім ß. Урок: ß і ss."
  x5.prompt: "Доповніть привітання для 8 ранку."
  x5.r1: "Guten Tag — удень; о 8 ранку кажуть Guten Morgen."
  x5.r2: "Тут Morgen — іменник: пишіть з великої M."
  x5.expl: "Guten Morgen — вранці. Урок: Guten Morgen і Guten Abend."
  x6.prompt: "Що з цього — прощання?"
  x6.o4.fb: "Hallo — привітання, а не прощання."
  x6.expl: "Tschüss, Auf Wiedersehen і Bis bald завершують розмову. Урок: прощання."
  x7.prompt: "Розставте слова в правильному порядку."
  x7.expl: "Ich heiße Anna. Урок: представитися на курсі."
  x8.prompt: "Офіціант питає. Оберіть ваше замовлення."
  x8.o2.fb: "Freut mich — для знайомства, а не для замовлення."
  x8.o3.fb: "Gute Nacht кажуть, коли йдуть пізно ввечері."
  x8.expl: "Число, напій і bitte. Урок: замовлення в кафе."
  x9.prompt: "Запишіть число цифрами."
  x9.expl: "Vier — це 4. Урок: числа від 0 до 5."
  x10.prompt: "Яке число — zwölf?"
  x10.o2.fb: "2 — це zwei; zwölf починається так само, але це 12."
  x10.o3.fb: "20 — це zwanzig."
  x10.expl: "Zwölf — це 12. Урок: числа від 6 до 12."
  x11.prompt: "Впишіть пропущені числа."
  x11.expl: "Fünfzehn — це 15. Урок: числа від 13 до 20."
  x12.prompt: "Це правильно?"
  x12.wrong: "Ні: у 16 s від sechs зникає: sechzehn."
  x12.expl: "Sechzehn, без s. Урок: числа від 13 до 20."
  x13.prompt: "Зробіть це привітання ввічливим."
  x13.expl: "З Herr і прізвищем ввічливо — Guten Tag. Урок: Hallo і Guten Tag."
  x14.prompt: "Оберіть правильну відповідь."
  x14.o2.fb: "Ja, danke — відповідь на Ist das alles?, а не на питання про ціну."
  x14.o3.fb: "Freut mich — для знайомства."
  x14.expl: "На питання про ціну — ціна. Урок: покупки на ринку."
  x15.prompt: "Напишіть число 7 словом."
  x15.r1: "Sieben пишеться з ie."
  x15.expl: "Sieben: s, ie, b, e, n. Урок: числа від 6 до 12."
  x16.prompt: "З'єднайте кожне слово з цифрою."
  x16.expl: "Fünf 5, elf 11, neunzehn 19, zwanzig 20."
  x17.prompt: "Яке привітання пасує до 21:00?"
  x17.o2.fb: "Guten Morgen — для ранку."
  x17.o3.fb: "Guten Tag — для дня."
  x17.expl: "Guten Abend — увечері. Урок: Guten Morgen і Guten Abend."
  x18.prompt: "Запишіть ціну цифрами."
  x18.expl: "Acht Euro — це 8 євро. Урок: замовлення в кафе."
