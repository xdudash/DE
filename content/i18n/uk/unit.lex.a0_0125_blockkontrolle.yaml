translator: claude (AI draft, 2026-10-25)
strings:
  title: "Перевірка блоку: звуки, привітання й числа"
  summary: "Змішане повторення блоку A0.01: літери й звуки, привітання, ввічливі фрази та числа 0–20."
  obj: "Показати, що ви вмієте вживати літери, звуки, привітання й числа блоку A0.01."
  intro: "Цей урок перевіряє блок A0.01. Кожна вправа — з одного попереднього уроку, і в поясненні названо цей урок. Якщо вправа складна, поверніться до того уроку, перш ніж почати блок A0.02."
  examples: "Що було в блоці A0.01."
  summary_block: "Якщо більшість відповідей правильні, починайте блок **A0.02**. Якщо ні, повторіть уроки, названі в поясненнях."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Алфавіт з умлаутами та ß."
  ex.2: "Довгі й короткі голосні."
  ex.3: "Звуки ch, sch, st і sp."
  ex.4: "Привітання, подяка й прощання."
  ex.5: "Числа від 0 до 20."
  x1.prompt: "Яка літера називається «ве»?"
  x1.o2.fb: "V називається «фау»; W — «ве»."
  x1.o3.fb: "B називається «бе»."
  x1.expl: "W називається «ве». Урок: як диктувати імена."
  x2.prompt: "Прочитайте адресу lena@gmx.de уголос. Якого слова бракує?"
  x2.r1: "Ät — це @; крапка перед de — Punkt."
  x2.r2: "Bindestrich — це знак -; крапка — Punkt."
  x2.expl: "Крапку в адресі читають Punkt. Урок: літери в повсякденні."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Ні: Ö — окрема літера з власним звуком, як e з округленими губами."
  x3.expl: "Крапки — частина літери. Урок: умлаути, звуки."
  x4.prompt: "З'єднайте кожне слово з його умлаутом."
  x4.expl: "У München — ü, у Köln — ö, у Mädchen — ä. Урок: умлаути в словах і назвах міст."
  x5.prompt: "Яке написання правильне в Німеччині?"
  x5.o2.fb: "Після довгого a пишуть ß, а не одне s."
  x5.o3.fb: "Z звучить як «ц»; у Straße — ß."
  x5.expl: "Довгий голосний + ß: Straße. Урок: ß і ss."
  x6.prompt: "Напишіть слово «ліжко»: у ньому коротке e."
  x6.r1: "Після короткого e — подвоєний приголосний: Bett."
  x6.r2: "Ee зробило б e довгим; у Bett коротке e і tt."
  x6.expl: "Das Bett: коротке e, подвійне t. Урок: довгі й короткі a, e, i."
  x7.prompt: "У яких словах довге o або u?"
  x7.o4.fb: "У Sonne коротке o: це видно з подвійного n."
  x7.expl: "У Boot, rot і gut — довгі голосні. Урок: довгі й короткі o та u."
  x8.prompt: "Впишіть довге i в число 7."
  x8.r1: "Ei — інший звук, як у drei; довге i пишеться ie."
  x8.r2: "Одне i тут було б коротким; довге i — ie: sieben."
  x8.expl: "Sieben: ie — довге i. Урок: подвійні голосні та ie."
  x9.prompt: "Це правильно?"
  x9.wrong: "Це правильно: після u чути ach-звук, як у Buch і acht."
  x9.expl: "Після a, o, u та au — ach-звук. Урок: звуки ch і sch."
  x10.prompt: "Як вимовляють St на початку слова «Stadt»?"
  x10.o2.fb: "S-t — для st усередині чи в кінці слова, як у Fenster; на початку кажуть scht."
  x10.o3.fb: "«Ц» — це звук z, а не st."
  x10.expl: "St- на початку слова звучить як scht-. Урок: st і sp."
  x11.prompt: "Зробіть це привітання ввічливим."
  x11.expl: "З Herr і прізвищем ввічливо — Guten Tag. Урок: Hallo і Guten Tag."
  x12.prompt: "У яких словах кінець звучить як коротке a?"
  x12.o4.fb: "У rot r на початку, перед голосним: чітке r."
  x12.expl: "Закінчення -er звучить м'яко, як коротке a. Урок: звук r і -er."
  x13.prompt: "Доповніть привітання для 8 ранку."
  x13.r1: "Guten Tag — удень; о 8 ранку кажуть Guten Morgen."
  x13.r2: "Guten Abend — для вечора."
  x13.expl: "Guten Morgen — вранці. Урок: Guten Morgen і Guten Abend."
  x14.prompt: "Що з цього — прощання?"
  x14.o4.fb: "Hallo — привітання, а не прощання."
  x14.expl: "Tschüss, Auf Wiedersehen і Bis bald завершують розмову. Урок: прощання."
  x15.prompt: "Оберіть правильну відповідь."
  x15.o2.fb: "Tschüss — прощання; на подяку відповідайте Bitte."
  x15.o3.fb: "Guten Abend — привітання; на Danke відповідають, наприклад, Bitte."
  x15.expl: "Danke! – Bitte! Урок: Danke і Bitte."
  x16.prompt: "Запишіть число цифрами."
  x16.expl: "Vier — це 4. Урок: числа від 0 до 5."
  x17.prompt: "Ви не зрозуміли. Що ви ввічливо скажете?"
  x17.o2.fb: "Саме Was? може звучати грубо до незнайомих; Wie bitte? — ввічливо."
  x17.o3.fb: "Gute Nacht кажуть, коли йдуть пізно ввечері."
  x17.expl: "Wie bitte? — прохання повторити. Урок: Wie bitte?"
  x18.prompt: "Як ви відповісте?"
  x18.o2.fb: "Danke schön — подяка; на вибачення кажуть Kein Problem."
  x18.o3.fb: "Guten Morgen — привітання, а не відповідь на вибачення."
  x18.expl: "Entschuldigung! – Kein Problem! Урок: Gern geschehen і Entschuldigung."
  x19.prompt: "Складіть питання до іншого слухача."
  x19.expl: "Wie heißt du? — питання про ім'я слухача. Урок: представитися на курсі."
  x20.prompt: "Яке число — zwölf?"
  x20.o2.fb: "2 — це zwei; zwölf починається так само, але це 12."
  x20.o3.fb: "20 — це zwanzig."
  x20.expl: "Zwölf — це 12. Урок: числа від 6 до 12."
  x21.prompt: "Напишіть число 16 словом."
  x21.r1: "У 16 s від sechs зникає: sechzehn."
  x21.expl: "Sechzehn, без s. Урок: числа від 13 до 20."
  x22.prompt: "Офіціант питає. Оберіть ваше замовлення."
  x22.o2.fb: "Freut mich — для знайомства, а не для замовлення."
  x22.o3.fb: "Це каже офіціант, коли ви платите."
  x22.expl: "Число, напій і bitte. Урок: замовлення в кафе."
  x23.prompt: "Доповніть діалог."
  x23.expl: "Was kostet das? — питання про ціну. Урок: покупки на ринку."
  x24.prompt: "З'єднайте кожне слово з цифрою."
  x24.expl: "Fünf 5, elf 11, neunzehn 19, zwanzig 20. Уроки: числа від 0 до 20."
