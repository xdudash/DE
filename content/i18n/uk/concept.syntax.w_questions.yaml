strings:
  title: W-питання
  summary: 'Відкриті питання з wer, was, wann, wo, wohin, woher, wie та wie viel. Питальне слово стоїть на першому місці, відмінюване дієслово — на другому.'
  pattern.scope: "Відкрите питання в головному реченні запитує одну відсутню частину інформації. На першому місці стоїть питальне слово, за ним на другому — відмінюване дієслово. Підмет, наприклад *du* або *der Bus*, зазвичай іде після дієслова."
  pattern.limits: "У питанні *Wer wohnt hier?* слово *wer* саме є підметом, тому окремого підмета після дієслова немає. Загальні питання починаються з дієслова. У непрямому питанні після *weißt du, …* або *ich frage, …* дієслово переходить у кінець; цей шаблон поза межами уроку."
  ex.when: "Коли відправляється автобус?"
  ex.where: "Де ти живеш?"
  ex.who_subject: "Хто тут живе?"
  ex.where_from: "Звідки Ви? (ввічливе звертання)"
  ex.price: "Скільки коштує квиток?"
  err.verb_third: "Питальне слово вже займає перше місце. Одразу після нього постав відмінюване дієслово, а потім підмет: *Wo wohnst du?*"
