strings:
  title: "st і sp на початку слова"
  summary: "На початку слова кажуть «шт» і «шп», а пишуть st і sp."
  obj: "Правильно вимовляти st і sp залежно від місця в слові та писати їх як st і sp."
  intro: "На початку слова st вимовляють як «шт», а sp — як «шп»: Straße, Stadt, Stunde, Sport, sprechen, spielen. Пишуть при цьому st і sp. Усередині слова чи в кінці st і sp вимовляють так, як пишуть: Fenster, ist, Post, Wespe."
  examples: "st і sp на початку та всередині слів."
  summary_block: "**St- і Sp- на початку:** кажіть «шт» і «шп» (Straße, Sport). **st і sp усередині чи в кінці:** кажіть «с-т» і «с-п» (Fenster, ist). **Завжди пишіть st і sp.**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "вулиця: звучить «Штрасе»"
  ex.2: "місто: звучить «Штат»"
  ex.3: "година, урок: звучить «Штунде»"
  ex.4: "спорт: звучить «Шпорт»"
  ex.5: "говорити: звучить «шпрехен»"
  ex.6: "вікно: st усередині, звучить с-т"
  ex.7: "є: st у кінці, звучить с-т"
  x1.prompt: "У якому слові звучить «шт»?"
  x1.o2.fb: "В ist st стоїть у кінці, тому звучить с-т, як написано."
  x1.o3.fb: "У Post st стоїть у кінці, тому звучить с-т."
  x1.expl: "Straße: St- на початку звучить «шт»."
  x2.prompt: "Напишіть слово «вулиця»."
  x2.r1: "Кажуть «шт», а пишуть St: Straße."
  x2.r2: "Після довгого a стоїть ß (або ss у Швейцарії): Straße."
  x2.expl: "Straße, або Strasse у Швейцарії."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "st стоїть усередині слова Fenster, тому звучить с-т, як написано."
  x3.expl: "Лише st на початку слова звучить «шт»."
  x4.prompt: "З'єднайте кожне слово з тим, як звучить його st чи sp."
  x4.expl: "Sport і Stadt починаються з Sp і St; у Fenster st усередині."
  x5.prompt: "У яких словах st чи sp звучить як «шт» або «шп»?"
  x5.o4.fb: "ist: st у кінці звучить с-т."
  x5.o5.fb: "Wespe: sp усередині слова звучить с-п."
  x5.expl: "sprechen, Stunde і spielen починаються з sp або st."
  x6.prompt: "Доповніть слово «спорт» так, як його пишуть."
  x6.r1: "Кажуть «шп», а пишуть Sp: Sport."
  x6.expl: "Sport пишеться з Sp."
  x7.prompt: "Одногрупник питає, як пишеться слово. Яка відповідь правильна?"
  x7.o2.fb: "Чути «шт», але слово пишеться з St."
  x7.o3.fb: "Stadt закінчується на dt: S-t-a-d-t."
  x7.expl: "Stadt: St на початку, dt у кінці."
  x8.prompt: "Доповніть слова: вулиця, грати, вікно."
  x8.expl: "Усі три пишуться st або sp, незалежно від звуку."
  x9.prompt: "У якому слові sp звучить так, як пишеться, — с-п?"
  x9.o2.fb: "Sport: sp на початку звучить «шп»."
  x9.o3.fb: "sprechen: sp на початку звучить «шп»."
  x9.expl: "Wespe (оса): sp усередині слова звучить с-п."
  x10.prompt: "Напишіть по літерах слово «говорити»."
  x10.r1: "Пишіть sp, хоча чути «шп»."
  x10.r2: "sprechen закінчується на -en."
  x10.expl: "sprechen: sp на початку, ch усередині, -en у кінці."
  x11.prompt: "Це правильно?"
  x11.wrong: "Це правда: st на початку слова звучить «шт»."
  x11.expl: "Stunde починається з St, тому звучить «Штунде»."
  x12.prompt: "Доповніть слово «задоволення»."
  x12.r1: "Пишіть Sp, кажіть «шп»: Spaß."
  x12.expl: "Spaß (задоволення, веселощі): Sp на початку, ß після довгого a."
  x13.prompt: "У яких словах st чи sp стоїть усередині або в кінці?"
  x13.o4.fb: "Straße: St стоїть на початку."
  x13.o5.fb: "Sport: Sp стоїть на початку."
  x13.expl: "У Fenster, ist і Post звучить с-т, як написано."
  x14.prompt: "Наберіть слово «місто»."
  x14.r1: "Stadt пишеться з dt у кінці."
  x14.r2: "Пишіть St, кажіть «шт»: Stadt."
  x14.expl: "die Stadt: St-a-d-t."
  x15.prompt: "Яке слово починається зі звуку «шп»?"
  x15.o2.fb: "Stadt починається зі «шт», а не «шп»."
  x15.o3.fb: "Schule починається просто з sch, а не «шп»."
  x15.expl: "Spaß: Sp на початку звучить «шп»."
  tip: "У Швейцарії вулицю пишуть Strasse, з ss замість ß. Там обидва написання правильні."
