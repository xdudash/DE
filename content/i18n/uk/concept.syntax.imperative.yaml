strings:
  title: Наказовий спосіб
  summary: Форми для du, ihr і Sie; дієслово стоїть першим.
  pattern.scope: "Поширені форми наказу: *Mach!* (du), *Macht!* (ihr), *Machen Sie!* (ввічливо). Відокремлюваний префікс залишається в кінці."
  pattern.limits: "Деякі дієслова мають особливу форму наказового способу. Вступний урок не охоплює всі неправильні форми та прагматичні відмінності наказу й прохання."
  ex.du: "Відчини вікно, будь ласка!"
  ex.ihr: "Відкрийте книжки, будь ласка!"
  ex.sie: "Відчиніть двері, будь ласка! (ввічливо)"
  err.sie_order: "У ввічливому наказі поставте дієслово першим, потім *Sie*: *Machen Sie die Tür auf!*"
