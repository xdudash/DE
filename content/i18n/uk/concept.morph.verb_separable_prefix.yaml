strings:
  title: Дієслова з відокремлюваним префіксом
  summary: 'Дієслова на кшталт anrufen, aufstehen, einkaufen у головному реченні розпадаються: префікс іде в кінець — Ich rufe dich an.'
  pattern.scope: "Тут розглядаються поширені відокремлювані дієслова у твердженнях і прямих загальних питаннях теперішнього часу."
  pattern.limits: "Після модального дієслова відокремлюване дієслово залишається разом в інфінітиві; підрядні речення та минулий час вивчаються пізніше."
  ex.call: "Я зателефоную тобі пізніше."
  ex.get_up: "Мара встає о сьомій."
  ex.shop: "Ми ходимо за покупками в суботу."
