strings:
  title: "Звук r і закінчення -er"
  summary: "r перед голосним — приголосний; після голосного та в -er звучить як м'яке a."
  obj: "Розрізняти, де r чіткий приголосний, а де м'який, і правильно писати -er."
  intro: "Перед голосним r — чіткий приголосний, зазвичай горловий: rot, Reise, drei, Brot. Після голосного в кінці слова r стає м'яким і звучить майже як коротке a: Uhr, hier, vier. Закінчення -er теж звучить як м'яке коротке a: Lehrer, Vater, Mutter, aber, oder. Пишуть при цьому r і -er."
  examples: "Слова з чітким і м'яким r."
  summary_block: "**Перед голосним:** чіткий r (rot, drei). **Після голосного в кінці та в -er:** м'який, як коротке a (Uhr, Vater). **Завжди пишіть r і -er.**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "червоний: чіткий r на початку"
  ex.2: "три: чіткий r перед голосним ei"
  ex.3: "подорож: чіткий r на початку"
  ex.4: "учитель: -er у кінці звучить як м'яке a"
  ex.5: "батько: -er у кінці звучить як м'яке a"
  ex.6: "але: -er у кінці"
  ex.7: "тут: м'який r після голосного"
  ex.8: "годинник: м'який r після голосного"
  x1.prompt: "У якому слові r — чіткий приголосний на початку?"
  x1.o2.fb: "В Uhr r стоїть у кінці після голосного, тому він м'який."
  x1.o3.fb: "В aber r — частина -er у кінці, яке звучить як м'яке a."
  x1.expl: "rot починається з r перед голосним: чіткий приголосний."
  x2.prompt: "Напишіть слово «учитель» (чоловік)."
  x2.r1: "У кінці чути м'яке a, але пишуть -er: Lehrer."
  x2.r2: "У Lehrer після першого e стоїть h: воно позначає довге e."
  x2.expl: "Lehrer: Leh-rer, з h для довгого e і -er у кінці."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правда: -er у кінці звучить як коротке м'яке a."
  x3.expl: "Vater пишеться з -er, але звучить майже як «фата»."
  x4.prompt: "З'єднайте кожне слово з місцем його r."
  x4.expl: "am Anfang — на початку, am Ende — у кінці, nach dem Vokal — після голосного."
  x5.prompt: "Які слова закінчуються на -er?"
  x5.o4.fb: "Uhr закінчується на hr, а не -er."
  x5.o5.fb: "У rot r на початку, а закінчується воно на t."
  x5.expl: "Lehrer, Mutter і aber закінчуються на -er."
  x6.prompt: "Доповніть слово «але»."
  x6.r1: "Чути a, але закінчення пишеться -er: aber."
  x6.r2: "Закінчення -er, а не -ar: aber."
  x6.expl: "aber: -er у кінці."
  x7.prompt: "Одногрупник питає, як пишеться слово. Яка відповідь правильна?"
  x7.o2.fb: "Vater починається з V (звучить як f) і закінчується на -er, хоч чути a."
  x7.o3.fb: "Кінець звучить як a, але пишеться -er."
  x7.expl: "Vater: V-a-t-e-r."
  x8.prompt: "Доповніть слова: брат, годинник, червоний."
  x8.expl: "Bruder закінчується на -er; Uhr — на r; rot починається з r."
  x9.prompt: "У якому слові r стоїть перед голосним?"
  x9.o2.fb: "У hier r у кінці після голосного, тому м'який."
  x9.o3.fb: "В oder r — частина -er у кінці."
  x9.expl: "drei: r перед ei — чіткий приголосний."
  x10.prompt: "Напишіть по літерах слово «або»."
  x10.r1: "Закінчення звучить як a, але пишеться -er: oder."
  x10.expl: "oder: o-d-e-r."
  x11.prompt: "Це правильно?"
  x11.wrong: "В Uhr r стоїть після голосного в кінці, тому він м'який, а не чіткий, як у rot."
  x11.expl: "r чіткий перед голосним і м'який після нього."
  x12.prompt: "Доповніть слово «мати»."
  x12.r1: "Пишіть -er, хоч чути a: Mutter."
  x12.expl: "Mutter: tt для короткого u та -er у кінці."
  x13.prompt: "У яких словах r м'який, у кінці слова?"
  x13.o4.fb: "rot: r на початку, перед голосним."
  x13.o5.fb: "drei: r стоїть перед голосним ei, тому чіткий."
  x13.expl: "hier, vier і Uhr закінчуються на r після голосного."
  x14.prompt: "Наберіть слово «тут»."
  x14.r1: "У кінці чути м'яке a, але пишуть r: hier."
  x14.r2: "У hier ie: довге i пишеться ie."
  x14.expl: "hier: h-i-e-r."
  x15.prompt: "Як зазвичай звучить -er у кінці слова?"
  x15.o1: "як коротке м'яке a"
  x15.o2: "як чіткий розкотистий r"
  x15.o2.fb: "У стандартній німецькій -er у кінці — не чіткий r; воно звучить як м'яке a."
  x15.o3: "як довге e"
  x15.o3.fb: "-er не звучить як довге e; e слабке, а r переходить у м'яке a."
  x15.expl: "Lehrer, Vater, aber: -er звучить як м'яке a."
  tip: "У Баварії, Австрії та Швейцарії багато хто вимовляє розкотистий r кінчиком язика. Це теж правильно."
