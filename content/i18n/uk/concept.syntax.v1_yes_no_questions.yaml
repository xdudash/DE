strings:
  title: 'Загальні питання: дієслово на першому місці'
  summary: Прямі питання, на які відповідають ja або nein, починаються з відмінюваного дієслова, за яким іде підмет.
  pattern.scope: "У прямому загальному питанні постав відмінюване дієслово на перше місце, а одразу за ним — підмет: *Wohnst du in Wien?* У цьому уроці розглядаються питання в простому теперішньому часі."
  pattern.limits: "W-питання починається з питального слова, а дієслово залишається на другому місці: *Wo wohnst du?* У непрямому питанні після *ob* відмінюване дієслово переходить у кінець: *Ich weiß nicht, ob du in Wien wohnst.* З модальним або допоміжним дієсловом чи відокремлюваною часткою вперед виноситься лише відмінювана частина; такі дієслівні конструкції вивчаються окремо."
  ex.come: "Ти сьогодні прийдеш?"
  ex.work: "Вона працює завтра?"
  ex.appointment: "У Вас є призначений час? (ввічливе звертання)"
  ex.live: "Ти живеш у Відні?"
  err.verb_agreement: "З *du* вживай *arbeitest*. Закінчення дієслова має узгоджуватися з підметом: *Arbeitest du heute?*"
