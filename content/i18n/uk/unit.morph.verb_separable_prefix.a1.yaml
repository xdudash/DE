entity: unit.morph.verb_separable_prefix.a1
lang: uk
based_on_version: 1.0.0
status: machine_draft
translator: Codex (AI draft, 2026-10-26)
strings:
  title: "Відокремлювані дієслова: префікс у кінці"
  summary: "Відмінюйте основу дієслова та ставте відокремлюваний префікс у кінець простого головного речення."
  obj.recognize: "Розпізнавати, як відокремлюване дієслово розділяється в головному реченні."
  obj.form: "Складати прості твердження та загальні питання з відокремлюваним дієсловом."
  b.intro: |
    У деяких німецьких дієслів є префікс, який відокремлюється в простому головному реченні. Наприклад, *anrufen* («телефонувати») перетворюється на *Ich rufe dich an.* Основа дієслова відмінюється, а префікс переходить у кінець.

    Уявіть ці частини як рамку навколо інших відомостей: відмінюване дієслово стоїть ближче до початку, а префікс завершує речення.
  b.pattern.caption: "Відмінюване дієслово ближче до початку, префікс — у кінці"
  col.subject: "Підмет / питання"
  col.finite: "Відмінюване дієслово"
  col.middle: "Інші відомості"
  col.prefix: "Префікс у кінці"
  b.examples.title: "Відокремлювані дієслова на щодень"
  ex.call: "Я зателефоную тобі пізніше."
  ex.get_up: "Мара встає о сьомій."
  ex.shop: "Ми ходимо за покупками в суботу."
  ex.come: "Ти підеш сьогодні ввечері з нами?"
  ex.infinitive: "Я хотів/хотіла б сьогодні ввечері кудись вийти."
  b.rule: |
    У твердженні відмінюване дієслово залишається на другому місці, а префікс переходить у кінець: *Heute rufe ich dich an.* Якщо на першому місці стоїть обставина *Heute*, підмет іде після дієслова.

    У загальному питанні відмінюване дієслово ставимо першим, а префікс залишається в кінці: *Kommst du heute mit?* Після модального дієслова відокремлюване дієслово зазвичай залишається разом в інфінітиві: *Ich möchte heute Abend ausgehen.*
  b.errors.title: "Розташовуйте обидві частини правильно"
  e.prefix: "У простому головному реченні відмінюйте основу (*rufe*), а префікс (*an*) поставте в кінець: *Ich rufe dich später an.*"
  e.subject: "Якщо *Heute* стоїть першим, відмінюване дієслово залишається другим, а підмет іде після нього: *Heute stehe ich früh auf.*"
  b.summary: |
    - Відмінюйте основу дієслова: *anrufen → ich rufe*.
    - Ставте відокремлюваний префікс у кінець простого головного речення: *Ich rufe dich an.*
    - Якщо речення починається з іншого елемента, дієслово все одно стоїть другим: *Heute rufe ich dich an.*
    - У загальному питанні відмінюване дієслово ставимо першим: *Rufst du mich an?*
    - Після модального дієслова відокремлюване дієслово залишається разом в інфінітиві: *Ich möchte ausgehen.*
  b.practice.title: "Розділіть дієслова правильно"
  fb.correct: "Правильно."
  fb.incorrect: "Ще ні. Знайдіть відмінюване дієслово та перевірте, де має стояти префікс."
  x.choose.prompt: "Оберіть правильно побудоване речення з *anrufen*."
  x.choose.a: "Відмінювана частина має стояти ближче до початку, а префікс тут не відокремлено."
  x.choose.c: "У цьому головному реченні префікс має стояти в кінці."
  x.choose.explanation: "У реченні *Ich rufe dich am Abend an* форма *rufe* відмінюється, а *an* завершує речення."
  x.match.prompt: "Поєднайте інфінітив із його розділеною формою теперішнього часу."
  x.match.explanation: "Відмінювана основа стоїть ближче до початку, а *an*, *auf*, *ein* або *mit* переходять у кінець."
  x.cloze.prompt: "Доповніть речення правильними частинами дієслова *aufstehen*."
  x.cloze.explanation: "З *Mara* використовуйте форму *steht*. Відокремлюваний префікс *auf* ставимо в кінець: *Mara steht um sieben Uhr auf.*"
  x.order.prompt: "Складіть речення: «Я зателефоную тобі ввечері»."
  x.order.explanation: "Залиште підмет першим, відмініть *anrufen* як *rufe*, а префікс *an* поставте в кінець."
  x.transform.prompt: "Перетворіть твердження на загальне питання."
  x.transform.explanation: "У прямому загальному питанні відмінюване дієслово переходить на перше місце. Префікс усе одно залишається в кінці: *Stehst du am Sonntag früh auf?*"
  x.categorize.prompt: "Розподіліть речення: чи розділене в ньому відокремлюване дієслово?"
  x.categorize.split: "Частини розділені"
  x.categorize.together: "Інфінітив пишеться разом"
  x.categorize.explanation: "У простому головному реченні відмінювана форма відділяється від префікса. Після модального дієслова відокремлюване дієслово залишається разом в інфінітиві: *möchte ausgehen*."
  x.true_false.prompt: "Правда чи ні? У простому головному реченні відокремлюваний префікс зазвичай стоїть у кінці."
  x.true_false.wrong: "Відмінювана основа стоїть раніше в реченні, а відокремлюваний префікс завершує його."
  x.true_false.explanation: "Наприклад: *Wir kaufen am Samstag ein.* Префікс *ein* стоїть у кінці."
  x.correct.prompt: "Виправте порядок слів у реченні."
  x.correct.explanation: "*Heute* стоїть на першому місці, тому відмінюване дієслово *kaufe* займає друге місце, а підмет *ich* іде після нього. Префікс *ein* залишається в кінці."
