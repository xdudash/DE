strings:
  title: "Сценарій: замовлення в кафе"
  summary: "Ввічливо замовте напої, зрозумійте ціну й розплатіться."
  obj: "Замовити від одного до трьох напоїв і зрозуміти ціну до двадцяти євро."
  intro: "У кафе офіціант питає «Was möchten Sie?». Ви відповідаєте числом і назвою напою та додаєте bitte. Коли ви платите, офіціант каже «Das macht … Euro.», а ви даєте гроші зі словами «Hier, bitte!»."
  examples: "Фрази в кафе."
  summary_block: "**Was möchten Sie?** — **Zwei Kaffee, bitte.** — **Das macht sechs Euro.** — **Hier, bitte!**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Що ви бажаєте? (офіціант)"
  ex.2: "Один чай, будь ласка. Перед словом «один» — ein, а не eins."
  ex.3: "Дві кави, будь ласка."
  ex.4: "Три води, будь ласка."
  ex.5: "З вас шість євро."
  ex.6: "Ось, будь ласка! (коли платите)"
  x1.prompt: "Офіціант питає. Оберіть ваше замовлення."
  x1.o2.fb: "Gute Nacht кажуть, коли йдуть уночі, а не замовляють."
  x1.o3.fb: "Це каже офіціант, коли ви платите."
  x1.expl: "На Was möchten Sie? відповідайте числом, напоєм і bitte."
  x2.prompt: "Скільки це коштує? Запишіть ціну цифрами."
  x2.expl: "Neun Euro — це 9 євро."
  x3.prompt: "З'єднайте кожне замовлення з кількістю напоїв."
  x3.expl: "Ein 1, zwei 2, drei 3."
  x4.prompt: "Правда чи ні?"
  x4.wrong: "Це правда: Das macht … Euro означає, скільки платити."
  x4.expl: "Das macht fünf Euro: з вас п'ять євро."
  x5.prompt: "Доповніть ввічливе замовлення."
  x5.r1: "Danke — подяка; щоб ввічливо попросити, кажіть bitte."
  x5.r2: "Bitte пишеться з подвійним t."
  x5.expl: "Bitte робить замовлення ввічливим."
  x6.prompt: "Ви даєте гроші. Що ви скажете?"
  x6.o2.fb: "Це питання офіціанта."
  x6.o3.fb: "Це замовлення, а не те, що кажуть під час оплати."
  x6.expl: "Hier, bitte: ось, будь ласка."
  x7.prompt: "Розставте слова в правильному порядку."
  x7.expl: "Число, напій, потім bitte."
  x8.prompt: "Які речення — ввічливі замовлення?"
  x8.o3.fb: "Без bitte це звучить грубо."
  x8.o4.fb: "Це ціна, а не замовлення."
  x8.expl: "Ввічливе замовлення — напій і bitte."
  x9.prompt: "Доповніть діалог."
  x9.expl: "Zwei Kaffee, bitte. – Das macht vier Euro."
  x10.prompt: "Як ви відповісте?"
  x10.o2.fb: "Ви вже замовили; відповідайте на подяку."
  x10.o3.fb: "Це питання офіціанта, а не відповідь на подяку."
  x10.expl: "Bitte schön — відповідь на Danke schön."
  x11.prompt: "Кава коштує 8 євро. Напишіть число словом."
  x11.r1: "Acht закінчується на t."
  x11.r2: "У acht перед t стоїть ch."
  x11.expl: "Acht Euro: вісім євро."
  x12.prompt: "Це правильно?"
  x12.wrong: "Ні: Euro не змінюється після числа: sechs Euro."
  x12.expl: "Das macht sechs Euro."
  x13.prompt: "Складіть питання офіціанта."
  x13.expl: "Was möchten Sie? — що ви бажаєте?"
  x14.prompt: "Ви хочете один чай. Яке замовлення правильне?"
  x14.o2.fb: "Коли лічите — eins, а перед словом — ein: ein Tee."
  x14.o3.fb: "Elf — це 11, а не один."
  x14.expl: "Ein Tee, bitte: один чай, будь ласка."
  x15.prompt: "Запишіть кількість кав цифрами."
  x15.expl: "Drei Kaffee: три кави."
  tip: "Euro не змінюється після числа: ein Euro, sechs Euro. У замовленні Kaffee теж не змінюється: zwei Kaffee."
