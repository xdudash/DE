  ex.1: "Два кави, будь ласка."
  ex.2: "Це десять євро."
  ex.3: "Ось, будь ласка."
  x1.prompt: "Яке речення замовляє дві кави?"
  x1.expl: "Zwei — 2; zwölf — 12."
  x2.prompt: "Оберіть правильну відповідь."
  x2.expl: "Відповідайте на питання, назвавши бажане."
  x3.prompt: "Запишіть цифрами: zehn."
  x3.expl: "zehn — це 10."
  x4.prompt: "Напишіть словом число 3."
  x4.expl: "3 пишеться drei."
  x5.prompt: "Чи правдиве це твердження?"
  x5.expl: "Macht — «становить» у значенні суми."
  x6.prompt: "Чи правдиве це твердження?"
  x6.expl: "«Ich möchte» — «я хотів би»."
  x6.wrong: "Möchte — «хотів би»."
  x7.prompt: "Які слова — числа, які можна використати для замовлення?"
  x7.expl: "Zwei і acht — числа; Kaffee і Bitte — ні."
  x8.prompt: "Яке речення каже, що рахунок — п'ять євро?"
  x8.expl: "Euro — валюта; Tage і Uhr — не гроші."
  x9.prompt: "Яке замовлення ввічливе?"
  x9.expl: "Bitte робить замовлення ввічливим."
  x10.prompt: "Оберіть правильну відповідь."
  x10.expl: "Розплачуючись, скажіть «Hier, bitte!»."
  x11.prompt: "Яка відповідь на «Danke schön»?"
  x11.expl: "Bitte schön — ввічлива відповідь."
  x12.prompt: "Напишіть словом число 9."
  x12.expl: "9 пишеться neun."
  x13.prompt: "Запишіть цифрами: vier Tees."
  x13.expl: "vier Tees — це 4."
  x14.prompt: "Чи правдиве це твердження?"
  x14.expl: "Це звичайне замовлення в кафе."
  x15.prompt: "Які фрази ввічливо завершують замовлення?"
  x15.expl: "Gute Nacht не пасує до кафе."
