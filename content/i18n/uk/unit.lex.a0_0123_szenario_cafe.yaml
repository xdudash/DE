strings:
  title: "Сценарій: замовити в кафе"
  summary: "Замовте напої й розплатіться числами до дванадцяти."
  obj: "Замовити два-три напої і зрозуміти ціну."
  intro: "У кафе назвіть кількість напоїв числом і розплатіться. Використовуйте числа від 0 до 12."
  examples: "Фрази для кафе."
  summary_block: "**Zwei Kaffee, bitte.** **Das macht zehn Euro.** **Hier, bitte!**"
