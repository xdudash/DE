strings:
  title: "Довгі й короткі a, e, i"
  summary: "Літери після голосного показують, довгий він чи короткий."
  obj: "Розрізняти довгі й короткі a, e, i за написанням слова."
  intro: "Німецькі голосні бувають довгі й короткі, і написання зазвичай це показує. Голосний перед подвоєним приголосним (nn, tt) або двома приголосними (tz, nd) зазвичай короткий: Mann, Bett, Kind. Голосний перед одним приголосним, а також з h, подвоєним голосним чи ie зазвичай довгий: Tag, Zahl, Tee, Tier."
  examples: "Довгі й короткі голосні в словах."
  summary_block: "**Подвоєний приголосний або два приголосні:** короткий голосний (Mann, Bett, Kind). **Один приголосний, h, подвоєний голосний або ie:** довгий голосний (Tag, Zahl, Tee, Tier)."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "день: довге a, після нього одне g"
  ex.2: "чоловік: коротке a, подвоєне n"
  ex.3: "число: довге a, позначене h"
  ex.4: "чай: довге e, пишеться ee"
  ex.5: "ліжко: коротке e, подвоєне t"
  ex.6: "тварина: довге i, пишеться ie"
  ex.7: "дитина: коротке i, два приголосні nd"
  ex.8: "ім'я: довге a, одне m"
  x1.prompt: "У якому слові довге a?"
  x1.o2.fb: "У Mann після a стоїть nn, тому a коротке."
  x1.o3.fb: "У Platz після a стоїть tz, тому a коротке."
  x1.expl: "У Tag після a один приголосний, тому a довге."
  x2.prompt: "Напишіть слово «чоловік»: коротке a, подвоєне n."
  x2.r1: "З одним n man — інше слово. «Чоловік» — Mann, з nn для короткого a."
  x2.expl: "Mann: подвоєне n показує коротке a."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правда: у Bett після e стоїть tt, тому e коротке."
  x3.expl: "Подвоєний приголосний після голосного робить його коротким."
  x4.prompt: "З'єднайте кожне слово з його голосним."
  x4.expl: "nn і tt — коротко. Один приголосний або ee — довго."
  x5.prompt: "У яких словах короткий голосний?"
  x5.o4.fb: "Tier пишеться з ie, а ie — це довге i."
  x5.o5.fb: "У Name після a одне m, тому a довге."
  x5.expl: "У Mann, Bett і Kind після голосного подвоєний приголосний або два приголосні."
  x6.prompt: "Доповніть слово «ліжко»."
  x6.r1: "З одним t e було б довгим. У Bett коротке e, тому потрібно tt."
  x6.expl: "Bett: tt після короткого e."
  x7.prompt: "Одногрупник питає вас. Що ви відповісте?"
  x7.o2.fb: "У Name після a лише одне m, тому a довге."
  x7.o3.fb: "Name пишеться N-a-m-e: там є a."
  x7.expl: "Lang означає «довгий»: після a один приголосний."
  x8.prompt: "Короткі голосні: доповніть кожне слово подвоєним приголосним."
  x8.expl: "Mann, Bitte і Wetter: подвоєний приголосний показує короткий голосний."
  x9.prompt: "Це правильно?"
  x9.wrong: "Tier пишеться з ie, а ie — завжди довге i."
  x9.expl: "ie позначає довге i."
  x10.prompt: "Напишіть слово «чай»: довге e, два e."
  x10.r1: "Tee має подвоєне e: довге e пишеться ee."
  x10.r2: "Tea — англійською. Німецькою Tee."
  x10.expl: "Tee: ee — довге e."
  x11.prompt: "У якому слові коротке i?"
  x11.o2.fb: "У Kino після i одне n, тому i довге."
  x11.o3.fb: "У Tier ie, а це довге i."
  x11.expl: "У Kind після i стоїть nd, тому i коротке."
  x12.prompt: "Доповніть словом «чай» (довге e)."
  x12.r1: "Довге e пишеться ee: Tee."
  x12.expl: "Ich trinke Tee означає «я п'ю чай»."
  x13.prompt: "У яких словах довгий голосний?"
  x13.o4.fb: "У Mann nn, тому a коротке."
  x13.o5.fb: "У Bitte tt, тому i коротке."
  x13.expl: "У Name один приголосний, у Tee — ee, у Tier — ie: усі довгі."
  x14.prompt: "Напишіть по літерах слово «ім'я» (довге a)."
  x14.r1: "У Name немає h: N-a-m-e. Одне m уже показує довге a."
  x14.r2: "З mm a було б коротким. У Name одне m."
  x14.expl: "Name: одне m після довгого a."
  x15.prompt: "У якому слові довге a позначене h?"
  x15.o2.fb: "У Stadt після a стоїть dt, тому a коротке, і h немає."
  x15.o3.fb: "У Katze після a tz, тому a коротке."
  x15.expl: "Zahl: h після a позначає, що воно довге."
  tip: "У вправах lang означає «довгий», kurz — «короткий». Правило каже «зазвичай»: кілька коротких слів його порушують."
