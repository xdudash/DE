strings:
  title: "Довгі й короткі a, e, i"
  summary: "Літери після голосного зазвичай показують, довгий він чи короткий."
  obj: "Розрізняти довгі й короткі a, e, i за написанням слова."
  intro: "Німецькі голосні бувають довгі й короткі, і довжина може змінити слово: Bett (ліжко) має коротке e, а Beet (грядка) — довге. В українській довжина голосних слів не розрізняє, тож на неї варто зважати окремо. Голосний перед подвоєним приголосним (nn, tt) або двома приголосними (tz, nd) зазвичай короткий: Mann, Bett, Kind. Голосний перед одним приголосним, а також з h, подвоєним голосним чи ie зазвичай довгий: Tag, Zahl, Tee, Tier."
  examples: "Довгі й короткі голосні в словах."
  summary_block: "**Подвоєний приголосний або два приголосні:** зазвичай короткий голосний (Mann, Bett, Kind). **Один приголосний, h, подвоєний голосний або ie:** зазвичай довгий голосний (Tag, Zahl, Tee, Tier). **Винятки:** короткі слова на кшталт mit, das."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "день: довге a, після нього одне g (g у кінці звучить як k)"
  ex.2: "чоловік: коротке a, подвоєне n"
  ex.3: "число: довге a, позначене h"
  ex.4: "чай: довге e, пишеться ee"
  ex.5: "ліжко: коротке e, подвоєне t"
  ex.6: "тварина: довге i, пишеться ie"
  ex.7: "дитина: коротке i, два приголосні nd (d у кінці звучить як t)"
  ex.8: "ім'я: довге a, одне m"
  ex.9: "Я п'ю чай."
  ex.10: "Мене звати Том."
  x1.prompt: "У якому слові довге a?"
  x1.o2.fb: "У Mann після a стоїть nn, тому a коротке."
  x1.o3.fb: "У Platz після a стоїть tz, тому a коротке."
  x1.expl: "У Tag після a один приголосний, тому a довге."
  x2.prompt: "З'єднайте кожне слово з його голосним (kurz — короткий, lang — довгий)."
  x2.expl: "nn і nd — коротко. Одне m та ie — довго."
  x3.prompt: "Правда чи ні? (kurz — короткий)"
  x3.wrong: "Це правда: у Bett після e стоїть tt, тому e коротке."
  x3.expl: "Подвоєний приголосний після голосного зазвичай робить його коротким."
  x4.prompt: "Доповніть слово «ліжко». (Ліжко нове.)"
  x4.r1: "З одним t e було б довгим. У Bett коротке e, тому потрібно tt."
  x4.r2: "Beet — це грядка, з довгим e. Ліжко — Bett, із tt."
  x4.expl: "Bett: tt після короткого e."
  x5.prompt: "У яких словах короткий голосний?"
  x5.o4.fb: "Tier пишеться з ie, а ie — це довге i."
  x5.o5.fb: "У Name після a одне m, тому a довге."
  x5.expl: "У Mann, Bett і Kind після голосного подвоєний приголосний або два приголосні."
  x6.prompt: "Напишіть німецьке слово «чай»."
  x6.r1: "Tee має подвоєне e: довге e пишеться ee."
  x6.r2: "Tea — англійською. Німецькою Tee."
  x6.expl: "Tee: ee — довге e."
  x7.prompt: "Одногрупник питає (Wie heißt das auf Deutsch? — Як це німецькою?). Що ви відповісте?"
  x7.o2.fb: "Без e довге i не позначене. Тварина — Tier."
  x7.o3.fb: "Tür — це двері. Тварина — Tier, з ie."
  x7.expl: "das Tier: T-i-e-r, довге i."
  x8.prompt: "Складіть речення «Я п'ю чай»."
  x8.expl: "Ich trinke Tee: довге e в Tee пишеться ee."
  x9.prompt: "Яке з двох слів має довге e?"
  x9.o2.fb: "У Bett tt, тому його e коротке."
  x9.o3: "обидва"
  x9.o3.fb: "Лише Beet має ee. У Bett коротке e."
  x9.expl: "Beet (грядка) і Bett (ліжко) відрізняються лише довжиною e."
  x10.prompt: "Виправте помилку в написанні."
  x10.expl: "У Name немає h: одне m уже показує довге a. У Zahl є h, у Name — ні."
  x11.prompt: "Це правильно? (lang — довгий)"
  x11.wrong: "mit — коротке слово з коротким i, виняток із правила одного приголосного."
  x11.expl: "Короткі слова на кшталт mit і das зазвичай мають короткий голосний."
  x12.prompt: "Короткі голосні: доповніть кожне слово."
  x12.expl: "Katze (кішка), Mitte (середина), Wetter (погода): приголосні після голосного показують, що він короткий."
  x13.prompt: "Яке написання слова «дитина» правильне?"
  x13.o2.fb: "У кінці чути t, але слово пишеться з d: Kind."
  x13.o3.fb: "ie зробило б i довгим. У Kind коротке i."
  x13.expl: "das Kind: коротке i перед nd; d звучить як t."
  x14.prompt: "Одногрупник каже це (ich glaube — я думаю). Що ви відповісте?"
  x14.o2.fb: "У Mann після a стоїть nn, тому a коротке."
  x14.o3.fb: "У Name одне m і довге a; у Mann nn і коротке a."
  x14.expl: "Nein — ні: подвоєне n показує коротке a."
  x15.prompt: "Доповніть слово «число»."
  x15.r1: "Zal — такого слова немає. Довге a в Zahl позначене h."
  x15.r2: "ll зробило б a коротким. У Zahl довге a, позначене h."
  x15.expl: "die Zahl: h після a позначає довге a."
  tip: "lang — довгий, kurz — короткий. Правило каже «зазвичай»: короткі слова на кшталт mit і das мають короткий голосний навіть з одним приголосним."
