strings:
  title: "Алфавіт: диктування слів"
  summary: Продиктуйте німецьке слово літера за літерою, так само як називаєте своє прізвище по телефону.
  obj.letters: Назвіть літери німецького алфавіту, зокрема Ä, Ö, Ü та ß.
  obj.spell: Продиктуйте коротке слово за назвами німецьких літер.
  b.intro: |
    У німецькій мові кожна літера має назву. Коли ви диктуєте слово, ви називаєте **назву** кожної літери, а не звук, який вона дає в слові.

    Називайте назви з короткою паузою між ними: **B – E – R – L – I – N**.
    Три літери особливі: **Ä**, **Ö** і **Ü** мають умлаут, а **ß** є окремою літерою.
  b.examples.title: "Диктування"
  ex.berlin: "Berlin, продиктовано літера за літерою."
  ex.anna: "Anna, продиктовано літера за літерою. Дві N і дві A."
  ex.umlaut: "Ö називається за назвою літери; у слові це звук з умлаутом."
  ex.uber: "Ü називається „ü“; у слові „über“ це той самий звук."
  ex.eszett: "ß називається „ес-цет“ або „scharfes S“."
  b.tip: |
    Назви більшості літер складаються з голосного: **A** — „a“, **E** — „e“, **I** — „i“, **O** — „o“, **U** — „u“.
    **Ä**, **Ö** і **Ü** називаються з умлаутом: „ä“, „ö“, „ü“. **ß** — це „ес-цет“.
  b.summary: "**Диктувати — значить називати назви літер.** Називайте кожну літеру з паузою між ними. Ä, Ö, Ü і ß мають власні назви."
  b.practice.title: "Практика"
  x.spell_name.prompt: "Яка літера називається звуком „ö“?"
  x.spell_name.b: "O — інша літера. Назва Ö — „ö“ з умлаутом."
  x.spell_name.c: "Ä — інша літера. Шукайте літеру з двома крапками, яка звучить як „ö“."
  x.spell_name.explanation: "Ö — це літера з двома крапками; називається „ö“."
  x.letter_names.prompt: "Як продиктувати „Mai“ по літерах?"
  x.letter_names.b: "N, A і Y у цьому слові немає. Диктуйте літери по одній: M, A, I."
  x.letter_names.c: "Друга літера — A, а не E. Її назва — „a“."
  x.letter_names.explanation: "M – A – I: назвіть по черзі назву кожної літери."
  x.tuer.prompt: "Як продиктувати „Tür“ (двері) по літерах?"
  x.tuer.b: "U — інша літера. У цьому слові є Ü, літера з двома крапками."
  x.tuer.c: "E тут немає. Друга літера — Ü з двома крапками."
  x.tuer.explanation: "T – Ü – R: назвіть назву кожної літери по порядку. Ü — „ü“."
  x.haus.prompt: "Як продиктувати „Haus“ (будинок) по літерах?"
  x.haus.b: "Z тут немає. Остання літера — S, її назва „ес“."
  x.haus.c: "O тут немає. Друга літера — A."
  x.haus.explanation: "H – A – U – S: назвіть назву кожної літери по порядку."
  x.eszett_letter.prompt: "Яка одна літера — це „scharfes S“?"
  x.eszett_letter.a: "ss — це дві літери. Одна літера — ß."
  x.eszett_letter.c: "sz — не німецька літера. Одна літера — ß."
  x.eszett_letter.explanation: "ß пишеться як одна літера, її назва — „ес-цет“."
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Назвіть назву кожної літери по порядку."
