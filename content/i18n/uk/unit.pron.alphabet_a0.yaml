strings:
  title: "Алфавіт: диктування слів"
  summary: Продиктуйте німецьке слово літера за літерою, так само як називаєте своє прізвище по телефону.
  obj.letters: Назвіть літери німецького алфавіту, зокрема Ä, Ö, Ü та ß.
  obj.spell: Продиктуйте коротке слово за назвами німецьких літер.
  b.intro: |
    У німецькій кожна літера має свою назву. Коли ви диктуєте слово, ви називаєте **назву** кожної літери, а не звук, який вона дає у слові.

    Називайте літери з короткою паузою між ними: **B – E – R – L – I – N**.
    Три літери особливі: **Ä**, **Ö** і **Ü** мають умлаут, а **ß** — окрема літера.
  b.examples.title: "Диктування"
  ex.berlin: "Berlin, продиктований літера за літерою."
  ex.umlaut: "Ö називають за назвою літери; у слові це звук умлаута."
  ex.eszett: "ß називають «ес-цет» або «scharfes S»."
  b.summary: "**Диктувати — значить називати назви літер.** Називайте кожну літеру окремо, з паузою. Ä, Ö, Ü та ß мають власні назви."
  b.practice.title: "Практика"
  x.spell_name.prompt: "Яка літера позначає звук «ö»?"
  x.spell_name.b: "O — інша літера. Літера з двома крапками називається Ö."
  x.spell_name.c: "Ä — інша літера. Шукайте літеру з двома крапками, яка звучить як «ö»."
  x.spell_name.explanation: "Ö — літера з двома крапками; її називають як «ö»."
  x.letter_names.prompt: "Як продиктувати «Mai»?"
  x.letter_names.b: "У цьому слові немає N, A та Y. Диктуйте літери по одній: M, A, I."
  x.letter_names.c: "Друга літера — A, а не E. Її назва — «а»."
  x.letter_names.explanation: "M – A – I: називайте назву кожної літери по черзі."
  x.eszett_letter.prompt: "Яка одна літера означає «scharfes S»?"
  x.eszett_letter.a: "ss — це дві літери. Одна літера — це ß."
  x.eszett_letter.c: "sz не є німецькою літерою. Одна літера — це ß."
  x.eszett_letter.explanation: "ß пишеться однією літерою, її назва — «ес-цет»."
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Називайте назву кожної літери по порядку."
