strings:
  title: "Привітання: Guten Morgen і Guten Abend"
  summary: "Привітання змінюється з часом доби: ранок, день, вечір, ніч."
  obj: "Обирати привітання, що пасує до часу доби."
  intro: "Guten Morgen означає «доброго ранку»; його кажуть приблизно до 10–11 години. Потім удень кажуть Guten Tag. Guten Abend означає «добрий вечір», приблизно з 18 години. Gute Nacht — не привітання при зустрічі: так кажуть уночі, коли хтось іде спати або коли ви йдете пізно."
  examples: "Привітання протягом дня."
  summary_block: "**Guten Morgen** — вранці, **Guten Tag** — удень, **Guten Abend** — увечері. **Gute Nacht** — лише коли хтось іде спати або ви йдете пізно."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Доброго ранку, пане Кляйн! (приблизно до 10–11 години)"
  ex.2: "Доброго ранку, Томе! (коротко й розмовно)"
  ex.3: "Добрий день! (удень)"
  ex.4: "Добрий вечір, пані Вебер! (приблизно з 18 години)"
  ex.5: "На добраніч, Лізо! (коли хтось іде спати)"
  x1.prompt: "Восьма ранку. Ви заходите в офіс. Що ви скажете?"
  x1.o2.fb: "Guten Abend — для вечора, приблизно з 18 години."
  x1.o3.fb: "Gute Nacht кажуть уночі, коли хтось іде спати."
  x1.expl: "Приблизно до 10–11 години кажуть Guten Morgen."
  x2.prompt: "Напишіть привітання для вечора."
  x2.r1: "Привітання — Guten з -n: Guten Abend."
  x2.r2: "Abend — іменник: пишіть з великої A."
  x2.expl: "Guten Abend: два слова; Abend — вечір."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Gute Nacht — для ночі, коли хтось іде спати або ви йдете пізно. Вранці кажіть Guten Morgen."
  x3.expl: "Nacht — ніч, Morgen — ранок."
  x4.prompt: "З'єднайте кожну фразу з часом, коли її кажуть."
  x4.expl: "Ранок, день, вечір, ніч: фраза залежить від часу."
  x5.prompt: "Що з цього чути ввечері або вночі?"
  x5.o3.fb: "Guten Morgen — для ранку."
  x5.expl: "Guten Abend — вітання ввечері; Gute Nacht кажуть пізно, перед сном."
  x6.prompt: "Восьма вечора. Доповніть привітання."
  x6.r1: "Guten Morgen — для ранку; о 20:00 кажуть Guten Abend."
  x6.r2: "Guten Tag — для дня; о 20:00 уже вечір."
  x6.expl: "Приблизно з 18 години: Guten Abend."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Вас привітали вранці; відповідайте тим самим часом доби."
  x7.o3.fb: "Gute Nacht — коли йдуть спати, а не вранішнє привітання."
  x7.expl: "На привітання відповідайте тим самим привітанням."
  x8.prompt: "Розставте слова в правильному порядку."
  x8.expl: "Спочатку привітання, потім ім'я."
  x9.prompt: "Це правильно?"
  x9.wrong: "Це правильно: Morgen! — коротка розмовна форма Guten Morgen."
  x9.expl: "Колеги й друзі часто кажуть просто Morgen!"
  x10.prompt: "Доповніть ранковий діалог."
  x10.expl: "Пан Кляйн відповідає тим самим ранковим привітанням."
  x11.prompt: "Яке слово означає «вечір»?"
  x11.o2.fb: "Morgen — ранок."
  x11.o3.fb: "Nacht — ніч."
  x11.expl: "Abend — вечір: Guten Abend."
  x12.prompt: "Змініть привітання для вечора."
  x12.r1: "Gute Nacht — коли йдуть спати; ввечері вітаються Guten Abend."
  x12.expl: "Змінюється лише слово часу: Morgen стає Abend."
  x13.prompt: "Як ви відповісте?"
  x13.o2.fb: "Guten Morgen — для ранку, а друг іде спати."
  x13.o3.fb: "Hallo — вітання при зустрічі, а друг бажає на добраніч."
  x13.expl: "На Gute Nacht відповідають Gute Nacht."
  x14.prompt: "Складіть побажання на добраніч."
  x14.expl: "Спочатку Gute Nacht, потім ім'я."
  x15.prompt: "В Австрії ви чуєте Grüß Gott. Яке привітання розуміють усюди?"
  x15.o2.fb: "Gute Nacht — лише перед сном."
  x15.o3.fb: "Tschüss — прощання, а не привітання."
  x15.expl: "Guten Tag розуміють у Німеччині, Австрії та Швейцарії."
  x16.prompt: "Напишіть привітання для 7 ранку."
  x16.r1: "Morgen — іменник: пишіть з великої M."
  x16.r2: "Привітання — Guten з -n: Guten Morgen."
  x16.expl: "Guten Morgen або розмовно просто Morgen."
  tip: "На півдні Німеччини та в Австрії ви почуєте також Grüß Gott, а у Швейцарії — Grüezi. Поки що вони вам не потрібні: Guten Morgen, Guten Tag і Guten Abend розуміють усюди."
