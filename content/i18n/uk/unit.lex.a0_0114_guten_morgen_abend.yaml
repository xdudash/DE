strings:
  title: "Привітання: Guten Morgen і Guten Abend"
  summary: "Привітання змінюється з часом доби: ранок, день, вечір, ніч."
  obj: "Обирати привітання, що пасує до часу доби."
  intro: "Guten Morgen означає «доброго ранку»; зазвичай його кажуть приблизно до 10–11 години. Потім удень кажуть Guten Tag. Guten Abend означає «добрий вечір», приблизно з 18 години. Gute Nacht — не привітання при зустрічі: зазвичай так кажуть пізно, коли хтось іде спати або коли ви йдете пізно ввечері."
  examples: "Привітання протягом дня."
  summary_block: "**Guten Morgen** — вранці, **Guten Tag** — удень, **Guten Abend** — увечері. **Gute Nacht** — зазвичай коли хтось іде спати або ви йдете пізно."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Доброго ранку, пане Кляйн! (приблизно до 10–11 години)"
  ex.2: "Доброго ранку, Томе! (коротко й розмовно)"
  ex.3: "Добрий день! (удень; g у кінці Tag звучить як к)"
  ex.4: "Добрий вечір, пані Вебер! (приблизно з 18 години; d у кінці Abend звучить як т)"
  ex.5: "На добраніч, Лізо! (коли хтось іде спати; Gute без -n)"
  x1.prompt: "З'єднайте кожну фразу з часом, коли її кажуть."
  x1.expl: "Ранок, день, вечір, ніч: фраза залежить від часу."
  x2.prompt: "Восьма ранку. Ви заходите в офіс. Що ви скажете?"
  x2.o2.fb: "Guten Abend — для вечора, приблизно з 18 години."
  x2.o3.fb: "Gute Nacht кажуть пізно, коли хтось іде спати."
  x2.expl: "Приблизно до 10–11 години кажуть Guten Morgen."
  x3.prompt: "Правда чи ні? (= означає «те саме, що»)"
  x3.wrong: "Це правда: Morgen! — коротка розмовна форма Guten Morgen."
  x3.expl: "Колеги й друзі часто кажуть просто Morgen!"
  x4.prompt: "Восьма вечора. Доповніть привітання."
  x4.r1: "Guten Morgen — для ранку; о 20:00 кажуть Guten Abend."
  x4.r2: "Guten Tag — для дня; о 20:00 уже вечір."
  x4.r3: "Abend — іменник: пишіть з великої A."
  x4.r4: "Фраза правильна; тут напишіть лише пропущене слово: Abend."
  x4.expl: "Приблизно з 18 години: Guten Abend."
  x5.prompt: "Що з цього чути ввечері або вночі?"
  x5.o3.fb: "Guten Morgen — для ранку."
  x5.o4.fb: "Guten Tag — для дня; приблизно з 18 години кажуть Guten Abend."
  x5.expl: "Guten Abend — вітання ввечері; Gute Nacht кажуть пізно, перед сном."
  x6.prompt: "Розставте слова в правильному порядку."
  x6.expl: "Спочатку привітання, потім ім'я."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Ліза привіталася вранці; відповідайте тим самим часом доби."
  x7.o3.fb: "Gute Nacht — коли йдуть спати, а не вранішнє привітання."
  x7.expl: "Відповідайте тим самим привітанням та ім'ям співрозмовника."
  x8.prompt: "Правда чи ні? (= означає «те саме, що»)"
  x8.wrong: "Guten Abend — привітання ввечері; Gute Nacht кажуть, коли хтось іде спати."
  x8.expl: "Abend — вечір, Nacht — ніч."
  x9.prompt: "Доповніть ранковий діалог."
  x9.expl: "Пан Кляйн відповідає тим самим ранковим привітанням."
  x10.prompt: "Яке слово означає «вечір»?"
  x10.o2.fb: "Morgen — ранок."
  x10.o3.fb: "Nacht — ніч; вона настає після вечора."
  x10.expl: "Abend — вечір: Guten Abend."
  x11.prompt: "Змініть привітання для вечора."
  x11.r1: "Gute Nacht — коли йдуть спати; ввечері вітаються Guten Abend."
  x11.expl: "Змінюється лише слово часу: Morgen стає Abend."
  x12.prompt: "Ваш друг іде спати. Як ви відповісте?"
  x12.o2.fb: "Guten Morgen — для ранку, а друг іде спати."
  x12.o3.fb: "Guten Abend — вітання ввечері при зустрічі, а друг бажає на добраніч."
  x12.expl: "На Gute Nacht відповідають Gute Nacht."
  x13.prompt: "Ваша дитина лягає спати. Напишіть, що ви скажете."
  x13.r1: "З Nacht — Gute, без -n: Gute Nacht."
  x13.r2: "Nacht — іменник: пишіть з великої N."
  x13.expl: "Gute Nacht: Gute без -n, на відміну від Guten Morgen і Guten Abend."
  x14.prompt: "Ви чуєте це в Австрії. Яке привітання розуміють усюди?"
  x14.o2.fb: "Gute Nacht кажуть перед сном, а Grüß Gott — привітання."
  x14.o3.fb: "Tschüss — прощання, а не привітання."
  x14.expl: "Guten Tag розуміють у Німеччині, Австрії та Швейцарії."
  x15.prompt: "Ранок у пекарні. Доповніть привітання."
  x15.r1: "З Morgen — Guten, з -n. Без -n лише Gute Nacht."
  x15.r2: "Фраза правильна; тут напишіть лише пропущене слово: Guten."
  x15.expl: "Guten Morgen, Guten Tag, Guten Abend — але Gute Nacht."
  x16.prompt: "Напишіть коротке розмовне ранкове привітання (одне слово)."
  x16.r1: "Правильно, але тут напишіть лише коротку форму: Morgen."
  x16.expl: "Morgen! — розмовна коротка форма серед колег і друзів."
  tip: "На півдні Німеччини та в Австрії ви почуєте також Grüß Gott, а у Швейцарії — Grüezi. Поки що вони вам не потрібні: Guten Morgen, Guten Tag і Guten Abend розуміють усюди. Як і українське «на добраніч», Gute Nacht — побажання перед сном, а не привітання."
