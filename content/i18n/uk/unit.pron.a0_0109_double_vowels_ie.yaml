strings:
  title: "Подвоєні голосні та ie"
  summary: "aa, ee, oo та ie завжди позначають довгий голосний."
  obj: "Читати й писати слова з aa, ee, oo та ie."
  intro: "Деякі довгі голосні пишуться двічі: aa як у Haar, ee як у See, oo як у Boot. Довге i зазвичай пишеться ie: Bier, vier, sieben. Подвоєних i та u в німецьких словах немає. Подвоєний приголосний (tt, nn) — протилежний сигнал: він показує короткий голосний."
  examples: "Слова з подвоєними голосними та ie."
  summary_block: "**aa, ee, oo:** довгі a, e, o (Haar, See, Boot). **ie:** довге i (Bier, vier). **tt, nn:** короткий голосний."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "волосся: довге a, пишеться aa"
  ex.2: "пара: довге a, пишеться aa"
  ex.3: "озеро: довге e, пишеться ee"
  ex.4: "море: довге e, пишеться ee"
  ex.5: "зоопарк: довге o, пишеться oo"
  ex.6: "пиво: довге i, пишеться ie"
  ex.7: "чотири: довге i, пишеться ie"
  ex.8: "сім: довге i, пишеться ie"
  x1.prompt: "У якому слові довге i пишеться ie?"
  x1.o2.fb: "У Mitte після i стоїть tt, тому i коротке і пишеться одним i."
  x1.o3.fb: "У Kind після i стоїть nd, тому i коротке."
  x1.expl: "vier: ie — довге i."
  x2.prompt: "Напишіть слово «озеро»."
  x2.r1: "У See подвоєне e: ee — довге e."
  x2.r2: "Sea — англійською. Німецькою See."
  x2.expl: "der See: ee для довгого e."
  x3.prompt: "З'єднайте кожне слово з написанням його довгого голосного."
  x3.expl: "Кожен довгий голосний має своє подвоєне написання; довге i — ie."
  x4.prompt: "Правда чи ні?"
  x4.wrong: "Це правда: ie читається як одне довге i, як у Bier."
  x4.expl: "ie — один звук: довге i."
  x5.prompt: "У яких словах подвоєний голосний?"
  x5.o4.fb: "У Sonne подвоєний приголосний nn, а не голосний."
  x5.o5.fb: "У Bett подвоєний приголосний tt, а не голосний."
  x5.expl: "Haar, Meer і Zoo подвоюють голосний; Sonne і Bett — приголосний."
  x6.prompt: "Доповніть слово «чотири»."
  x6.r1: "vier — це v-i-e-r: спочатку i, потім e. ei — звук як у drei."
  x6.r2: "Довгому i потрібне ie: vier."
  x6.expl: "vier: ie для довгого i."
  x7.prompt: "Одногрупник питає, як пишеться слово. Яка відповідь правильна?"
  x7.o2.fb: "Так виходить Beir. Довге i пишеться: спочатку i, потім e."
  x7.o3.fb: "Без e довге i не позначене. У Bier потрібно ie."
  x7.expl: "Bier: B, i, e, r."
  x8.prompt: "Доповніть довгі голосні: човен, озеро, тварина."
  x8.expl: "Boot, See, Tier: oo, ee та ie."
  x9.prompt: "У якому слові довге a пишеться aa?"
  x9.o2.fb: "У Mann після a стоїть nn, тому a коротке."
  x9.o3.fb: "У Tag довге a, але пишеться одним a."
  x9.expl: "Paar: aa — довге a."
  x10.prompt: "Напишіть по літерах слово «пиво»."
  x10.r1: "У Bier потрібне e: ie — довге i."
  x10.r2: "Beer — англійською. Німецькою довге i пишеться ie: Bier."
  x10.r3: "У Beir літери переставлені. Спочатку i, потім e: Bier."
  x10.expl: "Bier: B-i-e-r."
  x11.prompt: "Це правильно?"
  x11.wrong: "У Haar стоїть aa. Подвоєний голосний завжди довгий."
  x11.expl: "aa, ee та oo показують довгий голосний."
  x12.prompt: "Доповніть слово «сім»."
  x12.r1: "У sieben довге i, яке пишеться ie."
  x12.r2: "seiben — такого слова немає. Довге i — ie: sieben."
  x12.expl: "sieben: ie для довгого i."
  x13.prompt: "У яких словах довге i?"
  x13.o4.fb: "У Kind після i стоїть nd, тому i коротке."
  x13.o5.fb: "У bitte після i стоїть tt, тому i коротке."
  x13.expl: "У sieben, Tier і wie є ie."
  x14.prompt: "Наберіть слово «зоопарк»."
  x14.r1: "У Zoo подвоєне o: довге o пишеться oo."
  x14.expl: "der Zoo: oo для довгого o."
  x15.prompt: "Яке написання показує короткий голосний?"
  x15.o2.fb: "ie показує довге i."
  x15.o3.fb: "oo показує довге o."
  x15.expl: "Подвоєний приголосний, як tt, показує короткий голосний; подвоєний голосний — довгий."
  tip: "Не плутайте ie та ei: ie — довге i (vier), ei — інший звук (drei, ein)."
