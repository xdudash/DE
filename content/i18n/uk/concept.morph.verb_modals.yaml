strings:
  title: 'Модальні дієслова: können, müssen, wollen, dürfen, sollen, möchten'
  summary: Модальні дієслова виражають можливість, необхідність, намір і дозвіл. В однині вони неправильні, а основне дієслово йде в кінець в інфінітиві.
  pattern.scope: "Тут розглядаються основні форми модальних дієслів у теперішньому часі, їхні значення в головних реченнях і загальних питаннях."
  pattern.limits: "Форми минулого часу, підрядні речення та відтінки значення між wollen і möchten вивчаються пізніше."
  ex.ability: "Я можу сьогодні залишитися довше."
  ex.necessity: "Нам потрібно зараз іти."
  ex.permission: "Можна мені тут почекати?"
