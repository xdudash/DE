strings:
  title: "Дієслово на другому місці (V2) у розповідному реченні"
  summary: "У німецькому розповідному головному реченні дієвідмінюване дієслово стоїть на позиції 2; перед ним — рівно один член речення."
  rel.v1: "У загальних питаннях (так/ні) дієвідмінюване дієслово стоїть на позиції 1."
  rel.imperative: "У наказовому способі дієслово стоїть на позиції 1."
  rel.verb_final: "У підрядних реченнях дієвідмінюване дієслово стоїть у кінці."
  rel.bracket: "Недієвідмінювані частини дієслова йдуть у кінець і утворюють рамку з дієсловом на позиції 2."
  rel.position_zero: "und, aber, oder, denn, sondern стоять перед позицією 1."
  rel.connective: "deshalb, trotzdem, dann … займають позицію 1 і спричиняють інверсію."
  rel.w_questions: "W-питання теж V2: питальне слово на позиції 1."
  pattern.scope: "Розповідні головні речення, зокрема друге речення після und/aber/oder/denn/sondern, а також W-питання."
  pattern.limits: "Не діє в загальних питаннях і наказових реченнях (дієслово перше) та в підрядних (дієслово останнє). Розмовне weil + V2 не є нормою писемного мовлення."
  ex.subject_first: "Я живу в Берліні з травня."
  ex.time_first: "З травня я живу в Берліні."
  ex.object_first: "Договір я підпишу завтра."
  ex.object_first.note: "Додаток на позиції 1 — для наголосу або протиставлення."
  ex.modal: "У понеділок мені треба піти до Bürgeramt (міської служби реєстрації)."
  err.v3_adverbial: "Перенесення порядку слів з рідної мови: підмет ставиться перед дієсловом після обставини на початку — дієслово опиняється на позиції 3."
  err.subject_adverb_verb: "Прислівник між підметом і дієсловом зсуває дієслово на позицію 3."
