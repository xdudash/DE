strings:
  title: "Довгі й короткі o та u"
  summary: "Читайте o та u довгими чи короткими за літерами поруч."
  obj: "Розрізняти довгі й короткі o та u за написанням слова."
  intro: "Те саме правило написання діє для o та u. Подвоєний приголосний (nn, tt, mm) або два приголосні (st, nd) після голосного зазвичай роблять його коротким: Sonne, Mutter, Post, Hund. Один приголосний, h або подвоєний голосний зазвичай роблять його довгим: rot, gut, Sohn, Uhr, Boot."
  examples: "Довгі й короткі o та u у словах."
  summary_block: "**Короткі o та u:** Sonne, Post, Mutter, Hund. **Довгі o та u:** Boot, Sohn, rot, gut, Uhr."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "човен: довге o, пишеться oo"
  ex.2: "сонце: коротке o, подвоєне n"
  ex.3: "син: довге o, позначене h"
  ex.4: "червоний: довге o, одне t"
  ex.5: "мати: коротке u, подвоєне t"
  ex.6: "добре: довге u, одне t"
  ex.7: "годинник: довге u, позначене h"
  ex.8: "собака: коротке u, два приголосні nd"
  x1.prompt: "У яких словах довге o?"
  x1.o4.fb: "У Sonne після o стоїть nn, тому o коротке."
  x1.o5.fb: "У Post після o два приголосні st, тому o коротке."
  x1.expl: "У Boot oo, у Sohn oh, а в rot один приголосний: усі довгі."
  x2.prompt: "Доповніть слово «мати»."
  x2.r1: "З одним t u було б довгим. У Mutter коротке u, тому потрібно tt."
  x2.expl: "Mutter: tt після короткого u."
  x3.prompt: "У якому слові коротке u?"
  x3.o2.fb: "У gut після u одне t, тому u довге."
  x3.o3.fb: "У Uhr після u стоїть h, тому u довге."
  x3.expl: "У Hund після u стоїть nd, тому u коротке."
  x4.prompt: "З'єднайте кожне слово з його голосним."
  x4.expl: "oo і один приголосний — довго. nn і tt — коротко."
  x5.prompt: "Правда чи ні?"
  x5.wrong: "Це правда: у Sohn після o стоїть h, а oh — довге o."
  x5.expl: "h після голосного позначає, що він довгий."
  x6.prompt: "Напишіть слово «човен»."
  x6.r1: "У Boot подвоєне o для довгого o."
  x6.r2: "Boat — англійською. Німецькою Boot."
  x6.expl: "Boot: oo — довге o."
  x7.prompt: "Одногрупник питає вас. Що ви відповісте?"
  x7.o2.fb: "У Butter після u стоїть tt, тому u коротке."
  x7.o3.fb: "Butter пишеться B-u-t-t-e-r: там є u."
  x7.expl: "Kurz означає «короткий»: після u стоїть tt."
  x8.prompt: "Коротке o: доповніть кожне слово подвоєним приголосним."
  x8.expl: "Sonne, kommen і Koffer: подвоєний приголосний показує коротке o."
  x9.prompt: "У якому слові довге u позначене h?"
  x9.o2.fb: "У Hund після u стоїть nd, тому u коротке, і h немає."
  x9.o3.fb: "У Mutter після u стоїть tt, тому u коротке."
  x9.expl: "Uhr: h після u позначає, що воно довге."
  x10.prompt: "Напишіть по літерах слово «добре» (довге u)."
  x10.r1: "З tt u було б коротким. У gut одне t."
  x10.r2: "У gut немає h: g-u-t. Одне t уже показує довге u."
  x10.expl: "gut: одне t після довгого u."
  x11.prompt: "Це правильно?"
  x11.wrong: "У Post після o два приголосні st, тому o коротке."
  x11.expl: "Два приголосні після голосного зазвичай роблять його коротким."
  x12.prompt: "Доповніть словом «сонце» (коротке o, nn)."
  x12.r1: "У Sonne потрібно nn: o коротке."
  x12.expl: "Die Sonne ist warm означає «сонце тепле»."
  x13.prompt: "У яких словах короткий голосний?"
  x13.o4.fb: "У Brot після o одне t, тому o довге."
  x13.o5.fb: "У Schuh після u стоїть h, тому u довге."
  x13.expl: "У Hund nd, у kommen mm, у Koffer ff: усі короткі."
  x14.prompt: "Наберіть слово «годинник»."
  x14.r1: "У Uhr після U стоїть h: довге u пишеться uh."
  x14.expl: "Uhr також означає «година» в часі: drei Uhr."
  x15.prompt: "У якому слові довге o пишеться oo?"
  x15.o2.fb: "У Brot довге o, але пишеться одним o."
  x15.o3.fb: "У Sohn довге o пишеться oh, а не oo."
  x15.expl: "Довгий голосний пишуть трьома способами: однією літерою, з h або подвоєно."
  tip: "Пам'ятайте з минулого уроку: lang — довгий, kurz — короткий."
