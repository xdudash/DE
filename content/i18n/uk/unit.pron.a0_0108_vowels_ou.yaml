strings:
  title: "Довгі й короткі o та u"
  summary: "Читайте o та u довгими чи короткими за літерами поруч; кілька слів — винятки."
  obj: "Розрізняти довгі й короткі o та u за написанням слова."
  intro: "Правило з минулого уроку діє і для o та u. Подвоєний приголосний (nn, tt, mm) або два приголосні (st, nd) після голосного зазвичай роблять його коротким: Sonne, Mutter, Post, Hund. Один приголосний, h або подвоєний голосний зазвичай роблять його довгим: rot, gut, Sohn, Uhr, Boot. Довжина важлива: Sohn (син) і Sonne (сонце) відрізняються саме нею. Українське о й у завжди однакові за довжиною, тож довге німецьке о тягніть помітно довше."
  examples: "Довгі й короткі o та u у словах."
  summary_block: "**Зазвичай короткі o та u:** Sonne, Post, Mutter, Hund. **Зазвичай довгі o та u:** Boot, Sohn, rot, gut, Uhr. **Виняток:** Buch, Kuchen (довге u перед ch)."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "човен: довге o, пишеться oo"
  ex.2: "сонце: коротке o, подвоєне n"
  ex.3: "син: довге o, позначене h"
  ex.4: "червоний: довге o, одне t"
  ex.5: "мати: коротке u, подвоєне t"
  ex.6: "добре: довге u, одне t"
  ex.7: "годинник: довге u, позначене h"
  ex.8: "собака: коротке u, два приголосні nd (d у кінці звучить як t)"
  ex.9: "Годинник червоний."
  ex.10: "Хліб добрий."
  x1.prompt: "У яких словах довге o?"
  x1.o4.fb: "У Sonne після o стоїть nn, тому o коротке."
  x1.o5.fb: "У Post після o два приголосні st, тому o коротке."
  x1.expl: "У Boot oo, у Sohn oh, а в rot один приголосний: усі довгі."
  x2.prompt: "З'єднайте кожне слово з його голосним (kurz — короткий, lang — довгий)."
  x2.expl: "nn і nd — коротко. Одне t — довго (Brot, Hut)."
  x3.prompt: "Правда чи ні? (lang — довгий)"
  x3.wrong: "Це правда: у Sohn після o стоїть h, а oh — довге o."
  x3.expl: "h після голосного позначає, що він довгий."
  x4.prompt: "Доповніть слово «мати». (Моя мама — вчителька.)"
  x4.r1: "З одним t u було б довгим. У Mutter коротке u, тому потрібно tt."
  x4.expl: "Mutter: tt після короткого u."
  x5.prompt: "У якому слові коротке u?"
  x5.o2.fb: "У gut після u одне t, тому u довге."
  x5.o3.fb: "У Uhr після u стоїть h, тому u довге."
  x5.expl: "У Hund після u стоїть nd, тому u коротке."
  x6.prompt: "Напишіть німецьке слово «човен»."
  x6.r1: "У Boot подвоєне o для довгого o."
  x6.r2: "Boat — англійською. Німецькою Boot."
  x6.expl: "das Boot: oo — довге o."
  x7.prompt: "Одногрупник питає (Wie heißt das auf Deutsch? — Як це німецькою?). Що ви відповісте?"
  x7.o2.fb: "З одним n o було б довгим. Сонце — Sonne, із nn."
  x7.o3.fb: "Sohn — це син, з довгим o. Сонце — Sonne, з коротким o."
  x7.expl: "die Sonne: коротке o перед nn."
  x8.prompt: "Складіть речення «Годинник червоний»."
  x8.expl: "Die Uhr ist rot: довге u в Uhr, довге o в rot."
  x9.prompt: "Яке з двох слів має довге o?"
  x9.o2.fb: "У Sonne nn, тому його o коротке."
  x9.o3: "обидва"
  x9.o3.fb: "Лише Sohn має довге o (oh). У Sonne коротке o."
  x9.expl: "Sohn (син) і Sonne (сонце) відрізняються довжиною o."
  x10.prompt: "Виправте помилку в написанні."
  x10.expl: "У gut одне t: u довге."
  x11.prompt: "Це правильно? (lang — довгий)"
  x11.wrong: "Це правда: у Buch довге u, хоча після нього ch. Buch і Kuchen — винятки."
  x11.expl: "Правило каже «зазвичай»: у Buch і Kuchen довге u перед ch."
  x12.prompt: "Коротке o: доповніть слова «сонце», «приходити» і «валіза»."
  x12.expl: "Sonne, kommen і Koffer: подвоєний приголосний показує коротке o."
  x13.prompt: "Яке написання слова «собака» правильне?"
  x13.o2.fb: "У кінці чути t, але слово пишеться з d: Hund."
  x13.o3.fb: "h позначало б довге u. У Hund коротке u."
  x13.expl: "der Hund: коротке u перед nd; d звучить як t."
  x14.prompt: "Одногрупник каже це (ich glaube — я думаю). Що ви відповісте?"
  x14.o2.fb: "У Post після o два приголосні st, тому o коротке."
  x14.o3.fb: "У Boot oo і довге o; у Post st і коротке o."
  x14.expl: "Nein — ні: st після o робить його коротким."
  x15.prompt: "Доповніть слово «годинник»."
  x15.r1: "Ur — це не годинник. Довге u позначене h: Uhr."
  x15.expl: "die Uhr: h після u позначає довге u."
  tip: "Виняток, який трапиться часто: Buch (книжка) і Kuchen (пиріг) мають довге u, хоча після нього стоїть ch."
