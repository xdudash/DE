strings:
  title: "Числа від 13 до 20"
  summary: "Від тринадцяти до двадцяти: числа на -zehn і zwanzig."
  obj: "Називати, читати й писати числа від 13 до 20."
  intro: "Від 13 до 19 число — це одиниця плюс -zehn: drei + zehn = dreizehn. Одиниця стоїть першою. Дві форми скорочені: sechzehn (без s від sechs) і siebzehn (без -en від sieben). Двадцять — нове слово: zwanzig."
  examples: "Числа в повсякденних фразах."
  summary_block: "**dreizehn 13 · vierzehn 14 · fünfzehn 15 · sechzehn 16 · siebzehn 17 · achtzehn 18 · neunzehn 19 · zwanzig 20**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "автобус номер тринадцять"
  ex.2: "чотирнадцять днів: два тижні"
  ex.3: "шістнадцять євро: sech- без s"
  ex.4: "сімнадцята година (17:00): sieb- без -en"
  ex.5: "вісімнадцять років"
  ex.6: "двадцять хвилин"
  x1.prompt: "Яке число — vierzehn?"
  x1.o2.fb: "40 — це vierzig, з -zig; -zehn означає «плюс десять»."
  x1.o3.fb: "4 — це vier; -zehn додає десять."
  x1.expl: "Vierzehn = vier + zehn = 14."
  x2.prompt: "Запишіть число цифрами."
  x2.expl: "Achtzehn = acht + zehn = 18."
  x3.prompt: "З'єднайте кожне слово з цифрою."
  x3.expl: "Спочатку одиниця, потім -zehn; zwanzig — це 20."
  x4.prompt: "Правда чи ні?"
  x4.wrong: "Це правда: sechzehn — це 16, пишеться без s від sechs."
  x4.expl: "Sechzehn — це 16."
  x5.prompt: "Напишіть число 16 словом."
  x5.r1: "У 16 s від sechs зникає: sechzehn."
  x5.r2: "У zehn є h: sechzehn."
  x5.expl: "Sechzehn: sech + zehn."
  x6.prompt: "Які слова закінчуються на -zehn?"
  x6.o4.fb: "Zwanzig — це 20 і закінчується на -zig."
  x6.expl: "Від 13 до 19 — на -zehn; 20 — zwanzig."
  x7.prompt: "Складіть фразу «автобус номер п'ятнадцять»."
  x7.expl: "Bus Nummer fünfzehn: число стоїть у кінці."
  x8.prompt: "Що далі?"
  x8.o2.fb: "Zehn — це 10; після 19 іде 20."
  x8.o3.fb: "Neunzig — це 90; двадцять — zwanzig."
  x8.expl: "Achtzehn, neunzehn, zwanzig: 18, 19, 20."
  x9.prompt: "Впишіть пропущені числа."
  x9.expl: "Пропущені числа: vierzehn (14) і sechzehn (16)."
  x10.prompt: "Фільм починається о 17:00. Коли це?"
  x10.o2.fb: "Sieben Uhr — це 7:00."
  x10.o3.fb: "Siebzig — це 70; сімдесятої години не буває."
  x10.expl: "17:00 — це siebzehn Uhr."
  x11.prompt: "Яка цифра відповідає цьому слову?"
  x11.expl: "Dreizehn = drei + zehn = 13."
  x12.prompt: "Це правильно?"
  x12.wrong: "Ні: у 17 -en від sieben зникає: siebzehn."
  x12.expl: "Правильно пишеться siebzehn."
  x13.prompt: "Напишіть пропущене число словом."
  x13.r1: "Пишіть -ig у кінці; у багатьох регіонах це звучить як -ich."
  x13.r2: "Двадцять — це zwanzig, а не число на -zehn."
  x13.expl: "Der Bus kommt in zwanzig Minuten: автобус приїде за двадцять хвилин."
  x14.prompt: "З'єднайте ціну з числом."
  x14.expl: "Dreizehn 13, sechzehn 16, neunzehn 19."
  x15.prompt: "Напишіть число 17 словом."
  x15.r1: "У 17 -en від sieben зникає: siebzehn."
  x15.r2: "Siebzig — це 70; 17 закінчується на -zehn."
  x15.expl: "Siebzehn: sieb + zehn."
  x16.prompt: "Які з цих чисел між 13 і 16?"
  x16.o3.fb: "Zwölf — це 12, менше за 13."
  x16.o4.fb: "Achtzehn — це 18, більше за 16."
  x16.expl: "Vierzehn (14) і fünfzehn (15) — між 13 і 16."
  tip: "Не плутайте -zehn (13–19) з -zig (20, 30 …): vierzehn — це 14, vierzig — 40."
