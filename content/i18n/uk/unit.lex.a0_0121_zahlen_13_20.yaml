strings:
  title: "Числа від 13 до 20"
  summary: "Від тринадцяти до двадцяти: числа на -zehn і zwanzig."
  obj: "Називати, читати й писати числа від 13 до 20 і вживати їх для автобусів, кімнат, віку й часу."
  intro: "Від 13 до 19 спочатку кажуть число від 3 до 9, а потім -zehn: drei + zehn = dreizehn — так само, як у «три-надцять». Дві форми скорочені: sechzehn (без s від sechs) і siebzehn (без -en від sieben). Двадцять — нове слово: zwanzig. Зверніть увагу на звуки: sechzehn вимовляють з ich-звуком (sech-), а не з «кс», як у sechs, а i у vierzehn коротке, хоч і пишеться ie."
  examples: "Числа в повсякденних фразах."
  summary_block: "**dreizehn 13 · vierzehn 14 · fünfzehn 15 · sechzehn 16 · siebzehn 17 · achtzehn 18 · neunzehn 19 · zwanzig 20**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "автобус номер тринадцять"
  ex.2: "чотирнадцять євро: i коротке"
  ex.3: "шістнадцята година (16:00): sech- з ich-звуком"
  ex.4: "Мені вісімнадцять. Wie alt bist du? = скільки тобі років?"
  ex.5: "кімната дев'ятнадцять"
  ex.6: "Автобус приїде за двадцять хвилин."
  x1.prompt: "З'єднайте кожне слово з цифрою."
  x1.expl: "Спочатку мале число, потім -zehn; zwanzig — це 20."
  x2.prompt: "Яке число — vierzehn?"
  x2.o2.fb: "40 — це vierzig, з -zig; -zehn додає десять."
  x2.o3.fb: "4 — це vier; -zehn додає десять: 14."
  x2.expl: "Vierzehn = vier + zehn = 14."
  x3.prompt: "Напишіть число 16 словом."
  x3.r1: "У 16 s від sechs зникає: sechzehn."
  x3.r2: "У zehn є h: sechzehn."
  x3.expl: "Sechzehn: sech + zehn, з ich-звуком."
  x4.prompt: "Правда чи ні?"
  x4.wrong: "Це правда: 14 + 1 = 15."
  x4.expl: "Vierzehn (14) + eins (1) = fünfzehn (15)."
  x5.prompt: "Які з цих чисел більші за 15?"
  x5.o4.fb: "Vierzehn — це 14, менше за 15."
  x5.expl: "Siebzehn 17, achtzehn 18, zwanzig 20: усі більші за 15."
  x6.prompt: "Впишіть пропущені числа."
  x6.expl: "Лічба: dreizehn, vierzehn, fünfzehn … achtzehn, neunzehn, zwanzig."
  x7.prompt: "Правда чи ні? (hört man = чути, wie in = як у)"
  x7.wrong: "Це правда: sechzehn вимовляють з ich-звуком, sech-zehn, а не з «кс», як у sechs."
  x7.expl: "У sechs — «кс», а в sechzehn — ich-звук."
  x8.prompt: "Розставте слова в правильному порядку."
  x8.expl: "Der Bus kommt in zwanzig Minuten: автобус приїде за двадцять хвилин."
  x9.prompt: "Ваш автобус — 13. Напишіть його номер словом."
  x9.r1: "У zehn є h: dreizehn."
  x9.r2: "Dreißig — це 30; 13 — dreizehn."
  x9.expl: "Bus Nummer dreizehn: автобус номер тринадцять."
  x10.prompt: "Фільм починається о 17:00. Коли це?"
  x10.o2.fb: "Sieben Uhr — це 7:00."
  x10.o3.fb: "Siebzig — це 70; 17 закінчується на -zehn: siebzehn."
  x10.expl: "17:00 = siebzehn Uhr; um = о."
  x11.prompt: "-zehn чи -zig? Доповніть число 14."
  x11.r1: "-zig утворює десятки: vierzig — 40. Для 14 — -zehn: vierzehn."
  x11.r2: "У zehn є h: vierzehn."
  x11.expl: "14 = vierzehn."
  x12.prompt: "Вам 18. Відповідайте на питання."
  x12.o2.fb: "Achtzig — це 80; 18 — achtzehn."
  x12.o3.fb: "Acht — це 8; 18 — achtzehn."
  x12.expl: "Wie alt bist du? – Ich bin achtzehn."
  x13.prompt: "Адміністратор називає вашу кімнату. Запишіть номер цифрами."
  x13.expl: "Neunzehn — це 19."
  x14.prompt: "Напишіть цю ціну словами."
  x14.r1: "Vierzig — це 40; 14 — vierzehn."
  x14.r2: "Euro не змінюється після числа: vierzehn Euro."
  x14.expl: "14 € = vierzehn Euro."
  x15.prompt: "Запишіть час цифрами."
  x15.r1: "Neun Uhr — 9:00; neunzehn Uhr — 19:00."
  x15.expl: "Neunzehn Uhr — це 19:00."
  tip: "Не плутайте -zehn (13–19) з -zig (20, 30 …): vierzehn — це 14, vierzig — 40. Закінчення -ig у zwanzig у стандартній вимові Німеччини звучить як «-іх», а на півдні Німеччини, в Австрії та Швейцарії — як «-ік»."
