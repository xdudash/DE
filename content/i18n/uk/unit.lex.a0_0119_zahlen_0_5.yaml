strings:
  title: "Числа від 0 до 5"
  summary: "Від нуля до п'яти: для кімнат, автобусів, цін і телефонних номерів."
  obj: "Називати, читати й писати числа від 0 до 5 і вживати їх для кімнат, автобусів, цін і телефонних номерів."
  intro: "Перші числа — null, eins, zwei, drei, vier, fünf. Ви чуєте їх щодня: номер кімнати, номер автобуса, ціна, номер телефону. Числівники пишуть з малої літери, крім початку речення. Телефонні номери зазвичай читають по одній цифрі: null – eins – fünf – zwei."
  examples: "Числа в повсякденних фразах."
  summary_block: "**null 0 · eins 1 · zwei 2 · drei 3 · vier 4 · fünf 5**. Телефонні номери — по одній цифрі."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "0, 1, 2: лічба від нуля."
  ex.2: "кімната три. Welches Zimmer? = яка кімната?"
  ex.3: "автобус номер чотири"
  ex.4: "п'ять євро. Euro не змінюється після числа."
  ex.5: "номер телефону, по одній цифрі. Ihre Nummer? = ваш номер?"
  x1.prompt: "З'єднайте кожне слово з цифрою."
  x1.expl: "Null 0, eins 1, zwei 2, drei 3, vier 4, fünf 5."
  x2.prompt: "На табличці на зупинці — 4. Як це сказати?"
  x2.o2.fb: "Fünf — це 5. Vier теж починається зі звуку f, але пишеться з v і означає 4."
  x2.o3.fb: "Drei — це 3."
  x2.expl: "Vier — це 4: Bus Nummer vier."
  x3.prompt: "Напишіть число 4 словом."
  x3.r1: "Vier пишеться з v, хоча починається зі звуку f."
  x3.r2: "У vier посередині ie: v-ie-r."
  x3.expl: "Vier: v, ie, r."
  x4.prompt: "Правда чи ні? (klingt = звучить, am Anfang = на початку)"
  x4.wrong: "Це правда: vier пишеться з v, але починається зі звуку f."
  x4.expl: "У німецьких словах v зазвичай звучить як f: vier, Vater."
  x5.prompt: "Впишіть пропущені числа."
  x5.expl: "Лічба: null, eins, zwei, drei, vier, fünf."
  x6.prompt: "Які з цих чисел менші за drei?"
  x6.o4.fb: "Vier — це 4, більше за 3."
  x6.expl: "Null, eins і zwei — 0, 1 і 2: усі менші за 3."
  x7.prompt: "Складіть фразу «кімната номер чотири»."
  x7.expl: "Zimmer Nummer vier: число стоїть у кінці."
  x8.prompt: "На цінику 3 €. Як це прочитати?"
  x8.o2.fb: "Euro не змінюється після числа: drei Euro."
  x8.o3.fb: "Zwei — це 2, а на цінику 3."
  x8.expl: "3 € = drei Euro."
  x9.prompt: "Напишіть номер автобуса словом."
  x9.r1: "Звук «ай» пишеться ei: zwei."
  x9.r2: "Zwo кажуть по телефону; на письмі — zwei."
  x9.expl: "Bus Nummer zwei: автобус номер два."
  x10.prompt: "Які числівники пишуться з ei?"
  x10.o4.fb: "У vier — ie, а не ei: ie — довге i, ei звучить як «ай»."
  x10.expl: "У eins, zwei, drei — ei; у vier — ie."
  x11.prompt: "Це правильно?"
  x11.wrong: "Це правда: 4 + 1 = 5."
  x11.expl: "Vier (4) + eins (1) = fünf (5)."
  x12.prompt: "Хтось диктує номер телефону. Запишіть його цифрами."
  x12.expl: "Null eins fünf zwei: 0152."
  x13.prompt: "Ваш номер — 0 1 5 2. Відповідайте на питання."
  x13.o2.fb: "Vier — це 4; у вашому номері 5: fünf."
  x13.o3.fb: "Порядок неправильний: ваш номер починається з null."
  x13.expl: "Телефонний номер читають по одній цифрі, по порядку."
  x14.prompt: "Напишіть цей номер телефону словами."
  x14.expl: "0 3 4: null drei vier."
  x15.prompt: "На вашому ключі — 5. Відповідайте на питання."
  x15.o2.fb: "Vier — це 4, а на ключі 5."
  x15.o3.fb: "Eins — це 1, а на ключі 5."
  x15.expl: "Fünf — це 5: Zimmer fünf."
  tip: "Vier пишеться з v, але починається зі звуку f. Zwei починається з «цв». По телефону часто кажуть zwo замість zwei, щоб не сплутати з drei."
