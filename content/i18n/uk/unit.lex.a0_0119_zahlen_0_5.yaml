strings:
  title: "Числа від 0 до 5"
  summary: "Від нуля до п'яти: для кімнат, автобусів, цін і телефонних номерів."
  obj: "Називати, читати й писати числа від 0 до 5."
  intro: "Перші числа — null, eins, zwei, drei, vier, fünf. Ви чуєте їх щодня: номер кімнати, номер автобуса, ціна. Числа пишуться з малої літери."
  examples: "Числа в повсякденних фразах."
  summary_block: "**null 0 · eins 1 · zwei 2 · drei 3 · vier 4 · fünf 5**"
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "0, 1, 2: лічба від нуля."
  ex.2: "кімната три"
  ex.3: "автобус номер чотири"
  ex.4: "п'ять євро. У fünf є ü."
  ex.5: "один чи два?"
  x1.prompt: "Яке слово означає число 0?"
  x1.o2.fb: "Eins — це 1, перше число після null."
  x1.o3.fb: "Zwei — це 2."
  x1.expl: "Null — це 0. Воно потрібне для телефонних номерів."
  x2.prompt: "Запишіть число цифрами."
  x2.expl: "Drei — це 3."
  x3.prompt: "З'єднайте кожне слово з цифрою."
  x3.expl: "Null, eins, zwei, drei: 0, 1, 2, 3."
  x4.prompt: "Правда чи ні?"
  x4.wrong: "Це правда: fünf — це 5."
  x4.expl: "Fünf — це 5; пам'ятайте про ü."
  x5.prompt: "Напишіть число 4 словом."
  x5.r1: "Vier пишеться з v, хоча звучить як f."
  x5.r2: "У vier є ie: довге i."
  x5.expl: "Vier: v на початку, ie в середині."
  x6.prompt: "Які слова — числа від 0 до 5?"
  x6.o4.fb: "Zimmer означає «кімната»; це не число."
  x6.expl: "Null, eins і fünf — числа; Zimmer — іменник."
  x7.prompt: "Складіть фразу «автобус номер два»."
  x7.expl: "Bus Nummer zwei: число стоїть після Nummer."
  x8.prompt: "Що далі?"
  x8.o2.fb: "Після zwei іде drei; fünf — пізніше."
  x8.o3.fb: "Null стоїть перед eins, а не після zwei."
  x8.expl: "Eins, zwei, drei: 1, 2, 3."
  x9.prompt: "Впишіть пропущені числа."
  x9.expl: "Пропущені числа: zwei (2) і vier (4)."
  x10.prompt: "Ви їдете автобусом 5. Який це автобус?"
  x10.o2.fb: "Vier — це 4, а не 5."
  x10.o3.fb: "Zwei — це 2, а не 5."
  x10.expl: "Fünf — це 5."
  x11.prompt: "Яка цифра відповідає цьому слову?"
  x11.expl: "Fünf — це 5."
  x12.prompt: "Це правильно?"
  x12.wrong: "Ні: eins — це 1, а zwei — 2."
  x12.expl: "Eins — це 1."
  x13.prompt: "Напишіть номер кімнати словом."
  x13.r1: "Звук «ай» пишеться ei: drei."
  x13.r2: "Усередині фрази числа пишуть з малої літери: Zimmer drei."
  x13.expl: "Zimmer drei: кімната три."
  x14.prompt: "З'єднайте кімнату з її номером."
  x14.expl: "Zimmer vier — 4, Zimmer fünf — 5, Zimmer eins — 1."
  x15.prompt: "Напишіть число 5 словом."
  x15.r1: "У fünf є ü з двома крапками."
  x15.r2: "Fünf закінчується на f."
  x15.expl: "Fünf: f, ü, n, f."
  x16.prompt: "Які з цих чисел менші за drei?"
  x16.o4.fb: "Vier — це 4, більше за 3."
  x16.expl: "Null, eins і zwei — 0, 1 і 2: усі менші за 3."
  tip: "Vier починається з v, але звучить як f. По телефону часто кажуть zwo замість zwei, щоб не сплутати з drei."
