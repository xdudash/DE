strings:
  title: "Літери в повсякденні: e-mail і вулиця"
  summary: "Продиктуйте адресу електронної пошти й назву вулиці."
  obj: "Диктувати й розуміти адресу e-mail і продиктовану назву вулиці."
  intro: "Коли диктуєте адресу e-mail, називайте знаки словами: @ — «ет», крапка — Punkt, - — Bindestrich, _ — Unterstrich. У багатьох адресах умлаути пишуть без крапок: ü стає ue, ö — oe, ä — ae. Коли диктуєте назву вулиці, ß називайте «есцет»."
  examples: "Адреси вголос."
  summary_block: "**@ = ät, . = Punkt, - = Bindestrich, _ = Unterstrich.** В адресах **ü → ue, ö → oe, ä → ae**. **ß** диктуйте як **eszett**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Вимовляють: anna Punkt berg ät web Punkt de."
  ex.2: "Punkt: крапка (.) в адресі."
  ex.3: "Bindestrich: дефіс (-)."
  ex.4: "Unterstrich: нижнє підкреслення (_)."
  ex.5: "@ вимовляють «ет», від англійського „at“."
  ex.6: "В адресах ü часто пишуть як ue: Müller → mueller."
  x1.prompt: "Як вимовити знак @ в адресі e-mail?"
  x1.o2.fb: "Punkt — це крапка (.), а не @."
  x1.o3.fb: "Bindestrich — це дефіс (-), а не @."
  x1.expl: "@ вимовляють «ет»."
  x2.prompt: "Напишіть німецьке слово для крапки в адресі e-mail."
  x2.r1: "Punkt закінчується на -kt."
  x2.r2: "Німецькою тут пишуть k: Punkt."
  x2.expl: "Крапка — der Punkt."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правильно: - називається Bindestrich."
  x3.expl: "Binde- означає «з'єднувати»: дефіс з'єднує дві частини."
  x4.prompt: "З'єднайте знак із його німецькою назвою."
  x4.expl: "Punkt, Bindestrich і Unterstrich — найпотрібніші знаки в адресах."
  x5.prompt: "Які слова потрібні, щоб продиктувати „anna.berg@web.de“?"
  x5.o3.fb: "У цій адресі немає дефіса (-)."
  x5.o4.fb: "У цій адресі немає підкреслення (_)."
  x5.expl: "anna Punkt berg ät web Punkt de."
  x6.prompt: "Доповніть, як вимовити anna@web.de."
  x6.r1: "Punkt — це крапка. Тут знак @, його вимовляють «ет»."
  x6.expl: "Між іменем і поштовим сервісом стоїть @ — «ет»."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Це лише прізвище по літерах, а питають усю адресу."
  x7.o3.fb: "Це ваше ім'я, а не адреса e-mail."
  x7.expl: "Назвіть усю адресу з Punkt і ät."
  x8.prompt: "Розставте частини, щоб сказати web.de."
  x8.expl: "web.de вимовляють web Punkt de."
  x9.prompt: "Це правильно?"
  x9.wrong: "Це правильно: у багатьох адресах ü пишуть як ue, наприклад mueller."
  x9.expl: "Ue, oe і ae замінюють умлаути, коли крапки не можна вжити."
  x10.prompt: "Напишіть Müller так, як його часто пишуть в адресі e-mail, без умлауту."
  x10.r1: "Без крапок ü стає ue, а не u: mueller."
  x10.r2: "Тут залишився умлаут. У багатьох адресах пишуть ue: mueller."
  x10.expl: "Müller → mueller: ü замінюють на ue."
  x11.prompt: "Хтось диктує S – T – R – A – ß – E. Яке це слово?"
  x11.o2.fb: "Strasse пишеться з двома S, а продиктували ß (есцет)."
  x11.o3.fb: "У Strase одна S, а продиктували ß (есцет)."
  x11.expl: "ß диктують як «есцет»: Straße."
  x12.prompt: "Доповніть, як вимовити lisa.koch@gmx.de."
  x12.expl: "Кожну крапку вимовляють Punkt."
  x13.prompt: "Що з цього може бути частиною адреси e-mail?"
  x13.o4.fb: "Кома (Komma) в адресах e-mail не вживається."
  x13.expl: "Крапки, підкреслення й дефіси трапляються в адресах, а коми — ні."
  x14.prompt: "Напишіть, як вимовити цю адресу."
  x14.r1: "Punkt — іменник: пишіть з великої P."
  x14.expl: "tom@web.de: tom ät web Punkt de."
  x15.prompt: "Як ви відповісте?"
  x15.o2.fb: "Це назва й номер, а питають літери."
  x15.o3.fb: "Danke не відповідає на питання, як пишеться вулиця."
  x15.expl: "Wie schreibt man …? — це прохання продиктувати літери."
