strings:
  title: "Числа від 6 до 12"
  summary: "Від шести до дванадцяти: для часу, днів, місяців і гравців."
  obj: "Називати, читати й писати числа від 6 до 12 і вживати їх, щоб сказати час."
  intro: "Наступні числа — sechs, sieben, acht, neun, zehn, elf, zwölf. Elf і zwölf — окремі слова: вони не утворюються від zehn. Зі словом Uhr після числа називають час: acht Uhr — це 8:00."
  examples: "Числа в повсякденних фразах."
  summary_block: "**sechs 6 · sieben 7 · acht 8 · neun 9 · zehn 10 · elf 11 · zwölf 12**. **Es ist acht Uhr.** = Восьма година."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Шоста година. Wie viel Uhr ist es? = котра година?"
  ex.2: "сім днів: тиждень"
  ex.3: "автобус номер вісім"
  ex.4: "одинадцять гравців: футбольна команда"
  ex.5: "У році дванадцять місяців."
  ex.6: "neun — це 9; nein означає «ні»."
  x1.prompt: "Годинник показує 9:00. Котра година?"
  x1.o2.fb: "Nein означає «ні». Дев'ять — neun, з eu."
  x1.o3.fb: "Acht Uhr — це 8:00."
  x1.expl: "9:00 = neun Uhr."
  x2.prompt: "Впишіть пропущені числа."
  x2.expl: "Лічба: sechs, sieben, acht, neun, zehn."
  x3.prompt: "Які числа більші за zehn?"
  x3.o3.fb: "Neun — це 9, менше за 10."
  x3.o4.fb: "Acht — це 8, менше за 10."
  x3.expl: "Elf (11) і zwölf (12) ідуть після zehn."
  x4.prompt: "Напишіть число 7 словом."
  x4.r1: "Sieben пишеться з ie: довге i."
  x4.r2: "Ei звучить як «ай»; довге i пишеться ie: sieben."
  x4.expl: "Sieben: s, ie, b, e, n."
  x5.prompt: "Правда чи ні? (nein = ні, dasselbe Wort = те саме слово)"
  x5.wrong: "Ні: neun — це 9, звучить з «ой»; nein — «ні», звучить з «ай»."
  x5.expl: "Eu звучить як «ой», ei — як «ай»."
  x6.prompt: "З'єднайте кожне слово з цифрою."
  x6.expl: "Sechs 6, sieben 7, acht 8, neun 9, elf 11, zwölf 12."
  x7.prompt: "Годинник показує 10:00. Відповідайте на питання."
  x7.o2.fb: "Elf — це 11, а годинник показує 10."
  x7.o3.fb: "Euro — це гроші; для часу кажіть Uhr."
  x7.expl: "Wie viel Uhr ist es? – Es ist zehn Uhr."
  x8.prompt: "Годинник показує 12:00. Доповніть речення."
  x8.r1: "У zwölf — ö, а не e."
  x8.r2: "Zwölf закінчується на f."
  x8.r3: "Oe — так пишуть ö в адресах; у словах пишіть ö: zwölf."
  x8.expl: "Es ist zwölf Uhr: дванадцята година."
  x9.prompt: "У футбольній команді 11 гравців. Як це сказати?"
  x9.o2.fb: "Zwölf — це 12."
  x9.o3.fb: "11 не утворюється з eins і zehn: це elf."
  x9.expl: "Elf — це 11, окреме слово."
  x10.prompt: "Розставте слова в правильному порядку."
  x10.expl: "Ein Jahr hat zwölf Monate: у році дванадцять місяців."
  x11.prompt: "Які з цих чисел парні?"
  x11.o4.fb: "Sieben — це 7, непарне число."
  x11.o5.fb: "Elf — це 11, непарне число."
  x11.expl: "Sechs, acht і zwölf — 6, 8 і 12: парні числа."
  x12.prompt: "Запишіть час цифрами."
  x12.expl: "Sieben Uhr — це 7:00."
  x13.prompt: "Це правильно?"
  x13.wrong: "Це правда: 6 + 6 = 12."
  x13.expl: "Sechs (6) + sechs (6) = zwölf (12)."
  x14.prompt: "Запишіть номер автобуса цифрами."
  x14.expl: "Acht — це 8."
  x15.prompt: "Напишіть цей час словами."
  x15.expl: "6:00 = sechs Uhr."
  tip: "У sechs поєднання chs звучить як «кс». Sieben пишеться з ie, neun — з eu (звучить як «ой»), а zwölf — з ö і без e після w."
