  intro: "ß і ss звучать однаково: як чітке «с». Написання визначає голосний перед ними. Після довгого голосного (або ei, au) пишуть ß: Straße, groß, Fuß. Після короткого — ss: Fluss, Wasser. У Швейцарії ß не вживають: скрізь пишуть ss (Strasse)."
  examples: "Слова з ß і ss."
  summary_block: "**Довгий голосний + ß:** Straße, groß, Fuß. **Короткий голосний + ss:** Fluss, Wasser. У Швейцарії пишуть **ss** в обох випадках."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Straße (вулиця): ß після довгого a."
  ex.2: "groß (великий): ß після довгого o."
  ex.3: "Fuß (стопа): ß після довгого u."
  ex.4: "Fluss (річка): ss після короткого u."
  ex.5: "Wasser (вода): ss після короткого a."
  ex.6: "У Швейцарії: Strasse з ss."
  x1.prompt: "Яке написання вживають у Німеччині та Австрії?"
