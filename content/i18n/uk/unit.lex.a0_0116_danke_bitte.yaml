strings:
  title: "Danke і Bitte"
  summary: "Дякуйте, просіть зі словом bitte і відповідайте на подяку."
  obj: "Дякувати, ввічливо просити з bitte і відповідати на подяку."
  intro: "Danke означає «дякую»; Danke schön і Vielen Dank — тепліше. Bitte має дві ролі: у проханні це «будь ласка» (Ein Wasser, bitte.), а після Danke — «нема за що». Bitte schön також кажуть, коли щось подають людині."
  examples: "Подяка й прохання в коротких сценах."
  summary_block: "**Danke**, **Danke schön**, **Vielen Dank** — подяка. **Bitte** — «будь ласка» у проханні й відповідь на подяку. **Bitte schön** — коли щось подаєте."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Дякую!"
  ex.2: "Дуже дякую! (трохи тепліше)"
  ex.3: "Щиро дякую!"
  ex.4: "Воду, будь ласка. (замовлення)"
  ex.5: "Дякую! – Будь ласка!"
  ex.6: "Прошу! (коли щось подають)"
  x1.prompt: "Хтось притримує для вас двері. Що ви скажете?"
  x1.o2.fb: "Bitte відповідає на чужу подяку або просить; тут дякуєте ви."
  x1.o3.fb: "Tschüss — прощання, а людина зробила вам приємне."
  x1.expl: "За дрібну послугу кажуть Danke."
  x2.prompt: "Напишіть тепліший варіант подяки зі schön."
  x2.r1: "Schön пишеться s-c-h-ö-n, з ö."
  x2.expl: "Danke schön (також Dankeschön) — тепліша подяка."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правильно: Bitte! — звичайна відповідь на Danke!"
  x3.expl: "Antwort — відповідь. Danke! – Bitte! — стала пара."
  x4.prompt: "З'єднайте дві частини кожної фрази."
  x4.expl: "Vielen Dank, Danke schön і Ein Wasser, bitte — сталі фрази."
  x5.prompt: "Що з цього — подяка?"
  x5.o4.fb: "Bitte — прохання або відповідь на подяку, а не подяка."
  x5.expl: "Danke, Danke schön і Vielen Dank — усе це подяка."
  x6.prompt: "Ввічливо попросіть воду."
  x6.r1: "Danke — подяка; щоб попросити, додайте bitte."
  x6.r2: "Bitte пишеться з подвійним t."
  x6.expl: "У проханні bitte означає «будь ласка»."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Danke у відповідь не відповідає на подяку; скажіть Bitte."
  x7.o3.fb: "Це прощання, а не відповідь на подяку."
  x7.expl: "Danke! – Bitte! — звичайна пара."
  x8.prompt: "Розставте слова в правильному порядку."
  x8.expl: "Спочатку що ви хочете, потім bitte."
  x9.prompt: "Це правильно?"
  x9.wrong: "Vielen Dank — «щиро дякую», це не привітання."
  x9.expl: "Begrüßung — привітання, як Hallo чи Guten Tag."
  x10.prompt: "Доповніть сцену біля стійки кафе."
  x10.expl: "Ви просите з bitte, офіціант подає з Bitte schön, а ви дякуєте Danke schön."
  x11.prompt: "Ви подаєте клієнтові замовлену каву. Що ви скажете?"
  x11.o2.fb: "Danke schön — подяка; коли щось подаєте, кажіть Bitte schön."
  x11.o3.fb: "Це привітання, а не те, що кажуть, подаючи річ."
  x11.expl: "Bitte schön кажуть, коли щось подають."
  x12.prompt: "Зробіть це прохання ввічливим."
  x12.expl: "Додайте bitte: Ein Wasser, bitte."
  x13.prompt: "Як ви відповісте?"
  x13.o2.fb: "Повторити подяку — не відповідь; скажіть Bitte або Bitte schön."
  x13.o3.fb: "Guten Tag — привітання, а не відповідь на подяку."
  x13.expl: "Bitte schön — відповідь на теплу подяку."
  x14.prompt: "Складіть подяку."
  x14.expl: "Спочатку Vielen Dank, потім ім'я."
  x15.prompt: "Яке слово означає «будь ласка»?"
  x15.o2.fb: "danke — дякую."
  x15.o3.fb: "schön — гарний; у Danke schön робить подяку теплішою."
  x15.expl: "bitte — будь ласка."
  x16.prompt: "Напишіть відповідь на Danke одним словом."
  x16.r1: "Danke — подяка; відповідь на подяку — Bitte."
  x16.r2: "Bitte пишеться з подвійним t."
  x16.expl: "Danke! – Bitte!"
