translator: Codex (AI draft, 2026-10-26)
strings:
  title: "Наказовий спосіб: прості інструкції"
  summary: "Використовуйте форми du, ihr і ввічливе Sie для коротких інструкцій та прохань."
  obj.recognize: "Розпізнавати наказ і визначати, до кого він звернений: du, ihr чи ввічливе Sie."
  obj.form: "Складати короткі інструкції для однієї людини, групи та ввічливого звертання."
  b.intro: "Наказовий спосіб використовують для інструкцій і прохань. У багатьох поширених дієслів форми легко впізнати: *mach!* для однієї людини (*du*), *macht!* для кількох (*ihr*) і *machen Sie!* за ввічливого звертання.\n\nУ короткій формі для однієї людини *du* опускають. У ввічливій формі *Sie* стоїть після дієслова. Слово *bitte* робить прохання ввічливішим."
  b.pattern.caption: "Три корисні форми"
  col.form: "Форма наказу"
  col.subject: "До кого звертаються"
  col.example: "Приклад"
  b.examples.title: "Інструкції та прохання"
  ex.du: "Відчини вікно, будь ласка! (одній людині, неформально)"
  ex.ihr: "Відкрийте книжки, будь ласка! (кільком людям, неформально)"
  ex.sie: "Відчиніть двері, будь ласка! (ввічливо)"
  ex.wait: "Будь ласка, зачекайте тут! (ввічливо)"
  b.position: "У відокремлюваних дієслів префікс стоїть у кінці: *Mach das Fenster auf!* (Відчини вікно!). У ввічливій інструкції дієслово стоїть першим, а за ним іде *Sie*: *Öffnen Sie bitte das Fenster!* Тут розглянуто поширені схеми; деякі дієслова мають особливі форми, які вивчаються окремо."
  b.errors.title: "Стежте за порядком слів"
  e.du_subject: "У неформальному звертанні до однієї людини опустіть *du*: *Mach das Fenster auf!*"
  e.sie_order: "У ввічливому наказі спочатку поставте дієслово, потім *Sie*: *Machen Sie die Tür auf!*"
  b.summary: "- Одна людина, неформально: основа дієслова, зазвичай без *du*: *Mach!*\n- Кілька людей, неформально: форма *ihr* без займенника: *Macht!*\n- Ввічливе звертання: спочатку дієслово, потім *Sie*: *Machen Sie!*\n- У відокремлюваного дієслова префікс стоїть у кінці: *Mach die Tür auf!* Додайте *bitte* для ввічливого прохання."
  b.practice.title: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Перевірте, до кого звертаються і де стоїть дієслово."
  x.choose_du.prompt: "Виберіть наказ для однієї людини, до якої звертаються неформально."
  x.choose_du.a: "Це твердження з підметом *du*, а не звичайна коротка форма наказу."
  x.choose_du.c: "*Macht* звернене до кількох людей (*ihr*)."
  x.choose_du.explanation: "Для однієї людини використовуйте *Mach!* і опустіть *du*."
  x.match.prompt: "Поєднайте форму з адресатом."
  x.match.explanation: "Використовуйте *mach* з *du*, *macht* з *ihr* і *machen Sie* у ввічливому проханні."
  x.cloze.prompt: "Доповніть ввічливе прохання дієсловом *machen*."
  x.cloze.explanation: "У ввічливому наказі поставте *machen* першим, а потім *Sie*: *Machen Sie bitte ...!*"
  x.order.prompt: "Складіть прохання: «Відчини вікно, будь ласка!» (одній людині, неформально)"
  x.order.explanation: "Почніть із *Mach*, потім додайте *bitte* і додаток; відокремлюваний префікс *auf* стоїть у кінці."
  x.transform.prompt: "Перетворіть твердження на наказ для кількох людей: Ihr macht bitte die Bücher auf."
  x.transform.explanation: "Використайте форму *ihr* — *macht*, але опустіть займенник *ihr*: *Macht bitte die Bücher auf!*"
  x.categorize.prompt: "Розподіліть інструкції за адресатом."
  x.categorize.du: "Одна людина (du)"
  x.categorize.ihr: "Кілька людей (ihr)"
  x.categorize.sie: "Ввічливе звертання (Sie)"
  x.categorize.explanation: "*Mach* звернене до однієї людини, *macht* — до групи, *machen Sie* або *warten Sie* — ввічлива форма."
  x.true_false.prompt: "Правда чи ні? У короткому неформальному наказі одній людині зазвичай опускають *du*."
  x.true_false.wrong: "У короткій формі зазвичай кажуть *Mach!* без *du*."
  x.true_false.explanation: "Форма дієслова показує адресата, тому *du* зазвичай опускають: *Mach!*"
  x.correct.prompt: "Виправте порядок слів у цьому ввічливому проханні."
  x.correct.explanation: "Поставте дієслово першим, а потім ввічливе *Sie*: *Öffnen Sie bitte das Fenster!*"
  x.situation.prompt: "Як ввічливо попросити зачекати тут?"
  x.situation.b: "Це твердження, а не інструкція."
  x.situation.c: "У ввічливому наказі *Sie* стоїть після дієслова, а не в кінці."
  x.situation.explanation: "Ввічлива інструкція починається з дієслова: *Warten Sie bitte hier!*"
