strings:
  title: "Алфавіт: як продиктувати ім'я"
  summary: "Продиктуйте своє ім'я по літерах і зрозумійте продиктоване ім'я."
  obj: "Диктувати ім'я німецькими назвами літер і записувати продиктоване ім'я."
  intro: "На рецепції чи по телефону часто питають: Wie schreibt man das? (Як це пишеться?). Відповідайте назвами літер з короткою паузою: M – E – Y – E – R. Деякі назви відрізняються від англійських: V — «фау», W — «ве», J — «йот», Y — «іпсилон». Для двох однакових літер часто кажуть Doppel-, наприклад Doppel-L."
  examples: "Як диктують ім'я."
  summary_block: "**Wie schreibt man das?** Відповідайте назвами літер: **M – E – Y – E – R**. Пам'ятайте: **V = фау, W = ве, J = йот, Y = іпсилон** і **Doppel-L** для LL."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Як це пишеться?"
  ex.2: "Meyer по літерах: ем – е – іпсилон – е – ер."
  ex.3: "Müller: замість двох L кажуть Doppel-L."
  ex.4: "V називається «фау», W — «ве»."
  ex.5: "J називається «йот», Y — «іпсилон»."
  ex.6: "W як у Wasser: слово робить літеру зрозумілою по телефону."
  x1.prompt: "Як німецькою називається літера W?"
  x1.o2.fb: "«Подвійне U» — англійська назва. Німецькою W — «ве»."
  x1.o3.fb: "«Фау» — це літера V, а не W."
  x1.expl: "W називається «ве»; V — «фау»."
  x2.prompt: "Запишіть ім'я, яке продиктували: M – E – Y – E – R."
  x2.r1: "Meier — інше написання, але тут є Y: M – E – Y – E – R."
  x2.r2: "Друга літера — E, а не A: Meyer."
  x2.expl: "Пишіть саме ті літери, які чуєте: M, E, Y, E, R."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правильно: V називається «фау» і часто звучить як f."
  x3.expl: "V — «фау»: Vater вимовляють зі звуком f."
  x4.prompt: "З'єднайте літеру з її німецькою назвою."
  x4.expl: "Ці чотири назви найбільше відрізняються від англійських."
  x5.prompt: "Які літери двічі трапляються в імені Anna?"
  x5.o3.fb: "В Anna немає M: A – N – N – A."
  x5.expl: "Anna — це A – Doppel-N – A: і A, і N трапляються двічі."
  x6.prompt: "Допишіть останню літеру в слові Müller."
  x6.r1: "Müller закінчується на -er, тож остання літера — R."
  x6.expl: "Müller: M – Ü – Doppel-L – E – R."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Це повтор імені, а питають про літери."
  x7.o3.fb: "Danke не відповідає на питання, як пишеться ім'я."
  x7.expl: "Wie schreibt man das? — це прохання назвати літери."
  x8.prompt: "Розставте слова, щоб спитати, як щось пишеться."
  x8.expl: "Спочатку питальне слово Wie, потім дієслово schreibt."
  x9.prompt: "Це правильно?"
  x9.wrong: "Це правильно: для двох однакових літер часто кажуть Doppel-, наприклад Doppel-L у Müller."
  x9.expl: "Doppel означає «подвійний»."
  x10.prompt: "Напишіть літеру, яка називається «йот»."
  x10.r1: "Y називається «іпсилон». «Йот» — це J."
  x10.r2: "I називається «і». «Йот» — це J."
  x10.expl: "J — «йот», як у Januar."
  x11.prompt: "Яка літера називається «іпсилон»?"
  x11.o2.fb: "I називається просто «і»."
  x11.o3.fb: "J називається «йот»."
  x11.expl: "Y — «іпсилон», як у Meyer."
  x12.prompt: "Доповніть короткий діалог."
  x12.expl: "На Wie schreibt man das? відповідають літерами, а потім усім ім'ям."
  x13.prompt: "Що з цього — німецькі назви літер?"
  x13.o4.fb: "Double-u — англійська назва. Німецькою W — «ве»."
  x13.expl: "B — «бе», H — «га», V — «фау»."
  x14.prompt: "Продиктуйте це ім'я по літерах, через тире."
  x14.expl: "Klein: K – L – E – I – N, літера за літерою."
  x15.prompt: "Як ви відповісте?"
  x15.o2.fb: "Це привітання, а питають ваше ім'я."
  x15.o3.fb: "Tschüss завершує розмову, а питають ваше ім'я."
  x15.expl: "Назвіть ім'я і одразу продиктуйте його: так не буде зайвого питання."
  tip: "Називайте літери повільно, з паузою, а умлаути — як окремі літери: Ü, а не U."
