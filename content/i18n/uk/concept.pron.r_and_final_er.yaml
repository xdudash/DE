strings:
  title: "Німецький r і закінчення -er"
  summary: "r перед голосним — приголосний, зазвичай горловий (rot, drei). Після голосного в кінці складу та в закінченні -er він стає майже голосним, близьким до короткого м'якого a (Uhr, Vater, aber)."
  pattern.scope: "r на початку слова або перед голосним; r після довгого голосного в кінці складу; ненаголошене закінчення -er."
  pattern.limits: "Різницю між горловим і розкотистим r письмово не перевіряємо. Розкотистий r поширений у Баварії, Австрії та Швейцарії, і він теж правильний."
  ex.rot: "rot (червоний): r на початку — приголосний."
  ex.drei: "drei (три): r перед голосним — приголосний."
  ex.vater: "Vater (батько): -er у кінці звучить як м'яке a."
  ex.uhr: "Uhr (годинник): r після голосного в кінці м'який."
