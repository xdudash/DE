strings:
  title: "Умлаути: звуки"
  summary: "Ä, Ö і Ü мають кожен свій звук. Вивчайте їх разом зі словом."
  obj: "Розрізняти ä, ö і ü та писати їх у простих словах."
  intro: "Ä, Ö і Ü — окремі літери. Ä звучить близько до е в «bed», часто довше. Для ö скажіть «е» й округліть губи. Для ü скажіть «і» й округліть губи. Крапки важливі: без них слово інше або неправильне."
  examples: "Слово для кожного умлауту."
  summary_block: "**ä** ≈ е в «bed». **ö** = е з округленими губами. **ü** = і з округленими губами. Крапки — частина літери."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Käse (сир): ä, близько до е в «bed», але довше."
  ex.2: "Bär (ведмідь): довге ä."
  ex.3: "schön (гарний): е з округленими губами."
  ex.4: "Öl (олія): довге ö на початку слова."
  ex.5: "über (над): і з округленими губами."
  ex.6: "Tür (двері): ü в середині слова."
  x1.prompt: "Який умлаут виходить, якщо сказати «е» з округленими губами?"
  x1.o2.fb: "ä близьке до е в «bed», без округлених губ."
  x1.o3.fb: "ü — це «і» з округленими губами, а не «е»."
  x1.expl: "е + округлені губи = ö, як у schön."
  x2.prompt: "Напишіть німецьке слово «сир». У ньому є ä."
  x2.r1: "Käse потребує двох крапок: ä."
  x2.r2: "Kaese — написання без клавіші умлауту; зазвичай пишуть ä: Käse."
  x2.expl: "Käse: K – Ä – S – E."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Це правильно: скажіть «і», округліть губи — і вийде ü."
  x3.expl: "Ü = і з округленими губами, як у über."
  x4.prompt: "З'єднайте слово з його умлаутом."
  x4.expl: "У Käse — ä, у schön — ö, в über — ü."
  x5.prompt: "У яких словах є звук ü?"
  x5.o3.fb: "Tor (ворота) має o, а не ü."
  x5.o4.fb: "Hut (капелюх) має u без крапок."
  x5.expl: "У über і Tür — ü; у Tor і Hut — звичайні o та u."
  x6.prompt: "Вставте пропущений умлаут: sch_n (гарний)."
  x6.r1: "Без крапок це o; у schön має бути ö."
  x6.r2: "ü — інший умлаут; у schön — ö."
  x6.expl: "schön: S – C – H – Ö – N."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Це O без крапок; у schön — Ö."
  x7.o3.fb: "Ä — інший умлаут; у schön — Ö."
  x7.expl: "Умлаут диктують як окрему літеру: Ö."
  x8.prompt: "Вставте умлаути."
  x8.expl: "У Käse — ä; у schön — ö."
  x9.prompt: "Це правильно?"
  x9.wrong: "Ні: Ö і O — різні літери з різними звуками."
  x9.expl: "Крапки утворюють нову літеру: O і Ö — не одне й те саме."
  x10.prompt: "Напишіть німецьке слово «двері». У ньому є ü."
  x10.r1: "Tür потребує крапок: ü."
  x10.r2: "Tor — це ворота. Двері — Tür, з ü."
  x10.expl: "Tür: T – Ü – R."
  x11.prompt: "Яка літера є в „Bär“ (ведмідь)?"
  x11.o2.fb: "У Bär над a дві крапки: ä."
  x11.o3.fb: "Звук близький до е, але літера — ä."
  x11.expl: "Bär: B – Ä – R."
  x12.prompt: "Виправте написання: цьому слову потрібен умлаут."
  x12.expl: "über пишеться з ü."
  x13.prompt: "У яких словах є звук ö?"
  x13.o3.fb: "У Bär — ä, а не ö."
  x13.o4.fb: "Ofen (піч) має o без крапок."
  x13.expl: "У schön і Öl — ö."
  x14.prompt: "Яка літера пропущена? B_r (ведмідь)"
  x14.r1: "Без крапок це a; у Bär має бути ä."
  x14.r2: "Звук близький до е, але Bär пишуть з ä."
  x14.expl: "Bär: довге ä."
  x15.prompt: "Як ви відповісте?"
  x15.o2.fb: "У über дві крапки: Ü."
  x15.o3.fb: "Ö — інший умлаут; в über — Ü."
  x15.expl: "über: Ü з двома крапками."
