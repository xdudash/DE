  x2.o2.fb: "Guten Tag — привітання при зустрічі, а не при прощанні."
  x2.o3.fb: "Hallo — це привітання, а ви йдете."
  x2.expl: "З друзями прощаються словом Tschüss."
  x3.prompt: "Правда чи ні? (= означає «те саме, що»)"
