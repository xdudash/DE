  x5.o5.fb: "Hallo — привітання при зустрічі."
  x5.expl: "Tschüss, Auf Wiedersehen і Bis bald завершують розмову."
  x6.prompt: "Розставте слова в правильному порядку."
  x6.expl: "Спочатку прощання, потім ім'я."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "Hallo починає розмову, а пані Вебер іде."
  x7.o3.fb: "Guten Morgen — привітання, а тут прощання."
  x7.expl: "На ввічливе прощання відповідайте ввічливо."
  x8.prompt: "Правда чи ні? (= означає «те саме, що»)"
