  x9.prompt: "Доповніть прощання двох друзів."
  x9.expl: "Bis morgen або Bis bald, і Tschüss у відповідь."
  x10.prompt: "Ви відходите від віконця в банку. Яке прощання пасує?"
  x10.o2.fb: "Tschüss — неформально; у банку краще ввічливе прощання."
  x10.o3.fb: "Bis bald означає, що ви скоро побачитеся, а коли знову побачите працівника банку — невідомо."
  x10.expl: "З незнайомими ввічливо сказати Auf Wiedersehen."
