  x3.expl: "Bis bald — прощання, Guten Tag — привітання."
  x4.prompt: "Ви побачите колегу завтра. Доповніть прощання."
  x4.r1: "Bis bald — «до скорого», без дня; на завтра кажіть Bis morgen."
  x4.r2: "У Bis bald немає дня; на завтра кажіть Bis morgen."
  x4.expl: "Morgen тут означає «завтра»: Bis morgen."
