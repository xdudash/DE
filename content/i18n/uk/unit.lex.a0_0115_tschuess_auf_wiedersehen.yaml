  x12.prompt: "Ваша подруга Анна йде; ви побачитеся завтра. Що ви відповісте?"
  x12.o2.fb: "Guten Tag — привітання при зустрічі, а Анна йде."
  x12.o3.fb: "Не та людина: ви говорите з подругою Анною, а не з паном Кляйном."
  x12.expl: "Tschüss у відповідь і bis morgen, бо побачитеся завтра."
  x13.prompt: "Напишіть ввічливе прощання (два слова)."
  x13.r1: "Wieder- пишеться з ie: Wiedersehen."
  x13.r2: "Wiedersehen — іменник: пишіть з великої W."
  x13.r3: "На письмі — повна форма Wiedersehen, з -en."
  x13.expl: "Auf Wiedersehen: два слова, Wiedersehen з ie і великою W."
  x14.prompt: "Яке слово означає «скоро»?"
