strings:
  title: "Прощання: Tschüss і Auf Wiedersehen"
  summary: "Tschüss — зі знайомими, Auf Wiedersehen — ввічливо з будь-ким; Bis bald і Bis morgen — коли ще побачитеся."
  obj: "Обирати прощання, що пасує до людини, і казати, коли побачитеся знову."
  intro: "Tschüss — неформальне прощання з друзями, однокласниками й знайомими колегами. Auf Wiedersehen — ввічливе прощання: біля віконця, у магазині, з малознайомими людьми. Bis bald — «до скорого»; Bis morgen — «до завтра». Обидва можна сказати після Tschüss."
  examples: "Прощання в коротких сценах."
  summary_block: "**Tschüss** — неформально. **Auf Wiedersehen** — ввічливо. **Bis bald** — «до скорого», **Bis morgen** — «до завтра»."
