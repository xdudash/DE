  x14.o3.fb: "bis — «до»: Bis bald дослівно «до скорого»."
  x14.expl: "bald — скоро: Bis bald!"
  x15.prompt: "Це правильно? (+ означає «і»)"
  x15.wrong: "Це правда: wieder — знову, sehen — бачити."
  x15.expl: "Auf Wiedersehen дослівно «до нової зустрічі»."
  x16.prompt: "Напишіть німецькою: «До завтра!»"
  x16.r1: "Тут morgen означає «завтра» і пишеться з малої m."
  x16.r2: "Bis bald — «до скорого»; «до завтра» — Bis morgen."
  x16.expl: "Bis morgen: morgen з малої m означає «завтра»."
  tip: "Tschüss і Tschüs — обидва написання правильні. Wiedersehen = wieder (знову) + sehen (бачити). Розподіл такий самий, як в українській: Tschüss ≈ «бувай», Auf Wiedersehen ≈ «до побачення»."
