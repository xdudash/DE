strings:
  title: "Ввічливі фрази: дякую, будь ласка, вибачте, перепрошую"
  summary: "Danke — подяка, Bitte — прохання або відповідь на подяку, Gern geschehen і Kein Problem — відповіді на подяку, Entschuldigung — вибачення або спосіб привернути увагу, Wie bitte? — прохання повторити."
  pattern.scope: "Сталі фрази, щоб подякувати, попросити, відповісти на подяку, вибачитися та попросити повторити або говорити повільніше."
  pattern.limits: "Вивчаються як сталі фрази. Ввічливі прохання з модальними дієсловами, як Könnten Sie …, — на рівні A1."
  ex.danke_bitte: "Дякую! – Будь ласка!"
  ex.gern: "Щиро дякую! – Нема за що!"
  ex.entschuldigung: "Вибачте! / Перепрошую!"
  ex.wie_bitte: "Перепрошую? / Що ви сказали? (ви не почули)"
