translator: claude (AI draft, 2026-10-12)
strings:
  title: "Порядок слів: дієслово на другому місці (V2)"
  summary: "У німецькому розповідному реченні дієвідмінюване дієслово завжди стоїть на позиції 2 — хоч би що стояло першим."
  obj.identify: "Знаходити дієвідмінюване дієслово у твердженні й бачити, що воно стоїть на позиції 2."
  obj.produce: "Будувати твердження, які починаються з часу, місця чи додатка, зберігаючи дієслово на позиції 2."
  obj.position_zero: "Розрізняти слова, що не займають позиції (und, aber, oder, denn, sondern), і слова, що займають позицію 1 (deshalb, dann, trotzdem)."
  obj.limits: "Розпізнавати типи речень, у яких дієслово НЕ стоїть на позиції 2."

  b.intro: |
    В українській мові порядок слів досить вільний: «Сьогодні я працюю вдома» і «Я сьогодні працюю вдома» — обидва варіанти нормальні.
    У німецькій мові в **твердженні** (головному реченні, яке не є питанням чи проханням)
    діє суворе правило: **дієвідмінюване дієслово** — форма, що змінюється за особами: *ich arbeit**e***, *du arbeit**est*** —
    завжди стоїть на **позиції 2**.

    На позиції 1 може стояти підмет, але не обов'язково. Там може бути час, місце, додаток
    чи інший член речення. Якщо першим стоїть не підмет, то підмет переходить **за** дієслово.
    Саме дієслово свого місця не змінює.
  b.pattern.caption: "Одне речення, три різні початки — дієслово залишається на позиції 2"
  col.p1: "Позиція 1 (один член речення)"
  col.p2: "Позиція 2 (дієвідмінюване дієслово)"
  col.middle: "Середина (підмет, додатки, деталі)"
  col.end: "Кінець (інші частини дієслова)"
  b.position1: |
    **Позиція 1 — це один член речення, а не одне слово.** *Seit Mai*, *am nächsten Montag* і
    *meine neue Kollegin aus Polen* — кожен із них вважається **одним** членом, тому дієслово стоїть одразу після нього.

    На позицію 1 ставлять те, що найкраще пов'язане з попередньою фразою, або те, що треба виділити:
    *Seit Mai wohne ich in Berlin.* відповідає на питання «відколи?», *In Berlin wohne ich seit Mai.* наголошує на місці.
    У нейтральному мовленні найчастіше починають із підмета або з вказівки на час.

    На позицію 2 йде лише **дієвідмінюване** дієслово. Інші частини дієслова — інфінітив після модального дієслова
    (*muss … gehen*), дієприкметник (*habe … abgeschickt*) чи відокремлюваний префікс (*rufe … an*) — йдуть у **кінець**
    речення. Разом вони утворюють «рамку» навколо середини речення.
  b.examples.title: "Приклади з повсякденного життя"
  ex.work: "З наступного тижня я працюю в Лінці."
  ex.doctor: "У лікаря часто доводиться довго чекати."
  ex.object: "Цю квартиру я вважаю занадто дорогою."
  ex.object.note: "Додаток (*diese Wohnung*) стоїть на позиції 1 для наголосу; підмет *ich* іде після дієслова."
  ex.bracket: "Сьогодні курс німецької починається о дев'ятій."
  ex.bracket.note: "*anfangen* — дієслово з відокремлюваним префіксом: *fängt* стоїть на позиції 2, префікс *an* іде в кінець."
  ex.perfect: "Учора я надіслав(-ла) свою податкову декларацію."
  b.contrast.title: "Порівняйте"
  c.emphasis: "Зміст однаковий, початок різний. В обох реченнях дієслово *arbeite* на позиції 2; коли першим стоїть *heute*, підмет *ich* переходить за дієслово."
  c.und_deshalb: "*und* не займає позиції, тому *ich* стоїть на позиції 1, а *lerne* — на позиції 2. *deshalb* (тому) **займає** позицію 1, тому дієслово йде одразу після нього, а підмет — після дієслова."
  b.position0: |
    Деякі короткі сполучники стоять **перед** позицією 1 і не враховуються. Це «позиція 0»:
    **und, aber, oder, denn, sondern**.

    - *Aber **ich** habe keine Zeit.* — *aber* = позиція 0, *ich* = позиція 1, *habe* = позиція 2.

    Слова **deshalb, dann, danach, trotzdem, außerdem, leider** поводяться інакше: це звичайні члени речення,
    і вони **займають** позицію 1.

    - *Deshalb **lerne** ich Deutsch.* / *Dann **gehen** wir nach Hause.*

    *Ja*, *nein* і звертання на ім'я теж не враховуються: *Ja, ich komme.* — *Anna, ich bin gleich da.*
  b.errors.title: "Типові помилки"
  e.v3: "Після *heute* (позиція 1) одразу має йти дієслово. Якщо поставити підмет першим, як в українській, дієслово опиниться на позиції 3."
  e.deshalb: "*deshalb* займає позицію 1, тому дієслово йде одразу за ним: *Deshalb lerne ich …*"
  e.aber: "*aber* стоїть на позиції 0. Позиція 1 ще вільна, тож потрібен звичайний член речення, найчастіше підмет: *Aber ich habe …*"
  e.adverb: "Прислівник не може стояти між підметом на позиції 1 і дієсловом. Поставте його після дієслова — або почніть із нього речення: *Am Wochenende koche ich oft.*"
  e.bracket: "На позиції 2 стоїть лише дієвідмінюване дієслово (*will*). Інфінітив *lernen* іде в кінець."
  b.limits: |
    V2 — правило для **тверджень** (головних речень). Інші типи речень побудовані інакше, їх ви вивчатимете в окремих темах:

    - **Загальні питання** (так/ні) починаються з дієслова (позиція 1): *Kommst du morgen?*
    - **Прохання й накази** теж починаються з дієслова: *Komm bitte morgen!*
    - **W-питання** зберігають дієслово на позиції 2, питальне слово — на позиції 1: *Wann kommst du?*
    - У **підрядних реченнях** (після *weil*, *dass*, *wenn* …) дієслово йде в **кінець**: *…, weil ich keine Zeit habe.*

    В усному мовленні можна почути *weil* із дієсловом на позиції 2 (*weil ich habe keine Zeit*). Це розмовний варіант,
    у нормативній писемній німецькій він не прийнятий, тож на письмі після *weil* ставте дієслово в кінець.
  b.regional: "Правило V2 однакове в Німеччині, Австрії та Швейцарії. Регіональні відмінності стосуються лексики, наприклад *Im Jänner* (Австрія) замість *Im Januar* або *das Velo* (Швейцарія) замість *das Fahrrad* — порядок слів не змінюється: *Im Jänner **fahre** ich nach Graz.*"
  b.summary: |
    - У твердженні **дієвідмінюване дієслово завжди на позиції 2**.
    - Позиція 1 — **один член речення** (у ньому може бути кілька слів): підмет, час, місце, додаток …
    - Якщо на позиції 1 не підмет, **підмет іде одразу після дієслова**.
    - Інші частини дієслова (інфінітив, дієприкметник, префікс) — у **кінці**.
    - *und, aber, oder, denn, sondern* не враховуються; *deshalb, dann, trotzdem* — враховуються.
  b.practice.title: "Вправи"

  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Перевірте, де стоїть дієвідмінюване дієслово."
  fb.v3: "Тут дієслово на позиції 3. Після першого члена речення одразу має йти дієвідмінюване дієслово, потім підмет."
  fb.subject_adverb: "Між підметом на позиції 1 і дієсловом нічого не може стояти. Поставте *morgen* після дієслова або на початок."
  fb.bracket: "На позиції 2 лише дієвідмінюване дієслово (*muss*). Інфінітив *bezahlen* стоїть у самому кінці."
  fb.separable: "*anrufen* — дієслово з відокремлюваним префіксом: *rufe* на позиції 2, а *an* — у самому кінці речення."
  fb.position_zero: "*aber* не займає позиції. Після *aber* все одно потрібна позиція 1 (наприклад, *ich*), а потім дієслово."
  fb.connective: "*deshalb* займає позицію 1, тому дієслово йде одразу за ним: *Deshalb nehme ich …*"

  x.choose_correct.prompt: "Яке речення правильне?"
  x.choose_correct.a: "*heute* стоїть на позиції 1, отже, далі має йти дієслово, а не підмет."
  x.choose_correct.c: "Тут дієслово на позиції 3. *frei* ставиться після підмета."
  x.choose_correct.d: "Твердження не починається з дієслова. З дієсловом на початку фраза звучить як загальне питання — і *heute ich* після нього неможливе."
  x.choose_correct.explanation: "*Heute* займає позицію 1, дієвідмінюване дієслово *habe* — позицію 2, підмет *ich* іде після дієслова."

  x.position2.prompt: "Яке слово стоїть на позиції 2 в цьому реченні?"
  x.position2.a: "*Seit drei Jahren* — один член речення (обставина часу), він повністю займає позицію 1."
  x.position2.b: "*Jahren* ще належить до першого члена речення *Seit drei Jahren*."
  x.position2.d: "*meine Schwester* — підмет. Він стоїть після дієслова, бо позиція 1 вже зайнята."
  x.position2.explanation: "*Seit drei Jahren* — один член на позиції 1, тому дієвідмінюване дієслово *wohnt* стоїть на позиції 2."

  x.order_vienna.prompt: "Складіть твердження: «Завтра я їду до Відня». Спробуйте почати з *morgen*."
  x.order_vienna.explanation: "Можливі варіанти: *Morgen fahre ich nach Wien.* / *Ich fahre morgen nach Wien.* / *Nach Wien fahre ich morgen.* Скрізь *fahre* стоїть на позиції 2."

  x.order_rent.prompt: "Складіть твердження: «У понеділок я маю заплатити за квартиру»."
  x.order_rent.explanation: "*muss* на позиції 2, інфінітив *bezahlen* у кінці. На позиції 1 може бути *am Montag*, *ich* або *die Miete*."

  x.order_call.prompt: "Складіть твердження: «Сьогодні я зателефоную своїй орендодавиці». (*anrufen* = телефонувати)"
  x.order_call.explanation: "*rufe* на позиції 2, відокремлюваний префікс *an* — у кінці: *Heute rufe ich meine Vermieterin an.*"

  x.cloze_deshalb.prompt: "Вставте *ich* і *lerne* у правильному порядку."
  x.cloze_deshalb.gap0_subject: "*Deshalb* уже займає позицію 1, отже, на позиції 2 має стояти дієслово."
  x.cloze_deshalb.gap1_verb: "Тут дієслово має стояти перед підметом, бо *deshalb* займає позицію 1."
  x.cloze_deshalb.explanation: "*Deshalb* — позиція 1 → *lerne* (позиція 2) → *ich*."

  x.transform_evening.prompt: "Перепишіть речення так, щоб воно починалося з *Heute Abend*."
  x.transform_evening.subject: "Підмет *ich* іде одразу після дієслова, перед рештою речення."
  x.transform_evening.explanation: "*Heute Abend* (позиція 1) → *gehe* (позиція 2) → *ich* → *ins Kino*."

  x.transform_aber.prompt: "Додайте *aber* на початок речення."
  x.transform_aber.explanation: "*aber* стоїть на позиції 0. Позиція 1 залишається такою ж (*ich*), *habe* залишається на позиції 2. Можна сказати й так: *Aber heute habe ich keine Zeit.*"

  x.transform_deshalb.prompt: "З'єднайте два речення за допомогою *deshalb*: друге речення — наслідок."
  x.transform_deshalb.explanation: "*Deshalb* займає позицію 1 у другому реченні, тому дієслово *nehme* йде одразу за ним: *Deshalb nehme ich ein Taxi.*"

  x.limits.prompt: "Усі ці речення правильні. У якому з них дієслово НЕ на позиції 2?"
  x.limits.a: "*Morgen* на позиції 1, *komme* на позиції 2 — це звичайне твердження з V2."
  x.limits.c: "У W-питанні питальне слово займає позицію 1, а дієслово стоїть на позиції 2."
  x.limits.d: "*Ich* на позиції 1, *komme* на позиції 2."
  x.limits.explanation: "Загальне питання (так/ні) починається з дієслова (позиція 1): *Kommst du morgen?*"

  # Interactive categorisation exercise: sort chunks by V2 sentence role.
  x.categorize_v2.prompt: "Розподіліть частини речення «Heute arbeite ich von zu Hause.» за їхньою роллю в реченні."
  x.categorize_v2.category.first: "Позиція 1 · перший елемент"
  x.categorize_v2.category.verb: "Позиція 2 · дієслово зі змінюваною формою"
  x.categorize_v2.category.middle: "Середина · підмет або деталі"
  x.categorize_v2.item.verb: "Дієслово зі змінюваною формою залишається на позиції 2, одразу після першого елемента."
  x.categorize_v2.explanation: "Heute — перший елемент, arbeite — дієслово зі змінюваною формою на позиції 2, а ich von zu Hause стоять у середині."

  x.listening_v2.prompt: "Прослухайте речення та виберіть його значення."
  x.listening_v2.a: "Сьогодні я працюю з дому."
  x.listening_v2.b: "Завтра я працюю вдома."
  x.listening_v2.b.feedback: "*Heute* означає «сьогодні», а не «завтра»."
  x.listening_v2.c: "Я працюю з дому щодня."
  x.listening_v2.c.feedback: "У реченні сказано *heute* («сьогодні»), а не «щодня»."
  x.listening_v2.explanation: "*Heute* — перший елемент, а *arbeite*, дієслово зі змінюваною формою, стоїть на позиції 2."
  x.dictation_monday.prompt: "Прослухайте й запишіть повне речення німецькою."
  x.dictation_monday.explanation: "*Am Montag* — перший елемент, *fahre* — дієслово зі змінюваною формою на позиції 2, за ним іде *ich*."
  x.correct_v2.prompt: "Перепишіть речення, виправивши порядок слів."
  x.correct_v2.verb: "Після першого елемента *Heute* поставте дієслово *arbeite* перед підметом."
  x.correct_v2.explanation: "*Heute* займає позицію 1, *arbeite* — дієслово зі змінюваною формою на позиції 2, далі йде *ich*."
