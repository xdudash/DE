strings:
  title: "W-питання: запитуємо про потрібне"
  summary: "Запитуйте про людину, предмет, місце, час, причину чи кількість: питальне слово стоїть першим, відмінюване дієслово — другим."
  obj.recognize: "Визначати, яку інформацію запитує W-питання, і знаходити місце відмінюваного дієслова."
  obj.ask: "Складати просте W-питання з відмінюваним дієсловом на другому місці."
  b.intro: |
    Ставте W-питання, коли вам потрібна певна інформація. На початку стоїть питальне слово, а одразу за ним — **відмінюване дієслово** на другому місці. Підмет зазвичай іде після дієслова: *Wo **wohnst** du?* (Де ти живеш?)

    Питальне слово підказує співрозмовнику, якої саме відповіді ви очікуєте: про місце, час, людину чи щось інше. Цей порядок пов'язаний із порядком слів у ствердженні, який ви щойно вивчили.
  b.pattern.caption: "Питальне слово першим, відмінюване дієслово другим"
  col.question: "Місце 1: питальне слово"
  col.verb: "Місце 2: відмінюване дієслово"
  col.subject: "Підмет"
  col.rest: "Інші відомості"
  b.examples.title: "Щоденні запитання"
  ex.when: "Коли відправляється автобус?"
  ex.where: "Де ти живеш?"
  ex.who_subject: "Хто тут живе?"
  ex.where_from: "Звідки Ви? (ввічливе звертання)"
  ex.price: "Скільки коштує квиток?"
  b.word_meaning: |
    **Обирайте питальне слово залежно від потрібної відповіді.** *Wo?* запитує про місце, *wohin?* — про напрямок до цілі, *woher?* — про початкову точку. *Wann?* запитує про час, *warum?* — про причину, а *wie viel?* — про кількість або ціну.

    Корисний виняток: у питанні *Wer wohnt hier?* (Хто тут живе?) слово *wer* саме є підметом. Окремого підмета після дієслова немає. У більшості інших прикладів, як-от *Wo wohnst du?*, підмет стоїть після відмінюваного дієслова.
  b.errors.title: "Поширена помилка"
  e.verb_third: "Питальне слово вже займає перше місце. Одразу після нього постав відмінюване дієслово, а потім підмет: *Wo wohnst du?*"
  e.indirect: "Це пряме питання, тож порядок такий: питальне слово + відмінюване дієслово + підмет: *Wann fährt der Bus?* У непрямому питанні порядок інший: *Weißt du, wann der Bus fährt?*"
  b.summary: |
    - Постав питальне слово на перше місце, а відмінюване дієслово — на друге: *Wann fährt der Bus?*
    - Підмет зазвичай іде після дієслова: *Wo wohnst du?*
    - Якщо *wer* — підмет, не додавай іншого: *Wer wohnt hier?*
    - Використовуй *wo*, *wohin* і *woher* відповідно для місця, напрямку та початкової точки.
  b.practice.title: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Подумай, яку відповідь запитує питальне слово, а потім постав відмінюване дієслово на друге місце."
  x.choose_order.prompt: "Яке пряме питання має правильний порядок слів?"
  x.choose_order.b: "У прямому питанні відмінюване дієслово стоїть одразу після питального слова."
  x.choose_order.c: "Питальне слово займає перше місце, а відмінюване дієслово — друге."
  x.choose_order.explanation: "Пряме W-питання починається з питального слова. За ним на другому місці стоїть відмінюване дієслово, потім підмет: *Wann beginnt der Deutschkurs?*"
  x.choose_word.prompt: "Обери питальне слово, що підходить до відповіді."
  x.choose_word.a: "*Wo?* запитує про місце, а не про час."
  x.choose_word.c: "*Wer?* запитує про людину. Тут у відповіді вказано час."
  x.choose_word.explanation: "*Um acht Uhr* вказує на час, тож запитай *Wann fährt der Bus?*"
  x.match_words.prompt: "З'єднай питальне слово з типом інформації, про яку воно запитує."
  x.match_words.explanation: "*Wo?* запитує про місце, *wann?* — про час, *wohin?* — про напрямок до цілі, *woher?* — про початкову точку."
  x.cloze.prompt: "Доповни питання й відповідь правильними формами дієслова *heißen*."
  x.cloze.explanation: "Запитай *Wie heißt du?*, поставивши дієслово на друге місце. У відповіді з підметом *ich* вживається форма *heiße*."
  x.order_where.prompt: "Склади питання: «Де ти живеш?»"
  x.order_where.explanation: "*Wo* стоїть на першому місці, *wohnst* — відмінюване дієслово на другому, а *du* — підмет."
  x.transform_time.prompt: "Перетвори ствердження на питання про час: Der Bus fährt um acht Uhr."
  x.transform_time.explanation: "Заміни вказівку часу на *wann* і постав його на перше місце. Відмінюване дієслово *fährt* буде другим, перед підметом *der Bus*."
  x.categorize.prompt: "Розподіли питальні слова за типом запитуваної інформації."
  x.categorize.time: "Час"
  x.categorize.place: "Місце"
  x.categorize.person: "Людина"
  x.categorize.reason: "Причина"
  x.categorize.explanation: "*Wann* запитує про час, *wo* — про місце, *wer* — про людину, а *warum* — про причину."
  x.wer_subject.prompt: "Правда чи неправда? У цьому питанні *wer* є підметом."
  x.wer_subject.wrong: "Тут *wer* називає людину, яка виконує дію, тож це підмет."
  x.wer_subject.explanation: "У реченні *Wer wohnt hier?* слово *wer* є підметом. За ним іде відмінюване дієслово *wohnt*, окремий підмет не потрібен."
  x.correct_order.prompt: "Виправ порядок слів у прямому питанні."
  x.correct_order.explanation: "Це пряме питання: *wo* стоїть першим, відмінюване дієслово *findet* — другим, за ним іде підмет *der Deutschkurs*."
