strings:
  title: "Умлаути в словах і назвах місць"
  summary: "Крапки змінюють слово: schon і schön — два різні слова."
  obj: "Знаходити й писати умлаут у повсякденних словах і назвах місць."
  intro: "Умлаут — частина написання. Schon (вже) і schön (гарний) — різні слова. Багато повсякденних слів і назв місць мають умлаути: Mädchen, Brötchen, München, Köln, Zürich, Österreich. Пишіть крапки щоразу."
  examples: "Слова й назви з умлаутами."
  summary_block: "**Умлаут належить до слова.** schon ≠ schön. Пишіть крапки в словах і назвах: **München, Köln, Zürich, Österreich**."
  practice: "Практика"
  fb.correct: "Правильно."
  fb.incorrect: "Не зовсім. Прочитайте пояснення."
  ex.1: "Mädchen (дівчинка): ä."
  ex.2: "Brötchen (булочка): ö."
  ex.3: "München (Мюнхен): ü."
  ex.4: "Köln (Кельн): ö."
  ex.5: "Zürich (Цюрих): ü, місто у Швейцарії."
  ex.6: "Österreich (Австрія): починається з Ö."
  x1.prompt: "Яке місто пишеться з ü?"
  x1.o2.fb: "У Köln — ö, а не ü."
  x1.o3.fb: "У Wien (Відень) немає умлауту."
  x1.expl: "München: M – Ü – N – C – H – E – N."
  x2.prompt: "Напишіть німецьку назву Австрії."
  x2.r1: "Österreich починається з Ö, з двома крапками."
  x2.r2: "Oe — написання без клавіші умлауту; пишіть Ö."
  x2.expl: "Österreich: Ö на початку, далі sterreich."
  x3.prompt: "Правда чи ні?"
  x3.wrong: "Ні: schon — «вже», schön — «гарний». Крапки змінюють слово."
  x3.expl: "Дві крапки утворюють нове слово."
  x4.prompt: "З'єднайте слово з його умлаутом."
  x4.expl: "Mädchen – ä, Brötchen – ö, Zürich – ü."
  x5.prompt: "У яких словах є умлаут?"
  x5.o3.fb: "У Berlin немає умлауту."
  x5.o4.fb: "У Wien немає умлауту: W – I – E – N."
  x5.expl: "У Mädchen — ä, у Köln — ö."
  x6.prompt: "Вставте пропущену літеру: M_nchen."
  x6.r1: "München потребує ü з двома крапками."
  x6.r2: "ö — інший умлаут; у München — ü."
  x6.expl: "München: ü."
  x7.prompt: "Оберіть правильну відповідь."
  x7.o2.fb: "У Köln — Ö, а не O."
  x7.o3.fb: "Ü — інший умлаут; у Köln — Ö."
  x7.expl: "Умлаут диктують як окрему літеру: Ö."
  x8.prompt: "Вставте умлаути в це замовлення в пекарні."
  x8.expl: "У Brötchen — ö, у Käse — ä."
  x9.prompt: "Це правильно?"
  x9.wrong: "Це правильно: Zürich пишеться з ü."
  x9.expl: "Zürich: Z – Ü – R – I – C – H."
  x10.prompt: "Напишіть німецьке слово «дівчинка». У ньому є ä."
  x10.r1: "Mädchen потребує ä з двома крапками."
  x10.r2: "Mädchen пишеться з ch, а не sch."
  x10.expl: "Mädchen: M – Ä – D – C – H – E – N."
  x11.prompt: "Яке слово означає «гарний»?"
  x11.o2.fb: "schon без крапок означає «вже»."
  x11.o3.fb: "Sohn означає «син»; умлауту немає."
  x11.expl: "schön (гарний) має ö."
  x12.prompt: "Виправте написання цього міста: у ньому є ü."
  x12.expl: "Düsseldorf пишеться з ü."
  x13.prompt: "У яких словах є ö?"
  x13.o4.fb: "У München — ü, а не ö."
  x13.expl: "У Brötchen, Köln і Österreich — ö."
  x14.prompt: "Яка літера пропущена? T_r (двері)"
  x14.r1: "Tor — ворота; двері — Tür з ü."
  x14.r2: "Без крапок це u; у Tür має бути ü."
  x14.expl: "Tür (двері): ü."
  x15.prompt: "Як ви відповісте?"
  x15.o2.fb: "Без крапок вийшло б schon (вже)."
  x15.o3.fb: "ä — інший умлаут; у schön — ö."
  x15.expl: "schön: ö."
