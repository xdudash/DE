strings:
  title: Німецький алфавіт і назви літер
  summary: У німецькій мові 26 літер, три умлаути та ß. Назви літер не збігаються зі звуками, тому слова під час диктування назви треба вимовляти за правилами алфавіту.
  rel.umlauts: Ä, Ö та Ü — окремі літери; їхні звуки пояснює наступна тема.
  rel.eszett: ß — окрема літера, яка стоїть після довгих голосних і дифтонгів.
  pattern.scope: "Кожна літера має одну назву; літери з умлаутом зберігають крапки в назві."
  pattern.limits: "Назви літер вимовляють окремо; це не речення."
  ex.letters: "Ö — літера з умлаутом; називайте її власною назвою."
  ex.names: "M – A – I — це «Mai» по літерах."
